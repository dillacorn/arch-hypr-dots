[window]
decorations = "Buttonless"
dynamic_title = false
opacity = 0.85
padding = { x = 22, y = 22 }

[scrolling]
history = 0

[font]
size = 12.0
normal = { family = "NotoSansM Nerd Font Mono", style = "Regular" }
bold = { family = "NotoSansM Nerd Font Mono", style = "Bold" }
italic = { family = "NotoSansM Nerd Font Mono", style = "Italic" }
bold_italic = { family = "NotoSansM Nerd Font Mono", style = "Bold Italic" }
glyph_offset = { x = 0, y = 2 }

[colors]
transparent_background_colors = false
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#1f1f1f"
foreground = "#e5e1d8"

[colors.normal]
black = "#000000"
red = "#f7786d"
green = "#bde97c"
yellow = "#efdfac"
blue = "#6ebaf8"
magenta = "#ef88ff"
cyan = "#90fdf8"
white = "#e5e1d8"

[colors.bright]
black = "#b4b4b4"
red = "#f99f92"
green = "#e3f7a1"
yellow = "#f2e9bf"
blue = "#b3d2ff"
magenta = "#e5bdff"
cyan = "#c2fefa"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
blink_timeout = 0
unfocused_hollow = true

[mouse]
hide_when_typing = true
