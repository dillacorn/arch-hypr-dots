[window]
decorations = "None"
dynamic_title = false
opacity = 1.0
padding = { x = 8, y = 8 }

[scrolling]
history = 0

[font]
size = 11.0
normal = { family = "NotoSansM Nerd Font Mono", style = "Regular" }
bold = { family = "NotoSansM Nerd Font Mono", style = "Bold" }

[colors.primary]
background = "#202020"
foreground = "#dedede"

[colors.normal]
black = "#202020"
red = "#ff6b65"
green = "#a6e36a"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#ff6cff"
cyan = "#56b6c2"
white = "#dedede"

[colors.bright]
black = "#969696"
red = "#ff6b65"
green = "#a6e36a"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#ff6cff"
cyan = "#56b6c2"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = false

[mouse]
hide_when_typing = false
