# awtarchy hypridle config
# github.com/dillacorn/awtarchy/tree/main/config/hypr
# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.config/hypr/scripts/hypridle_action.sh prepare-sleep
    after_sleep_cmd = ~/.config/hypr/scripts/hypridle_action.sh resume-sleep
    # Ignore application-provided idle inhibitors globally.
    # Quickshell bar, active games, and active video playback are enforced by hypridle_action.sh.
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
    inhibit_sleep = 2

    # Clear the temporary all-bar idle hide after a successful hyprlock unlock.
    on_unlock_cmd = ~/.config/hypr/scripts/quickshell_bar_restore.sh

    # Optional: also hide all Quickshell bars when the session locks.
    # on_lock_cmd = ~/.config/hypr/scripts/quickshell_bar_idle_hide.sh
}

# Temporarily hide every Quickshell bar while idle. Saved per-monitor bar
# visibility is untouched and restored automatically on user activity.
# The legacy action name is retained inside hypridle_action.sh for compatibility.
listener {
    timeout = 60 # 1 minute
    on-timeout = ~/.config/hypr/scripts/hypridle_action.sh waybar-hide
    on-resume  = ~/.config/hypr/scripts/quickshell_bar_restore.sh
    ignore_inhibit = false
}

# dim external monitor via DDC
listener {
    timeout = 120 # 2 minutes
    on-timeout = ~/.config/hypr/scripts/hypridle_action.sh dim
    on-resume  = ~/.config/hypr/scripts/restore_brightness.sh
    ignore_inhibit = false
}

# lock session
listener {
    timeout = 180 # 3 minutes
    on-timeout = ~/.config/hypr/scripts/hypridle_action.sh lock
    ignore_inhibit = false
}

# DPMS off/on
listener {
    timeout = 240 # 4 minutes
    on-timeout = ~/.config/hypr/scripts/hypridle_action.sh dpms-off
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_inhibit = false
}

# Protected sessions normally block the short idle actions above. After four
# hours with no real user input, Keep Awake / games / video / Teams / OBS may
# still lock the session and power off the displays without allowing suspend.
# The bar eye's "Always Awake" mode explicitly bypasses this safety action too.
listener {
    timeout = 14400 # 4 hours
    on-timeout = ~/.config/hypr/scripts/protected_idle_safety.sh
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_inhibit = false
}

# suspend
listener {
    timeout = 540 # 9 minutes
    on-timeout = ~/.config/hypr/scripts/hypridle_action.sh suspend
    # Cancel a deferred suspend when user activity returns.
    on-resume = ~/.config/hypr/scripts/hypridle_action.sh cancel-suspend-watch
    ignore_inhibit = false
}
