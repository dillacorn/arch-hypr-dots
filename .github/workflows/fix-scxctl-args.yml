name: Fix scxctl scheduler arguments

on:
  push:
    branches: [scxctl-args-fix]
    paths:
      - .github/workflows/fix-scxctl-args.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Add regression and verify RED
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path('tests/test-security-boundaries.sh')
          text = test.read_text(encoding='utf-8')
          marker = "for command in \\\n            'status' \\\n"
          block = r'''# scxctl 1.1+ requires scheduler arguments that begin with '-' to be
          # attached to --args. The trusted helper accepts the UI's structured
          # five-field form, then must normalize only the final scxctl argv.
          : >"$scx_log"
          AWTARCHY_TEST_SCXCTL_LOG="$scx_log" "$scx_fixture" \
            switch --sched lavd --args --performance \
            || fail 'privileged scxctl helper rejected LAVD preset arguments'
          printf '%s\n' switch --sched lavd '--args=--performance' \
            >"${TMPD}/scxctl-expected-lavd.log"
          cmp -s "$scx_log" "${TMPD}/scxctl-expected-lavd.log" \
            || fail 'privileged scxctl helper did not attach LAVD scheduler args'

          : >"$scx_log"
          AWTARCHY_TEST_SCXCTL_LOG="$scx_log" "$scx_fixture" \
            start --sched tickless --args '-f,5000,-s,5000' \
            || fail 'privileged scxctl helper rejected Tickless preset arguments'
          printf '%s\n' start --sched tickless '--args=-f,5000,-s,5000' \
            >"${TMPD}/scxctl-expected-tickless.log"
          cmp -s "$scx_log" "${TMPD}/scxctl-expected-tickless.log" \
            || fail 'privileged scxctl helper did not attach Tickless scheduler args'

          '''
          if text.count(marker) != 1:
              raise SystemExit('security test insertion point changed unexpectedly')
          test.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY

          if bash tests/test-security-boundaries.sh >red.log 2>&1; then
            cat red.log
            echo 'Regression unexpectedly passed before the production fix.' >&2
            exit 1
          fi
          cat red.log
          grep -Fq 'privileged scxctl helper did not attach LAVD scheduler args' red.log

      - name: Apply minimal helper fix and verify GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('local/libexec/awtarchy/scxctl-helper')
          text = helper.read_text(encoding='utf-8')
          old = '''  exec "$SCXCTL" "$@"
'''
          new = '''  if [[ ${1:-} == start || ${1:-} == switch ]] && (( $# == 5 )); then
    exec "$SCXCTL" "$1" --sched "$3" "--args=$5"
  fi

  exec "$SCXCTL" "$@"
'''
          if text.count(old) != 1:
              raise SystemExit('scxctl helper exec point changed unexpectedly')
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n local/libexec/awtarchy/scxctl-helper
          bash -n tests/test-security-boundaries.sh
          shellcheck local/libexec/awtarchy/scxctl-helper
          bash tests/test-security-boundaries.sh
          bash tests/test-scxctl-helper-update.sh

      - name: Commit tested fix and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-scxctl-args.yml
          git add local/libexec/awtarchy/scxctl-helper tests/test-security-boundaries.sh
          git commit -m 'Fix sched-ext preset argument forwarding'
          git push origin HEAD:scxctl-args-fix
