name: Temporary flyout blur lifecycle fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'flyout-blur-lifecycle-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: flyout-blur-lifecycle-fix
          fetch-depth: 0

      - name: Prove regression test fails first
        shell: bash
        run: |
          python3 tools/tmp_fix_flyout_blur_lifecycle.py --test-only
          if bash tests/test-flyout-toggle-debounce.sh; then
            echo 'Expected blur-lifecycle regression test to fail before production fix.' >&2
            exit 1
          fi

      - name: Apply launcher lifecycle to flyouts
        shell: bash
        run: |
          python3 tools/tmp_fix_flyout_blur_lifecycle.py --apply
          bash -n tests/test-flyout-toggle-debounce.sh
          bash tests/test-flyout-toggle-debounce.sh
          git diff --check

      - name: Refresh managed stock hashes
        shell: bash
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for file in QuickSettings.qml NetworkMenu.qml BluetoothMenu.qml ClipboardMenu.qml Notifications.qml; do
            source="config/quickshell/awtarchy/$file"
            rel=".config/quickshell/awtarchy/$file"
            digest="$(sha256sum "$source" | awk '{print $1}')"
            grep -Fq -- "$digest"$'\t'"$rel" "$history" || printf '%s\t%s\n' "$digest" "$rel" >> "$history"
          done

      - name: Publish clean fix branch
        shell: bash
        run: |
          rm -f -- tools/tmp_fix_flyout_blur_lifecycle.py .github/workflows/tmp-flyout-blur-lifecycle-fix.yml
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'fix: match launcher flyout blur lifecycle'
          git push origin HEAD:flyout-blur-lifecycle-fix
