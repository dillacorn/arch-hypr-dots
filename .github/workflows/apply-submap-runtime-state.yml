name: Apply submap runtime-state fix

on:
  push:
    branches: [fix-submap-runtime-state]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy' && github.ref == 'refs/heads/fix-submap-runtime-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Patch remaining submap state consumers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "config/hypr/scripts/hypr_quicksettings_core.sh",
              'SUBMAP_STATE_FILE="${HYPR_SUBMAP_STATE_FILE:-/tmp/hypr-submap}"',
              'SUBMAP_STATE_DIR="${XDG_RUNTIME_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}}"\n'
              'SUBMAP_STATE_FILE="${HYPR_SUBMAP_STATE_FILE:-${SUBMAP_STATE_DIR}/awtarchy-hypr-submap}"',
          )

          replace_once(
              "config/quickshell/awtarchy/Bar.qml",
              '    readonly property string configHome: Quickshell.env("XDG_CONFIG_HOME") || (Quickshell.env("HOME") + "/.config")\n'
              '    readonly property string ddcScript: configHome + "/hypr/scripts/ddc_brightness.sh"',
              '    readonly property string configHome: Quickshell.env("XDG_CONFIG_HOME") || (Quickshell.env("HOME") + "/.config")\n'
              '    readonly property string runtimeHome: Quickshell.env("XDG_RUNTIME_DIR")\n'
              '        || Quickshell.env("XDG_CACHE_HOME")\n'
              '        || (Quickshell.env("HOME") + "/.cache")\n'
              '    readonly property string submapStatePath: Quickshell.env("HYPR_SUBMAP_STATE_FILE") || (runtimeHome + "/awtarchy-hypr-submap")\n'
              '    readonly property string ddcScript: configHome + "/hypr/scripts/ddc_brightness.sh"',
          )
          replace_once(
              "config/quickshell/awtarchy/Bar.qml",
              '        path: "/tmp/hypr-submap"',
              '        path: bar.submapStatePath',
          )

          replace_once(
              "config/hypr/hyprland.lua",
              'local submap_file = "/tmp/hypr-submap"',
              "local submap_file = '${HYPR_SUBMAP_STATE_FILE:-${XDG_RUNTIME_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}}/awtarchy-hypr-submap}'",
          )
          replace_once(
              "config/hypr/hyprland.lua",
              '''local function _submap_on_cmd(name)
              return "sh -c 'echo " .. name .. " > /tmp/hypr-submap; notify-send -a Hyprland -t 1000 \\\"" .. name .. " mode: ON\\\"; hyprctl dispatch \\\"hl.dsp.submap(\\\\\\\"" .. name .. "\\\\\\\")\\\"'"
          end

          local function _submap_off_cmd(name)
              return "sh -c 'truncate -s 0 /tmp/hypr-submap; notify-send -a Hyprland -t 1000 \\\"" .. name .. " mode: OFF\\\"; hyprctl dispatch \\\"hl.dsp.submap(\\\\\\\"reset\\\\\\\")\\\"'"
          end''',
              '''local function _submap_on_cmd(name)
              return "sh -c 'state_file=\\\"" .. submap_file .. "\\\"; mkdir -p -- \\\"$(dirname -- \\\"$state_file\\\")\\\"; printf \\\"%s\\\\n\\\" \\\"" .. name .. "\\\" > \\\"$state_file\\\"; notify-send -a Hyprland -t 1000 \\\"" .. name .. " mode: ON\\\"; hyprctl dispatch \\\"hl.dsp.submap(\\\\\\\"" .. name .. "\\\\\\\")\\\"'"
          end

          local function _submap_off_cmd(name)
              return "sh -c 'state_file=\\\"" .. submap_file .. "\\\"; mkdir -p -- \\\"$(dirname -- \\\"$state_file\\\")\\\"; : > \\\"$state_file\\\"; notify-send -a Hyprland -t 1000 \\\"" .. name .. " mode: OFF\\\"; hyprctl dispatch \\\"hl.dsp.submap(\\\\\\\"reset\\\\\\\")\\\"'"
          end''',
          )

          test = Path("tests/test-bar-control-actions.sh")
          text = test.read_text(encoding="utf-8")
          old = '''TMP="$(mktemp -d)"
          SUBMAP_FILE="/tmp/hypr-submap"
          SUBMAP_BACKUP="${TMP}/hypr-submap.backup"
          submap_existed=false
          volume_pids=()'''
          new = '''TMP="$(mktemp -d)"
          SUBMAP_RUNTIME="${TMP}/submap-runtime"
          SUBMAP_FILE="${SUBMAP_RUNTIME}/awtarchy-hypr-submap"
          volume_pids=()'''
          if text.count(old) != 1:
              raise SystemExit("unexpected bar-control test submap fixture")
          text = text.replace(old, new, 1)
          old = '''  rm -f -- "$SUBMAP_FILE"
            if [[ $submap_existed == true ]]; then
              cp -a -- "$SUBMAP_BACKUP" "$SUBMAP_FILE"
            fi
            rm -rf -- "$TMP"'''
          new = '''  rm -rf -- "$TMP"'''
          if text.count(old) != 1:
              raise SystemExit("unexpected bar-control cleanup block")
          text = text.replace(old, new, 1)
          old = '''if [[ -e $SUBMAP_FILE || -L $SUBMAP_FILE ]]; then
            cp -a -- "$SUBMAP_FILE" "$SUBMAP_BACKUP"
            submap_existed=true
          fi
          rm -f -- "$SUBMAP_FILE"

          fakebin="${TMP}/mouse-bin"'''
          new = '''fakebin="${TMP}/mouse-bin"'''
          if text.count(old) != 1:
              raise SystemExit("unexpected bar-control shared-/tmp setup block")
          text = text.replace(old, new, 1)
          text = text.replace(
              'mkdir -p "$fakebin" "${config_home}/hypr/scripts"',
              'mkdir -p "$fakebin" "${config_home}/hypr/scripts" "$SUBMAP_RUNTIME"',
              1,
          )
          marker = '''chmod 0755 "${config_home}/hypr/scripts/quickshell_runtime_rules.sh"

          PATH="${fakebin}:$PATH"'''
          guard = '''chmod 0755 "${config_home}/hypr/scripts/quickshell_runtime_rules.sh"

          for submap_source in \\
            "$MOUSE_SCRIPT" \\
            "${ROOT}/config/hypr/scripts/hypr_quicksettings_core.sh" \\
            "${ROOT}/config/hypr/hyprland.lua" \\
            "${ROOT}/config/quickshell/awtarchy/Bar.qml" \\
            "${ROOT}/local/share/applications/vm_submap.desktop" \\
            "${ROOT}/local/share/applications/noalt_submap.desktop"
          do
            ! grep -Fq '/tmp/hypr-submap' "$submap_source" \\
              || fail "${submap_source#"${ROOT}/"} still uses shared /tmp submap state"
            grep -Fq 'awtarchy-hypr-submap' "$submap_source" \\
              || fail "${submap_source#"${ROOT}/"} does not use the per-user submap state"
          done

          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate \\
              "${ROOT}/local/share/applications/vm_submap.desktop" \\
              "${ROOT}/local/share/applications/noalt_submap.desktop"
          fi

          XDG_RUNTIME_DIR="$SUBMAP_RUNTIME" \\
          PATH="${fakebin}:$PATH"'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected first mouse-test invocation marker")
          text = text.replace(marker, guard, 1)
          marker = '''PATH="${fakebin}:$PATH" \\
            XDG_CONFIG_HOME="$config_home" \\
            HYPRCTL_LOG="$hyprctl_log" \\
            RUNTIME_RULES_MARKER="$runtime_marker" \\
            bash "$MOUSE_SCRIPT" reset'''
          replacement = '''XDG_RUNTIME_DIR="$SUBMAP_RUNTIME" \\
            PATH="${fakebin}:$PATH" \\
            XDG_CONFIG_HOME="$config_home" \\
            HYPRCTL_LOG="$hyprctl_log" \\
            RUNTIME_RULES_MARKER="$runtime_marker" \\
            bash "$MOUSE_SCRIPT" reset'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected second mouse-test invocation")
          text = text.replace(marker, replacement, 1)
          test.write_text(text, encoding="utf-8")

          bar = Path("config/quickshell/awtarchy/Bar.qml")
          digest = hashlib.sha256(bar.read_bytes()).hexdigest()
          history = Path("local/share/awtarchy/quickshell-managed-history.sha256")
          history_text = history.read_text(encoding="utf-8")
          history_line = f"{digest}\t.config/quickshell/awtarchy/Bar.qml"
          if history_line not in history_text.splitlines():
              history.write_text(history_text.rstrip("\n") + "\n" + history_line + "\n", encoding="utf-8")

          Path(".github/workflows/apply-submap-runtime-state.yml").unlink()
          PY

      - name: Validate patch
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shellcheck lua5.4
          bash -n config/hypr/scripts/toggle_mouse_submap.sh
          bash -n config/hypr/scripts/hypr_quicksettings_core.sh
          bash -n tests/test-bar-control-actions.sh
          shellcheck config/hypr/scripts/toggle_mouse_submap.sh tests/test-bar-control-actions.sh
          shellcheck -e SC2015 config/hypr/scripts/hypr_quicksettings_core.sh
          desktop-file-validate local/share/applications/vm_submap.desktop local/share/applications/noalt_submap.desktop
          bash tests/test-bar-control-actions.sh
          bash tests/test-lua-validation.sh
          git diff --check
          ! grep -R -F '/tmp/hypr-submap' -- \
            config/hypr/hyprland.lua \
            config/hypr/scripts/hypr_quicksettings_core.sh \
            config/hypr/scripts/toggle_mouse_submap.sh \
            config/quickshell/awtarchy/Bar.qml \
            local/share/applications/vm_submap.desktop \
            local/share/applications/noalt_submap.desktop \
            tests/test-bar-control-actions.sh

      - name: Commit completed fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No patch changes to commit.'; return 0; }
          git commit -m 'Complete per-user submap state fix'
          git push origin HEAD:fix-submap-runtime-state
