name: Validate Quick Settings Layout

on:
  pull_request:
    paths:
      - '.github/workflows/validate-quick-settings-layout.yml'
      - 'config/hypr/scripts/quickshell_application_state.sh'
      - 'config/quickshell/awtarchy/BarState.qml'
      - 'config/quickshell/awtarchy/FlyoutSettings.qml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'config/quickshell/awtarchy/QuickSettingsLayoutEditor.qml'
      - 'local/share/awtarchy/quickshell-managed-history.sha256'
      - 'tests/test-quick-settings-layout.sh'
      - 'tests/test-quick-settings-startup-rows.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-settings-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate Quick Settings layout customization
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quick-settings-layout.sh
          bash -n tests/test-quick-settings-startup-rows.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck tests/test-quick-settings-layout.sh
          shellcheck tests/test-quick-settings-startup-rows.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-quick-settings-startup-rows.sh
