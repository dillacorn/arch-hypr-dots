name: Validate Quick Settings Layout

on:
  pull_request:
    paths:
      - '.github/workflows/validate-quick-settings-layout.yml'
      - 'config/hypr/scripts/quickshell_application_state.sh'
      - 'config/quickshell/awtarchy/BarState.qml'
      - 'config/quickshell/awtarchy/FlyoutSettings.qml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'config/quickshell/awtarchy/QuickSettingsLayoutEditor.qml'
      - 'local/share/awtarchy/quickshell-managed-history.sha256'
      - 'tests/test-quick-settings-layout.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-feature:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/quick-settings-layout-customization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quick-settings-layout-customization
          fetch-depth: 0
      - name: Apply guarded implementation patch
        env:
          PATCH_GZIP_BASE64: 
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 -d | gzip -d > /tmp/apply-quick-settings-layout.py
          python3 /tmp/apply-quick-settings-layout.py
          git diff --check
          bash -n config/hypr/scripts/quickshell_application_state.sh
          if git diff --quiet; then
            echo 'Quick Settings layout implementation already applied.'
            exit 0
          fi
          git config user.name 'Awtarchy Layout Patch'
          git config user.email 'actions@users.noreply.github.com'
          git add config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/QuickSettings.qml
          git commit -m 'Implement Quick Settings layout customization'
          git push origin HEAD:feature/quick-settings-layout-customization

  quick-settings-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate Quick Settings layout customization
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quick-settings-layout.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck tests/test-quick-settings-layout.sh
          bash tests/test-quick-settings-layout.sh
