name: One-use battery rollback regression

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
      - name: Run rollback readback regression
        run: |
          set -euo pipefail
          bash -n tests/test-battery-care-rollback-verification.sh
          shellcheck tests/test-battery-care-rollback-verification.sh
          bash tests/test-battery-care-rollback-verification.sh
