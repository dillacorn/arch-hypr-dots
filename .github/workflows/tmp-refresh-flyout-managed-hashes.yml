name: Refresh flyout managed hashes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.ref == 'flyout-main-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: flyout-main-validation
          fetch-depth: 0

      - name: Refresh managed stock hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for name in \
            BluetoothMenu.qml \
            ClipboardMenu.qml \
            FlyoutManager.qml \
            NetworkMenu.qml \
            Notifications.qml \
            QuickSettings.qml \
            shell.qml
          do
            source="config/quickshell/awtarchy/${name}"
            rel=".config/quickshell/awtarchy/${name}"
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}	${rel}"
            grep -Fqx -- "$entry" "$history" || printf '%s\t%s\n' "$digest" "$rel" >>"$history"
          done
          git diff --check
          bash tests/test-flyout-toggle-debounce.sh
          bash tests/test-hyprbars-quicksettings.sh

      - name: Publish clean manifest update
        shell: bash
        run: |
          rm -f -- \
            .github/workflows/tmp-refresh-flyout-managed-hashes.yml \
            .github/tmp-flyout-main-validation
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh flyout managed hashes'
          git push origin HEAD:flyout-main-validation
