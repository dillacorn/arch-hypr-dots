name: Validate Stable Release Notes

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - INSTALL.md
      - UPDATING.md
      - .github/scripts/validate-stable-release-notes.py
      - .github/workflows/validate-stable-release-notes.yml
      - tests/test-stable-release-notes-validator.sh
      - tests/test-install-update-docs.sh

permissions:
  contents: read

jobs:
  release-notes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n tests/test-stable-release-notes-validator.sh
          bash -n tests/test-install-update-docs.sh
      - name: Stable release notes contract
        run: bash tests/test-stable-release-notes-validator.sh
      - name: Canonical installation and update docs
        run: bash tests/test-install-update-docs.sh

  record-battery-care-managed-hash:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 161 &&
      github.event.pull_request.head.ref == 'hardening/battery-care-readback-feedback' &&
      github.event.pull_request.title == 'Surface Battery Care readback mismatches'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: hardening/battery-care-readback-feedback
          fetch-depth: 0
      - name: Record exact stock hash and remove diagnostic bridge
        shell: bash
        env:
          APPROVED_IMPL: 614efdd1ee746220059974cf480f48f96e1b62c8
          EXPECTED_MAIN: 2bd8e0d135855634ae82624d202ad461491f7518
          STOCK_HASH: 657bf3b9777f027c5f66c1b37ae6b7b092270ca27c10b87bfff28725870819f7
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$APPROVED_IMPL" HEAD
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(sha256sum config/quickshell/awtarchy/BatteryCareCard.qml | awk '{print $1}')" = "$STOCK_HASH"

          python3 - <<'PY'
          from pathlib import Path
          import os

          history = Path('local/share/awtarchy/quickshell-managed-history.sha256')
          entry = os.environ['STOCK_HASH'] + '\t.config/quickshell/awtarchy/BatteryCareCard.qml'
          text = history.read_text(encoding='utf-8')
          if entry not in text.splitlines():
              history.write_text(text.rstrip('\n') + '\n' + entry + '\n', encoding='utf-8')

          test = Path('tests/test-battery-care-write-gating.sh')
          text = test.read_text(encoding='utf-8')
          debug = '''printf 'DEBUG_BATTERY_CARE_CARD_SHA256=%s\\n' "$(sha256sum "$CARD" | awk '{print $1}')"\n'''
          if text.count(debug) != 1:
              raise SystemExit('expected exactly one temporary Battery Care hash diagnostic line')
          test.write_text(text.replace(debug, '', 1), encoding='utf-8')
          PY

          git show origin/main:.github/workflows/validate-stable-release-notes.yml \
            > .github/workflows/validate-stable-release-notes.yml

          grep -Fqx "$STOCK_HASH"$'\t''.config/quickshell/awtarchy/BatteryCareCard.qml' \
            local/share/awtarchy/quickshell-managed-history.sha256
          ! grep -Fq 'DEBUG_BATTERY_CARE_CARD_SHA256=' tests/test-battery-care-write-gating.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/validate-stable-release-notes.yml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-battery-care-write-gating.sh
          git commit -m 'chore: record Battery Care managed hash'
          git push origin HEAD:hardening/battery-care-readback-feedback
