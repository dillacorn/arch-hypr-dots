name: Anti-Spam PR Labeler

on: [pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  label-spam-prs:
    runs-on: ubuntu-latest
    steps:
    - name: Label Potential Spam PRs
      uses: PraiseXI/AntiSpamPRLabeler@6dceeed42338b61e9d2957a124f170efee7aaf7a # v1.2.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        max-changes-for-label: '2' # Flag PRs with 2 or fewer changes
        label-message: 'This PR has been flagged for review due to minimal changes. Please ensure your contribution adds meaningful value.'

  publish-v3-2-1:
    if: github.event.pull_request.title == 'Trigger v3.2.1 release' && github.event.pull_request.head.ref == 'v3-2-1-release-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Publish Awtarchy v3.2.1
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c27768f7ebe0de45a5fb8db5d1591e2650cb163c
          TARGET_TREE: 9e6f5569cab701edc352d0bac0a5bc99dd3e2d02
          RELEASE_TAG: v3.2.1
          RELEASE_NAME: Awtarchy v3.2.1 Quickshell
        run: |
          set -euo pipefail

          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git diff --quiet "$TARGET_SHA" HEAD -- . \
            ':(exclude).github/workflows/antispam-pr-labeler.yml'

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} tag already exists; refusing to recreate it." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} release already exists; refusing to replace it." >&2
            exit 1
          fi

          gh release view v3.2.0 --repo "$GITHUB_REPOSITORY" \
            --json name,isDraft,isPrerelease,body >v3.2.0-release.json

          jq -e '
            .name == "Awtarchy v3.2.0 Quickshell"
            and .isDraft == false
            and .isPrerelease == false
          ' v3.2.0-release.json >/dev/null
          jq -r '.body' v3.2.0-release.json >v3.2.0-release.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('v3.2.0-release.md').read_text()
          lines = source.splitlines(keepends=True)
          h2 = [i for i, line in enumerate(lines) if re.match(r'^##\s+\S', line)]
          sections = []
          for pos, start in enumerate(h2):
              end = h2[pos + 1] if pos + 1 < len(h2) else len(lines)
              title = re.sub(r'^##\s+', '', lines[start]).strip()
              sections.append((title, ''.join(lines[start:end]).rstrip() + '\n'))

          install_idx = next((i for i, (_, block) in enumerate(sections)
                              if 'sudo pacman -S git --noconfirm' in block), None)
          if install_idx is None:
              raise SystemExit('v3.2.0 release does not contain expected installation text')

          start_idx = install_idx
          for i in range(install_idx, -1, -1):
              if sections[i][0].casefold() in {
                  'getting started', 'start here', 'fresh install', 'fresh installation'
              }:
                  start_idx = i
                  break

          end_idx = next((i for i in range(install_idx, len(sections))
                          if 'existing awtarchy' in sections[i][0].casefold()
                          or 'existing user' in sections[i][0].casefold()), None)
          if end_idx is None:
              end_idx = next((i for i in range(install_idx, len(sections))
                              if 'awtarchy update' in sections[i][1]), None)
          if end_idx is None:
              raise SystemExit('could not identify v3.2.0 installation block')

          installation = '\n'.join(block for _, block in sections[start_idx:end_idx + 1]).strip()
          required = (
              'sudo pacman -S git --noconfirm',
              'git clone https://github.com/dillacorn/awtarchy',
              'sudo ./awtarchy-install.sh',
              'awtarchy update',
          )
          missing = [item for item in required if item not in installation]
          if missing:
              raise SystemExit(f'v3.2.0 installation block missing expected text: {missing}')

          installation = installation.replace('v3.2.0', 'v3.2.1')

          body = f'''# Awtarchy v3.2.1 Quickshell

Awtarchy v3.2.1 adds scheduled Night Light controls to Quick Settings and makes user-approved anonymous Quickshell failure reports substantially more actionable while preserving strict data minimization.

{installation}

## Night Light scheduling

- Added a Samsung-style daily Night Light schedule directly to Quick Settings with start time, end time, and scheduled color temperature.
- Overnight schedules identify the end time as the next day.
- Scheduling uses native Hyprsunset profiles. Existing **Warmer**, **On/Off**, and **Cooler** manual controls continue to work.
- Scheduling is disabled by default, and disabling a schedule preserves the selected start/end times and temperature for later reuse.
- Awtarchy refuses to overwrite an existing user-owned `hyprsunset.conf`.
- The Night Light and Vibrance cards now share the same row height for a consistent Quick Settings layout.

## Sanitized failure diagnostics

- User-approved Quickshell failure reports can now include an optional tightly bounded diagnostic when Awtarchy can safely recognize one locally.
- The diagnostic is limited to a fixed QML failure category, an Awtarchy-managed QML basename, and positive numeric line/column values.
- Raw logs, raw exception/error text, arbitrary paths, usernames, hostnames, home-directory paths, and persistent installation identifiers remain excluded.
- The public Worker independently validates diagnostic categories and managed filenames rather than trusting client-provided text.
- Diagnostic issue fingerprints may refine by safe failure kind plus managed filename, while line/column, versions, GPU family, and machine-specific values remain outside the fingerprint.
- Cloudflare rate limiting remains keyed to the original coarse failure class so rotating diagnostic values cannot increase the request budget.

## Exact-source GitHub links

- Recognized QML reports now generate a clickable GitHub source permalink to the exact failing Awtarchy revision, managed QML file, and reported line.
- The client does not send a repository URL. The Worker constructs the permalink from server-owned repository coordinates plus the validated revision/file/line fields.
- If a safe diagnostic cannot be extracted, reporting still works with the normal failure class and exact Awtarchy revision for manual investigation.

## Production validation

- The updated Cloudflare report Worker was deployed and passed its production health check before release.
- End-to-end issue #57 validated the enhanced path with an intentional `Theme.qml` parse failure: the report identified `qml_parse_error`, `Theme.qml`, location `67:1`, and linked directly to the exact failing source line.
- The updater exhausted normal Quickshell recovery, offered the explicit review/send consent flow, created the sanitized GitHub issue, and rolled the user's changed files back safely.
- The intentional failure was removed immediately afterward and the restored branch passed the full Awtarchy, anonymous-reporting, Node 20/22 report-service, and Wrangler dry-run validation suites.

## Post-release updates

_Placeholder for possible tested post-release patches to v3.2.1._
'''
          Path('release-notes.md').write_text(body)
          PY

          grep -Fq '# Awtarchy v3.2.1 Quickshell' release-notes.md
          grep -Fq 'sudo pacman -S git --noconfirm' release-notes.md
          grep -Fq 'git clone https://github.com/dillacorn/awtarchy' release-notes.md
          grep -Fq 'sudo ./awtarchy-install.sh' release-notes.md
          grep -Fq 'awtarchy update' release-notes.md
          grep -Fq '## Night Light scheduling' release-notes.md
          grep -Fq '## Sanitized failure diagnostics' release-notes.md
          grep -Fq 'issue #57' release-notes.md
          grep -Fq '## Post-release updates' release-notes.md

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_NAME" \
            --latest \
            --notes-file release-notes.md

          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$TARGET_SHA"

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,targetCommitish,isDraft,isPrerelease,body,url >verified-release.json
          jq -e --arg target "$TARGET_SHA" --arg name "$RELEASE_NAME" '
            .name == $name
            and .targetCommitish == $target
            and .isDraft == false
            and .isPrerelease == false
          ' verified-release.json >/dev/null
          jq -r '.body' verified-release.json >verified-release.md

          grep -Fq '## Night Light scheduling' verified-release.md
          grep -Fq '## Sanitized failure diagnostics' verified-release.md
          grep -Fq 'issue #57' verified-release.md
          jq -r '.url' verified-release.json
