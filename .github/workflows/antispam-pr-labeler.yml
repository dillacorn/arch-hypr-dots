name: Anti-Spam PR Labeler

on: [pull_request]

permissions:
  pull-requests: write

jobs:
  label-spam-prs:
    runs-on: ubuntu-latest
    steps:
    - name: Label Potential Spam PRs
      uses: PraiseXI/AntiSpamPRLabeler@6dceeed42338b61e9d2957a124f170efee7aaf7a # v1.2.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        max-changes-for-label: '2' # Flag PRs with 2 or fewer changes
        label-message: 'This PR has been flagged for review due to minimal changes. Please ensure your contribution adds meaningful value.'

  verify-and-clean-v3-3-7:
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.ref == 'release/v3.3.7-publish-helper' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.title == 'Publish v3.3.7 release bridge'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: release/v3.3.7-publish-helper
          fetch-depth: 0
      - name: Verify release and remove helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          tag='v3.3.7'
          title='Awtarchy v3.3.7 Quickshell'
          target='d599be7966e934f6ccf717b72e4852ca8090e29b'
          notes='RELEASE-v3.3.7.md'

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > /tmp/v3.3.7-release.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /tmp/v3.3.7-tag.json

          TAG="$tag" TITLE="$title" TARGET="$target" NOTES="$notes" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path('/tmp/v3.3.7-release.json').read_text(encoding='utf-8'))
          tag = json.loads(Path('/tmp/v3.3.7-tag.json').read_text(encoding='utf-8'))
          expected_body = Path(os.environ['NOTES']).read_text(encoding='utf-8')

          assert release['tag_name'] == os.environ['TAG']
          assert release['name'] == os.environ['TITLE']
          assert release['target_commitish'] == os.environ['TARGET']
          assert release['draft'] is False
          assert release['prerelease'] is False
          assert release['body'] == expected_body
          assert tag['object']['type'] == 'commit'
          assert tag['object']['sha'] == os.environ['TARGET']
          PY

          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          test "$latest" = "$tag"

          gh pr close 82 --repo "$GITHUB_REPOSITORY" --comment 'v3.3.7 release verified. Closing temporary release bridge without merging.'
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/v3.3.7-publish-helper"

          printf 'Verified and cleaned release helper for %s at %s.\n' "$tag" "$target"
