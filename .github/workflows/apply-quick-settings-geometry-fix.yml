name: Apply Quick Settings Geometry Fix

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/apply-quick-settings-geometry-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: python3 .github/scripts/apply_quick_settings_geometry_fix.py
      - run: |
          git diff --check
          bash -n tests/test-quick-settings-settings-mode.sh
          shellcheck tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-display-options.sh
      - run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy/QuickSettings.qml local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Fix Quick Settings settings geometry'
          git push origin HEAD:feature/bar-transparency
# trigger
