name: Apply Direct AUR Scanner Stage 6 CI

on:
  push:
    branches:
      - feature/direct-aur-scanner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/direct-aur-scanner
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Apply repository-wide scanner CI ownership
        run: python3 .github/temp-stage6-ci-apply.py

      - name: Validate Stage 6 scanner contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-installer-aur-scanner-delegation.sh
          bash -n tests/test-aur-scanner-updater-migration.sh
          bash -n tests/test-aur-helper-policy.sh
          bash -n tests/test-aur-scanner-docs.sh
          bash -n tests/test-aur-scanner-retirement.sh
          bash -n tests/test-package-reconciler.sh
          bash -n tests/test-package-reconciler-alternatives.sh
          bash -n tests/test-package-reconciler-interrupted-recovery.sh
          bash -n tests/test-package-reconciler-aur-equivalents.sh
          shellcheck bashrc
          shellcheck tests/test-installer-aur-scanner-delegation.sh
          shellcheck tests/test-aur-scanner-updater-migration.sh
          shellcheck tests/test-aur-helper-policy.sh
          shellcheck tests/test-aur-scanner-docs.sh
          shellcheck tests/test-aur-scanner-retirement.sh
          shellcheck tests/test-package-reconciler.sh
          shellcheck tests/test-package-reconciler-alternatives.sh
          shellcheck tests/test-package-reconciler-interrupted-recovery.sh
          shellcheck tests/test-package-reconciler-aur-equivalents.sh
          bash tests/test-installer-aur-scanner-delegation.sh
          bash tests/test-aur-scanner-updater-migration.sh
          bash tests/test-aur-helper-policy.sh
          bash tests/test-aur-scanner-docs.sh
          bash tests/test-aur-scanner-retirement.sh
          bash tests/test-package-reconciler.sh
          bash tests/test-package-reconciler-alternatives.sh
          bash tests/test-package-reconciler-interrupted-recovery.sh
          bash tests/test-package-reconciler-aur-equivalents.sh
          git diff --check

      - name: Commit Stage 6 CI integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-awtarchy.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Make repository CI own aur-scanner contracts'
          git push origin HEAD:feature/direct-aur-scanner
