                    bash tests/test-quickshell-lockscreen-interactive-effects.sh
                    bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
                - name: Customization editor contracts
                  run: bash tests/test-quickshell-lockscreen-editor.sh
                - name: Managed history contracts
                  run: bash tests/test-quickshell-lockscreen-interactive-managed-history.sh
          FINAL_WORKFLOW
          sed -i 's/^          //' .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml

          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          git diff --check
      - name: Commit validated editor state phase
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/hypr/scripts/quickshell_application_state.sh \
