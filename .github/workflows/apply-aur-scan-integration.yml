name: Validate AUR Scan Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - bashrc
      - tests/test-security-boundaries.sh
      - tests/test-aur-scan-self-heal.sh
      - tests/test-aur-scan-checkout-delegation.sh
      - .github/workflows/apply-aur-scan-integration.yml
  push:
    branches:
      - main
    paths:
      - bashrc
      - tests/test-security-boundaries.sh
      - tests/test-aur-scan-self-heal.sh
      - tests/test-aur-scan-checkout-delegation.sh
      - .github/workflows/apply-aur-scan-integration.yml

permissions:
  contents: write

jobs:
  validate-aur-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scan-integration

      - name: Update legacy boundary regression
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-security-boundaries.sh')
          text = path.read_text(encoding='utf-8')
          old = (
              'text = Path(sys.argv[1]).read_text(encoding="utf-8")\n'
              'legacy_scan = text.index(\'_aur_guard_scan_package_files "$pkg" "$pkgdir"\')\n'
              'aur_scan = text.index(\'_aur_guard_scan_checkout_with_aur_scan "$pkg" "$pkgdir"\', legacy_scan)\n'
              'srcinfo = text.index(\'_aur_guard_verify_srcinfo "$pkg" "$pkgdir"\', aur_scan)\n'
              'if not legacy_scan < aur_scan < srcinfo:\n'
              '    raise SystemExit("aur-scan does not run on the exact checkout before makepkg metadata evaluation")\n'
          )
          new = (
              'text = Path(sys.argv[1]).read_text(encoding="utf-8")\n'
              'legacy_call = \'_aur_guard_scan_package_files "$pkg" "$pkgdir"\'\n'
              'if legacy_call in text:\n'
              '    raise SystemExit("legacy checkout regex blocker still runs before aur-scan")\n'
              'aur_scan = text.index(\'_aur_guard_scan_checkout_with_aur_scan "$pkg" "$pkgdir"\')\n'
              'srcinfo = text.index(\'_aur_guard_verify_srcinfo "$pkg" "$pkgdir"\', aur_scan)\n'
              'if not aur_scan < srcinfo:\n'
              '    raise SystemExit("aur-scan does not run on the exact checkout before makepkg metadata evaluation")\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy test assumption, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n tests/test-security-boundaries.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test-security-boundaries.sh
          git commit -m 'Update aur-scan checkout boundary regression'
          git push origin HEAD:feature/aur-scan-integration

      - name: Validate AUR Guard aur-scan boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-security-boundaries.sh
          bash -n tests/test-aur-scan-self-heal.sh
          bash -n tests/test-aur-scan-checkout-delegation.sh
          shellcheck bashrc tests/test-security-boundaries.sh tests/test-aur-scan-self-heal.sh tests/test-aur-scan-checkout-delegation.sh
          bash tests/test-security-boundaries.sh
          bash tests/test-aur-scan-self-heal.sh
          bash tests/test-aur-scan-checkout-delegation.sh
          git diff --check
