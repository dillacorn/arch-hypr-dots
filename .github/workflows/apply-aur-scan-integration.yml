name: Apply AUR Scan Integration

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scan-integration
          fetch-depth: 0

      - name: Apply deterministic AUR Guard integration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | python3

      - name: Validate deterministic edit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} > 0 )); then
            [[ ${#changed[@]} -eq 1 && ${changed[0]} == bashrc ]]
          fi
          bash -n bashrc
          shellcheck bashrc tests/test-security-boundaries.sh
          bash tests/test-security-boundaries.sh
          git diff --check

      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git add -- bashrc
          if git diff --cached --quiet; then
            printf '%s\n' 'No production change to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Integrate aur-scan into AUR Guard'
            git push origin HEAD:feature/aur-scan-integration
          fi
