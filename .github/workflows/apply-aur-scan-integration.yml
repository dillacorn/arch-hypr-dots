name: Validate AUR Scan Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - bashrc
      - tests/test-security-boundaries.sh
      - tests/test-aur-scan-self-heal.sh
      - .github/workflows/apply-aur-scan-integration.yml
  push:
    branches:
      - main
    paths:
      - bashrc
      - tests/test-security-boundaries.sh
      - tests/test-aur-scan-self-heal.sh
      - .github/workflows/apply-aur-scan-integration.yml

permissions:
  contents: read

jobs:
  validate-aur-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Validate AUR Guard aur-scan boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-security-boundaries.sh
          bash -n tests/test-aur-scan-self-heal.sh
          shellcheck bashrc tests/test-security-boundaries.sh tests/test-aur-scan-self-heal.sh
          bash tests/test-security-boundaries.sh
          bash tests/test-aur-scan-self-heal.sh
          git diff --check
