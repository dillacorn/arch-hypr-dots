name: Validate AUR Scan Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - bashrc
      - tests/test-security-boundaries.sh
      - tests/test-aur-scan-self-heal.sh
      - tests/test-aur-scan-checkout-delegation.sh
      - .github/workflows/apply-aur-scan-integration.yml
  push:
    branches:
      - main
    paths:
      - bashrc
      - tests/test-security-boundaries.sh
      - tests/test-aur-scan-self-heal.sh
      - tests/test-aur-scan-checkout-delegation.sh
      - .github/workflows/apply-aur-scan-integration.yml

permissions:
  contents: write

jobs:
  validate-aur-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scan-integration

      - name: Apply exact checkout delegation change
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bashrc')
          text = path.read_text(encoding='utf-8')
          old = (
              '  _aur_guard_scan_package_files "$pkg" "$pkgdir" || {\n'
              "    _AUR_GUARD_REQUEST_STATE[$pkg]='failed'\n"
              '    return 1\n'
              '  }\n'
              '\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one live legacy checkout gate, found {count}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          bash -n bashrc
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bashrc
          git commit -m 'Delegate AUR checkout scanning to aur-scan'
          git push origin HEAD:feature/aur-scan-integration

      - name: Validate AUR Guard aur-scan boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-security-boundaries.sh
          bash -n tests/test-aur-scan-self-heal.sh
          bash -n tests/test-aur-scan-checkout-delegation.sh
          shellcheck bashrc tests/test-security-boundaries.sh tests/test-aur-scan-self-heal.sh tests/test-aur-scan-checkout-delegation.sh
          bash tests/test-security-boundaries.sh
          bash tests/test-aur-scan-self-heal.sh
          bash tests/test-aur-scan-checkout-delegation.sh
          git diff --check
