name: Apply AUR Scan Bootstrap Regression

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply-bootstrap-regression:
    if: github.event.head_commit.message != 'Add aur-scanner bootstrap regression test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scan-integration
          fetch-depth: 0

      - name: Add bootstrap regression test
        shell: bash
        run: |
          set -euo pipefail
          block_b64=''
          python3 -c 'import base64,sys; from pathlib import Path; p=Path("tests/test-security-boundaries.sh"); t=p.read_text(encoding="utf-8"); marker="# AUR Guard bootstrap regression: missing aur-scan must bootstrap stable aur-scanner."; anchor="# Once a launcher/runtime is target-user-owned, root must only invoke it after\n"; block=base64.b64decode(sys.argv[1]).decode(); assert marker not in t, "bootstrap regression test already present"; assert t.count(anchor) == 1, f"expected one insertion anchor, found {t.count(anchor)}"; p.write_text(t.replace(anchor, block + anchor, 1), encoding="utf-8")' "$block_b64"

      - name: Validate regression test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 && ${changed[0]} == tests/test-security-boundaries.sh ]]
          bash -n bashrc
          bash -n tests/test-security-boundaries.sh
          shellcheck bashrc tests/test-security-boundaries.sh
          bash tests/test-security-boundaries.sh
          git diff --check

      - name: Commit regression test
        shell: bash
        run: |
          set -euo pipefail
          git add -- tests/test-security-boundaries.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add aur-scanner bootstrap regression test'
          git push origin HEAD:feature/aur-scan-integration
