name: Temporary Fix Session Runtime

on:
  push:
    branches:
      - fix-update-session-environment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix-update-session-environment
          fetch-depth: 0

      - name: Recover graphical runtime environment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("local/share/awtarchy/awtarchy-runtime.sh")
          text = path.read_text(encoding="utf-8")

          old = '''awtarchy_polkit_recover_session_environment() {
            local line key value

            if [[ -n "${WAYLAND_DISPLAY:-}" && -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" && -n "${XDG_SESSION_ID:-}" ]]; then
              return 0
            fi
          '''
          new = '''awtarchy_polkit_recover_session_environment() {
            local target_uid runtime_dir line key value
            target_uid="$(awtarchy_polkit_target_uid)" || return 1
            runtime_dir="/run/user/${target_uid}"
            [[ -d "$runtime_dir" && -S "${runtime_dir}/bus" ]] || return 1
            export XDG_RUNTIME_DIR="$runtime_dir"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=${runtime_dir}/bus"

            if [[ -n "${WAYLAND_DISPLAY:-}" && -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" && -n "${XDG_SESSION_ID:-}" ]]; then
              return 0
            fi
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected one recovery-function anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''start_quickshell_update_shell() {
            command -v hyprctl >/dev/null 2>&1 || return 0
            [[ -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" ]] || return 0

            local manager="${HOME_DIR}/.config/hypr/scripts/quickshell.sh"
          '''
          new = '''start_quickshell_update_shell() {
            command -v hyprctl >/dev/null 2>&1 || return 0
            awtarchy_polkit_recover_session_environment || return 1
            [[ -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" ]] || return 0

            local manager="${HOME_DIR}/.config/hypr/scripts/quickshell.sh"
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected one Quickshell-start anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate focused regressions
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash tests/test-polkit-agent-session-binding.sh
          bash tests/test-hypridle-restart.sh
          bash tests/test-quickshell-updater-bootstrap.sh
          git diff --check

      - name: Commit final fix and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local/share/awtarchy/awtarchy-runtime.sh
          git rm .github/workflows/tmp-fix-session-runtime.yml
          git commit -m "Recover updater runtime environment"
          git push origin HEAD:fix-update-session-environment
