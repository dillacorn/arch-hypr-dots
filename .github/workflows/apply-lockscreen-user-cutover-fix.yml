name: Apply Lockscreen User Cutover Fix

on:
  push:
    branches: [feature/quickshell-lockscreen]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy' && github.ref == 'refs/heads/feature/quickshell-lockscreen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quickshell-lockscreen
          fetch-depth: 0
      - name: Apply exact cutover corrections
        run: python3 .github/scripts/apply-lockscreen-user-cutover-fix.py
      - name: Verify focused correction
        run: |
          python3 -m py_compile local/share/awtarchy/awtarchy-lockscreen-hyprland-migrate.py
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n tests/test-quickshell-lockscreen-cutover.sh
          bash -n tests/test-quickshell-lockscreen-migration.sh
          bash -n tests/test-quickshell-lockscreen-live-hyprland-migration.sh
          bash -n tests/test-quickshell-lockscreen-user-cutover.sh
          bash tests/test-quickshell-lockscreen-cutover.sh
          bash tests/test-quickshell-lockscreen-migration.sh
          bash tests/test-quickshell-lockscreen-live-hyprland-migration.sh
          bash tests/test-quickshell-lockscreen-user-cutover.sh
      - name: Commit verified correction
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm .github/workflows/apply-lockscreen-user-cutover-fix.yml \
            .github/scripts/apply-lockscreen-user-cutover-fix.py
          git add config/hypr/hyprland.lua \
            local/share/awtarchy/awtarchy-lockscreen-hyprland-migrate.py \
            local/share/awtarchy/awtarchy-runtime.sh \
            local/share/awtarchy/awtarchy-package-reconcile.sh \
            tests/test-quickshell-lockscreen-cutover.sh \
            tests/test-quickshell-lockscreen-migration.sh \
            tests/test-quickshell-lockscreen-live-hyprland-migration.sh
          git commit -m 'Correct lockscreen power-menu migration'
          git push origin HEAD:feature/quickshell-lockscreen
