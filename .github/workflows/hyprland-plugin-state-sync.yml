name: Apply Hyprland plugin state sync patch

on:
  push:
    branches:
      - hyprland-plugin-state-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hyprland-plugin-state-sync
      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          helper = 'local/libexec/awtarchy/scxctl-helper'
          replace_one(helper, '''hyprbars_have_plugin() {
            [[ -x $HYPRPM ]] || return 1
            "$HYPRPM" list 2>/dev/null \\
              | /usr/bin/grep -qiE '(^|[^a-zA-Z0-9_])hyprbars([^a-zA-Z0-9_]|$)'
          }

          hyprbars_enabled() {
            [[ -x $HYPRPM ]] || return 1
            "$HYPRPM" list 2>/dev/null \\
              | /usr/bin/grep -iEA1 '(^|[^a-zA-Z0-9_])hyprbars([^a-zA-Z0-9_]|$)' \\
              | /usr/bin/grep -qiE 'enabled:[[:space:]]*true'
          }
          ''', '''hyprbars_persistent_state() {
            [[ -x $HYPRPM ]] || {
              printf '%s\\n' 'unavailable'
              return 0
            }

            "$HYPRPM" list 2>/dev/null | /usr/bin/awk '\''
              BEGIN { seen = 0; emitted = 0 }
              {
                line = $0
                gsub(/\\033\\[[0-9;?]*[ -\\/]*[@-~]/, "", line)
                if (line ~ /Plugin[[:space:]]+hyprbars([[:space:]]|$)/) {
                  seen = 1
                  next
                }
                if (seen && line ~ /enabled:[[:space:]]*true([[:space:]]|$)/) {
                  print "enabled"
                  emitted = 1
                  exit
                }
                if (seen && line ~ /enabled:/) {
                  print "disabled"
                  emitted = 1
                  exit
                }
                if (seen && line ~ /Plugin[[:space:]]+/)
                  exit
              }
              END {
                if (!emitted)
                  print seen ? "unknown" : "unavailable"
              }
            '\''
          }
          ''')

          replace_one(helper, '''hyprbars_status() {
            hyprbars_require_user
            if [[ ! -x $HYPRPM ]] || ! hyprbars_have_plugin; then
              printf '%s\\n' 'unavailable'
            elif hyprbars_enabled; then
              printf '%s\\n' 'enabled'
            else
              printf '%s\\n' 'disabled'
            fi
          }
          ''', '''hyprbars_status() {
            local persisted=""
            hyprbars_require_user
            persisted="$(hyprbars_persistent_state)"

            case "$persisted" in
              enabled)
                printf '%s\\n' 'enabled'
                ;;
              disabled)
                if hyprbars_loaded; then
                  printf '%s\\n' 'disabled-pending'
                else
                  printf '%s\\n' 'disabled'
                fi
                ;;
              unavailable)
                if hyprbars_loaded; then
                  printf '%s\\n' 'enabled'
                else
                  printf '%s\\n' 'unavailable'
                fi
                ;;
              *)
                if hyprbars_loaded; then
                  printf '%s\\n' 'enabled'
                else
                  printf '%s\\n' 'disabled'
                fi
                ;;
            esac
          }
          ''')

          script = 'config/hypr/scripts/hyprbars_toggle.sh'
          replace_one(script, '''REPO_URL="https://github.com/hyprwm/hyprland-plugins"
          RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp}"
          ''', '''REPO_URL="https://github.com/hyprwm/hyprland-plugins"
          TRUSTED_HELPER="/usr/local/libexec/awtarchy/scxctl-helper"
          RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp}"
          ''')
          replace_one(script, '''machine_status() {
            require_hyprpm || {
              printf '%s\\n' 'unavailable'
              return 0
            }

            if ! have_hyprbars_in_hyprpm; then
              printf '%s\\n' 'unavailable'
            elif hyprbars_enabled_in_hyprpm; then
              printf '%s\\n' 'enabled'
            else
              printf '%s\\n' 'disabled'
            fi
          }
          ''', '''machine_status() {
            if [[ -x $TRUSTED_HELPER ]]; then
              "$TRUSTED_HELPER" hyprbars-status
              return
            fi

            require_hyprpm || {
              printf '%s\\n' 'unavailable'
              return 0
            }

            if ! have_hyprbars_in_hyprpm; then
              if hyprbars_loaded; then
                printf '%s\\n' 'enabled'
              else
                printf '%s\\n' 'unavailable'
              fi
            elif hyprbars_enabled_in_hyprpm; then
              printf '%s\\n' 'enabled'
            elif hyprbars_loaded; then
              printf '%s\\n' 'disabled-pending'
            else
              printf '%s\\n' 'disabled'
            fi
          }
          ''')

          title = 'config/quickshell/awtarchy/TitleBarsCard.qml'
          replace_one(title, '''        if (hyprbarsState === "disabled")
              return "Disabled";
          if (hyprbarsState === "unavailable")
          ''', '''        if (hyprbarsState === "disabled")
              return "Disabled";
          if (hyprbarsState === "disabled-pending")
              return "On now · Off next login";
          if (hyprbarsState === "unavailable")
          ''')
          replace_one(title, '''        if (hyprbarsState === "disabled" || hyprbarsState === "unavailable")
              return "Enable";
          ''', '''        if (hyprbarsState === "disabled" || hyprbarsState === "disabled-pending"
                || hyprbarsState === "unavailable")
              return "Enable";
          ''')
          replace_one(title, '''                root.hyprbarsState = state === "enabled" || state === "disabled"
                    || state === "unavailable" ? state : "unavailable";
          ''', '''                root.hyprbarsState = state === "enabled" || state === "disabled" || state === "disabled-pending"
                    || state === "unavailable" ? state : "unavailable";
          ''')
          replace_one(title, '''                if (root.actionOutput === "disabled-pending") {
                    root.hyprbarsState = "disabled";
                    root.message = "Disabled for next login; the loaded plugin was not force-unloaded.";
          ''', '''                if (root.actionOutput === "disabled-pending") {
                    root.hyprbarsState = "disabled-pending";
                    root.message = "Title Bars are still active now and are configured to turn off next login.";
          ''')
          replace_one(title, '''                    : (root.hyprbarsState === "unavailable"
                        ? "Enable once to install and activate the official Hyprland Title Bars plugin."
                        : "Managed through Hyprland's plugin manager. Disabling avoids a forced hot-unload when the plugin remains loaded."))
          ''', '''                    : (root.hyprbarsState === "unavailable"
                        ? "Enable once to install and activate the official Hyprland Title Bars plugin."
                        : (root.hyprbarsState === "disabled-pending"
                            ? "Title Bars are loaded in this session, but hyprpm is configured to leave them off next login."
                            : "Managed through Hyprland's plugin manager and synchronized with SUPER+ALT+T.")))
          ''')

          power = 'config/quickshell/awtarchy/PowerModeCard.qml'
          replace_one(power, '''
              TitleBarsCard {
                  active: root.active
                  textScale: root.textScale
                  iconScale: root.iconScale
              }
          ''', '\n')

          quick = 'config/quickshell/awtarchy/QuickSettings.qml'
          replace_one(quick, '''                        }
                      }

                      ListScrollBar {
                          id: contentScrollBar
          ''', '''                        }

                        TitleBarsCard {
                            active: quickSettingsWindow.visible
                            textScale: root.effectiveTextScale
                            iconScale: root.effectiveIconScale
                        }
                    }

                    ListScrollBar {
                        id: contentScrollBar
          ''')
          PY

          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          for rel in \
            .config/quickshell/awtarchy/QuickSettings.qml \
            .config/quickshell/awtarchy/PowerModeCard.qml \
            .config/quickshell/awtarchy/TitleBarsCard.qml \
            .config/hypr/scripts/hyprbars_toggle.sh
          do
            src="config/${rel#.config/}"
            hash="$(sha256sum "$src" | awk '{print $1}')"
            row="${hash}"$'\t'"${rel}"
            grep -Fqx -- "$row" "$manifest" || printf '%s\n' "$row" >>"$manifest"
          done

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/PowerModeCard.qml \
            config/quickshell/awtarchy/TitleBarsCard.qml \
            config/hypr/scripts/hyprbars_toggle.sh \
            local/libexec/awtarchy/scxctl-helper \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'fix: synchronize Hyprland plugin state' \
            || exit 0
          git push origin HEAD:hyprland-plugin-state-sync
