name: Apply Hyprland plugin state sync patch

on:
  push:
    branches:
      - hyprland-plugin-state-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hyprland-plugin-state-sync
      - name: Verify regression is red
        shell: bash
        run: |
          set -Eeuo pipefail
          if bash tests/test-hyprbars-quicksettings.sh; then
            echo 'Regression test unexpectedly passed before implementation.' >&2
            exit 1
          fi
      - name: Apply and verify patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{path}: start marker not found: {start!r}')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'{path}: end marker not found: {end!r}')
              p.write_text(text[:a] + replacement + text[b:])

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one target for {old!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          helper = 'local/libexec/awtarchy/scxctl-helper'
          replace_between(helper, 'hyprbars_have_plugin() {', 'hyprbars_loaded() {', '''hyprbars_persistent_state() {
            [[ -x $HYPRPM ]] || {
              printf '%s\\n' 'unavailable'
              return 0
            }

            "$HYPRPM" list 2>/dev/null | /usr/bin/awk '\''
              BEGIN { seen = 0; emitted = 0 }
              {
                line = $0
                gsub(/\\033\\[[0-9;?]*[ -\\/]*[@-~]/, "", line)
                if (line ~ /Plugin[[:space:]]+hyprbars([[:space:]]|$)/) {
                  seen = 1
                  next
                }
                if (seen && line ~ /enabled:[[:space:]]*true([[:space:]]|$)/) {
                  print "enabled"
                  emitted = 1
                  exit
                }
                if (seen && line ~ /enabled:/) {
                  print "disabled"
                  emitted = 1
                  exit
                }
                if (seen && line ~ /Plugin[[:space:]]+/)
                  exit
              }
              END {
                if (!emitted)
                  print seen ? "unknown" : "unavailable"
              }
            '\''
          }

          ''')
          replace_between(helper, 'hyprbars_status() {', 'hyprbars_enable() {', '''hyprbars_status() {
            local persisted=""
            hyprbars_require_user
            persisted="$(hyprbars_persistent_state)"

            case "$persisted" in
              enabled)
                printf '%s\\n' 'enabled'
                ;;
              disabled)
                if hyprbars_loaded; then
                  printf '%s\\n' 'disabled-pending'
                else
                  printf '%s\\n' 'disabled'
                fi
                ;;
              unavailable)
                if hyprbars_loaded; then
                  printf '%s\\n' 'enabled'
                else
                  printf '%s\\n' 'unavailable'
                fi
                ;;
              *)
                if hyprbars_loaded; then
                  printf '%s\\n' 'enabled'
                else
                  printf '%s\\n' 'disabled'
                fi
                ;;
            esac
          }

          ''')

          script = 'config/hypr/scripts/hyprbars_toggle.sh'
          replace_one(script,
              'REPO_URL="https://github.com/hyprwm/hyprland-plugins"\n',
              'REPO_URL="https://github.com/hyprwm/hyprland-plugins"\nTRUSTED_HELPER="/usr/local/libexec/awtarchy/scxctl-helper"\n')
          replace_between(script, 'machine_status() {', 'machine_toggle() {', '''machine_status() {
            if [[ -x $TRUSTED_HELPER ]]; then
              "$TRUSTED_HELPER" hyprbars-status
              return
            fi

            require_hyprpm || {
              printf '%s\\n' 'unavailable'
              return 0
            }

            if ! have_hyprbars_in_hyprpm; then
              if hyprbars_loaded; then
                printf '%s\\n' 'enabled'
              else
                printf '%s\\n' 'unavailable'
              fi
            elif hyprbars_enabled_in_hyprpm; then
              printf '%s\\n' 'enabled'
            elif hyprbars_loaded; then
              printf '%s\\n' 'disabled-pending'
            else
              printf '%s\\n' 'disabled'
            fi
          }

          ''')

          title = 'config/quickshell/awtarchy/TitleBarsCard.qml'
          replace_one(title,
              '        if (hyprbarsState === "unavailable")\n            return "Not set up";',
              '        if (hyprbarsState === "disabled-pending")\n            return "On now · Off next login";\n        if (hyprbarsState === "unavailable")\n            return "Not set up";')
          replace_one(title,
              '        if (hyprbarsState === "disabled" || hyprbarsState === "unavailable")\n            return "Enable";',
              '        if (hyprbarsState === "disabled" || hyprbarsState === "disabled-pending"\n                || hyprbarsState === "unavailable")\n            return "Enable";')
          replace_one(title,
              '                root.hyprbarsState = state === "enabled" || state === "disabled"\n                    || state === "unavailable" ? state : "unavailable";',
              '                root.hyprbarsState = state === "enabled" || state === "disabled" || state === "disabled-pending"\n                    || state === "unavailable" ? state : "unavailable";')
          replace_one(title,
              '                    root.hyprbarsState = "disabled";\n                    root.message = "Disabled for next login; the loaded plugin was not force-unloaded.";',
              '                    root.hyprbarsState = "disabled-pending";\n                    root.message = "Title Bars are still active now and are configured to turn off next login.";')
          replace_one(title,
              '                        : "Managed through Hyprland\'s plugin manager. Disabling avoids a forced hot-unload when the plugin remains loaded."))',
              '                        : (root.hyprbarsState === "disabled-pending"\n                            ? "Title Bars are loaded in this session, but hyprpm is configured to leave them off next login."\n                            : "Managed through Hyprland\'s plugin manager and synchronized with SUPER+ALT+T.")))')

          power = Path('config/quickshell/awtarchy/PowerModeCard.qml')
          text = power.read_text()
          start = text.rfind('\n    TitleBarsCard {')
          if start < 0:
              raise SystemExit('PowerModeCard.qml: nested TitleBarsCard not found')
          end = text.find('\n    }', start + 1)
          if end < 0:
              raise SystemExit('PowerModeCard.qml: nested TitleBarsCard end not found')
          end += len('\n    }')
          power.write_text(text[:start] + text[end:])

          quick = Path('config/quickshell/awtarchy/QuickSettings.qml')
          text = quick.read_text()
          marker_pos = text.find('text: "Disable Num Lock at session start"')
          if marker_pos < 0:
              raise SystemExit('QuickSettings.qml: Num Lock card marker not found')
          close_pattern = '                        }\n                    }\n\n                    ListScrollBar {'
          close_pos = text.find(close_pattern, marker_pos)
          if close_pos < 0:
              raise SystemExit('QuickSettings.qml: settings column end not found after Num Lock card')
          replacement = '''                        }

                        TitleBarsCard {
                            active: quickSettingsWindow.visible
                            textScale: root.effectiveTextScale
                            iconScale: root.effectiveIconScale
                        }
                    }

                    ListScrollBar {'''
          quick.write_text(text[:close_pos] + replacement + text[close_pos + len(close_pattern):])
          PY

          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          for rel in \
            .config/quickshell/awtarchy/QuickSettings.qml \
            .config/quickshell/awtarchy/PowerModeCard.qml \
            .config/quickshell/awtarchy/TitleBarsCard.qml \
            .config/hypr/scripts/hyprbars_toggle.sh
          do
            src="config/${rel#.config/}"
            hash="$(sha256sum "$src" | awk '{print $1}')"
            row="${hash}"$'\t'"${rel}"
            grep -Fqx -- "$row" "$manifest" || printf '%s\n' "$row" >>"$manifest"
          done

          bash -n local/libexec/awtarchy/scxctl-helper
          bash -n config/hypr/scripts/hyprbars_toggle.sh
          bash tests/test-hyprbars-quicksettings.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/PowerModeCard.qml \
            config/quickshell/awtarchy/TitleBarsCard.qml \
            config/hypr/scripts/hyprbars_toggle.sh \
            local/libexec/awtarchy/scxctl-helper \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'fix: synchronize Hyprland plugin state'
          git push origin HEAD:hyprland-plugin-state-sync
