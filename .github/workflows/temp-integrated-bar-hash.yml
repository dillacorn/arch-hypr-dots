name: TEMP Add Integrated Bar Managed Hash

on:
  push:
    branches: [fix/integrated-bar-managed-hash]

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.head_commit.message, 'Stage integrated Bar hash fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/integrated-bar-managed-hash
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Add current Bar hash and validate
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          bar='config/quickshell/awtarchy/Bar.qml'
          digest="$(sha256sum "$bar" | awk '{print $1}')"
          entry="$digest"$'\t''.config/quickshell/awtarchy/Bar.qml'

          grep -Fqx -- "$entry" "$history" || {
            printf '\n# 2026-09-08 integrated lockscreen/workspace Bar stock hash.\n%s\n' "$entry" >> "$history"
          }

          rm -f .github/workflows/temp-integrated-bar-hash.yml
          git add -A
          git diff --cached --check
          grep -Fqx -- "$entry" "$history"

          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
          fi
          bash tests/test-quickshell-updater-migration.sh

          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git commit -m 'Record integrated Bar managed hash'
          git push origin HEAD:fix/integrated-bar-managed-hash
