name: Apply desktop validation hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck lua5.4

      - name: Apply runtime fix
        run: python3 tools/apply-desktop-validation-fix.py

      - name: Validate complete update path
        run: |
          test ! -e awtarchy.sh
          bash -n awtarchy-install.sh
          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-awtarchy-command.sh
          bash -n tests/test-awtarchy-command-shim.sh
          bash -n tests/test-desktop-candidate-validation.sh
          bash -n tests/test-lua-validation.sh
          shellcheck \
            awtarchy-install.sh \
            local/bin/awtarchy \
            tests/test-awtarchy-command.sh \
            tests/test-awtarchy-command-shim.sh \
            tests/test-desktop-candidate-validation.sh \
            tests/test-lua-validation.sh
          bash tests/test-desktop-candidate-validation.sh
          bash tests/test-awtarchy-command.sh
          bash tests/test-awtarchy-command-shim.sh
          bash tests/test-lua-validation.sh
          git diff --check

      - name: Commit validated runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'Allow intentional desktop launcher commands during updates'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
