name: Temporary v3.4.3 Post-Update Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare-post-update:
    if: github.event.pull_request.number == 98 && github.event.pull_request.head.ref == 'fix/transient-task-icons' && github.event.pull_request.title == 'Filter transient task icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/transient-task-icons
          fetch-depth: 0
      - name: Prepare focused fix and v3.4.3 post-update repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bar_path = Path('config/quickshell/awtarchy/Bar.qml')
          bar = bar_path.read_text(encoding='utf-8')

          helper_start = bar.find('\n    function isXwaylandPopupHelper(toplevel) {')
          helper_end = bar.find('\n    function toplevelVisibleHere(toplevel) {', helper_start)
          if helper_start >= 0:
              if helper_end < 0:
                  raise SystemExit('could not locate end of temporary XWayland helper')
              bar = bar[:helper_start] + bar[helper_end:]

          stale_filters = '''        if (toplevel.wayland && toplevel.wayland.parent)\n            return false;\n        if (isXwaylandPopupHelper(toplevel))\n            return false;\n'''
          bar = bar.replace(stale_filters, '')

          title_guard = '''        const taskTitle = String(toplevel.title || "").trim();\n        if (taskTitle.length === 0)\n            return false;\n'''
          if bar.count(title_guard) != 1:
              raise SystemExit('final untitled-task guard is missing or duplicated')
          bar_path.write_text(bar, encoding='utf-8')

          runtime_path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          runtime = runtime_path.read_text(encoding='utf-8')
          function_name = 'repair_v343_transient_task_icons_target()'
          if function_name not in runtime:
              function_text = r'''repair_v343_transient_task_icons_target() {
            local target_home="$1" tag="$2"
            local bar_file="${target_home}/.config/quickshell/awtarchy/Bar.qml"

            [[ "$tag" == "v3.4.3" ]] || return 0
            [[ -f "$bar_file" && ! -L "$bar_file" ]] \
              || die "v3.4.3 post-release Bar target is unavailable."

            python3 - "$bar_file" <<'PY_TRANSIENT_TASK_ICONS'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          guard = '''        const taskTitle = String(toplevel.title || "").trim();
                  if (taskTitle.length === 0)
                      return false;
          '''
          if guard in text:
              raise SystemExit(0)

          anchor = '''        if (!toplevel || !toplevel.monitor || toplevel.monitor.name !== monitorName)
                      return false;
                  if (isAwtarchyFlyout(toplevel))
                      return false;
          '''
          replacement = '''        if (!toplevel || !toplevel.monitor || toplevel.monitor.name !== monitorName)
                      return false;
                  const taskTitle = String(toplevel.title || "").trim();
                  if (taskTitle.length === 0)
                      return false;
                  if (isAwtarchyFlyout(toplevel))
                      return false;
          '''
          if text.count(anchor) != 1:
              raise SystemExit("v3.4.3 transient-task repair anchor mismatch")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY_TRANSIENT_TASK_ICONS
            log "Applied v3.4.3 transient-task-icon post-release repair to generated target."
          }

          '''
              anchor = 'prepare_quickshell_update_target() {'
              if runtime.count(anchor) != 1:
                  raise SystemExit('could not locate Quickshell target preparation function')
              runtime = runtime.replace(anchor, function_text + anchor, 1)

          call = '  repair_v343_transient_task_icons_target "$target_home" "$tag"\n'
          if call not in runtime:
              call_anchor = '  repair_v342_workspace_focus_target "$target_home" "$tag"\n'
              if runtime.count(call_anchor) != 1:
                  raise SystemExit('could not locate post-release repair call site')
              runtime = runtime.replace(call_anchor, call_anchor + call, 1)
          runtime_path.write_text(runtime, encoding='utf-8')

          test_path = Path('tests/test-bar-task-icons.sh')
          test = test_path.read_text(encoding='utf-8')
          if '# shellcheck disable=SC1090\n' not in test:
              test = test.replace('#!/usr/bin/env bash\n', '#!/usr/bin/env bash\n# shellcheck disable=SC1090\n', 1)
          if 'RUNTIME="${ROOT}/local/share/awtarchy/awtarchy-runtime.sh"' not in test:
              test = test.replace(
                  'BAR_QML="${ROOT}/config/quickshell/awtarchy/Bar.qml"\n',
                  'BAR_QML="${ROOT}/config/quickshell/awtarchy/Bar.qml"\nRUNTIME="${ROOT}/local/share/awtarchy/awtarchy-runtime.sh"\nTMP="$(mktemp -d)"\ntrap \'rm -rf -- "$TMP"\' EXIT\n',
                  1,
              )

          stale_start = test.find('contains "$BAR_QML" \'if (toplevel.wayland && toplevel.wayland.parent)\'')
          stale_end = test.find('\n# Native icon sources remain authoritative.', stale_start)
          if stale_start >= 0:
              if stale_end < 0:
                  raise SystemExit('could not trim superseded task-filter assertions')
              test = test[:stale_start] + test[stale_end:]

          runtime_tests = r'''
          contains "$RUNTIME" 'repair_v343_transient_task_icons_target()' \
              'runtime is missing the v3.4.3 transient-task post-release repair'
          contains "$RUNTIME" '[[ "$tag" == "v3.4.3" ]] || return 0' \
              'v3.4.3 transient-task repair is not scoped to the published release'
          contains "$RUNTIME" 'repair_v343_transient_task_icons_target "$target_home" "$tag"' \
              'runtime does not apply the v3.4.3 transient-task repair to the generated target'

          prepare_line="$(grep -nF 'prepare_quickshell_update_target "$target_home"' "$RUNTIME" | head -n1 | cut -d: -f1)"
          repair_line="$(grep -nF 'repair_v343_transient_task_icons_target "$target_home" "$tag"' "$RUNTIME" | head -n1 | cut -d: -f1)"
          baseline_line="$(grep -nF 'bootstrap_previous_baseline "$active_theme"' "$RUNTIME" | head -n1 | cut -d: -f1)"
          [[ "$prepare_line" =~ ^[0-9]+$ && "$repair_line" =~ ^[0-9]+$ && "$baseline_line" =~ ^[0-9]+$ ]] \
              || fail 'could not locate v3.4.3 transient-task target-repair ordering'
          (( prepare_line < repair_line && repair_line < baseline_line )) \
              || fail 'v3.4.3 transient-task target repair must run before baseline comparison'

          functions_file="${TMP}/v343-transient-task-repair.sh"
          awk '
              /^repair_v343_transient_task_icons_target\(\) \{/ { capture=1 }
              capture { print }
              capture && /^}$/ { exit }
          ' "$RUNTIME" >"$functions_file"
          contains "$functions_file" 'repair_v343_transient_task_icons_target()' \
              'could not extract the real v3.4.3 transient-task repair function'

          die() {
              printf 'TEST DIE: %s\n' "$*" >&2
              return 1
          }
          log() { :; }
          source "$functions_file"

          v343_home="${TMP}/v343"
          v342_home="${TMP}/v342"
          for home in "$v343_home" "$v342_home"; do
              mkdir -p "${home}/.config/quickshell/awtarchy"
              cat >"${home}/.config/quickshell/awtarchy/Bar.qml" <<'EOF_BAR_FIXTURE'
              function toplevelVisibleHere(toplevel) {
                  if (!toplevel || !toplevel.monitor || toplevel.monitor.name !== monitorName)
                      return false;
                  if (isAwtarchyFlyout(toplevel))
                      return false;
              }
          EOF_BAR_FIXTURE
          done

          repair_v343_transient_task_icons_target "$v343_home" v3.4.3
          v343_bar="${v343_home}/.config/quickshell/awtarchy/Bar.qml"
          [[ $(grep -Fc 'const taskTitle = String(toplevel.title || "").trim();' "$v343_bar") -eq 1 ]] \
              || fail 'real v3.4.3 repair did not add the live title guard'
          [[ $(grep -Fc 'if (taskTitle.length === 0)' "$v343_bar") -eq 1 ]] \
              || fail 'real v3.4.3 repair did not reject untitled task windows'

          repair_v343_transient_task_icons_target "$v343_home" v3.4.3
          [[ $(grep -Fc 'const taskTitle = String(toplevel.title || "").trim();' "$v343_bar") -eq 1 ]] \
              || fail 'v3.4.3 transient-task repair is not idempotent'

          repair_v343_transient_task_icons_target "$v342_home" v3.4.2
          v342_bar="${v342_home}/.config/quickshell/awtarchy/Bar.qml"
          if grep -Fq 'const taskTitle = String(toplevel.title || "").trim();' "$v342_bar"; then
              fail 'v3.4.3 transient-task repair leaked into another release tag'
          fi
          '''
          marker = '\n# Native icon sources remain authoritative.'
          if 'runtime is missing the v3.4.3 transient-task post-release repair' not in test:
              if test.count(marker) != 1:
                  raise SystemExit('could not locate task-icon test insertion point')
              test = test.replace(marker, '\n' + runtime_tests.strip('\n') + '\n' + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          digest="$(sha256sum config/quickshell/awtarchy/Bar.qml | awk '{print $1}')"
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          entry="${digest}"$'\t''.config/quickshell/awtarchy/Bar.qml'
          grep -Fxq -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"

          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-bar-task-icons.sh
          shellcheck tests/test-bar-task-icons.sh
          bash tests/test-bar-task-icons.sh
          git diff --check

          rm -f -- .github/workflows/tmp-v343-post-update-bridge.yml

      - name: Commit prepared post-update patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Prepare v3.4.3 transient task post-update'
          git push origin HEAD:fix/transient-task-icons
