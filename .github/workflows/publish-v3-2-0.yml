name: Publish v3.2.0

on:
  workflow_run:
    workflows:
      - Validate Awtarchy
    types:
      - completed

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Report validation result
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [[ "$CONCLUSION" == success ]]; then
            state=success
            description='Validate Awtarchy passed'
          else
            state=failure
            failed_steps="$(
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
                --jq '[.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name] | unique | join(", ")'
            )"
            [[ -n "$failed_steps" ]] || failed_steps="workflow conclusion: $CONCLUSION"
            description="Validate Awtarchy failed: ${failed_steps}"
            description="${description:0:140}"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$EVENT_SHA" \
            --raw-field state="$state" \
            --raw-field context='release-gate/validate-awtarchy' \
            --raw-field description="$description" \
            --raw-field target_url="$RUN_URL" >/dev/null

      - name: Stop on failed validation
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: exit 1

      - name: Check out repository
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Publish v3.2.0
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_SHA: 9a96b5352461fc88e31c8fe690eb4487a3e16de4
          TARGET_TREE: 192934acba334e350abd6e2e76de27a664880bc2
          RELEASE_TAG: v3.2.0
          RELEASE_NAME: Awtarchy v3.2.0 Anonymous Failure Reporting
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          git merge-base --is-ancestor "$TARGET_SHA" "$EVENT_SHA"
          git diff --quiet "$TARGET_SHA" "$EVENT_SHA" -- . \
            ':(exclude).github/workflows/publish-v3-2-0.yml'

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} tag already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} release already exists" >&2
            exit 1
          fi

          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' >v3.1.5-release.md
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json name --jq '.name' | grep -Fxq 'Awtarchy v3.1.5 Quickshell'
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fxq true

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('v3.1.5-release.md').read_text()
          lines = source.splitlines(keepends=True)
          heading_indexes = [i for i, line in enumerate(lines) if re.match(r'^##\s+\S', line)]
          if not heading_indexes:
              raise SystemExit('v3.1.5 release body has no H2 sections')

          sections = []
          for pos, start in enumerate(heading_indexes):
              end = heading_indexes[pos + 1] if pos + 1 < len(heading_indexes) else len(lines)
              title = re.sub(r'^##\s+', '', lines[start]).strip()
              sections.append((title, ''.join(lines[start:end]).rstrip() + '\n'))

          wanted = {
              'getting started',
              'start here',
              'install awtarchy',
              'after installation',
              'existing awtarchy users',
          }
          install_sections = [
              block for title, block in sections
              if title.casefold() in wanted
          ]
          if not install_sections:
              raise SystemExit('could not find v3.1.5 Getting Started/install sections')

          installation = '\n'.join(install_sections).strip()
          required = [
              'sudo pacman -S git --noconfirm',
              'git clone https://github.com/dillacorn/awtarchy',
              'sudo ./awtarchy-install.sh',
          ]
          missing = [item for item in required if item not in installation]
          if missing:
              raise SystemExit(f'v3.1.5 installation text missing expected markers: {missing}')

          Path('v3.1.5-installation.md').write_text(installation + '\n')
          installation_v320 = installation.replace('v3.1.5', 'v3.2.0')

          patch_notes = '''# Awtarchy v3.2.0 Anonymous Failure Reporting

## Patch notes for v3.2.0

- Added user-approved anonymous failure reporting for a narrow set of recognized Awtarchy and Quickshell failures. Reports are prepared locally first and are never submitted unless the user explicitly chooses **Send**; **Review** shows the exact structured payload before transmission and **Don't send** discards it.
- Added the production Awtarchy report service using a Cloudflare Worker, Cloudflare D1, and the restricted Awtarchy Report Bot GitHub App. New failure signatures can create a server-generated public issue, while repeated reports reuse the same issue through D1-backed fingerprint deduplication.
- Hardened the public reporting path with strict allowlisted schemas, bounded request bodies and GitHub calls, client-side pending-file confinement and revalidation, creation-lease recovery, bot-author verification, and layered Cloudflare rate limiting before D1/GitHub work.
- Kept report payloads free of raw logs, usernames, hostnames, home-directory paths, command history, clipboard contents, VPN details, and persistent machine/install identifiers. Cloudflare transport metadata is handled separately from the sanitized application payload as documented in `PRIVACY.md`.
- Integrated terminal failure capture with Quickshell start/restart readiness, exhausted resume recovery, and updater rollback handling. Recoverable intermediate updater attempts are suppressed so a failed update produces one specific `restart_after_update` report only after recovery is exhausted.
- Pending noninteractive reports now survive locally and resurface through normal Awtarchy maintenance/Quickshell flows instead of silently disappearing or spawning a terminal during a broken session.
- Added dedicated reporting CI, Worker tests on Node 20/22, Wrangler deployment dry-runs, security/concurrency regressions, operator documentation, and project privacy documentation.
- Validated the production path end-to-end before release: the live Worker accepted a reviewed user-style report, Awtarchy Report Bot created issue #50, and an identical second submission resolved to the same issue.
'''

          what_changed = '''## What Changed in v3.2.0

- User-approved failure reporting is now part of Awtarchy's supported maintenance/recovery path.
- Awtarchy now includes a narrowly scoped hosted report backend while keeping normal desktop operation local.
- Duplicate recognized failures are aggregated by stable server-generated signatures instead of creating one GitHub issue per report.
- Reporting failures remain secondary: they do not replace the original Quickshell/update/recovery result or silently transmit diagnostic data.
'''

          placeholder = '''## Post-release updates

_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._
'''

          body = (
              patch_notes.rstrip() + '\n\n' +
              installation_v320.rstrip() + '\n\n' +
              what_changed.rstrip() + '\n\n' +
              placeholder
          )
          Path('release-notes.md').write_text(body)
          PY

          grep -Fq '# Awtarchy v3.2.0 Anonymous Failure Reporting' release-notes.md
          grep -Fq '## Patch notes for v3.2.0' release-notes.md
          grep -Fq '## What Changed in v3.2.0' release-notes.md
          grep -Fq '## Post-release updates' release-notes.md
          grep -Fq '_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._' release-notes.md
          grep -Fq 'sudo pacman -S git --noconfirm' release-notes.md
          grep -Fq 'git clone https://github.com/dillacorn/awtarchy' release-notes.md
          grep -Fq 'sudo ./awtarchy-install.sh' release-notes.md
          grep -Fq 'Awtarchy Report Bot created issue #50' release-notes.md

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg target "$TARGET_SHA" \
            --arg name "$RELEASE_NAME" \
            --rawfile body release-notes.md \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false}' \
            >release-create.json

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            --input release-create.json >/dev/null

          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$TARGET_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json name --jq '.name' | grep -Fxq "$RELEASE_NAME"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish' | grep -Fxq "$TARGET_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fxq true
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' >verified-release.md

          grep -Fq '## Post-release updates' verified-release.md
          grep -Fq '_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._' verified-release.md
          grep -Fq 'Awtarchy Report Bot created issue #50' verified-release.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          def installation_sections(text):
              lines = text.splitlines(keepends=True)
              indexes = [i for i, line in enumerate(lines) if re.match(r'^##\s+\S', line)]
              sections = []
              for pos, start in enumerate(indexes):
                  end = indexes[pos + 1] if pos + 1 < len(indexes) else len(lines)
                  title = re.sub(r'^##\s+', '', lines[start]).strip()
                  sections.append((title, ''.join(lines[start:end]).rstrip() + '\n'))
              wanted = {
                  'getting started', 'start here', 'install awtarchy',
                  'after installation', 'existing awtarchy users',
              }
              return '\n'.join(
                  block for title, block in sections if title.casefold() in wanted
              ).strip()

          old = installation_sections(Path('v3.1.5-release.md').read_text())
          new = installation_sections(Path('verified-release.md').read_text())
          if not old or not new:
              raise SystemExit('could not verify copied installation sections')
          if new.replace('v3.2.0', 'v3.1.5') != old:
              raise SystemExit('v3.2.0 Getting Started/install text does not match v3.1.5')
          PY

      - name: Remove temporary publisher
        if: ${{ github.event.workflow_run.conclusion == 'success' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm -- .github/workflows/publish-v3-2-0.yml
          git commit -m 'chore: remove v3.2.0 release publisher'
          git push origin HEAD:main
