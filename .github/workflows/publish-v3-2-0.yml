name: Publish v3.2.0

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Release Awtarchy v3.2.0' &&
      github.event.issue.body == 'AWTARCHY_PUBLISH_V3_2_0_20260824_FINAL'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Publish and verify v3.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          TARGET_SHA: 9a96b5352461fc88e31c8fe690eb4487a3e16de4
          TARGET_TREE: 192934acba334e350abd6e2e76de27a664880bc2
          RELEASE_TAG: v3.2.0
          RELEASE_NAME: Awtarchy v3.2.0 Quickshell
        run: |
          set -Eeuo pipefail

          fail() {
            local rc="$?"
            trap - ERR
            gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "v3.2.0 release publisher failed before completion (exit ${rc})." >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap fail ERR

          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} tag already exists" >&2
            false
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} release already exists" >&2
            false
          fi

          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" --json name,isDraft,isPrerelease,body >old-release.json
          jq -e '.name == "Awtarchy v3.1.5 Quickshell" and .isDraft == false and .isPrerelease == false' old-release.json >/dev/null
          jq -r '.body' old-release.json >old-release.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          old = Path('old-release.md').read_text()
          lines = old.splitlines(keepends=True)
          starts = [i for i, line in enumerate(lines) if re.match(r'^##\s+\S', line)]
          if not starts:
              raise SystemExit('v3.1.5 release has no H2 sections')

          sections = []
          for n, start in enumerate(starts):
              end = starts[n + 1] if n + 1 < len(starts) else len(lines)
              title = re.sub(r'^##\s+', '', lines[start]).strip()
              block = ''.join(lines[start:end]).rstrip() + '\n'
              sections.append((title, block))

          install_idx = next((i for i, (_, b) in enumerate(sections) if 'sudo pacman -S git --noconfirm' in b), None)
          if install_idx is None:
              raise SystemExit('could not find v3.1.5 install section')

          start_idx = install_idx
          for i in range(install_idx, -1, -1):
              if sections[i][0].casefold() in {'getting started', 'start here', 'fresh install', 'fresh installation'}:
                  start_idx = i
                  break

          end_idx = next((i for i in range(install_idx, len(sections)) if 'awtarchy update' in sections[i][1]), None)
          if end_idx is None:
              raise SystemExit('could not find end of v3.1.5 install/update section')

          install = '\n'.join(block for _, block in sections[start_idx:end_idx + 1]).strip()
          for required in (
              'sudo pacman -S git --noconfirm',
              'git clone https://github.com/dillacorn/awtarchy',
              'sudo ./awtarchy-install.sh',
              'awtarchy update',
          ):
              if required not in install:
                  raise SystemExit(f'missing expected v3.1.5 install text: {required}')

          Path('v3.1.5-install.md').write_text(install + '\n')
          install = install.replace('v3.1.5', 'v3.2.0')

          notes = f'''# Awtarchy v3.2.0 Quickshell

Awtarchy v3.2.0 adds user-approved anonymous failure reporting for recognized Awtarchy and Quickshell failures, with a production-tested reporting service designed around explicit consent, strict data minimization, deduplication, and abuse protection.

{install}

## Anonymous failure reporting

- Recognized failures can prepare a sanitized report locally without transmitting anything automatically.
- The prompt provides **Send**, **Review**, and **Don't send**. Review displays the exact structured payload before transmission.
- Accepted reports may become part of a public GitHub issue in the Awtarchy repository.
- Noninteractive failures remain queued locally and can resurface through normal Awtarchy maintenance or healthy Quickshell startup.
- Initial reporting covers Quickshell start/restart readiness, exhausted resume recovery, and post-update Quickshell failure after updater recovery is exhausted.
- Reporting remains secondary and never replaces the original update, Quickshell, or recovery result.

## Report service and privacy

- Added the production Cloudflare Worker and D1 report service plus the restricted Awtarchy Report Bot GitHub App.
- New recognized failure signatures can create a server-generated GitHub issue; repeat reports reuse the same issue through stable fingerprint deduplication.
- Reports exclude raw logs, usernames, hostnames, home-directory paths, command history, clipboard contents, VPN details, and persistent machine/install identifiers.
- The client confines pending-report operations to known files and revalidates payloads before transmission.
- The Worker strictly allowlists fields and recognized failure classes, bounds request bodies and GitHub calls, and applies layered Cloudflare rate limiting before D1/GitHub work.
- Cloudflare necessarily processes normal transport metadata, but transport IP is not copied into the Awtarchy report payload, D1 report record, GitHub issue content, or a persistent Awtarchy identifier.

## Production validation

- The production Worker was deployed and passed its health check.
- A reviewed user-style submission created bot-authored issue #50; an identical second submission resolved to the same issue, proving production deduplication.
- A separate raw `curl` request with no `Authorization` header received HTTP 201 and created bot-authored issue #51, proving normal users need no Cloudflare login, GitHub login, API token, or client secret to submit an approved report.
- Dedicated CI covers shell integration, Worker behavior, Node 20/22 backend tests, Wrangler deployment dry-runs, validation, rate limiting, deduplication, concurrency, and recovery behavior.

## Post-release updates

_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._
'''
          Path('release-notes.md').write_text(notes)
          PY

          grep -Fq '# Awtarchy v3.2.0 Quickshell' release-notes.md
          grep -Fq 'sudo pacman -S git --noconfirm' release-notes.md
          grep -Fq 'git clone https://github.com/dillacorn/awtarchy' release-notes.md
          grep -Fq 'sudo ./awtarchy-install.sh' release-notes.md
          grep -Fq 'awtarchy update' release-notes.md
          grep -Fq 'issue #50' release-notes.md
          grep -Fq 'issue #51' release-notes.md
          grep -Fq '## Post-release updates' release-notes.md
          grep -Fq '_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._' release-notes.md

          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "$RELEASE_NAME" --notes-file release-notes.md

          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$TARGET_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,targetCommitish,isDraft,isPrerelease,body,url >verified.json
          jq -e --arg name "$RELEASE_NAME" --arg target "$TARGET_SHA" '.name == $name and .targetCommitish == $target and .isDraft == false and .isPrerelease == false' verified.json >/dev/null
          jq -r '.body' verified.json >verified.md
          grep -Fq '## Post-release updates' verified.md
          grep -Fq 'issue #51' verified.md
          grep -Fq 'sudo ./awtarchy-install.sh' verified.md

          python3 - <<'PY'
          from pathlib import Path
          old = Path('v3.1.5-install.md').read_text().strip()
          new = Path('verified.md').read_text()
          for text in ('sudo pacman -S git --noconfirm', 'git clone https://github.com/dillacorn/awtarchy', 'sudo ./awtarchy-install.sh', 'awtarchy update'):
              if text not in new:
                  raise SystemExit(f'published release missing install text: {text}')
          if old.replace('v3.1.5', 'v3.2.0') not in new:
              raise SystemExit('published Getting Started/install text does not match v3.1.5')
          PY

          url="$(jq -r '.url' verified.json)"
          sha="$(sha256sum verified.md | awk '{print $1}')"
          gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "v3.2.0 release published and verified. Target: \`${TARGET_SHA}\`. Release body SHA-256: \`${sha}\`. ${url}" >/dev/null

          trap - ERR
