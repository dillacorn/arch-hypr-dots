name: Refresh sched-ext Apply label

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-v3-apply-label.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Rename button and refresh v3.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: 52a95a9def0ca3cbbcbc76bec089ff3849356981
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          file='config/quickshell/awtarchy/QuickSettings.qml'
          old='label: "Start / Switch"'
          new='label: "Apply"'

          test "$(grep -Fxc -- "                                        $old" "$file")" = '1'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = 'label: "Start / Switch"'
          new = 'label: "Apply"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

          ! grep -Fq -- 'label: "Start / Switch"' "$file"
          test "$(grep -Fc -- 'label: "Apply"' "$file")" -ge 1
          git diff --check

          changed="$(git diff --numstat -- "$file")"
          test "$changed" = $'1\t1\tconfig/quickshell/awtarchy/QuickSettings.qml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-v3-apply-label.yml
          git add "$file"
          git commit -m 'Rename sched-ext apply button'
          git push origin HEAD:main

          final_sha="$(git rev-parse HEAD)"

          release_json="$(mktemp)"
          body_file="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" >"$release_json"
          test "$(jq -r '.id' "$release_json")" = '370945153'
          test "$(jq -r '.name' "$release_json")" = 'Awtarchy v3.0.0 Quickshell'
          jq -r '.body // ""' "$release_json" >"$body_file"

          bullet='- Renamed the sched-ext `Start / Switch` control to `Apply` so the button matches its actual behavior without changing scheduler activation logic.'
          if ! grep -Fqx -- "$bullet" "$body_file"; then
            printf '\n%s\n' "$bullet" >>"$body_file"
          fi

          git tag -f v3.0.0 "$final_sha"
          git push origin refs/tags/v3.0.0 --force

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/370945153" \
            -f tag_name='v3.0.0' \
            -f target_commitish="$final_sha" \
            -f name='Awtarchy v3.0.0 Quickshell' \
            -F draft=false \
            -F prerelease=false \
            -f body="$(cat "$body_file")" \
            >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.0.0" --jq '.object.sha')" = "$final_sha"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" --jq '.id')" = '370945153'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" --jq '.target_commitish')" = "$final_sha"
