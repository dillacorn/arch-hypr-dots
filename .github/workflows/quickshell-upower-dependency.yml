name: Quickshell UPower dependency patch

on:
  push:
    branches: [quickshell-conversion-testing]
    paths: ['.github/workflows/quickshell-upower-dependency.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0
      - name: Add UPower to branch runtime and installer transform
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = runtime.read_text()
          match = re.search(r'("Utilities": ")([^"]+)(")', text)
          if not match:
              raise SystemExit('missing Utilities package group in runtime')
          packages = match.group(2).split()
          if 'upower' not in packages:
              insert_at = packages.index('qt6ct') + 1 if 'qt6ct' in packages else 0
              packages.insert(insert_at, 'upower')
              text = text[:match.start()] + match.group(1) + ' '.join(packages) + match.group(3) + text[match.end():]
          runtime.write_text(text)

          installer = Path('awtarchy-install.sh')
          text = installer.read_text()
          marker = '# Quickshell battery integration requires the UPower daemon.'
          if marker not in text:
              anchor = '\n# AUR defaults: Waybar-git and wlogout are no longer part of Awtarchy.\n'
              if anchor not in text:
                  raise SystemExit('missing installer package transform anchor')
              block = '''
# Quickshell battery integration requires the UPower daemon.
utility_match = re.search(r'("Utilities": ")([^"]+)(")', text)
if not utility_match:
    raise SystemExit("ERROR: could not locate Utilities package group")
utility_packages = utility_match.group(2).split()
if "upower" not in utility_packages:
    insert_at = utility_packages.index("qt6ct") + 1 if "qt6ct" in utility_packages else 0
    utility_packages.insert(insert_at, "upower")
text = text[:utility_match.start()] + utility_match.group(1) + " ".join(utility_packages) + utility_match.group(3) + text[utility_match.end():]
'''
              text = text.replace(anchor, '\n' + block + anchor, 1)
          installer.write_text(text)
          PY
          bash -n awtarchy-install.sh
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          grep -q 'Quickshell battery integration requires the UPower daemon' awtarchy-install.sh
          grep -q 'qt6ct upower' local/share/awtarchy/awtarchy-runtime.sh
          git diff --check
      - name: Commit source patch
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add awtarchy-install.sh local/share/awtarchy/awtarchy-runtime.sh
          git diff --cached --check
          git commit -m 'Add UPower dependency for Quickshell battery support'
          git push origin HEAD:quickshell-conversion-testing
