name: Validate Anonymous Failure Reporting

on:
  push:
    branches: [main, anonymous-crash-reporting-testing]
    paths:
      - config/hypr/scripts/awtarchy_report_failure.sh
      - config/hypr/scripts/quickshell.sh
      - config/hypr/scripts/quickshell_resume_recover.sh
      - local/bin/awtarchy
      - local/share/awtarchy/awtarchy-runtime.sh
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-anonymous-reporting.sh
      - tests/test-quickshell-report-hooks.sh
      - tests/test-quickshell-resume-report-hooks.sh
      - tests/test-update-report-stage.sh
      - .github/workflows/validate-anonymous-reporting.yml
  pull_request:
    paths:
      - config/hypr/scripts/awtarchy_report_failure.sh
      - config/hypr/scripts/quickshell.sh
      - config/hypr/scripts/quickshell_resume_recover.sh
      - local/bin/awtarchy
      - local/share/awtarchy/awtarchy-runtime.sh
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-anonymous-reporting.sh
      - tests/test-quickshell-report-hooks.sh
      - tests/test-quickshell-resume-report-hooks.sh
      - tests/test-update-report-stage.sh
      - .github/workflows/validate-anonymous-reporting.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: anonymous-crash-reporting-testing
          fetch-depth: 1
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Bash syntax
        run: |
          bash -n config/hypr/scripts/awtarchy_report_failure.sh
          bash -n config/hypr/scripts/quickshell.sh
          bash -n config/hypr/scripts/quickshell_resume_recover.sh
          bash -n tests/test-anonymous-reporting.sh
          bash -n tests/test-quickshell-report-hooks.sh
          bash -n tests/test-quickshell-resume-report-hooks.sh
          bash -n tests/test-update-report-stage.sh
      - name: ShellCheck
        run: |
          shellcheck config/hypr/scripts/awtarchy_report_failure.sh
          shellcheck -e SC2034 config/hypr/scripts/quickshell.sh
          shellcheck config/hypr/scripts/quickshell_resume_recover.sh
          shellcheck tests/test-anonymous-reporting.sh
          shellcheck tests/test-quickshell-report-hooks.sh
          shellcheck tests/test-quickshell-resume-report-hooks.sh
          shellcheck tests/test-update-report-stage.sh
      - name: Apply exact updater reporting runtime fix
        if: github.event_name == 'pull_request'
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'if ! run_target bash "$manager" restart 9>&-; then',
                  'if ! AWTARCHY_REPORT_SUPPRESS_QUICKSHELL=1 run_target bash "$manager" restart 9>&-; then',
              ),
              (
                  '    run_target bash "$manager" start 9>&- || return 1',
                  '    AWTARCHY_REPORT_SUPPRESS_QUICKSHELL=1 run_target bash "$manager" start 9>&- || return 1',
              ),
              (
                  '    && ! run_target bash "$manager" start 9>&-;',
                  '    && ! AWTARCHY_REPORT_SUPPRESS_QUICKSHELL=1 run_target bash "$manager" start 9>&-;',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)

          anchor = 'start_quickshell_update_shell() {\n'
          reporter = '''report_quickshell_update_failure() {
            local source_label="$1" target_home="$2"
            local report_script="${target_home}/.config/hypr/scripts/awtarchy_report_failure.sh"

            if [[ ! -f "$report_script" || -L "$report_script" ]]; then
              report_script="${HOME_DIR}/.config/hypr/scripts/awtarchy_report_failure.sh"
            fi
            [[ -f "$report_script" && ! -L "$report_script" ]] || return 0

            AWTARCHY_REPORT_CONFIG_VERSION_OVERRIDE="$source_label" \\
              run_target bash "$report_script" \\
                capture quickshell restart_after_update quickshell_not_ready 9>&- \\
              || true
          }

          start_quickshell_update_shell() {
          '''
          if text.count(anchor) != 1:
              raise SystemExit('start_quickshell_update_shell anchor was not unique')
          text = text.replace(anchor, reporter, 1)

          old_failure = '''  if ! start_quickshell_update_shell; then
            rollback_quickshell_update
            die "Quickshell did not start successfully. User files were rolled back."
          fi'''
          new_failure = '''  if ! start_quickshell_update_shell; then
            rollback_quickshell_update
            report_quickshell_update_failure "$source_label" "$target_home"
            die "Quickshell did not start successfully. User files were rolled back."
          fi'''
          if text.count(old_failure) != 1:
              raise SystemExit('Quickshell startup failure block was not unique')
          text = text.replace(old_failure, new_failure, 1)

          path.write_text(text, encoding='utf-8')
          PY

          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash tests/test-update-report-stage.sh
          git diff --check

          rm -f -- .github/workflows/apply-runtime-reporting-fix.yml
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh .github/workflows/apply-runtime-reporting-fix.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged runtime fix'; false; }
          git commit -m 'fix: report exhausted updater recovery once'
          git push origin HEAD:anonymous-crash-reporting-testing
      - name: Managed history registration
        run: |
          while IFS='|' read -r file rel; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            entry="${hash}"$'\t'"${rel}"
            if ! grep -Fxq "$entry" local/share/awtarchy/quickshell-managed-history.sha256; then
              echo "Current ${file} hash missing from managed history: ${hash}"
              exit 1
            fi
          done <<'EOF'
          config/hypr/scripts/quickshell.sh|.config/hypr/scripts/quickshell.sh
          config/hypr/scripts/quickshell_resume_recover.sh|.config/hypr/scripts/quickshell_resume_recover.sh
          EOF
      - name: Anonymous reporting tests
        run: |
          bash tests/test-anonymous-reporting.sh
          bash tests/test-quickshell-report-hooks.sh
          bash tests/test-quickshell-resume-report-hooks.sh
          bash tests/test-update-report-stage.sh
