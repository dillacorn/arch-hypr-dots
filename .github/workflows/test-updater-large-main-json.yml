name: Test large updater response

on:
  push:
    branches: [fix-updater-large-main-json]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Reproduce large main commit response
        run: bash tests/test-updater-large-main-json.sh
