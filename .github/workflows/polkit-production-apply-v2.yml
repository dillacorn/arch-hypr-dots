name: Run Polkit production patch

on:
  push:
    branches:
      - polkit-agent-concept-testing

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply migration patch
        run: python3 tests/helpers/apply-polkit-production-migration.py
      - name: Remove one-use patch machinery
        run: |
          rm -f .github/workflows/polkit-production-apply.yml
          rm -f .github/workflows/polkit-production-apply-v2.yml
          rm -f tests/helpers/apply-polkit-production-migration.py
      - name: Validate implementation
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n config/hypr/scripts/awtarchy-polkit-agent/launcher.sh
          bash -n config/hypr/scripts/awtarchy-polkit-agent/window-guard.sh
          bash tests/test-polkit-agent-production-integration.sh
          bash tests/test-polkit-agent-secure.sh
          bash tests/test-polkit-agent-concept-input-redraw.sh
          bash tests/test-polkit-agent-runtime-rebuild.sh
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Awtarchy Polkit agent'
          git push origin HEAD:polkit-agent-concept-testing
