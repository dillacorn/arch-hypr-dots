name: Temporary PR73 Custom Scale Writer

on:
  push:
    branches:
      - feature/focused-display-scale
    paths:
      - .github/workflows/pr73-custom-scale-writer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/focused-display-scale
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Apply refinement
        run: python3 .github/scripts/pr73-custom-scale.py

      - name: Validate focused display scale
        run: |
          set -Eeuo pipefail
          bash -n config/hypr/scripts/quickshell_display_scale.sh
          bash -n tests/test-display-scale-quicksettings.sh
          shellcheck config/hypr/scripts/quickshell_display_scale.sh
          shellcheck tests/test-display-scale-quicksettings.sh
          bash tests/test-display-scale-quicksettings.sh
          git diff --check

      - name: Remove temporary writer and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -f .github/scripts/pr73-custom-scale.py .github/workflows/pr73-custom-scale-writer.yml
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'Support custom display scales'
          git push origin HEAD:feature/focused-display-scale
