name: Validate Flyout Runtime Centering Testing

on:
  push:
    branches: [feature/filter-quickshell-task-icons]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4

      - name: Record current managed stock hashes
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          changed=0

          while IFS= read -r repo_path; do
            repo_rel="${repo_path#./}"
            entry="$(sha256sum "$repo_path" | awk '{print $1}')"$'\t'".${repo_rel}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\n' "$entry" >> "$history"
              changed=1
            fi
          done < <(
            {
              find ./config/quickshell/awtarchy -maxdepth 1 -type f -print
              find ./config/hypr/scripts -maxdepth 1 -type f \
                \( -name 'quickshell*' -o -name 'ddc_brightness.sh' -o -name 'hypr-ddc-brightness.sh' \) -print
            } | sort
          )

          if (( changed == 1 )); then
            git config user.name 'dillacorn'
            git config user.email '28743863+dillacorn@users.noreply.github.com'
            git add "$history"
            git commit -m 'Record flyout runtime managed hashes'
            git push origin HEAD:feature/filter-quickshell-task-icons
          fi

      - name: Bash syntax
        run: |
          bash -n config/hypr/scripts/quickshell_notifications_toggle.sh
          bash -n tests/test-flyout-runtime-centering.sh

      - name: ShellCheck focused files
        run: shellcheck config/hypr/scripts/quickshell_notifications_toggle.sh tests/test-flyout-runtime-centering.sh

      - name: Runtime flyout centering regression
        run: bash tests/test-flyout-runtime-centering.sh

      - name: Existing related regressions
        run: |
          bash tests/test-bar-fullscreen-visibility.sh
          bash tests/test-flyout-toggle-debounce.sh
          bash tests/test-flyout-edge-layout.sh
          bash tests/test-launcher-keyboard-focus.sh
          bash tests/test-notification-hide-history.sh
          bash tests/test-quickshell-updater-migration.sh
          bash tests/test-display-scale-quicksettings.sh

      - name: Lua validation
        run: bash tests/test-lua-validation.sh

      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
