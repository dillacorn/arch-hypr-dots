name: Test direct Quickshell SIGTERM shutdown

on:
  push:
    paths:
      - ".github/workflows/tmp-quickshell-direct-term.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: tmp-quickshell-direct-term-20260815
          fetch-depth: 0

      - name: Patch shutdown path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager_path = Path("config/hypr/scripts/quickshell.sh")
          manager = manager_path.read_text()
          old = '''    # Quickshell's kill command is an IPC shutdown request. Target each exact\n    # old PID, then wait for those processes to really exit before starting a\n    # replacement. IPC can disappear slightly before Qt/Wayland teardown is\n    # complete, and starting the new instance in that gap can race the old one.\n    for pid in "${pids[@]}"; do\n        qs kill --pid "$pid" >/dev/null 2>&1 || true\n    done\n\n    wait_for_pids_stop "${pids[@]}" && return 0\n\n    # Quickshell's IPC shutdown can occasionally stall during Qt teardown.\n    # Use SIGTERM as recovery because Quickshell does not register SIGTERM\n    # with its crash reporter. Avoid SIGKILL, which presents a crash dialog.\n    printf 'quickshell.sh: graceful shutdown stalled for PID(s): %s; using SIGTERM fallback.\\n' "${pids[*]}" >&2\n    for pid in "${pids[@]}"; do\n        [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n        kill -TERM -- "$pid" 2>/dev/null || true\n    done\n\n    wait_for_pids_stop "${pids[@]}" && return 0\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish after SIGTERM for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n'''
          new = '''    # Do not use Quickshell's IPC teardown here. On some Qt/Quickshell builds\n    # it can crash while destructing the old shell and launch the crash reporter.\n    # SIGTERM is not registered by Quickshell's crash handler, so terminate the\n    # exact old Awtarchy instance directly and wait for it to disappear.\n    for pid in "${pids[@]}"; do\n        [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n        kill -TERM -- "$pid" 2>/dev/null || true\n    done\n\n    wait_for_pids_stop "${pids[@]}" && return 0\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish after SIGTERM for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n'''
          if manager.count(old) != 1:
              raise SystemExit("unexpected current Quickshell shutdown block")
          manager_path.write_text(manager.replace(old, new, 1))

          readiness_path = Path("tests/test-quickshell-production-readiness.sh")
          readiness = readiness_path.read_text()
          old = '''assert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs kill --pid "$pid"'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'kill -TERM -- "$pid"'\nassert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'kill -KILL -- "$pid"'\n'''
          new = '''assert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs kill --pid "$pid"'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'kill -TERM -- "$pid"'\nassert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'kill -KILL -- "$pid"'\n'''
          if readiness.count(old) != 1:
              raise SystemExit("unexpected readiness shutdown assertions")
          readiness_path.write_text(readiness.replace(old, new, 1))
          PY

          manifest="local/share/awtarchy/quickshell-managed-history.sha256"
          hash="$(sha256sum config/hypr/scripts/quickshell.sh | awk '{print $1}')"
          managed='.config/hypr/scripts/quickshell.sh'
          if ! grep -Fqx "${hash}"$'\t'"${managed}" "$manifest"; then
              printf '\n# Direct SIGTERM Quickshell updater shutdown.\n%s\t%s\n' "$hash" "$managed" >>"$manifest"
          fi

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-quickshell-production-readiness.sh
          shellcheck --severity=error config/hypr/scripts/quickshell.sh tests/test-quickshell-production-readiness.sh
          bash tests/test-quickshell-production-readiness.sh
          bash tests/test-bluetooth-state-persistence.sh
          git diff --check

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/scripts/quickshell.sh \
                  tests/test-quickshell-production-readiness.sh \
                  local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Avoid Quickshell teardown crash during updates"
          git push origin HEAD:tmp-quickshell-direct-term-20260815