name: Validate Bar Icon Display Options

on:
  pull_request:
    paths:
      - '.github/workflows/validate-bar-icon-display-options.yml'
      - 'config/hypr/scripts/quickshell.sh'
      - 'config/quickshell/awtarchy/Bar.qml'
      - 'config/quickshell/awtarchy/BarSettingsSection.qml'
      - 'tests/test-bar-icon-display-options.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bar-icon-display-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate bar icon display options
        run: |
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bar-icon-display-options.sh
          shellcheck tests/test-bar-icon-display-options.sh
          bash tests/test-bar-icon-display-options.sh

  record-power-menu-handoff-hash:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/quickshell-lockscreen'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record tested managed stock hash
        shell: bash
        run: |
          set -euo pipefail
          expected='8242ea24ae760e86276466a5ebc78d32aa6dbd59270b3a18690b701246234db4'
          actual="$(sha256sum config/quickshell/awtarchy/PowerMenu.qml | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          line="${actual}"$'\t''.config/quickshell/awtarchy/PowerMenu.qml'
          if ! grep -Fqx -- "$line" "$history"; then
            printf '\n# 2026-09-07 power menu action handoff coverage.\n%s\n' "$line" >>"$history"
          fi

          bash -n tests/test-quickshell-power-menu-action-handoff.sh
          shellcheck tests/test-quickshell-power-menu-action-handoff.sh
          bash tests/test-quickshell-power-menu-action-handoff.sh
          bash tests/test-quickshell-lockscreen-cutover.sh
          git diff --check

          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add "$history"
          git commit -m 'Record power menu handoff managed hash'
          git push origin HEAD:feature/quickshell-lockscreen
