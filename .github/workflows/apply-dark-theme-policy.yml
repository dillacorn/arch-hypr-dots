name: Apply safe dark theme policy
on:
  push:
    branches: [easyeffects-qt-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: easyeffects-qt-fix
          fetch-depth: 0
      - name: Verify RED
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y lua5.4 shellcheck >/dev/null
          set +e
          out="$(bash tests/test-lua-validation.sh 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -ne 0
          grep -Fq 'globally forces QT_QUICK_CONTROLS_STYLE' <<<"$out"
      - name: Patch
        run: |
          set -Eeuo pipefail
          sed -i '/hl\.env("QT_QUICK_CONTROLS_STYLE", "org\.hyprland\.style")/d' config/hypr/hyprland.lua
          python3 -c 'from pathlib import Path; p=Path("config/hypr/scripts/portal_fixup.sh"); s=p.read_text(); a="if command -v dbus-update-activation-environment >/dev/null 2>&1; then\n"; b="# Advertise the Awtarchy dark appearance preference through desktop settings.\n# Applications remain free to use their own supported toolkit style.\nif command -v gsettings >/dev/null 2>&1; then\n    if gsettings writable org.gnome.desktop.interface color-scheme 2>/dev/null | grep -qx '\''true'\''; then\n        gsettings set org.gnome.desktop.interface color-scheme prefer-dark >/dev/null 2>&1 || true\n    fi\nfi\n\n"; assert s.count(a)==1; p.write_text(s.replace(a,b+a,1))'
      - name: Verify GREEN
        run: |
          set -Eeuo pipefail
          bash -n config/hypr/scripts/portal_fixup.sh
          shellcheck config/hypr/scripts/portal_fixup.sh tests/test-lua-validation.sh
          bash tests/test-lua-validation.sh
          ! grep -Fq 'hl.env("QT_STYLE_OVERRIDE"' config/hypr/hyprland.lua
          ! grep -Fq 'hl.env("QT_QUICK_CONTROLS_STYLE"' config/hypr/hyprland.lua
          grep -Fq 'style=kvantum-dark' config/qt5ct/qt5ct.conf
          grep -Fq 'style=kvantum-dark' config/qt6ct/qt6ct.conf
          git diff --check
      - name: Commit
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-dark-theme-policy.yml
          git add config/hypr/hyprland.lua config/hypr/scripts/portal_fixup.sh
          git diff --cached --check
          git commit -m 'fix: advertise dark theme safely'
          git push origin HEAD:easyeffects-qt-fix
