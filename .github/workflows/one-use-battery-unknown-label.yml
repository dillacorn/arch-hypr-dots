name: One-use battery unknown label

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
          fetch-depth: 0
      - name: Label unreadable battery state as unknown
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/quickshell/awtarchy/BatteryCareCard.qml')
          text = path.read_text()
          old = '''        if (statusData.managed_config)
                      return "Managed";
                  return "Off";
              }
          '''
          new = '''        if (statusData.managed_config)
                      return "Managed";
                  return "Unknown";
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('statusControlLabel fallback not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

          history=local/share/awtarchy/quickshell-managed-history.sha256
          rel=.config/quickshell/awtarchy/BatteryCareCard.qml
          digest="$(sha256sum config/quickshell/awtarchy/BatteryCareCard.qml | awk '{print $1}')"
          line="${digest}"$'\t'"${rel}"
          grep -Fqx -- "$line" "$history" || printf '%s\n' "$line" >>"$history"

          bash -n tests/test-battery-care-detector-profiles.sh
          shellcheck tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-charge-limit-detection.sh
          sudo bash tests/test-battery-care-control.sh
          git diff --check

          rm -- .github/workflows/one-use-battery-unknown-label.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add config/quickshell/awtarchy/BatteryCareCard.qml \
                  local/share/awtarchy/quickshell-managed-history.sha256 \
                  .github/workflows/one-use-battery-unknown-label.yml
          git commit -m 'Show unknown battery state accurately'
          git push origin HEAD:hardening/tlp-battery-compatibility
