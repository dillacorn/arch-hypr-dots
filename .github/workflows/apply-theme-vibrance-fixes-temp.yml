name: Temporary Apply Theme and Vibrance Fixes

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/apply-theme-vibrance-fixes-temp.yml'
      - '.github/scripts/apply-theme-vibrance-fixes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq lua5.4
      - name: Apply production changes
        run: python3 .github/scripts/apply-theme-vibrance-fixes.py
      - name: Syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/vibrance_shader.sh
          bash -n tests/test-theme-overlay-escape.sh
          bash -n tests/test-color-adjustment-keybinds.sh
          bash -n tests/test-vibrance-runtime-toggle.sh
          shellcheck config/hypr/scripts/vibrance_shader.sh
          shellcheck tests/test-theme-overlay-escape.sh
          shellcheck tests/test-color-adjustment-keybinds.sh
          shellcheck tests/test-vibrance-runtime-toggle.sh
      - name: Focused and neighboring regressions
        run: |
          bash tests/test-theme-overlay-escape.sh
          bash tests/test-quickshell-theme-picker.sh
          bash tests/test-color-adjustment-keybinds.sh
          bash tests/test-vibrance-runtime-toggle.sh
          bash tests/test-night-light-schedule.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-bar-customize-flow.sh
          bash tests/test-lua-validation.sh
      - name: Verify diff and commit production files
        run: |
          git diff --check
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy/ThemePicker.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/hypr/scripts/vibrance_shader.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'Fix theme focus and display effect controls'
          git push origin HEAD:feature/bar-transparency
