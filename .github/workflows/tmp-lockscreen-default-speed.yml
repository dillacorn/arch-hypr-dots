name: Temporary Lockscreen Default Speed Apply

on:
  push:
    branches:
      - feature/quickshell-lockscreen

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage lockscreen default and speed implementation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/quickshell-lockscreen
          fetch-depth: 0
      - name: Apply approved production changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          bar = Path('config/quickshell/awtarchy/BarState.qml')
          shell = Path('config/quickshell/awtarchy-lock/shell.qml')
          surface = Path('config/quickshell/awtarchy-lock/LockSurface.qml')
          history = Path('local/share/awtarchy/quickshell-managed-history.sha256')

          paths = {
              bar: '.config/quickshell/awtarchy/BarState.qml',
              shell: '.config/quickshell/awtarchy-lock/shell.qml',
              surface: '.config/quickshell/awtarchy-lock/LockSurface.qml',
          }

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          before = [(digest(path), rel) for path, rel in paths.items()]

          text = bar.read_text()
          old = '''    function lockscreenAnimationPreference() {
              const value = String(data().lockscreen_animation || "random");
              for (const preset of lockscreenAnimationPresets) {
                  if (preset.key === value)
                      return value;
              }
              return "random";
          }'''
          new = '''    function lockscreenAnimationPreference() {
              const value = String(data().lockscreen_animation || "split");
              for (const preset of lockscreenAnimationPresets) {
                  if (preset.key === value)
                      return value;
              }
              return "split";
          }'''
          if old not in text:
              raise SystemExit('expected BarState lockscreen preference block not found')
          text = text.replace('            lockscreen_animation: "random",', '            lockscreen_animation: "split",', 1)
          text = text.replace(old, new, 1)
          bar.write_text(text)

          text = shell.read_text()
          replacements = {
              'property string lockAnimationPreference: "random"': 'property string lockAnimationPreference: "split"',
              'return allowedAnimationPreferences.indexOf(key) >= 0 ? key : "random";': 'return allowedAnimationPreferences.indexOf(key) >= 0 ? key : "split";',
              'lockAnimationPreference = "random";': 'lockAnimationPreference = "split";',
              'parsed && typeof parsed === "object" ? parsed.lockscreen_animation : "random"': 'parsed && typeof parsed === "object" ? parsed.lockscreen_animation : "split"',
          }
          for old_text, new_text in replacements.items():
              if old_text not in text:
                  raise SystemExit(f'expected shell text not found: {old_text}')
              text = text.replace(old_text, new_text)
          shell.write_text(text)

          text = surface.read_text()
          old_timing = '''                                readonly property int formationDelay: Math.floor(Math.random() * 451)
                                          readonly property int formationDuration: 2300
                                              + Math.floor(Math.random() * 451)'''
          new_timing = '''                                readonly property int formationDelay: Math.floor(Math.random() * 301)
                                          readonly property int formationDuration: 1700
                                              + Math.floor(Math.random() * 351)'''
          if old_timing not in text:
              raise SystemExit('expected lockscreen timing block not found')
          surface.write_text(text.replace(old_timing, new_timing, 1))

          after = [(digest(path), rel) for path, rel in paths.items()]
          history_text = history.read_text()
          additions = []
          for value, rel in before + after:
              line = f'{value}\t{rel}'
              if line not in history_text and line not in additions:
                  additions.append(line)
          if additions:
              with history.open('a') as handle:
                  handle.write('\n# 2026-09-07 native lockscreen Split default and faster formation.\n')
                  for line in additions:
                      handle.write(line + '\n')
          PY
          git diff --check
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/BarState.qml \
                  config/quickshell/awtarchy-lock/shell.qml \
                  config/quickshell/awtarchy-lock/LockSurface.qml \
                  local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --quiet && { echo 'No production changes staged'; exit 1; }
          git commit -m 'Use Split as faster lockscreen default'
          git push origin HEAD:feature/quickshell-lockscreen
