name: Apply Quickshell Interrupt Recovery

on:
  push:
    branches:
      - fix/quickshell-interrupt-recovery
    paths:
      - .github/workflows/apply-quickshell-interrupt-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/quickshell-interrupt-recovery
          fetch-depth: 0
      - name: Apply focused runtime fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''TMPD=""
          TARGET_STAGE_HOME=""

          cleanup_update() {
            if (( MOUSE_ENABLED == 1 )); then
              printf '\\033[?1000l\\033[?1006l' >/dev/tty 2>/dev/null || true
            fi
            [[ -n "${TMPD:-}" ]] && rm -rf -- "$TMPD" 2>/dev/null || true
          }
          ''',
              '''TMPD=""
          TARGET_STAGE_HOME=""
          QUICKSHELL_UPDATE_RESTORE_ON_EXIT=0

          restore_quickshell_update_shell_on_exit() {
            (( QUICKSHELL_UPDATE_RESTORE_ON_EXIT == 1 )) || return 0
            QUICKSHELL_UPDATE_RESTORE_ON_EXIT=0

            [[ -n "${HOME_DIR:-}" ]] || {
              warn "Could not restore Quickshell after interrupted update: target home is unavailable."
              return 1
            }

            local manager="${HOME_DIR}/.config/hypr/scripts/quickshell.sh"
            local status=""
            [[ -f "$manager" && ! -L "$manager" ]] || {
              warn "Could not restore Quickshell after interrupted update: manager is unavailable."
              return 1
            }

            status="$(run_target bash "$manager" status 9>&- 2>/dev/null || true)"
            [[ "$status" == "running" ]] && return 0

            log "Update interrupted; restoring Quickshell..."
            if ! AWTARCHY_REPORT_SUPPRESS_QUICKSHELL=1 run_target bash "$manager" start 9>&-; then
              warn "Could not restore Quickshell after interrupted update."
              return 1
            fi

            status="$(run_target bash "$manager" status 9>&- 2>/dev/null || true)"
            if [[ "$status" == "running" ]]; then
              log "Quickshell restored."
              return 0
            fi

            warn "Could not restore Quickshell after interrupted update."
            return 1
          }

          cleanup_update() {
            local exit_rc=$?
            if (( MOUSE_ENABLED == 1 )); then
              printf '\\033[?1000l\\033[?1006l' >/dev/tty 2>/dev/null || true
            fi
            [[ -n "${TMPD:-}" ]] && rm -rf -- "$TMPD" 2>/dev/null || true
            restore_quickshell_update_shell_on_exit || true
            return "$exit_rc"
          }
          ''',
              'cleanup recovery',
          )

          replace_once(
              '''  (( ${#alive_pids[@]} > 0 )) || return 0
            warn "Updater recovery could not stop Quickshell PID(s): ${alive_pids[*]}"
            return 1
          }
          ''',
              '''  if (( ${#alive_pids[@]} == 0 )); then
            QUICKSHELL_UPDATE_RESTORE_ON_EXIT=1
            return 0
            fi
            warn "Updater recovery could not stop Quickshell PID(s): ${alive_pids[*]}"
            return 1
          }
          ''',
              'shutdown recovery arming',
          )

          replace_once(
              '''  status="$(run_target bash "$manager" status 9>&- 2>/dev/null || true)"
            [[ "$status" == "running" ]]
          }
          ''',
              '''  status="$(run_target bash "$manager" status 9>&- 2>/dev/null || true)"
            if [[ "$status" == "running" ]]; then
              QUICKSHELL_UPDATE_RESTORE_ON_EXIT=0
              return 0
            fi
            return 1
          }
          ''',
              'successful restart disarm',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate focused behavior
        shell: bash
        run: |
          set -euo pipefail
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-quickshell-update-interrupt-recovery.sh
          bash tests/test-quickshell-update-interrupt-recovery.sh
          bash tests/test-quickshell-updater-bootstrap.sh
          git diff --check
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'Restore Quickshell after interrupted updates'
          git push origin HEAD:fix/quickshell-interrupt-recovery
