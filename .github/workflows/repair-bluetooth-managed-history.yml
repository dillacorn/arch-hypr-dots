name: Repair Bluetooth Managed History

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-bluetooth-managed-history.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Record current Bluetooth managed hashes and remove repair workflow
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EVENT_SHA"

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          helper='config/hypr/scripts/quickshell_bluetooth_state.sh'
          resume='config/hypr/scripts/quickshell_resume_recover.sh'
          helper_hash='7b13be4b4b2dbd9d2e03d5eb530caa1e8aa917613a37933f1db4ec182d36ea34'
          resume_hash='e6d1ead0edd25f81da7fd9b5a2dd84f86fc97faa89719107fe8e72ed93591290'
          helper_entry="${helper_hash}"$'\t'".${helper}"
          resume_entry="${resume_hash}"$'\t'".${resume}"

          test "$(sha256sum "$helper" | awk '{print $1}')" = "$helper_hash"
          test "$(sha256sum "$resume" | awk '{print $1}')" = "$resume_hash"

          if ! grep -Fqx "$helper_entry" "$history" || ! grep -Fqx "$resume_entry" "$history"; then
            {
              printf '\n# 2026-08-22 Bluetooth suspend/resume persistence.\n'
              grep -Fqx "$helper_entry" "$history" || printf '%s\n' "$helper_entry"
              grep -Fqx "$resume_entry" "$history" || printf '%s\n' "$resume_entry"
            } >>"$history"
          fi

          grep -Fqx "$helper_entry" "$history"
          grep -Fqx "$resume_entry" "$history"

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm -- .github/workflows/repair-bluetooth-managed-history.yml
          git add -- "$history"
          git commit -m 'Record Bluetooth resume managed hashes'
          git push origin HEAD:main
