name: Temporary Validate Theme and Vibrance Fixes

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-theme-vibrance-fixes-temp.yml'
      - 'config/quickshell/awtarchy/ThemePicker.qml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'config/hypr/scripts/vibrance_shader.sh'
      - 'tests/test-theme-overlay-escape.sh'
      - 'tests/test-quickshell-theme-picker.sh'
      - 'tests/test-color-adjustment-keybinds.sh'
      - 'tests/test-vibrance-runtime-toggle.sh'
      - 'local/share/awtarchy/quickshell-managed-history.sha256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-escape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: bash tests/test-theme-overlay-escape.sh

  color-hints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: bash tests/test-color-adjustment-keybinds.sh

  vibrance-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: bash tests/test-vibrance-runtime-toggle.sh
