name: Verify Quickshell Test Compatibility

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify temporary testing command compatibility
        run: |
          set -euo pipefail
          bash -n awtarchy-install.sh
          bash -n local/bin/awtarchy-quickshell
          bash -n local/share/awtarchy/awtarchy-runtime.sh

          test_home="$(mktemp -d)"
          env \
            HOME="$test_home" \
            USER="$(id -un)" \
            LOGNAME="$(id -un)" \
            AWTARCHY_INSTALL_BRANCH=quickshell-conversion-testing \
            AWTARCHY_TESTING_COMMIT="$GITHUB_SHA" \
            AWTARCHY_SKIP_SYSTEM_SHIM=1 \
            AWTARCHY_QUIET_TEST_COMMAND_INSTALL=1 \
            bash ./awtarchy-install.sh --quickshell-command

          test -x "$test_home/.local/bin/awtarchy-quickshell"
          test -x "$test_home/.local/share/awtarchy-quickshell/awtarchy-runtime.sh"
          grep -Fq "revision=$GITHUB_SHA" "$test_home/.local/state/awtarchy-quickshell/command-version"
          "$test_home/.local/bin/awtarchy-quickshell" help >/dev/null
