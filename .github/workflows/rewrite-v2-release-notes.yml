name: Rewrite v2.0.0 release installation guide

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rewrite-v2-release-notes.yml

permissions:
  contents: write

jobs:
  rewrite-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace v2.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/v2-release-body.md <<'EOF'
          # Awtarchy v2.0.0

          Awtarchy now has an official semantic version. Version 2.0.0 replaces repository-driven maintenance with a permanent installed `awtarchy` command.

          ## Start Here

          Awtarchy is not a Linux distribution. It is an overlay built to run on top of a fresh, vanilla Arch Linux installation.

          1. Download the latest [Arch Linux ISO](https://archlinux.org/download/).
          2. Put the ISO on a bootable USB. [Ventoy](https://www.ventoy.net/en/download.html) is recommended because you can copy ISOs directly to the drive and reuse it without reflashing each time.
          3. Boot the Arch ISO and install Arch manually, or use `archinstall`.

          `archinstall` is included on the Arch ISO. To refresh it before starting the installer:

          ```bash
          pacman -Sy archinstall
          archinstall
          ```

          Choose the **Minimal** profile. Complete the Arch installation, reboot, and log into the new system before installing Awtarchy.

          ## Install Awtarchy

          Install Git:

          ```bash
          sudo pacman -S git --noconfirm
          ```

          Clone the repository and run the installer:

          ```bash
          git clone https://github.com/dillacorn/awtarchy
          cd awtarchy
          sudo ./awtarchy-install.sh
          ```

          The installer collects your choices before making changes and shows a final review before installation begins.

          ## After Installation

          Reboot after the installer completes.

          If Ly was enabled during installation, log in through Ly. Otherwise, log in from the TTY and start Hyprland with:

          ```bash
          hypr
          ```

          For future updates and system maintenance, run:

          ```bash
          awtarchy
          ```

          The `awtarchy` menu handles command updates, configuration maintenance, version checks, and backup cleanup.

          ## Existing Awtarchy Users

          Existing users need one final repository-based migration:

          ```bash
          cd ~/awtarchy
          git pull --ff-only
          sudo ./awtarchy-install.sh
          ```

          The migration installs the new maintenance command, runtime, and version state without reinstalling packages or replacing managed configs. After migration, future maintenance starts with `awtarchy`.

          ## What Changed in v2.0.0

          - `awtarchy-install.sh` is now used for initial installation or an intentional full reinstall.
          - A permanent `awtarchy` maintenance command is installed at `~/.local/bin/awtarchy`.
          - Command updates and managed-config updates are handled separately.
          - Command and config release versions are tracked independently.
          - Self-updates use the exact tagged release archive and replace the command and runtime atomically.
          EOF

          gh release edit v2.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/v2-release-body.md

          verified_body="$(gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          grep -Fq 'Download the latest [Arch Linux ISO]' <<<"$verified_body"
          grep -Fq '[Ventoy]' <<<"$verified_body"
          grep -Fq 'git clone https://github.com/dillacorn/awtarchy' <<<"$verified_body"
          grep -Fq 'sudo ./awtarchy-install.sh' <<<"$verified_body"
          grep -Fq 'future updates and system maintenance' <<<"$verified_body"
          test "$(grep -Fc 'awtarchy self-update' <<<"$verified_body")" -eq 0

      - name: Remove temporary inspection branch and workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/release-v2-notes-inspection" \
            >/dev/null 2>&1 || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rewrite-v2-release-notes.yml
          git commit -m 'Remove one-time v2.0.0 release rewrite workflow'
          git push origin HEAD:main
