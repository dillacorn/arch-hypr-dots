name: One-use v3.5.5 clipboard hardening

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.ref == 'hardening/clipboard-thumbnail-v355' &&
      github.event.pull_request.title == 'Deliver clipboard thumbnail hardening to v3.5.5'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: hardening/clipboard-thumbnail-v355
          fetch-depth: 0
      - name: Apply reviewed clipboard hardening
        shell: bash
        env:
          EXPECTED_MAIN: 609e5aebe02bd53460ebd80d3cd12993d4707744
        run: |
          set -euo pipefail

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$EXPECTED_MAIN" || {
            printf 'Refusing write: main moved from %s to %s\n' "$EXPECTED_MAIN" "$current_main" >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          backend = Path('config/hypr/scripts/quickshell_clipboard.sh')
          history = Path('local/share/awtarchy/quickshell-managed-history.sha256')
          runtime = Path('local/share/awtarchy/awtarchy-runtime.sh')
          test_path = Path('tests/test-quickshell-clipboard-thumbnails.sh')

          text = backend.read_text(encoding='utf-8')
          old_timeout = 'DECODE_TIMEOUT="${DECODE_TIMEOUT:-0.70s}"\nLIST_PRODUCER_PID=""'
          new_timeout = 'DECODE_TIMEOUT="${DECODE_TIMEOUT:-0.70s}"\nTHUMB_TIMEOUT="${THUMB_TIMEOUT:-2s}"\nLIST_PRODUCER_PID=""'
          old_magick = '        && magick "$tmp" -thumbnail "${THUMB_SIZE}x${THUMB_SIZE}>" "png:$png" >/dev/null 2>&1; then'
          new_magick = (
              '        && timeout --kill-after=1s "$THUMB_TIMEOUT" magick \\\n'
              '            -limit memory 256MiB -limit map 256MiB -limit disk 512MiB \\\n'
              '            "${tmp}[0]" -thumbnail "${THUMB_SIZE}x${THUMB_SIZE}>" "png:$png" >/dev/null 2>&1; then'
          )
          if text.count(old_timeout) != 1 or text.count(old_magick) != 1:
              raise SystemExit('clipboard source no longer matches reviewed pre-hardening form')
          backend.write_text(text.replace(old_timeout, new_timeout, 1).replace(old_magick, new_magick, 1), encoding='utf-8')

          known_lines = [
              '8891de8271fa22f3932e7f9ee355c47f0807ab27f1151c77abf54bf10603fd02\t.config/hypr/scripts/quickshell_clipboard.sh',
              'ab73a9056ecd3cd692112cf218464c9abe1de5792b0fdaad1f6401b063a0d967\t.config/hypr/scripts/quickshell_clipboard.sh',
          ]
          htext = history.read_text(encoding='utf-8')
          if htext and not htext.endswith('\n'):
              htext += '\n'
          existing = set(htext.splitlines())
          for line in known_lines:
              if line not in existing:
                  htext += line + '\n'
          history.write_text(htext, encoding='utf-8')

          rtext = runtime.read_text(encoding='utf-8')
          if 'repair_v355_clipboard_thumbnail_repo()' in rtext:
              raise SystemExit('v3.5.5 clipboard repair already exists unexpectedly')

          repair = r"""
          repair_v355_clipboard_thumbnail_repo() {
            local repo_dir="$1" tag="$2"
            local backend="${repo_dir}/config/hypr/scripts/quickshell_clipboard.sh"
            local history="${repo_dir}/local/share/awtarchy/quickshell-managed-history.sha256"
            local expected_hash="ab73a9056ecd3cd692112cf218464c9abe1de5792b0fdaad1f6401b063a0d967"
            local actual_hash=""

            [[ "$tag" == "v3.5.5" ]] || return 0
            [[ -f "$backend" && ! -L "$backend" ]] \
              || die "v3.5.5 clipboard source is unavailable for the stable repair."
            [[ -f "$history" && ! -L "$history" ]] \
              || die "v3.5.5 managed-history source is unavailable for the stable repair."

            actual_hash="$(sha256sum "$backend" | awk '{print $1}')"
            if [[ "$actual_hash" != "$expected_hash" ]]; then
              python3 - "$backend" "$history" <<'PY_V355_CLIPBOARD'
          from pathlib import Path
          import sys

          backend = Path(sys.argv[1])
          history = Path(sys.argv[2])
          text = backend.read_text(encoding="utf-8")
          old_timeout = 'DECODE_TIMEOUT="${DECODE_TIMEOUT:-0.70s}"\nLIST_PRODUCER_PID=""'
          new_timeout = 'DECODE_TIMEOUT="${DECODE_TIMEOUT:-0.70s}"\nTHUMB_TIMEOUT="${THUMB_TIMEOUT:-2s}"\nLIST_PRODUCER_PID=""'
          old_magick = '        && magick "$tmp" -thumbnail "${THUMB_SIZE}x${THUMB_SIZE}>" "png:$png" >/dev/null 2>&1; then'
          new_magick = (
              '        && timeout --kill-after=1s "$THUMB_TIMEOUT" magick \\\n'
              '            -limit memory 256MiB -limit map 256MiB -limit disk 512MiB \\\n'
              '            "${tmp}[0]" -thumbnail "${THUMB_SIZE}x${THUMB_SIZE}>" "png:$png" >/dev/null 2>&1; then'
          )
          if text.count(old_timeout) != 1 or text.count(old_magick) != 1:
              raise SystemExit("v3.5.5 clipboard repair could not find the expected release source")
          backend.write_text(text.replace(old_timeout, new_timeout, 1).replace(old_magick, new_magick, 1), encoding="utf-8")

          lines = [
              "8891de8271fa22f3932e7f9ee355c47f0807ab27f1151c77abf54bf10603fd02\t.config/hypr/scripts/quickshell_clipboard.sh",
              "ab73a9056ecd3cd692112cf218464c9abe1de5792b0fdaad1f6401b063a0d967\t.config/hypr/scripts/quickshell_clipboard.sh",
          ]
          htext = history.read_text(encoding="utf-8")
          if htext and not htext.endswith("\n"):
              htext += "\n"
          existing = set(htext.splitlines())
          for line in lines:
              if line not in existing:
                  htext += line + "\n"
          history.write_text(htext, encoding="utf-8")
          PY_V355_CLIPBOARD
            fi

            actual_hash="$(sha256sum "$backend" | awk '{print $1}')"
            [[ "$actual_hash" == "$expected_hash" ]] \
              || die "v3.5.5 clipboard repair produced unexpected source hash ${actual_hash}."
            /usr/bin/bash -n "$backend" \
              || die "v3.5.5 clipboard repair failed Bash syntax validation."
            log "Applied v3.5.5 clipboard thumbnail resource hardening to release source."
          }

          """
          anchor = '\nprepare_quickshell_update_target() {'
          if rtext.count(anchor) != 1:
              raise SystemExit('runtime repair insertion anchor changed unexpectedly')
          rtext = rtext.replace(anchor, '\n' + repair + 'prepare_quickshell_update_target() {', 1)

          old_call = '  repair_v354_sony_battery_disable_repo "$repo_dir" "$tag"\n\n  target_home="${TMPD}/target-home"'
          if rtext.count(old_call) != 1:
              raise SystemExit('stable update repair call anchor changed unexpectedly')
          new_call = '  repair_v354_sony_battery_disable_repo "$repo_dir" "$tag"\n  repair_v355_clipboard_thumbnail_repo "$repo_dir" "$tag"\n\n  target_home="${TMPD}/target-home"'
          runtime.write_text(rtext.replace(old_call, new_call, 1), encoding='utf-8')

          ttext = test_path.read_text(encoding='utf-8')
          marker = '\nfixture_repo="${TMPD}/v355-repo"'
          if marker in ttext:
              ttext = ttext.split(marker, 1)[0].rstrip() + "\n\nprintf '%s\\n' 'PASS: clipboard thumbnails load lazily, reuse the cache, bound ImageMagick work, and expose v3.5.5 stable delivery.'\n"
          test_path.write_text(ttext, encoding='utf-8')
          PY

          expected_hash='ab73a9056ecd3cd692112cf218464c9abe1de5792b0fdaad1f6401b063a0d967'
          test "$(sha256sum config/hypr/scripts/quickshell_clipboard.sh | awk '{print $1}')" = "$expected_hash"

          rm -f -- \
            .github/release-v3.5.5-clipboard-notes.tmp.md \
            .github/clipboard-v355-red.txt \
            docs/superpowers/plans/2026-09-06-v355-clipboard-hardening-delivery.md

          git show origin/main:.github/workflows/validate-runtime-stress-analysis.yml > .github/workflows/validate-runtime-stress-analysis.yml
          rm -f -- .github/workflows/one-use-v355-clipboard.yml

          bash -n config/hypr/scripts/quickshell_clipboard.sh
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-quickshell-clipboard-thumbnails.sh
          shellcheck config/hypr/scripts/quickshell_clipboard.sh tests/test-quickshell-clipboard-thumbnails.sh
          bash tests/test-quickshell-clipboard-thumbnails.sh
          git diff --check

          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'Harden clipboard thumbnails for v3.5.5'
          git push origin HEAD:hardening/clipboard-thumbnail-v355
