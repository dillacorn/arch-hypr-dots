name: Refine Bar Icon Presets

on:
  push:
    branches:
      - feature/bar-icon-customization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine-presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Syntax and ShellCheck
        run: |
          bash -n tests/test-bar-icon-customization.sh
          shellcheck tests/test-bar-icon-customization.sh
      - name: Refined preset regression
        run: bash tests/test-bar-icon-customization.sh
