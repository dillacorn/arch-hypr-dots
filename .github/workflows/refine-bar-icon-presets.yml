name: Refine Bar Icon Presets

on:
  push:
    branches:
      - feature/bar-icon-customization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck jq
      - name: Align approved documentation
        run: |
          printf '%s' '' | base64 -d >/tmp/finalize-bar-icon-docs.py
          python3 /tmp/finalize-bar-icon-docs.py
      - name: Focused syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-bar-icon-customization.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh tests/test-bar-icon-customization.sh
      - name: Bar icon regression
        run: bash tests/test-bar-icon-customization.sh
      - name: Preserve Bluetooth and Night Light regressions
        run: |
          bash tests/test-bluetooth-state-persistence.sh
          bash tests/test-night-light-schedule.sh
      - name: Quickshell production readiness
        run: bash tests/test-quickshell-production-readiness.sh
      - name: Quickshell updater migration
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Branch diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Commit documentation alignment
        run: |
          if ! git diff --quiet -- docs/superpowers/specs/2026-08-28-bar-icon-customization-design.md docs/superpowers/plans/2026-08-28-bar-icon-customization.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/superpowers/specs/2026-08-28-bar-icon-customization-design.md docs/superpowers/plans/2026-08-28-bar-icon-customization.md
            git commit -m 'Align bar icon customization docs'
            git push origin HEAD:feature/bar-icon-customization
          fi
