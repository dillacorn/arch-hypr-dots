name: Refine Bar Icon Presets

on:
  push:
    branches:
      - feature/bar-icon-customization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck jq
      - name: Apply refined presets
        run: |
          printf '%s' '' | base64 -d >/tmp/refine-bar-icons.py
          python3 /tmp/refine-bar-icons.py
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          marker='# 2026-08-28 refined bar icon presets.'
          grep -Fqx -- "$marker" "$history" || printf '\n%s\n' "$marker" >>"$history"
          for repo_path in config/hypr/scripts/quickshell_application_state.sh config/quickshell/awtarchy/BarState.qml; do
            hash="$(sha256sum "$repo_path" | awk '{print $1}')"
            entry="${hash}"$'\t'".${repo_path}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          done
      - name: Syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-bar-icon-customization.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh tests/test-bar-icon-customization.sh
      - name: Refined preset regression
        run: bash tests/test-bar-icon-customization.sh
      - name: Preserve current-main Bluetooth and Night Light fixes
        run: |
          bash tests/test-bluetooth-state-persistence.sh
          bash tests/test-night-light-schedule.sh
      - name: Quickshell production readiness
        run: bash tests/test-quickshell-production-readiness.sh
      - name: Quickshell updater migration
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Diff whitespace
        run: git diff --check
      - name: Commit refinement
        run: |
          if ! git diff --quiet -- config/hypr/scripts/quickshell_application_state.sh config/quickshell/awtarchy/BarState.qml local/share/awtarchy/quickshell-managed-history.sha256; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add config/hypr/scripts/quickshell_application_state.sh config/quickshell/awtarchy/BarState.qml local/share/awtarchy/quickshell-managed-history.sha256
            git commit -m 'Refine bar icon presets'
            git push origin HEAD:feature/bar-icon-customization
          fi
