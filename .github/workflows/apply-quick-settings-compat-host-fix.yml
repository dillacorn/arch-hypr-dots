name: Apply Quick Settings Compatibility Host Fix

on:
  push:
    branches:
      - fix/fullscreen-bar-and-quick-settings-spacing
    paths:
      - .github/workflows/apply-quick-settings-compat-host-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/fullscreen-bar-and-quick-settings-spacing
          fetch-depth: 0
      - name: Apply compatibility host fix
        run: |
          set -Eeuo pipefail
          python3 -c 'from pathlib import Path; p=Path("config/quickshell/awtarchy/QuickSettings.qml"); t=p.read_text(encoding="utf-8"); old="                        PowerModeCard {\n                            active: quickSettingsWindow.visible\n                            textScale: root.effectiveTextScale\n                            iconScale: root.effectiveIconScale\n                        }\n"; anchor="            GridLayout {\n                anchors.fill: parent\n                columns: 1\n"; compat="            PowerModeCard {\n                active: quickSettingsWindow.visible\n                textScale: root.effectiveTextScale\n                iconScale: root.effectiveIconScale\n            }\n\n"; assert t.count(old)==1, t.count(old); assert t.count(anchor)==1, t.count(anchor); t=t.replace(old, "", 1); t=t.replace(anchor, compat+anchor, 1); p.write_text(t, encoding="utf-8")'
          bash tests/test-bar-fullscreen-visibility.sh
          bash tests/test-quick-settings-spacing.sh
          bash tests/test-hyprbars-quicksettings.sh
          git diff --check
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          path='.config/quickshell/awtarchy/QuickSettings.qml'
          digest="$(sha256sum config/quickshell/awtarchy/QuickSettings.qml | awk '{print $1}')"
          entry="${digest}"$'\t'"${path}"
          grep -Fxq -- "$entry" "$history" || printf '%s\n' "$entry" >> "$history"
          printf 'Recorded QuickSettings.qml SHA-256: %s\n' "$digest"
      - name: Commit fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/quickshell/awtarchy/QuickSettings.qml local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Keep Power Mode compatibility host out of Quick Settings layout'
          git push origin HEAD:fix/fullscreen-bar-and-quick-settings-spacing
