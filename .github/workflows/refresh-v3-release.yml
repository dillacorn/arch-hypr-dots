name: Refresh Awtarchy v3.0.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-v3-release.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Refresh existing v3.0.0 release and remove workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_parent="c1ee1697eb72643f4175d47362823c2fef089b59"
          [[ "$(git rev-parse HEAD^)" == "$expected_parent" ]] || {
            echo "main moved before v3.0.0 release refresh" >&2
            exit 1
          }

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" --jq '.id')"
          release_name="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.name')"
          [[ "$release_id" == "370945153" ]] || {
            echo "unexpected v3.0.0 release id: $release_id" >&2
            exit 1
          }
          [[ "$release_name" == "Awtarchy v3.0.0 Quickshell" ]] || {
            echo "unexpected v3.0.0 release name: $release_name" >&2
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-v3-release.yml
          git commit -m 'Remove one-time v3.0.0 refresh workflow'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"

          git tag -f v3.0.0 "$final_sha"
          git push --force origin refs/tags/v3.0.0

          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body // ""')"
          marker='Added proprietary NVIDIA GPU temperature fallback'
          if [[ "$body" != *"$marker"* ]]; then
            body+=$'\n\n- Added proprietary NVIDIA GPU temperature fallback through `nvidia-smi` when a usable GPU hwmon sensor is unavailable; verified on a GeForce GTX 980.'
            body+=$'\n- Added SMBIOS memory-topology caching so DIMM slot and population information remains available without continuous privileged polling.'
            body+=$'\n- Serialized Quickshell startup to prevent duplicate shell/bar instances during login races.'
            body+=$'\n- Reduced Quickshell background polling overhead while keeping CPU/core/RAM updates at 2 seconds, CPU/GPU temperatures at 4 seconds, and drive/other temperatures at 10 seconds.'
            body+=$'\n- Removed recurring login-shell polling overhead from Quickshell system-state updates.'
            body+=$'\n- Removed the 6-pixel horizontal bar edge insets so the bar reaches both display edges.'
            body+=$'\n- Revalidated the fixes on AMD-only and AMD + NVIDIA desktop systems before refreshing this release.'
          fi

          jq -n \
            --arg target_commitish "$final_sha" \
            --arg name "Awtarchy v3.0.0 Quickshell" \
            --arg body "$body" \
            '{
              target_commitish: $target_commitish,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false,
              make_latest: "true"
            }' > release.json

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input release.json >/dev/null

          remote_tag="$(git ls-remote origin refs/tags/v3.0.0 | awk '{print $1}')"
          [[ "$remote_tag" == "$final_sha" ]] || {
            echo "v3.0.0 tag did not move to final main commit" >&2
            exit 1
          }

          patched_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.target_commitish')"
          [[ "$patched_target" == "$final_sha" ]] || {
            echo "release target_commitish did not update" >&2
            exit 1
          }

          printf 'v3.0.0 refreshed to %s\n' "$final_sha"
