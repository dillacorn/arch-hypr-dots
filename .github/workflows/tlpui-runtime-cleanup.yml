name: One-use TLPUI runtime cleanup

on:
  push:
    branches:
      - refactor/tlp-battery-care-thin-client
    paths:
      - .github/workflows/tlpui-runtime-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Remove obsolete TLPUI AUR block
        shell: bash
        run: |
          set -Eeuo pipefail

          runtime='local/share/awtarchy/awtarchy-runtime.sh'
          expected_blob='0db7e6b55f5e9468f429166d15c1e5c90bd137eb'
          actual_blob="$(git hash-object "$runtime")"
          [[ "$actual_blob" == "$expected_blob" ]] || {
            printf 'Refusing runtime edit: expected blob %s, found %s\n' "$expected_blob" "$actual_blob" >&2
            exit 1
          }

          python3 - "$runtime" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = r'''  if [[ "$IS_LAPTOP" == true && "$IS_VM" == false ]]; then
            if pacman -Q tlpui >/dev/null 2>&1; then
              printf '%s\n' "${COLOR_YELLOW}tlpui already installed. Skipping...${COLOR_RESET}"
            else
              log "Installing tlpui through upstream aur-scanner..."
              if install_aur_with_scanner tlpui && pacman -Qq tlpui >/dev/null 2>&1; then
                install -d -m 0755 /var/lib/awtarchy
                touch /var/lib/awtarchy/managed-packages
                grep -Fxq tlpui /var/lib/awtarchy/managed-packages \
                  || printf '%s\n' tlpui >>/var/lib/awtarchy/managed-packages
                LC_ALL=C sort -u -o /var/lib/awtarchy/managed-packages /var/lib/awtarchy/managed-packages
                chmod 0644 /var/lib/awtarchy/managed-packages
              fi
            fi
          fi

          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy tlpui AUR block, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

          bash -n "$runtime"
          bash tests/test-installer-aur-scanner-delegation.sh
          bash tests/test-quickshell-backend-readiness.sh
          git diff --check

          rm -- .github/workflows/tlpui-runtime-cleanup.yml

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- "$runtime" tests/test-installer-aur-scanner-delegation.sh .github/workflows/tlpui-runtime-cleanup.yml
          git diff --cached --check
          git commit -m 'refactor: retire tlpui AUR install path'
          git push origin "HEAD:${GITHUB_REF_NAME}"
