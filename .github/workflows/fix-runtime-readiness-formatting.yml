name: Fix Runtime Readiness Formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 115 && github.event.pull_request.head.ref == 'analysis/runtime-stress-optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: analysis/runtime-stress-optimization
          fetch-depth: 0
      - name: Normalize diagnostic indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path, target in (
              ('config/quickshell/awtarchy/Launcher.qml', 'launcher'),
              ('config/quickshell/awtarchy/ClipboardMenu.qml', 'clipboard'),
          ):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              marker = f'    target: "{target}"\n'
              matches = [i for i, line in enumerate(lines) if line == marker and i > 0 and lines[i - 1] == '    IpcHandler {\n']
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected one under-indented {target} IPC marker, got {len(matches)}')
              start = matches[0]
              end = next((i for i in range(start + 1, len(lines)) if lines[i].lstrip().startswith('function toggle():')), None)
              if end is None:
                  raise SystemExit(f'{path}: toggle function not found after IPC marker')
              for i in range(start, end):
                  lines[i] = '    ' + lines[i]
              p.write_text(''.join(lines))
          PY

          grep -Fq '        target: "launcher"' config/quickshell/awtarchy/Launcher.qml
          grep -Fq '        readonly property int diagnosticResultCount:' config/quickshell/awtarchy/Launcher.qml
          grep -Fq '        target: "clipboard"' config/quickshell/awtarchy/ClipboardMenu.qml
          grep -Fq '        readonly property int diagnosticEntryCount:' config/quickshell/awtarchy/ClipboardMenu.qml
          rm -f .github/workflows/fix-runtime-readiness-formatting.yml
          git diff --check
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy/Launcher.qml \
            config/quickshell/awtarchy/ClipboardMenu.qml \
            .github/workflows/fix-runtime-readiness-formatting.yml
          git commit -m 'Normalize readiness diagnostics'
          git push origin HEAD:analysis/runtime-stress-optimization
