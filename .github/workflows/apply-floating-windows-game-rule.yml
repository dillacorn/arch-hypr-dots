name: Apply Floating Windows Game Rule

on:
  push:
    branches:
      - feature/floating-windows-default
    paths:
      - '.github/workflows/apply-floating-windows-game-rule.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/floating-windows-default
      - name: Apply exact game exception
        run: |
          python3 .github/scripts/apply-floating-windows-game-rule.py
          git diff --check
          git diff -- config/hypr/hyprland.lua
      - name: Commit exact game exception
        run: |
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- config/hypr/hyprland.lua
          git diff --cached --quiet && exit 1
          git commit -m 'fix: keep games tiled with floating default'
          git push origin HEAD:feature/floating-windows-default
