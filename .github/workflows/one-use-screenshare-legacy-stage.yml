name: One-use Screen Share Guard legacy stage fix

on:
  push:
    branches: [fix/screenshare-guard-runtime-apply]
    paths:
      - '.github/workflows/one-use-screenshare-legacy-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/screenshare-guard-runtime-apply
          fetch-depth: 0
      - name: Remove integrated-config early return
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          lines = path.read_text().splitlines(keepends=True)
          marker = "if grep -Fq -- 'function awtarchy_screenshare_guard_set_group_v1'"
          starts = [i for i, line in enumerate(lines) if marker in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one Screen Share Guard integrated-config early return, found {len(starts)}')
          start = starts[0]
          end = None
          for i in range(start + 1, min(start + 8, len(lines))):
              if lines[i].strip() == 'fi':
                  end = i + 1
                  break
          if end is None:
              raise SystemExit('Screen Share Guard integrated-config early return end was not found')
          block = ''.join(lines[start:end])
          required = (
              'awtarchy_screenshare_guard_set_group_v1',
              'awtarchy_screenshare_guard_status_v1',
              'return 0',
          )
          if not all(needle in block for needle in required):
              raise SystemExit('Screen Share Guard early-return block did not match the expected guarded shape')
          path.write_text(''.join(lines[:start] + lines[end:]))
          PY
      - name: Commit updater fix and remove one-use workflow
        run: |
          rm -f .github/workflows/one-use-screenshare-legacy-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh .github/workflows/one-use-screenshare-legacy-stage.yml
          git diff --cached --check
          git commit -m 'fix: run Screen Share Guard migration on integrated configs'
          git push origin HEAD:fix/screenshare-guard-runtime-apply
