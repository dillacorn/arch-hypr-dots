name: Apply Quick Settings volume and popup fix

on:
  push:
    paths:
      - .github/workflows/fix-quicksettings-volume-popup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 4

      - name: Verify guarded staging changes
        shell: bash
        run: |
          set -euo pipefail
          expected=8b774986d4fc8fbef4b839ffb6cb09a81f152fe0
          git merge-base --is-ancestor "$expected" HEAD
          unexpected="$(git diff --name-only "$expected"..HEAD | grep -Ev '^(\.github/workflows/fix-quicksettings-volume-popup\.yml|tools/fix-quicksettings-volume-popup\.py)$' || true)"
          [[ -z "$unexpected" ]] || {
            printf 'Unexpected files changed since guarded base:\n%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Apply fixes
        shell: bash
        run: python3 tools/fix-quicksettings-volume-popup.py

      - name: Refresh managed history
        shell: bash
        run: |
          set -euo pipefail
          manifest=local/share/awtarchy/quickshell-managed-history.sha256
          for rel in \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/Notifications.qml \
            config/hypr/scripts/quickshell_application_state.sh
          do
            hash="$(sha256sum "$rel" | awk '{print $1}')"
            entry="${hash}"$'\t'".${rel}"
            grep -Fqx -- "$entry" "$manifest" || printf '%s\n' "$entry" >>"$manifest"
          done

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq shellcheck >/dev/null
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-production-readiness.sh

          test_home="$(mktemp -d)"
          trap 'rm -rf -- "$test_home"' EXIT
          export HOME="$test_home"
          export XDG_CACHE_HOME="$test_home/cache"
          export HYPR_QUICKSHELL_SCRIPT=/bin/false
          state="$XDG_CACHE_HOME/awtarchy/quickshell-state.json"

          bash config/hypr/scripts/quickshell_application_state.sh save-flyout notifications DP-1 520 760 100 100 false
          bash config/hypr/scripts/quickshell_application_state.sh set-notification-popup-limit 4
          jq -e '.notification_popup_limit == 4' "$state" >/dev/null
          bash config/hypr/scripts/quickshell_application_state.sh save-flyout notifications DP-2 520 760 100 100 false
          jq -e '.notification_popup_limit == 4' "$state" >/dev/null
          bash config/hypr/scripts/quickshell_application_state.sh set-notification-popup-limit 10
          jq -e '.notification_popup_limit == 10' "$state" >/dev/null
          jq -e '[.notification_views[] | has("popup_limit")] | all(. == false)' "$state" >/dev/null
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/Notifications.qml \
            config/hypr/scripts/quickshell_application_state.sh \
            tests/test-quickshell-production-readiness.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Fix Quick Settings volume and popup controls"
          git push origin HEAD:main
