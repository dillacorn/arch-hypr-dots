name: Refresh Quickshell Privacy Managed History

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh current managed hashes
        id: refresh
        run: |
          set -euo pipefail
          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          while IFS= read -r source; do
            [[ -f "$source" ]] || { echo "Missing managed source: $source" >&2; exit 1; }
            managed=".${source}"
            hash="$(sha256sum "$source" | awk '{print $1}')"
            line="${hash}	${managed}"
            grep -Fqx -- "$line" "$manifest" || printf '%b\n' "$line" >> "$manifest"
          done <<'EOF'
          config/quickshell/awtarchy/CaptureEyeButton.qml
          config/quickshell/awtarchy/ClipboardMenu.qml
          config/quickshell/awtarchy/Notifications.qml
          config/quickshell/awtarchy/QuickSettings.qml
          config/quickshell/awtarchy/NetworkMenu.qml
          config/quickshell/awtarchy/BluetoothMenu.qml
          config/quickshell/awtarchy/FlyoutSettings.qml
          config/quickshell/awtarchy/NetworkVpnSection.qml
          config/quickshell/awtarchy/NumlockSessionTweak.qml
          config/quickshell/awtarchy/Launcher.qml
          config/quickshell/awtarchy/shell.qml
          config/hypr/scripts/quickshell_sensitive_capture.sh
          config/hypr/scripts/quickshell_runtime_rules.sh
          config/hypr/scripts/quickshell_wireguard.sh
          EOF

          if git diff --quiet -- "$manifest"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify migration and privacy regressions
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash tests/test-quickshell-updater-migration.sh
          bash tests/test-quickshell-capture-privacy.sh
          git diff --check

      - name: Commit managed history refresh
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Refresh flyout privacy managed hashes'
          git push origin HEAD:quickshell-conversion-testing
