name: Refresh Runtime Analysis Managed History

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 115 && github.event.pull_request.head.ref == 'analysis/runtime-stress-optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: analysis/runtime-stress-optimization
          fetch-depth: 0
      - name: Install migration-test dependency
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Refresh current managed hashes
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for source in \
            config/quickshell/awtarchy/ClipboardMenu.qml \
            config/quickshell/awtarchy/Launcher.qml; do
            hash="$(sha256sum "$source" | awk '{print $1}')"
            managed=".config/${source#config/}"
            line="${hash}"$'\t'"${managed}"
            if ! grep -Fxq "$line" "$history"; then
              printf '%s\n' "$line" >>"$history"
            fi
            grep -Fxq "$line" "$history"
            printf '%s  %s\n' "$hash" "$managed"
          done

          bash tests/test-quickshell-updater-migration.sh
          rm -f .github/workflows/refresh-runtime-analysis-managed-history.yml
          git diff --check
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add "$history" .github/workflows/refresh-runtime-analysis-managed-history.yml
          git commit -m 'Refresh Quickshell managed history'
          git push origin HEAD:analysis/runtime-stress-optimization
