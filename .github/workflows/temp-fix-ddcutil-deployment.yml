name: Temporary ddcutil deployment patch

on:
  push:
    branches:
      - fix-ddcutil-config-deployment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ddcutil-config-deployment

      - name: Add ddcutil to installer and updater deployment lists
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("awtarchy.sh")
          text = path.read_text(encoding="utf-8")

          installer_old = "local -a config_dirs=(hypr waybar alacritty wlogout mako wofi fuzzel gtk-3.0 Kvantum SpeedCrunch fastfetch pcmanfm-qt yazi xdg-desktop-portal qt5ct qt6ct lsfg-vk wiremix cava micro)"
          installer_new = "local -a config_dirs=(hypr waybar alacritty wlogout mako wofi fuzzel gtk-3.0 Kvantum SpeedCrunch fastfetch pcmanfm-qt yazi xdg-desktop-portal qt5ct qt6ct lsfg-vk wiremix cava micro ddcutil)"

          updater_old = '    "xdg-desktop-portal" "qt5ct" "qt6ct" "lsfg-vk" "wiremix" "cava" "YouTube Music"\n'
          updater_new = '    "xdg-desktop-portal" "qt5ct" "qt6ct" "lsfg-vk" "wiremix" "cava" "YouTube Music" "ddcutil"\n'

          if installer_old not in text:
              raise SystemExit("installer config directory list did not match expected text")
          if updater_old not in text:
              raise SystemExit("updater config directory list did not match expected text")

          text = text.replace(installer_old, installer_new, 1)
          text = text.replace(updater_old, updater_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          bash -n awtarchy.sh
          grep -Fq 'micro ddcutil)' awtarchy.sh
          grep -Fq '"YouTube Music" "ddcutil"' awtarchy.sh

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awtarchy.sh
          git commit -m "Deploy ddcutil configuration during install and update"
          git push origin HEAD:fix-ddcutil-config-deployment
