name: Quickshell final behavior audit

on:
  push:
    branches:
      - quickshell-conversion-testing
    paths:
      - .github/workflows/quickshell-final-behavior-audit.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0

      - name: Finalize Quickshell behavior conversion
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          bar = Path("config/quickshell/awtarchy/Bar.qml")
          text = bar.read_text()

          marker = '''    function workspaceIcon(id) {\n'''
          helper = '''    function focusWorkspace(selector) {\n        Quickshell.execDetached([\n            "hyprctl",\n            "eval",\n            "hl.dispatch(hl.dsp.focus({ workspace = \\\"" + selector + "\\\" }))"\n        ]);\n    }\n\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit("Bar.qml workspaceIcon marker missing")
              text = text.replace(marker, helper + marker, 1)

          old = '''                onClicked: modelData.activate()\n                onWheelUp: Hyprland.dispatch("workspace e-1")\n                onWheelDown: Hyprland.dispatch("workspace e+1")'''
          new = '''                onClicked: bar.focusWorkspace(String(modelData.id))\n                onWheelUp: bar.focusWorkspace("e-1")\n                onWheelDown: bar.focusWorkspace("e+1")'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 legacy workspace action blocks, found {count}")
          text = text.replace(old, new)
          bar.write_text(text)

          hypr = Path("config/hypr/hyprland.lua")
          text = hypr.read_text()
          rule = '''\n-- Quickshell application launcher: Fuzzel-like floating search window.\nhl.window_rule({\n    name = "awtarchy-quickshell-launcher",\n    match = { title = "Awtarchy Application Search" },\n    float = true,\n    border_size = 0,\n    rounding = 0,\n    decorate = false,\n    no_shadow = true,\n    no_follow_mouse = true,\n})\n'''
          input_marker = '''\n-- ───────────────────────────────────────────────────────────────────────────────\n-- INPUT\n-- ───────────────────────────────────────────────────────────────────────────────\n'''
          if rule not in text:
              if input_marker not in text:
                  raise SystemExit("hyprland.lua INPUT marker missing")
              text = text.replace(input_marker, rule + input_marker, 1)
          hypr.write_text(text)

          desktop_meta = {
              "local/share/applications/quickshell_bar_flip.desktop": "quickshell_bar_flip.desktop",
              "local/share/applications/quickshell_bar_rotate.desktop": "quickshell_bar_rotate.desktop",
              "local/share/applications/quickshell_bar_toggle.desktop": "quickshell_bar_toggle.desktop",
          }
          for name, installed in desktop_meta.items():
              path = Path(name)
              lines = path.read_text().splitlines()
              while lines and lines[0].startswith("#"):
                  lines.pop(0)
              while lines and not lines[0].strip():
                  lines.pop(0)
              path.write_text(
                  "# github.com/dillacorn/awtarchy\n"
                  f"# ~/.local/share/applications/{installed}\n\n"
                  + "\n".join(lines).rstrip() + "\n"
              )

          comments = {
              "config/hypr/scripts/quickshell_bar_flip.sh": (
                  "# Compatibility entrypoint: flip the Quickshell bar on the focused monitor.",
                  "# Flip the Quickshell bar side on the focused monitor.",
              ),
              "config/hypr/scripts/quickshell_bar_rotate.sh": (
                  "# Compatibility entrypoint: rotate the Quickshell bar between horizontal/vertical.",
                  "# Rotate the focused monitor's Quickshell bar between horizontal and vertical.",
              ),
              "config/hypr/scripts/quickshell_bar_toggle.sh": (
                  "# Compatibility entrypoint: toggle the Quickshell bar on one monitor.",
                  "# Toggle the Quickshell bar on the focused or requested monitor.",
              ),
          }
          for name, (old_comment, new_comment) in comments.items():
              path = Path(name)
              text = path.read_text()
              if old_comment in text:
                  text = text.replace(old_comment, new_comment, 1)
              path.write_text(text)
          PY

          rm -f .github/workflows/quickshell-final-behavior-audit.yml

      - name: Validate finalized behavior
        shell: bash
        run: |
          set -euo pipefail

          bash -n config/hypr/scripts/quickshell.sh
          bash -n config/hypr/scripts/quickshell_launcher.sh
          bash -n config/hypr/scripts/quickshell_launcher_position.sh
          bash -n config/hypr/scripts/quickshell_power_menu.sh
          bash -n config/hypr/scripts/quickshell_notification_dismiss.sh
          bash -n config/hypr/scripts/quickshell_bar_flip.sh
          bash -n config/hypr/scripts/quickshell_bar_rotate.sh
          bash -n config/hypr/scripts/quickshell_bar_toggle.sh

          ! grep -RFn 'Hyprland.dispatch(' config/quickshell
          ! grep -RFn 'waybar_' local/share/applications/quickshell_bar_*.desktop
          ! grep -RFn '/waybar/' local/share/applications/quickshell_bar_*.desktop
          grep -Fq 'hl.dsp.focus({ workspace' config/quickshell/awtarchy/Bar.qml
          grep -Fq 'Awtarchy Application Search' config/hypr/hyprland.lua
          grep -Fq 'float = true' config/hypr/hyprland.lua
          grep -Fq 'decorate = false' config/hypr/hyprland.lua
          git diff --check

      - name: Commit final behavior fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Quickshell launcher and bar behavior"
          git push origin HEAD:quickshell-conversion-testing
