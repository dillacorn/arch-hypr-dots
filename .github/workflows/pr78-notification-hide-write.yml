name: Apply PR78 Notification Hide History

on:
  push:
    branches:
      - feature/notification-hide-history
    paths:
      - .github/workflows/pr78-notification-hide-write.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/notification-hide-history
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Apply and validate notification behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/pr78-notification-hide.py
          bash -n config/hypr/scripts/quickshell_notification_dismiss.sh
          bash -n tests/test-notification-hide-history.sh
          shellcheck config/hypr/scripts/quickshell_notification_dismiss.sh tests/test-notification-hide-history.sh
          bash tests/test-notification-hide-history.sh
          bash tests/test-flyout-edge-layout.sh
          git diff --check

      - name: Commit production changes and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr78-notification-hide.py
          git rm .github/workflows/pr78-notification-hide-write.yml
          git add \
            config/hypr/scripts/quickshell_notification_dismiss.sh \
            config/quickshell/awtarchy/NotificationCard.qml \
            config/quickshell/awtarchy/Notifications.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Preserve notification history when hiding popups'
          git push origin HEAD:feature/notification-hide-history
