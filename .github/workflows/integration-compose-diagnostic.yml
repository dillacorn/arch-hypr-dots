name: Integration Compose Approved Features

on:
  push:
    branches:
      - integration/approved-quickshell-features-20260827
    paths:
      - .github/workflows/integration-compose-diagnostic.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: integration/approved-quickshell-features-20260827
          fetch-depth: 0
      - name: Compose and push approved heads
        shell: bash
        run: |
          set -Eeuo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          quick_settings='config/quickshell/awtarchy/QuickSettings.qml'
          app_state='config/hypr/scripts/quickshell_application_state.sh'
          bar_state='config/quickshell/awtarchy/BarState.qml'
          refs=(
            '483c84c9399c6d9fa47b9e5df204475adcbc4276:#72'
            'e683a20772cf6306f34d2456c6cba6c295219704:#73'
            '70008a33496edf0c0807e978c06f882b3a2ace50:#74'
            '3d5a48957f13b7bb137889ad281290f8339c5778:#75'
            'e5eba00299e4c50f0b64ea3028b2b87214b8e7d4:#77'
            '4b5d268a2c50de3afd471a980fa566fb129e2d49:#78'
            '97ac1f41acaf07373a98f1787fa4452c1bc71a47:#79'
          )
          git fetch origin \
            '+refs/heads/feature/progressive-clipboard-loading:refs/remotes/origin/feature/progressive-clipboard-loading' \
            '+refs/heads/feature/focused-display-scale:refs/remotes/origin/feature/focused-display-scale' \
            '+refs/heads/feature/quick-settings-layout-customization:refs/remotes/origin/feature/quick-settings-layout-customization' \
            '+refs/heads/feature/floating-windows-default:refs/remotes/origin/feature/floating-windows-default' \
            '+refs/heads/feature/persist-clock-date-state:refs/remotes/origin/feature/persist-clock-date-state' \
            '+refs/heads/feature/notification-hide-history:refs/remotes/origin/feature/notification-hide-history' \
            '+refs/heads/fix/fullscreen-bar-and-quick-settings-spacing:refs/remotes/origin/fix/fullscreen-bar-and-quick-settings-spacing'
          git config user.name 'Awtarchy Integration'
          git config user.email 'integration@invalid.local'

          add_current_hash() {
            local source="$1" managed="$2" digest entry
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${managed}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          }

          resolve_history() {
            local ours="${RUNNER_TEMP}/history-ours"
            local theirs="${RUNNER_TEMP}/history-theirs"
            git show ":2:${history}" >"$ours"
            git show ":3:${history}" >"$theirs"
            cp "$ours" "$history"
            while IFS= read -r line || [[ -n "$line" ]]; do
              grep -Fqx -- "$line" "$history" || printf '%s\n' "$line" >>"$history"
            done <"$theirs"
            git add -- "$history"
          }

          resolve_74_75_quick_settings() {
            git show ":2:${quick_settings}" >"$quick_settings"
            python3 - "$quick_settings" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>^[ \t]*)TitleBarsCard \{\n'
              r'(?P=indent)    Layout\.row: root\.quickSettingsSectionRow\("title-bars"\)\n'
              r'(?P=indent)    visible: root\.quickSettingsSectionVisible\("title-bars"\)\n'
              r'(?P=indent)    active: quickSettingsWindow\.visible\n'
              r'(?P=indent)    textScale: root\.effectiveTextScale\n'
              r'(?P=indent)    iconScale: root\.effectiveIconScale\n'
              r'(?P=indent)\}', re.MULTILINE)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one #74 TitleBarsCard block, found {len(matches)}')
          indent = matches[0].group('indent')
          inner = indent + '    '
          child = inner + '    '
          replacement = (
              f'{indent}ColumnLayout {{\n'
              f'{inner}Layout.row: root.quickSettingsSectionRow("title-bars")\n'
              f'{inner}visible: root.quickSettingsSectionVisible("title-bars")\n'
              f'{inner}Layout.fillWidth: true\n'
              f'{inner}spacing: 8\n\n'
              f'{inner}TitleBarsCard {{\n'
              f'{child}active: quickSettingsWindow.visible\n'
              f'{child}textScale: root.effectiveTextScale\n'
              f'{child}iconScale: root.effectiveIconScale\n'
              f'{inner}}}\n\n'
              f'{inner}FloatingWindowsCard {{\n'
              f'{child}active: quickSettingsWindow.visible\n'
              f'{child}textScale: root.effectiveTextScale\n'
              f'{child}iconScale: root.effectiveIconScale\n'
              f'{inner}}}\n'
              f'{indent}}}')
          path.write_text(pattern.sub(replacement, text, count=1))
          PY
            git add -- "$quick_settings"
          }

          resolve_74_77_app_state() {
            git show ":2:${app_state}" >"$app_state"
            python3 - "$app_state" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = '|set-update-notifications <true|false>|set-notification-popup-limit <1-20>'
          new = '|set-update-notifications <true|false>|set-clock-date <MON> <true|false>|set-notification-popup-limit <1-20>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one usage insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
            git add -- "$app_state"
          }

          resolve_74_79_quick_settings() {
            git show ":2:${quick_settings}" >"$quick_settings"
            python3 - "$quick_settings" "$bar_state" "$app_state" <<'PY'
          from pathlib import Path
          import re
          import sys
          quick = Path(sys.argv[1])
          bar_state = Path(sys.argv[2])
          app_state = Path(sys.argv[3])
          text = quick.read_text()
          power_pattern = re.compile(
              r'\n(?P<indent>[ \t]*)PowerModeCard \{\n'
              r'(?P=indent)    Layout\.row: root\.quickSettingsSectionRow\("power-mode"\)\n'
              r'(?P=indent)    visible: root\.quickSettingsSectionVisible\("power-mode"\)\n'
              r'(?P=indent)    active: quickSettingsWindow\.visible\n'
              r'(?P=indent)    textScale: root\.effectiveTextScale\n'
              r'(?P=indent)    iconScale: root\.effectiveIconScale\n'
              r'(?P=indent)\}\n', re.MULTILINE)
          matches = list(power_pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one dynamic PowerModeCard row, found {len(matches)}')
          text = power_pattern.sub('\n', text, count=1)
          outer_grid = '            GridLayout {\n                anchors.fill: parent\n                columns: 1\n'
          if text.count(outer_grid) != 1:
              raise SystemExit(f'expected one panel GridLayout anchor, found {text.count(outer_grid)}')
          compat = (
              '            PowerModeCard {\n'
              '                active: quickSettingsWindow.visible\n'
              '                textScale: root.effectiveTextScale\n'
              '                iconScale: root.effectiveIconScale\n'
              '            }\n\n')
          quick.write_text(text.replace(outer_grid, compat + outer_grid, 1))
          bar = bar_state.read_text()
          token = '        "power-mode",\n'
          if bar.count(token) != 1:
              raise SystemExit(f'expected one power-mode default-order entry, found {bar.count(token)}')
          bar_state.write_text(bar.replace(token, '', 1))
          app = app_state.read_text()
          old_sections = 'QUICK_SETTINGS_SECTIONS_JSON=\'["brightness","output-volume","power-mode","bar","display-effects","submap","wallpaper","awtarchy","smtty","scheduler","numlock","title-bars"]\''
          new_sections = 'QUICK_SETTINGS_SECTIONS_JSON=\'["brightness","output-volume","bar","display-effects","submap","wallpaper","awtarchy","smtty","scheduler","numlock","title-bars"]\''
          if app.count(old_sections) != 1:
              raise SystemExit(f'expected one Quick Settings section validator, found {app.count(old_sections)}')
          app_state.write_text(app.replace(old_sections, new_sections, 1))
          PY
            git add -- "$quick_settings" "$bar_state" "$app_state"
          }

          for item in "${refs[@]}"; do
            sha="${item%%:*}"
            label="${item#*:}"
            printf '\n=== merge %s %s ===\n' "$label" "$sha"
            if git merge --no-edit --no-ff "$sha"; then
              continue
            fi
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'CONFLICTS %s:\n' "$label"
            printf '  %s\n' "${conflicts[@]}"

            if [[ "$label" == '#75' ]]; then
              unexpected=0; have_history=0; have_quick=0
              for path in "${conflicts[@]}"; do
                case "$path" in "$history") have_history=1 ;; "$quick_settings") have_quick=1 ;; *) unexpected=1 ;; esac
              done
              if (( unexpected == 0 && have_history == 1 && have_quick == 1 )); then
                resolve_history
                resolve_74_75_quick_settings
                add_current_hash "$quick_settings" '.config/quickshell/awtarchy/QuickSettings.qml'
                git add -- "$history"
                git commit --no-edit
                continue
              fi
            fi

            if [[ "$label" == '#77' ]]; then
              unexpected=0; have_history=0; have_app=0
              for path in "${conflicts[@]}"; do
                case "$path" in "$history") have_history=1 ;; "$app_state") have_app=1 ;; *) unexpected=1 ;; esac
              done
              if (( unexpected == 0 && have_history == 1 && have_app == 1 )); then
                resolve_history
                resolve_74_77_app_state
                add_current_hash "$app_state" '.config/hypr/scripts/quickshell_application_state.sh'
                git add -- "$history"
                git commit --no-edit
                continue
              fi
            fi

            if [[ "$label" == '#79' ]]; then
              unexpected=0; have_history=0; have_quick=0
              for path in "${conflicts[@]}"; do
                case "$path" in "$history") have_history=1 ;; "$quick_settings") have_quick=1 ;; *) unexpected=1 ;; esac
              done
              if (( unexpected == 0 && have_history == 1 && have_quick == 1 )); then
                resolve_history
                resolve_74_79_quick_settings
                add_current_hash "$quick_settings" '.config/quickshell/awtarchy/QuickSettings.qml'
                add_current_hash "$bar_state" '.config/quickshell/awtarchy/BarState.qml'
                add_current_hash "$app_state" '.config/hypr/scripts/quickshell_application_state.sh'
                add_current_hash 'config/quickshell/awtarchy/Bar.qml' '.config/quickshell/awtarchy/Bar.qml'
                git add -- "$history"
                git commit --no-edit
                continue
              fi
            fi

            if [[ ${#conflicts[@]} -eq 1 && ${conflicts[0]} == "$history" ]]; then
              resolve_history
              git commit --no-edit
              continue
            fi

            git diff --cc -- "${conflicts[@]}" || true
            exit 1
          done

          printf '\nPASS: all approved heads composed.\n'
          git push origin HEAD:integration/approved-quickshell-features-20260827
