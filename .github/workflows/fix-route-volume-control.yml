name: Apply route volume control fix

on:
  push:
    paths:
      - .github/workflows/fix-route-volume-control.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 2

      - name: Verify guarded staging commit
        shell: bash
        run: |
          set -euo pipefail
          expected=6cc3c85dcda6a408199d0b02e35b516aaa8a1601
          actual="$(git rev-parse HEAD^)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected parent %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Apply route volume fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix-route-volume-control.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("config/hypr/scripts/quickshell_volume.sh")
          text = path.read_text(encoding="utf-8")
          text = text.replace('route[\\"index\\"]', 'route.get("index")')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh managed history
        shell: bash
        run: |
          set -euo pipefail
          manifest=local/share/awtarchy/quickshell-managed-history.sha256
          {
            printf '\n# 2026-08-14 route-aware amplified bar volume control\n'
            for src in \
              config/hypr/scripts/quickshell_volume.sh \
              config/quickshell/awtarchy/AudioLimitState.qml \
              config/quickshell/awtarchy/Bar.qml
            do
              hash="$(sha256sum "$src" | awk '{print $1}')"
              printf '%s\t.%s\n' "$hash" "$src"
            done
          } >> "$manifest"

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n config/hypr/scripts/quickshell_volume.sh
          shellcheck config/hypr/scripts/quickshell_volume.sh
          bash tests/test-quickshell-production-readiness.sh
          grep -Fq 'pw-cli s "$device_id" Route' config/hypr/scripts/quickshell_volume.sh
          ! grep -Fq '"wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@"' config/quickshell/awtarchy/Bar.qml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            .github/workflows/validate-awtarchy.yml \
            config/hypr/scripts/quickshell_volume.sh \
            config/quickshell/awtarchy/AudioLimitState.qml \
            config/quickshell/awtarchy/Bar.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-quickshell-production-readiness.sh
          git commit -m 'Fix amplified bar volume control'
          git push origin HEAD:main
