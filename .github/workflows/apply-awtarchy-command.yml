name: Apply Awtarchy Command Integration

on:
  push:
    branches: [feature/awtarchy-command]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-awtarchy-command
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/awtarchy-command
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate patchers
        run: |
          python -m py_compile tools/fix-awtarchy-test-cleanup.py
          python -m py_compile tools/apply-awtarchy-command.py

      - name: Apply test and runtime integration
        run: |
          python tools/fix-awtarchy-test-cleanup.py
          python tools/apply-awtarchy-command.py

      - name: Validate patched source
        run: |
          test ! -e awtarchy.sh
          bash -n awtarchy-install.sh
          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-awtarchy-command.sh
          shellcheck awtarchy-install.sh local/bin/awtarchy tests/test-awtarchy-command.sh
          git diff --check

      - name: Run command integration tests
        run: bash tests/test-awtarchy-command.sh

      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Install release-aware awtarchy command'
          git push origin HEAD:feature/awtarchy-command
