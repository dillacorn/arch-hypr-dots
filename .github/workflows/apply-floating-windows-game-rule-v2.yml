name: Apply Floating Game Rule
on:
  push:
    branches: [feature/floating-windows-default]
    paths: ['.github/workflows/apply-floating-windows-game-rule-v2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/floating-windows-default
      - run: python3 .github/scripts/apply-floating-windows-game-rule.py
      - run: git diff --check
      - run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/hyprland.lua
          git diff --cached --quiet && exit 1
          git commit -m 'fix: keep games tiled with floating default'
          git push origin HEAD:feature/floating-windows-default
