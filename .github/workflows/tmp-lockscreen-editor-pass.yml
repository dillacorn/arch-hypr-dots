                    or ($candidate[$key].scale | type) == "number")
                and (($candidate[$key] | has("color") | not)
                    or (($candidate[$key].color | type) == "string"
                        and ($candidate[$key].color == "auto"
                            or ($candidate[$key].color | test("^#[0-9A-Fa-f]{6}$")))))
