name: TEMP Lockscreen Editor Pass

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/tmp-lockscreen-editor-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply approved pass
        run: python3 .github/tmp-lockscreen-editor-pass.py

      - name: Install validation tools
        run: sudo apt-get update >/dev/null && sudo apt-get install -y jq shellcheck >/dev/null

      - name: Validate before commit
        shell: bash
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_weather.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_weather.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_contrast.sh
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Commit approved pass
        shell: bash
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            .github/workflows/validate-quickshell-lockscreen-interactive-effects.yml \
            config/hypr/scripts/quickshell_application_state.sh \
            config/hypr/scripts/quickshell_lockscreen_weather.sh \
            config/hypr/scripts/quickshell_lockscreen_contrast.sh \
            config/quickshell/awtarchy/shell.qml \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy/LockscreenWeather.qml \
            config/quickshell/awtarchy/LockscreenContrast.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy-lock/LockContrastCache.qml \
            tests/test-quickshell-lockscreen-interactive-effects.sh \
            tests/test-quickshell-lockscreen-interactive-managed-history.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git commit -m 'feat: refine lockscreen visual editor'
          git push origin HEAD:feature/lockscreen-interactive-effects
