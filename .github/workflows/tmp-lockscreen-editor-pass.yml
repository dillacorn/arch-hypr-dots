name: TEMP Lockscreen Editor Pass

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/tmp-lockscreen-editor-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply approved lockscreen editor pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one match, found {count}: {pattern[:120]!r}")
              write(path, new)

          # Persist per-element colors inside the existing atomic layout object.
          state = "config/hypr/scripts/quickshell_application_state.sh"
          regex_once(
              state,
              r"^LOCKSCREEN_LAYOUT_DEFAULT_JSON='.*'$",
              "LOCKSCREEN_LAYOUT_DEFAULT_JSON='{" +
              "\"logo\":{\"x\":0.5,\"y\":0.34,\"scale\":1,\"color\":\"auto\"}," +
              "\"time\":{\"x\":0.5,\"y\":0.51,\"scale\":1,\"color\":\"auto\"}," +
              "\"date\":{\"x\":0.5,\"y\":0.555,\"scale\":1,\"color\":\"auto\"}," +
              "\"username\":{\"x\":0.5,\"y\":0.595,\"scale\":1,\"color\":\"auto\"}," +
              "\"weather\":{\"x\":0.5,\"y\":0.635,\"scale\":1,\"color\":\"auto\"}," +
              "\"password\":{\"x\":0.5,\"y\":0.7,\"scale\":1,\"color\":\"auto\"}}'",
              flags=re.M,
          )
          replace_once(
              state,
              '''                and ((($candidate[$key] | keys | sort) == ["x", "y"])
                    or (($candidate[$key] | keys | sort) == ["scale", "x", "y"]))
''',
              '''                and ((($candidate[$key] | keys | sort) == ["x", "y"])
                    or (($candidate[$key] | keys | sort) == ["scale", "x", "y"])
                    or (($candidate[$key] | keys | sort) == ["color", "x", "y"])
                    or (($candidate[$key] | keys | sort) == ["color", "scale", "x", "y"]))
