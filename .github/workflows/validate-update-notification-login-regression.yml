name: Validate Update Notification Login Regression

on:
  push:
    branches:
      - main
    paths:
      - config/hypr/scripts/quickshell_update_notifications.sh
      - config/quickshell/awtarchy/shell.qml
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-update-notification-login-regression.sh
      - .github/workflows/validate-update-notification-login-regression.yml
  pull_request:
    paths:
      - config/hypr/scripts/quickshell_update_notifications.sh
      - config/quickshell/awtarchy/shell.qml
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-update-notification-login-regression.sh
      - .github/workflows/validate-update-notification-login-regression.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n config/hypr/scripts/quickshell_update_notifications.sh
          bash -n tests/test-update-notification-login-regression.sh
      - name: Update notification regression
        run: bash tests/test-update-notification-login-regression.sh
      - name: Managed history
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for entry in \
            'config/hypr/scripts/quickshell_update_notifications.sh|.config/hypr/scripts/quickshell_update_notifications.sh' \
            'config/quickshell/awtarchy/shell.qml|.config/quickshell/awtarchy/shell.qml'; do
            source_path="${entry%%|*}"
            managed_path="${entry#*|}"
            hash="$(sha256sum "$source_path" | awk '{print $1}')"
            if ! grep -Fq "${hash}"$'\t'"${managed_path}" "$history"; then
              printf 'Missing managed history entry: %s\t%s\n' "$hash" "$managed_path" >&2
              false
            fi
          done
