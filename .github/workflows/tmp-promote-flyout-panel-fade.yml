name: Temporary promote tested flyout panel fade

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  promote:
    if: github.event.pull_request.number == 43 && github.event.pull_request.head.ref == 'flyout-panel-fade-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: flyout-panel-fade-fix
          fetch-depth: 0

      - name: Apply and verify tested transform
        shell: bash
        run: |
          python3 tools/tmp_apply_flyout_fade.py
          bash -n tests/test-flyout-toggle-debounce.sh
          bash tests/test-flyout-toggle-debounce.sh
          git diff --check

      - name: Publish patched branch
        shell: bash
        run: |
          rm -f -- \
            tools/tmp_apply_flyout_fade.py \
            .github/workflows/apply-flyout-panel-fade-fix.yml \
            tmp-flyout-fade-trigger \
            tmp-flyout-fade-trigger-2
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- \
            config/quickshell/awtarchy/FlyoutManager.qml \
            config/quickshell/awtarchy/shell.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/NetworkMenu.qml \
            config/quickshell/awtarchy/BluetoothMenu.qml \
            config/quickshell/awtarchy/ClipboardMenu.qml \
            config/quickshell/awtarchy/Notifications.qml \
            tests/test-flyout-toggle-debounce.sh \
            tools/tmp_apply_flyout_fade.py \
            .github/workflows/apply-flyout-panel-fade-fix.yml \
            tmp-flyout-fade-trigger \
            tmp-flyout-fade-trigger-2
          git commit -m 'fix: fade flyouts on their panels'
          git push origin HEAD:flyout-panel-fade-fix
