name: Apply Git-Testing Handoff Final Cleanup

on:
  pull_request:
    paths:
      - .github/workflows/apply-git-handoff-final-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Clean launcher diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('local/bin/awtarchy')
          text = path.read_text(encoding='utf-8')

          self_start = text.index('self_update() {')
          self_end = text.index('\nensure_latest_updater() {', self_start)
          self_section = text[self_start:self_end]
          self_pattern = re.compile(
              r'  if ! tar -xzf "\$archive" -C "\$tmp"; then\n'
              r'\s+rm -rf -- "\$tmp"\n'
              r'\s+die "Failed to extract updater commit \$\{commit\}\."\n'
              r'\s+fi\n'
          )
          self_section, count = self_pattern.subn(
              '  tar -xzf "$archive" -C "$tmp"\n', self_section, count=1
          )
          if count != 1:
              raise SystemExit(f'expected one self_update extraction guard, replaced {count}')
          text = text[:self_start] + self_section + text[self_end:]

          git_start = text.index('run_git_testing_package_reconciler() {')
          git_end = text.index('\nrun_package_reconciler() {', git_start)
          git_section = text[git_start:git_end]
          git_pattern = re.compile(
              r'  if ! tar -xzf "\$archive" -C "\$tmp"; then\n'
              r'\s+rm -rf -- "\$tmp"\n'
              r'\s+die "Failed to extract Git-testing package archive for revision \$\{revision\}\."\n'
              r'\s+fi\n'
          )
          formatted = (
              '  if ! tar -xzf "$archive" -C "$tmp"; then\n'
              '    rm -rf -- "$tmp"\n'
              '    die "Failed to extract Git-testing package archive for revision ${revision}."\n'
              '  fi\n'
          )
          git_section, count = git_pattern.subn(formatted, git_section, count=1)
          if count != 1:
              raise SystemExit(f'expected one Git-testing extraction guard, replaced {count}')
          text = text[:git_start] + git_section + text[git_end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- local/bin/awtarchy; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local/bin/awtarchy
          git commit -m 'fix: keep git-testing handoff scoped'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
