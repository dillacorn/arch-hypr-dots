name: One-use clipboard disk history refresh

on:
  push:
    branches: [hardening/clipboard-thumbnail-resource-bounds]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/clipboard-thumbnail-resource-bounds
          fetch-depth: 0
      - name: Refresh managed hash and verify
        shell: bash
        run: |
          set -euo pipefail
          hash="$(sha256sum config/hypr/scripts/quickshell_clipboard.sh | awk '{print $1}')"
          entry="${hash}"$'\t''.config/hypr/scripts/quickshell_clipboard.sh'
          grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256 \
            || printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256

          bash -n config/hypr/scripts/quickshell_clipboard.sh
          bash -n tests/test-quickshell-clipboard-thumbnails.sh
          shellcheck config/hypr/scripts/quickshell_clipboard.sh tests/test-quickshell-clipboard-thumbnails.sh
          bash tests/test-quickshell-clipboard-thumbnails.sh
          git diff --check

          rm -- .github/workflows/one-use-clipboard-disk-history.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256 \
                  .github/workflows/one-use-clipboard-disk-history.yml
          git commit -m 'Refresh clipboard managed hash'
          git push origin HEAD:hardening/clipboard-thumbnail-resource-bounds
