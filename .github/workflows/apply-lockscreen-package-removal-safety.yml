name: Apply Lockscreen Package Removal Safety

on:
  push:
    branches: [feature/quickshell-lockscreen]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply conservative package-only removal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'local/share/awtarchy/awtarchy-package-reconcile.sh',
              'pacman -Rns --noconfirm hyprlock',
              'pacman -R --noconfirm hyprlock',
          )
          replace_once(
              'tests/test-quickshell-lockscreen-migration.sh',
              "require_text \"$RECONCILER\" 'pacman -Rns --noconfirm hyprlock' \\\n    'package reconciler does not use exact Hyprlock package removal'",
              "require_text \"$RECONCILER\" 'pacman -R --noconfirm hyprlock' \\\n    'package reconciler does not use conservative exact Hyprlock package removal'",
          )
          replace_once(
              'tests/test-quickshell-lockscreen-migration.sh',
              '''    -Rns)\n        [[ ${1:-} == --noconfirm ]] && shift\n        [[ ${1:-} == hyprlock && $# == 1 ]] || exit 64\n        grep -Fxq hyprlock "$state" || exit 1\n        grep -Fxv hyprlock "$state" >"${state}.tmp" || true\n        mv -f -- "${state}.tmp" "$state"\n        ;;''',
              '''    -R)\n        [[ ${1:-} == --noconfirm ]] && shift\n        [[ ${1:-} == hyprlock && $# == 1 ]] || exit 64\n        grep -Fxq hyprlock "$state" || exit 1\n        grep -Fxv hyprlock "$state" >"${state}.tmp" || true\n        mv -f -- "${state}.tmp" "$state"\n        ;;''',
          )
          PY
      - name: Verify safety regression and migration
        run: |
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n tests/test-quickshell-lockscreen-migration.sh
          bash tests/test-cheese-snapshot-migration.sh
          bash tests/test-quickshell-lockscreen-migration.sh
          bash tests/test-package-reconciler.sh
          git diff --check
      - name: Commit verified change and remove staging workflow
        run: |
          rm -f -- .github/workflows/apply-lockscreen-package-removal-safety.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'Use conservative Hyprlock package removal'
          git push origin HEAD:feature/quickshell-lockscreen
