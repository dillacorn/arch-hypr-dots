name: Runtime Current Managed History Once

on:
  push:
    branches: [quickshell-runtime-bugfixes]

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Record current managed hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest="local/share/awtarchy/quickshell-managed-history.sha256"
          added=0

          while IFS='|' read -r repo_path managed_path; do
            [[ -n "$repo_path" ]] || continue
            hash="$(sha256sum "$repo_path" | awk '{print $1}')"
            line="${hash}"$'\t'"${managed_path}"
            if grep -Fxq -- "$line" "$manifest"; then
              continue
            fi
            if (( added == 0 )); then
              printf '\n# 2026-08-16 Current stock hashes after runtime bug fixes.\n' >>"$manifest"
            fi
            printf '%s\n' "$line" >>"$manifest"
            added=1
          done <<'EOF'
          config/quickshell/awtarchy/PowerModeCard.qml|.config/quickshell/awtarchy/PowerModeCard.qml
          config/quickshell/awtarchy/BarSettingsSection.qml|.config/quickshell/awtarchy/BarSettingsSection.qml
          config/quickshell/awtarchy/NetworkMenu.qml|.config/quickshell/awtarchy/NetworkMenu.qml
          config/hypr/scripts/hyprbars_toggle.sh|.config/hypr/scripts/hyprbars_toggle.sh
          EOF

          git diff --check
          if ! git diff --quiet -- "$manifest"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$manifest"
            git commit -m "fix: record current runtime managed hashes"
            git push origin HEAD:quickshell-runtime-bugfixes
          fi
