name: Format desktop validation block

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck lua5.4

      - name: Format runtime block
        run: python3 tools/format-desktop-validation.py

      - name: Validate formatting and behavior
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-desktop-candidate-validation.sh
          shellcheck tests/test-desktop-candidate-validation.sh
          bash tests/test-desktop-candidate-validation.sh
          bash tests/test-awtarchy-command.sh
          git diff --check

      - name: Commit formatted runtime block
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'Format desktop validation checks'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
