name: Temporary Validate Themes Hint

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-theme-hint-temp.yml'
      - 'tests/test-quick-settings-theme-hint.sh'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'config/hypr/hyprland.lua'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - run: bash tests/test-quick-settings-theme-hint.sh
