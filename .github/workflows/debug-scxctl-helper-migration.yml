name: Debug scxctl helper migration

on:
  push:
    branches: [scxctl-helper-update-testing]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install migration test dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Trace updater migration test
        env:
          AWTARCHY_TEST_KEEP_TMP: "1"
        run: bash -x tests/test-quickshell-updater-migration.sh
