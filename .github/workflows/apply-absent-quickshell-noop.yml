name: Apply Absent Quickshell No-op Patch

on:
  push:
    branches:
      - fix/quickshell-interrupt-recovery
    paths:
      - .github/workflows/apply-absent-quickshell-noop.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/quickshell-interrupt-recovery
          fetch-depth: 0

      - name: Apply absent-instance fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'quickshell_update_instance_pids\(\) \{\n.*?\n\}\n\nstop_quickshell_update_instances\(\) \{',
              re.S,
          )
          replacement = r'''quickshell_update_target_has_process() {
            local target_uid=""
            command -v pgrep >/dev/null 2>&1 || return 2
            target_uid="$(id -u "$TARGET_USER" 2>/dev/null || true)"
            [[ "$target_uid" =~ ^[0-9]+$ ]] || return 2
            run_target pgrep -u "$target_uid" -x quickshell >/dev/null 2>&1
          }

          quickshell_update_instance_pids() {
            local config_name="${QUICKSHELL_CONFIG_NAME:-awtarchy}" instances="" list_rc=0 process_rc=0

            instances="$(run_target qs -c "$config_name" list --json 9>&- 2>/dev/null)" || list_rc=$?
            if (( list_rc != 0 )) || ! jq -e 'type == "array"' <<<"$instances" >/dev/null 2>&1; then
              quickshell_update_target_has_process || process_rc=$?
              case "$process_rc" in
                1) return 0 ;;
                *) return 1 ;;
              esac
            fi
            jq -r '.[] | .pid | select(type == "number" and . > 0)' <<<"$instances"
          }

          stop_quickshell_update_instances() {'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not replace Quickshell instance enumeration helper')

          path.write_text(text, encoding='utf-8')
          PY

          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash tests/test-quickshell-update-interrupt-recovery.sh
          bash tests/test-quickshell-updater-bootstrap.sh
          bash tests/test-quickshell-update-atomicity.sh
          git diff --check

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'Handle absent Quickshell during updates'
          git push origin HEAD:fix/quickshell-interrupt-recovery
