name: Validate Quick Settings Layout Scrollbar Testing

on:
  push:
    branches:
      - feature/theme-picker-workspace-toggle-fixes

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Record managed Quick Settings layout editor hash
        run: |
          digest="$(sha256sum config/quickshell/awtarchy/QuickSettingsLayoutEditor.qml | awk '{print $1}')"
          line="${digest}"$'\t''.config/quickshell/awtarchy/QuickSettingsLayoutEditor.qml'
          if ! grep -Fqx -- "$line" local/share/awtarchy/quickshell-managed-history.sha256; then
            printf '%s\n' "$line" >> local/share/awtarchy/quickshell-managed-history.sha256
          fi
      - name: Validate Quick Settings layout scrollbar
        run: |
          bash -n tests/test-quick-settings-layout.sh
          shellcheck tests/test-quick-settings-layout.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-quickshell-updater-migration.sh
          git diff --check origin/main...HEAD
      - name: Commit managed history hash
        run: |
          if git diff --quiet -- local/share/awtarchy/quickshell-managed-history.sha256; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Record Quick Settings layout scrollbar stock hash'
          git push origin HEAD:feature/theme-picker-workspace-toggle-fixes
