name: Validate Quick Settings Layout Scrollbar Testing

on:
  push:
    branches:
      - feature/theme-picker-workspace-toggle-fixes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Validate committed Quick Settings layout scrollbar
        run: |
          bash -n tests/test-quick-settings-layout.sh
          shellcheck tests/test-quick-settings-layout.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-quickshell-updater-migration.sh
          bash tests/test-theme-picker-workspace-composition.sh
          bash tests/test-workspace-icon-packs.sh
          bash tests/test-bar-icon-customization.sh
          git diff --check origin/main...HEAD
