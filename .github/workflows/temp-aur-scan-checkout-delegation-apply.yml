name: Apply AUR Scan Checkout Delegation

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scan-integration

      - name: Remove legacy checkout regex gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bashrc")
          text = path.read_text(encoding="utf-8")
          old = '''  _aur_guard_scan_package_files "$pkg" "$pkgdir" || {
            _AUR_GUARD_REQUEST_STATE[$pkg]='failed'
            return 1
          }

          '''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one live legacy checkout gate, found {count}")

          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

          bash -n bashrc
          git diff --check

      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bashrc
          git diff --cached --quiet && exit 0
          git commit -m 'Delegate AUR checkout scanning to aur-scan'
          git push origin HEAD:feature/aur-scan-integration
