name: Temporary Final Validate Theme Overlay and Color Binds

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-theme-overlay-color-binds-final-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: Syntax and ShellCheck
        run: |
          bash -n tests/test-theme-overlay-escape.sh
          bash -n tests/test-color-adjustment-keybinds.sh
          bash -n tests/test-quickshell-theme-picker.sh
          bash -n tests/test-lua-validation.sh
          shellcheck tests/test-theme-overlay-escape.sh
          shellcheck tests/test-color-adjustment-keybinds.sh
          shellcheck tests/test-quickshell-theme-picker.sh
          shellcheck tests/test-lua-validation.sh
          lua5.4 -e 'assert(loadfile("config/hypr/hyprland.lua"))'
      - name: Focused regressions
        run: |
          bash tests/test-theme-overlay-escape.sh
          bash tests/test-color-adjustment-keybinds.sh
          bash tests/test-quickshell-theme-picker.sh
          bash tests/test-quick-settings-theme-toggle.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-quick-settings-ux-flow.sh
          bash tests/test-quick-settings-bar-customize-flow.sh
          bash tests/test-night-light-schedule.sh
          bash tests/test-lua-validation.sh
