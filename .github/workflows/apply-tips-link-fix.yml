name: Apply Awtarchy Tips Link Fix

on:
  push:
    branches: [tips-link-opening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Normalize focused patch formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('config/hypr/scripts/awtarchy-tips-tui.sh')
          lines = path.read_text().splitlines()
          target = 'if (( ${#urls[@]} > 0 )); then'
          indexes = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(indexes) != 1:
              raise SystemExit(f'expected one Tips footer block, found {len(indexes)}')
          i = indexes[0]
          if lines[i + 2].strip() != 'else' or lines[i + 4].strip() != 'fi':
              raise SystemExit('unexpected Tips footer block shape')
          lines[i] = '        ' + lines[i].lstrip()
          lines[i + 1] = '            ' + lines[i + 1].lstrip()
          lines[i + 2] = '        else'
          lines[i + 3] = '            ' + lines[i + 3].lstrip()
          lines[i + 4] = '        fi'
          path.write_text('\n'.join(lines) + '\n')
          PY

          bash -n config/hypr/scripts/awtarchy-tips-tui.sh
          bash tests/test-awtarchy-tips-links.sh
          shellcheck tests/test-awtarchy-tips-links.sh

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/hypr/scripts/awtarchy-tips-tui.sh
          git commit -m 'style: normalize Awtarchy Tips link footer'
          git push origin HEAD:tips-link-opening
