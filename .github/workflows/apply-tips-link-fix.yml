name: Apply Awtarchy Tips Link Fix

on:
  push:
    branches: [tips-link-opening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Normalize focused patch formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/hypr/scripts/awtarchy-tips-tui.sh')
          text = path.read_text()
          old = '''        if (( ${#urls[@]} > 0 )); then
        printf '\\n%sUp/Down or wheel = scroll  PgUp/PgDn = page  Home/End = jump  o = open link  Esc/q = back%s\\n' "$C_DIM" "$C_RESET" >&3
    else
        printf '\\n%sUp/Down or wheel = scroll  PgUp/PgDn = page  Home/End = jump  Esc/q = back%s\\n' "$C_DIM" "$C_RESET" >&3
    fi
'''
          new = '''        if (( ${#urls[@]} > 0 )); then
            printf '\\n%sUp/Down or wheel = scroll  PgUp/PgDn = page  Home/End = jump  o = open link  Esc/q = back%s\\n' "$C_DIM" "$C_RESET" >&3
        else
            printf '\\n%sUp/Down or wheel = scroll  PgUp/PgDn = page  Home/End = jump  Esc/q = back%s\\n' "$C_DIM" "$C_RESET" >&3
        fi
'''
          if old not in text:
              raise SystemExit('expected Tips footer formatting block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          bash -n config/hypr/scripts/awtarchy-tips-tui.sh
          bash tests/test-awtarchy-tips-links.sh
          shellcheck tests/test-awtarchy-tips-links.sh

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/hypr/scripts/awtarchy-tips-tui.sh
          git commit -m 'style: normalize Awtarchy Tips link footer'
          git push origin HEAD:tips-link-opening
