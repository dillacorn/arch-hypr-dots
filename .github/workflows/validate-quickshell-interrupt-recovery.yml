name: Validate Quickshell Interrupt Recovery

on:
  push:
    branches:
      - fix/quickshell-interrupt-recovery
  pull_request:
    paths:
      - local/bin/awtarchy
      - local/share/awtarchy/awtarchy-runtime.sh
      - tests/test-awtarchy-git-mode.sh
      - tests/test-git-runtime-selection.sh
      - tests/test-quickshell-update-interrupt-recovery.sh
      - tests/test-quickshell-updater-bootstrap.sh
      - .github/workflows/validate-quickshell-interrupt-recovery.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Bash syntax
        run: |
          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-awtarchy-git-mode.sh
          bash -n tests/test-git-runtime-selection.sh
          bash -n tests/test-quickshell-update-interrupt-recovery.sh
          bash -n tests/test-quickshell-updater-bootstrap.sh
      - name: Existing Git testing flow
        run: bash tests/test-awtarchy-git-mode.sh
      - name: Exact Git runtime selection
        run: bash tests/test-git-runtime-selection.sh
      - name: Quickshell interrupted-update recovery
        run: bash tests/test-quickshell-update-interrupt-recovery.sh
      - name: Quickshell updater bootstrap
        run: bash tests/test-quickshell-updater-bootstrap.sh
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
