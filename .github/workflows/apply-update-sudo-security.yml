name: Apply Update Sudo Security Revision

on:
  push:
    branches: [fix/update-terminal-sudo-disk-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Tighten update sudo security regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply production revision
        run: |
          python3 <<'PY'
          from pathlib import Path

          launcher_path = Path('local/bin/awtarchy')
          launcher = launcher_path.read_text(encoding='utf-8')
          launcher = launcher.replace('GIT_TEST_STATE_FILE=""\nUPDATE_SUDO_KEEPALIVE_PID=""\n', 'GIT_TEST_STATE_FILE=""\n', 1)
          start = launcher.index('stop_update_privilege_session() {')
          end = launcher.index('root_free_mib() {', start)
          launcher = launcher[:start] + launcher[end:]
          old = '''      start_update_privilege_session
          trap stop_update_privilege_session EXIT HUP INT TERM
          ensure_update_disk_headroom
          offer_package_reconciliation_before_update "$@"
          ensure_update_disk_headroom
          if ! config_release_ready_or_noop "$@"; then
            stop_update_privilege_session
            trap - EXIT HUP INT TERM
            return 0
          fi
          run_runtime update-reset-backup --mode preserve "$@"
          reconcile_quickshell_ui_after_update
          stop_update_privilege_session
          trap - EXIT HUP INT TERM
          ;;
          '''
          new = '''      offer_package_reconciliation_before_update "$@"
          ensure_update_disk_headroom
          if ! config_release_ready_or_noop "$@"; then
            return 0
          fi
          run_runtime update-reset-backup --mode preserve "$@"
          reconcile_quickshell_ui_after_update
          ;;
          '''
          if old not in launcher:
              raise SystemExit('launcher update arm did not match expected branch state')
          launcher = launcher.replace(old, new, 1)
          launcher_path.write_text(launcher, encoding='utf-8')

          reconciler_path = Path('local/share/awtarchy/awtarchy-package-reconcile.sh')
          reconciler = reconciler_path.read_text(encoding='utf-8')
          marker = 'AUR_SCAN_BIN="/usr/bin/aur-scan"\n'
          if marker not in reconciler:
              raise SystemExit('AUR_SCAN_BIN marker missing')
          reconciler = reconciler.replace(marker, marker + 'PACKAGE_SUDO_KEEPALIVE_PID=""\n', 1)

          require_block = '''require_sudo() {
            if (( EUID == 0 )); then
              return 0
            fi
            have sudo || die "sudo is required to apply package reconciliation."
            sudo -v || die "sudo authentication failed; no package changes were applied."
          }

          '''
          helpers = '''require_sudo() {
            if (( EUID == 0 )); then
              return 0
            fi
            have sudo || die "sudo is required to apply package reconciliation."
            sudo -v || die "sudo authentication failed; no package changes were applied."
          }

          stop_package_privilege_keepalive() {
            local pid="${PACKAGE_SUDO_KEEPALIVE_PID:-}"
            PACKAGE_SUDO_KEEPALIVE_PID=""
            [[ $pid =~ ^[1-9][0-9]*$ ]] || return 0
            kill "$pid" >/dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
          }

          start_package_privilege_keepalive() {
            (( EUID != 0 )) || return 0
            [[ -z ${PACKAGE_SUDO_KEEPALIVE_PID:-} ]] || return 0
            (
              while sleep "${AWTARCHY_SUDO_KEEPALIVE_SECONDS:-45}"; do
                sudo -n -v >/dev/null 2>&1 || break
              done
            ) &
            PACKAGE_SUDO_KEEPALIVE_PID=$!
          }

          resume_package_privilege_keepalive() {
            (( EUID != 0 )) || return 0
            sudo -n -v >/dev/null 2>&1 || return 0
            start_package_privilege_keepalive
            trap stop_package_privilege_keepalive EXIT HUP INT TERM
          }

          root_free_mib() {
            local available_kib=""
            available_kib="$(/usr/bin/df -Pk / 2>/dev/null | awk 'NR == 2 { print $4 }')"
            [[ $available_kib =~ ^[0-9]+$ ]] || return 1
            printf '%s\\n' "$(( available_kib / 1024 ))"
          }

          recover_package_disk_headroom() {
            local preferred_mib="${AWTARCHY_UPDATE_PREFERRED_FREE_MIB:-4096}"
            local required_mib="${AWTARCHY_UPDATE_REQUIRED_FREE_MIB:-1024}"
            local free_mib="" paccache_bin=""

            [[ $preferred_mib =~ ^[0-9]+$ && $required_mib =~ ^[0-9]+$ ]] \\
              || die "Invalid update disk-space threshold override."
            (( preferred_mib >= required_mib )) \\
              || die "Preferred update disk-space threshold cannot be below the required threshold."

            free_mib="$(root_free_mib)" \\
              || die "Could not determine free space on the root filesystem."
            (( free_mib >= preferred_mib )) && return 0

            for paccache_bin in /usr/bin/paccache /usr/sbin/paccache; do
              [[ -x $paccache_bin ]] && break
              paccache_bin=""
            done

            if [[ -n $paccache_bin ]]; then
              log "Root filesystem has ${free_mib} MiB free; pruning old pacman cache entries while keeping two package versions..."
              if (( EUID == 0 )); then
                "$paccache_bin" -rk2
              elif ! sudo -n "$paccache_bin" -rk2; then
                die "Automatic pacman cache pruning failed after sudo authorization."
              fi
              free_mib="$(root_free_mib)" \\
                || die "Could not re-check free space after pacman cache pruning."
            fi

            (( free_mib >= required_mib )) \\
              || die "Root filesystem has only ${free_mib} MiB free; at least ${required_mib} MiB is required before continuing package installation."

            if (( free_mib < preferred_mib )); then
              warn "Root filesystem has ${free_mib} MiB free; continuing above the ${required_mib} MiB hard minimum."
            fi
          }

          '''
          if require_block not in reconciler:
              raise SystemExit('require_sudo block did not match expected branch state')
          reconciler = reconciler.replace(require_block, helpers, 1)

          old_apply = '''confirm_yes_no 'Apply this package plan?' 0 || { log 'Package reconciliation canceled.'; exit 0; }
          require_sudo

          if (( ${#install_arch[@]} )); then
            log "Installing Arch packages with a full system upgrade: ${install_arch[*]}"
            as_root pacman -Syu --needed --noconfirm "${install_arch[@]}"
            record_managed_packages "${install_arch[@]}"
          fi

          if (( enable_ly == 1 )); then
            have systemctl || die "Ly is installed but systemctl is unavailable for tty2 setup."
            as_root systemctl disable getty@tty2.service >/dev/null 2>&1 || true
            as_root systemctl enable ly@tty2.service
            log 'Ly enabled on tty2; getty@tty2 disabled.'
          fi

          if (( ${#selected_aur[@]} )); then
            if ensure_aur_scanner; then
              install_selected_aur_packages "${selected_aur[@]}"
            else
              warn 'aur-scanner is unavailable; recording selected AUR packages as failed and continuing with remaining package actions.'
              FAILED_AUR+=("${selected_aur[@]}")
            fi
          fi

          if (( ${#selected_flatpak[@]} )); then
          '''
          new_apply = '''confirm_yes_no 'Apply this package plan?' 0 || { log 'Package reconciliation canceled.'; exit 0; }
          require_sudo
          start_package_privilege_keepalive
          trap stop_package_privilege_keepalive EXIT HUP INT TERM
          recover_package_disk_headroom

          if (( ${#install_arch[@]} )); then
            log "Installing Arch packages with a full system upgrade: ${install_arch[*]}"
            as_root pacman -Syu --needed --noconfirm "${install_arch[@]}"
            record_managed_packages "${install_arch[@]}"
          fi

          if (( enable_ly == 1 )); then
            have systemctl || die "Ly is installed but systemctl is unavailable for tty2 setup."
            as_root systemctl disable getty@tty2.service >/dev/null 2>&1 || true
            as_root systemctl enable ly@tty2.service
            log 'Ly enabled on tty2; getty@tty2 disabled.'
          fi

          if (( ${#selected_aur[@]} )); then
            stop_package_privilege_keepalive
            trap - EXIT HUP INT TERM
            if (( EUID != 0 )); then
              sudo -k
            fi
            log 'AUR build privilege isolation enabled; makepkg may request sudo independently.'
            if ensure_aur_scanner; then
              install_selected_aur_packages "${selected_aur[@]}"
            else
              warn 'aur-scanner is unavailable; recording selected AUR packages as failed and continuing with remaining package actions.'
              FAILED_AUR+=("${selected_aur[@]}")
            fi
            resume_package_privilege_keepalive
          fi

          if (( ${#selected_flatpak[@]} )); then
          '''
          if old_apply not in reconciler:
              raise SystemExit('package apply block did not match expected branch state')
          reconciler = reconciler.replace(old_apply, new_apply, 1)

          end_marker = '''else
            log 'Package reconciliation complete.'
          fi
          '''
          end_replacement = '''else
            log 'Package reconciliation complete.'
          fi

          stop_package_privilege_keepalive
          trap - EXIT HUP INT TERM
          '''
          if end_marker not in reconciler:
              raise SystemExit('package reconciliation completion marker missing')
          reconciler = reconciler.replace(end_marker, end_replacement, 1)
          reconciler_path.write_text(reconciler, encoding='utf-8')
          PY

          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash tests/test-awtarchy-update-session.sh
          git diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add local/bin/awtarchy local/share/awtarchy/awtarchy-package-reconcile.sh
          git commit -m 'Scope sudo authorization around trusted update work'
          git push origin HEAD:fix/update-terminal-sudo-disk-recovery
