name: Quickshell bar parity finalizer

on:
  push:
    branches: [quickshell-conversion-testing]
    paths: ['.github/workflows/quickshell-bar-parity-final.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0
      - name: Match remaining Waybar interaction styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('config/quickshell/awtarchy/Bar.qml')
          text = p.read_text()

          def once(old, new):
              global text
              if new not in text:
                  if old not in text:
                      raise SystemExit('missing bar parity anchor: ' + old[:60])
                  text = text.replace(old, new, 1)

          once(
              '                foreground: SystemState.idleBroken ? Theme.urgent : Theme.foreground\n                onClicked: SystemState.toggleIdle()\n',
              '                foreground: SystemState.idleBroken ? Theme.urgent : Theme.foreground\n                hoverBackground: Theme.strongHover\n                onClicked: SystemState.toggleIdle()\n',
          )
          once(
              '                tooltip: "Clipboard history"\n                onClicked: ClipboardMenu.openFocused()\n',
              '                tooltip: "Clipboard history"\n                hoverBackground: Theme.strongHover\n                onClicked: ClipboardMenu.openFocused()\n',
          )
          once(
              '                foreground: Notifications.dnd ? Theme.critical : Theme.foreground\n                tooltip: Notifications.dnd ? "Notifications disabled\\nLeft: enable notifications" : "Notifications enabled\\nLeft: disable notifications"\n',
              '                foreground: Notifications.dnd ? Theme.critical : Theme.foreground\n                hoverBackground: Theme.strongHover\n                tooltip: Notifications.dnd ? "Notifications disabled\\nLeft: enable notifications" : "Notifications enabled\\nLeft: disable notifications"\n',
          )
          once(
              '                horizontalPadding: 10\n                onClicked: PowerMenu.openForScreen(bar.screen)\n',
              '                horizontalPadding: 10\n                hoverBackground: Theme.strongHover\n                onClicked: PowerMenu.openForScreen(bar.screen)\n',
          )
          once(
              '        anchors.fill: parent\n        visible: bar.vertical\n',
              '        anchors.fill: parent\n        anchors.topMargin: 4\n        anchors.bottomMargin: 4\n        visible: bar.vertical\n',
          )
          once(
              '                vertical: true; fixedWidth: 36; label: ""; tooltip: "app-launcher"\n                onClicked: Launcher.openForScreen(bar.screen)\n',
              '                vertical: true; fixedWidth: 36; label: ""; tooltip: "app-launcher"\n                hoverBackground: Theme.strongHover\n                onClicked: Launcher.openForScreen(bar.screen)\n',
          )
          once(
              '                vertical: true; fixedWidth: 36; label: ""; tooltip: "Clipboard history"\n                onClicked: ClipboardMenu.openFocused()\n',
              '                vertical: true; fixedWidth: 36; label: ""; tooltip: "Clipboard history"\n                hoverBackground: Theme.strongHover\n                onClicked: ClipboardMenu.openFocused()\n',
          )
          once(
              '                label: Notifications.dnd ? "" : ""\n                foreground: Notifications.dnd ? Theme.critical : Theme.foreground\n                onClicked: Notifications.toggleDnd()\n',
              '                label: Notifications.dnd ? "" : ""\n                foreground: Notifications.dnd ? Theme.critical : Theme.foreground\n                hoverBackground: Theme.strongHover\n                onClicked: Notifications.toggleDnd()\n',
          )
          once(
              '                vertical: true; fixedWidth: 36; label: ""; tooltip: "power menu"\n                onClicked: PowerMenu.openForScreen(bar.screen)\n',
              '                vertical: true; fixedWidth: 36; label: ""; tooltip: "power menu"\n                hoverBackground: Theme.strongHover\n                onClicked: PowerMenu.openForScreen(bar.screen)\n',
          )
          p.write_text(text)
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/quickshell-bar-parity-final.yml
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy/Bar.qml .github/workflows/quickshell-bar-parity-final.yml
          git diff --cached --check
          git commit -m 'Match remaining Quickshell bar styling'
          git push origin HEAD:quickshell-conversion-testing
