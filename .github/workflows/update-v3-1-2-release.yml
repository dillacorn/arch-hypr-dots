name: Update v3.1.2 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v3-1-2-release.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested target
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: ee6abd554d67ef9a2cfd310dec03db02ad3e96c3

      - name: Validate launcher usage ranking patch
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell_launcher_usage.sh
          bash -n tests/test-launcher-usage-ranking.sh
          bash tests/test-launcher-usage-ranking.sh
          git diff --check 630c3907fe854559691ba5b79bbe2a6122b1ea7a..ee6abd554d67ef9a2cfd310dec03db02ad3e96c3

      - name: Refresh v3.1.2 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ee6abd554d67ef9a2cfd310dec03db02ad3e96c3
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.1.2" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body' > release-body.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path("release-body.md")
          body = path.read_text()
          marker = "Application launcher now learns launch frequency"
          note = """- Application launcher now learns launch frequency, similar to Fuzzel, so frequently launched applications naturally rise toward the top.
          - Launch counts persist across sessions; typed fuzzy-search relevance still takes priority and unused applications remain alphabetical.

          The `v3.1.2` tag was refreshed to include this post-release launcher improvement."""

          if marker not in body:
              if "## Post-release refresh" in body:
                  body = body.rstrip() + "\n\n" + note + "\n"
              else:
                  body = body.rstrip() + "\n\n## Post-release refresh\n\n" + note + "\n"

          path.write_text(body)
          PY

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --raw-field body="$(cat release-body.md)" \
            --raw-field target_commitish="$TARGET_SHA" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body' \
            | grep -Fq "Application launcher now learns launch frequency"

      - name: Move v3.1.2 tag to refreshed target
        env:
          TARGET_SHA: ee6abd554d67ef9a2cfd310dec03db02ad3e96c3
        run: |
          set -euo pipefail
          git tag -f v3.1.2 "$TARGET_SHA"
          git push --force origin refs/tags/v3.1.2
          test "$(git ls-remote origin refs/tags/v3.1.2 | awk '{print $1}')" = "$TARGET_SHA"
