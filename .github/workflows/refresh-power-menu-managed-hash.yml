name: Refresh power menu managed hash

on:
  push:
    branches:
      - feature/quickshell-lockscreen

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quickshell-lockscreen
          fetch-depth: 0

      - name: Append current PowerMenu stock hash
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          source='config/quickshell/awtarchy/PowerMenu.qml'
          rel='.config/quickshell/awtarchy/PowerMenu.qml'
          hash="$(sha256sum "$source" | awk '{print $1}')"
          entry="${hash}"$'\t'"${rel}"

          if ! grep -Fxq -- "$entry" "$history"; then
            printf '%s\n' "$entry" >>"$history"
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh power menu managed hash'
          git push origin HEAD:feature/quickshell-lockscreen
