name: Apply Quickshell settings hotfix

on:
  push:
    paths:
      - .github/workflows/apply-quickshell-settings-hotfix.yml
      - tools/quickshell-settings-hotfix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 4

      - name: Verify guarded staging commits
        shell: bash
        run: |
          set -euo pipefail
          expected=2e8c2e92cf0e43652f83ad3636b4b552d46a5972
          git merge-base --is-ancestor "$expected" HEAD
          unexpected="$(git diff --name-only "$expected"..HEAD | grep -Ev '^(\.github/workflows/apply-quickshell-settings-hotfix\.yml|tools/quickshell-settings-hotfix\.py)$' || true)"
          [[ -z "$unexpected" ]] || {
            printf 'Unexpected files changed since guarded base:\n%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Apply settings fixes
        run: python3 tools/quickshell-settings-hotfix.py

      - name: Refresh managed-history hashes
        shell: bash
        run: |
          set -euo pipefail
          manifest=local/share/awtarchy/quickshell-managed-history.sha256
          for rel in \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/Notifications.qml \
            config/hypr/scripts/quickshell_application_state.sh
          do
            hash="$(sha256sum "$rel" | awk '{print $1}')"
            entry="${hash}"$'\t'".${rel}"
            grep -Fqx -- "$entry" "$manifest" || printf '%s\n' "$entry" >>"$manifest"
          done

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq shellcheck >/dev/null
          bash -n local/bin/awtarchy
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-production-readiness.sh
          shellcheck local/bin/awtarchy config/hypr/scripts/quickshell_application_state.sh tests/test-quickshell-production-readiness.sh
          bash tests/test-quickshell-production-readiness.sh

          test_home="$(mktemp -d)"
          trap 'rm -rf -- "$test_home"' EXIT
          export HOME="$test_home"
          export XDG_CACHE_HOME="$test_home/cache"
          export HYPR_QUICKSHELL_SCRIPT=/bin/false
          state="$XDG_CACHE_HOME/awtarchy/quickshell-state.json"

          bash config/hypr/scripts/quickshell_application_state.sh save-flyout notifications DP-1 520 760 100 100 false 4
          bash config/hypr/scripts/quickshell_application_state.sh save-flyout notifications DP-2 520 760 100 100 false 10
          jq -e '.notification_views["DP-1"].popup_limit == 4' "$state" >/dev/null
          jq -e '.notification_views["DP-2"].popup_limit == 10' "$state" >/dev/null
          jq -e 'has("notification_popup_limit") | not' "$state" >/dev/null

          bash config/hypr/scripts/quickshell_application_state.sh set-notification-popup-limit DP-1 7
          jq -e '.notification_views["DP-1"].popup_limit == 7' "$state" >/dev/null
          jq -e '.notification_views["DP-2"].popup_limit == 10' "$state" >/dev/null

          grep -Fq 'text: "Maximum output volume"' config/quickshell/awtarchy/FlyoutSettings.qml
          ! grep -Fq 'text: "Max volume"' config/quickshell/awtarchy/BarSettingsSection.qml
          grep -Fq 'popupLimitOverride = persisted.popupLimit;' config/quickshell/awtarchy/Notifications.qml
          ! grep -Fq 'notification-popup-limits.json' config/quickshell/awtarchy/Notifications.qml
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/Notifications.qml \
            config/hypr/scripts/quickshell_application_state.sh \
            local/bin/awtarchy \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-quickshell-production-readiness.sh
          git commit -m 'Fix Quickshell display settings persistence'
          git push origin HEAD:main
