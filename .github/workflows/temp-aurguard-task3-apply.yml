name: Apply AurGuard Task 3

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/aur-scan-integration

      - name: Correct applicator literal handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/temp-aurguard-task3-apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('guard_template.format(name=name)', 'guard_template.replace("{name}", name)')
          text = text.replace('guard_template.format(name="aurguardtest")', 'guard_template.replace("{name}", "aurguardtest")')
          text = text.replace(
              'begin = "# AWTARCHY_AURGUARD_RUNTIME_BEGIN v1"',
              'begin = "# AWTARCHY_AURGUARD_" + "RUNTIME_BEGIN v1"',
          )
          text = text.replace(
              'end = "# AWTARCHY_AURGUARD_RUNTIME_END v1"',
              'end = "# AWTARCHY_AURGUARD_" + "RUNTIME_END v1"',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate applicator syntax
        run: python3 -m py_compile .github/temp-aurguard-task3-apply.py

      - name: Apply Task 3
        run: python3 .github/temp-aurguard-task3-apply.py

      - name: Validate Task 3
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-aurguard-runtime-refresh.sh
          shellcheck bashrc tests/test-aurguard-runtime-refresh.sh
          bash tests/test-aurguard-runtime-refresh.sh
          bash tests/test-security-boundaries.sh
          bash tests/test-aur-scan-self-heal.sh
          bash tests/test-aur-scan-checkout-delegation.sh
          bash tests/test-aur-scan-review-policy.sh
          bash tests/test-aur-signed-metadata-chain.sh
          git diff --check

      - name: Commit Task 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bashrc
          git commit -m 'Self-refresh AurGuard from exact Awtarchy commits'
          git push origin HEAD:feature/aur-scan-integration
