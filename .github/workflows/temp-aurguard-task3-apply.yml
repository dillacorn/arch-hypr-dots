name: Apply AurGuard Task 3

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/aur-scan-integration

      - name: Correct applicator literal handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/temp-aurguard-task3-apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('guard_template.format(name=name)', 'guard_template.replace("{name}", name)')
          text = text.replace('guard_template.format(name="aurguardtest")', 'guard_template.replace("{name}", "aurguardtest")')
          text = text.replace(
              'begin = "# AWTARCHY_AURGUARD_RUNTIME_BEGIN v1"',
              'begin = "# AWTARCHY_AURGUARD_" + "RUNTIME_BEGIN v1"',
          )
          text = text.replace(
              'end = "# AWTARCHY_AURGUARD_RUNTIME_END v1"',
              'end = "# AWTARCHY_AURGUARD_" + "RUNTIME_END v1"',
          )
          old = """  python3 - \"$source\" \"$candidate\" <<'PY_RUNTIME_EXTRACT'\n"""
          new = """  python3 - \"$source\" \"$candidate\" <<'PY_RUNTIME_EXTRACT' || return 1\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one extractor heredoc command, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_tail = """PY_RUNTIME_EXTRACT\n  || return 1\n\n  candidate_size="""
          new_tail = """PY_RUNTIME_EXTRACT\n\n  candidate_size="""
          if text.count(old_tail) != 1:
              raise SystemExit(f'expected one extractor heredoc tail, found {text.count(old_tail)}')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate applicator syntax
        run: python3 -m py_compile .github/temp-aurguard-task3-apply.py

      - name: Apply Task 3
        run: python3 .github/temp-aurguard-task3-apply.py

      - name: Preserve intentional test-mode lint semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bashrc')
          text = path.read_text(encoding='utf-8')

          unused = '  local target_spec target revision lock_fd\n'
          if text.count(unused) != 1:
              raise SystemExit(f'expected one unused target_spec declaration, found {text.count(unused)}')
          text = text.replace(unused, '  local target revision lock_fd\n', 1)

          guard = (
              '  if [[ ${AWTARCHY_AURGUARD_RUNTIME_ACTIVE:-0} != 1 \\\n'
              '      && ${AUR_GUARD_TEST_MODE:-0} != 1 ]]; then\n'
          )
          guarded = (
              '  # AUR_GUARD_TEST_MODE is intentionally inherited by commands run inside aurguardtest()\'s subshell.\n'
              '  # shellcheck disable=SC2031\n'
              + guard
          )
          guard_count = text.count(guard)
          if guard_count != 15:
              raise SystemExit(f'expected 15 runtime dispatch guards, found {guard_count}')
          text = text.replace(guard, guarded)

          assignment = '  export AUR_GUARD_TEST_MODE=1\n'
          assignment_with_intent = (
              '  # This assignment is intentionally local to aurguardtest()\'s subshell.\n'
              '  # shellcheck disable=SC2030\n'
              + assignment
          )
          if text.count(assignment) != 1:
              raise SystemExit(f'expected one AUR_GUARD_TEST_MODE assignment, found {text.count(assignment)}')
          text = text.replace(assignment, assignment_with_intent, 1)

          aurhelp_dispatch = '    _aur_guard_runtime_dispatch aurhelp "$@"\n'
          if text.count(aurhelp_dispatch) != 1:
              raise SystemExit(f'expected one aurhelp runtime dispatch, found {text.count(aurhelp_dispatch)}')
          text = text.replace(
              aurhelp_dispatch,
              '    _aur_guard_runtime_dispatch aurhelp\n',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Task 3
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-aurguard-runtime-refresh.sh
          shellcheck bashrc tests/test-aurguard-runtime-refresh.sh
          bash tests/test-aurguard-runtime-refresh.sh
          bash tests/test-security-boundaries.sh
          bash tests/test-aur-scan-self-heal.sh
          bash tests/test-aur-scan-checkout-delegation.sh
          bash tests/test-aur-scan-review-policy.sh
          bash tests/test-aur-signed-metadata-chain.sh
          git diff --check

      - name: Commit Task 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bashrc
          git commit -m 'Self-refresh AurGuard from exact Awtarchy commits'
          git push origin HEAD:feature/aur-scan-integration
