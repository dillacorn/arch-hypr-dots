          replace_once(
              "config/hypr/scripts/quickshell.sh",
              '''reset_mon() {
''',
              '''copy_bar_settings() {
    local source="$1"
    shift
    local -a targets=("$@")
    local target targets_json tmp

    [[ -n "$source" ]] || { printf 'quickshell.sh: source monitor is required\\n' >&2; exit 2; }
    (( ${#targets[@]} > 0 )) || { printf 'quickshell.sh: at least one target monitor is required\\n' >&2; exit 2; }

    ensure_state
    jq -e --arg source "$source" '.monitors[$source] | type == "object"' "$STATE_FILE" >/dev/null \\
        || { printf 'quickshell.sh: unknown source monitor: %s\\n' "$source" >&2; exit 2; }
    for target in "${targets[@]}"; do
        jq -e --arg target "$target" '.monitors[$target] | type == "object"' "$STATE_FILE" >/dev/null \\
            || { printf 'quickshell.sh: unknown target monitor: %s\\n' "$target" >&2; exit 2; }
    done

    targets_json="$(printf '%s\\n' "${targets[@]}" | jq -Rsc 'split("\\n") | map(select(length > 0)) | unique')"
    tmp="${STATE_FILE}.tmp.$$"
    jq --arg source "$source" --argjson targets "$targets_json" '
        .monitors[$source] as $source_state
        | ($source_state | {
            position,
            bar_size,
            icon_scale,
            text_scale,
            bar_transparency,
            show_tasks,
            theme_task_icons,
            theme_tray_icons,
            show_cpu,
            show_temp,
            show_memory,
            last_horizontal,
            last_vertical
        }) as $bar_settings
        | reduce $targets[] as $target
            (.;
                if $target == $source then .
                else .monitors[$target] = (.monitors[$target] + $bar_settings)
                end)
    ' "$STATE_FILE" >"$tmp"
    mv -f "$tmp" "$STATE_FILE"
}

reset_mon() {
''')

          replace_once(
              "config/hypr/scripts/quickshell.sh",
              '''  setshowmemory <MON> <true|false>
  reset-mon <MON>
''',
              '''  setshowmemory <MON> <true|false>
  copy-bar-settings <SOURCE_MON> <TARGET_MON...>
  reset-mon <MON>
''')

          replace_once(
              "config/hypr/scripts/quickshell.sh",
              '''    setshowmemory-focused) [[ -n "${2:-}" ]] || { usage >&2; exit 2; }; monitor="$(focused_monitor)"; set_monitor_stat_visibility "$monitor" show_memory "$2" ;;
    reset-mon) [[ -n "${2:-}" ]] || { usage >&2; exit 2; }; reset_mon "$2" ;;
''',
              '''    setshowmemory-focused) [[ -n "${2:-}" ]] || { usage >&2; exit 2; }; monitor="$(focused_monitor)"; set_monitor_stat_visibility "$monitor" show_memory "$2" ;;
    copy-bar-settings) [[ -n "${2:-}" && -n "${3:-}" ]] || { usage >&2; exit 2; }; copy_bar_settings "$2" "${@:3}" ;;
    reset-mon) [[ -n "${2:-}" ]] || { usage >&2; exit 2; }; reset_mon "$2" ;;
''')
          PY

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for path in \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/hypr/scripts/quickshell.sh; do
            hash="$(sha256sum "$path" | awk '{print $1}')"
            managed=".config/${path#config/}"
            grep -Fqx "$hash	$managed" "$history" || printf '%s\t%s\n' "$hash" "$managed" >>"$history"
          done
      - name: Validate
        run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-quick-settings-settings-mode.sh
          shellcheck config/hypr/scripts/quickshell.sh tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-display-options.sh
      - name: Commit production change
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/hypr/scripts/quickshell.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Clarify Quick Settings copy controls'
          git push origin HEAD:feature/bar-transparency
