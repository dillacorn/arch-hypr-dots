name: Apply Quick Settings Settings Cleanup

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/apply-quick-settings-settings-mode.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply scoped settings changes
        run: python3 .github/scripts/apply_quick_settings_settings_mode.py
      - name: Validate
        run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-quick-settings-settings-mode.sh
          shellcheck config/hypr/scripts/quickshell.sh tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-display-options.sh
      - name: Commit production change
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/hypr/scripts/quickshell.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Clarify Quick Settings copy controls'
          git push origin HEAD:feature/bar-transparency
