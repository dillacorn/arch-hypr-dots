name: Validate current package catalog

on:
  push:
    branches: [fix/remove-stale-arch-packages]
  pull_request:
    paths:
      - local/bin/awtarchy
      - local/share/awtarchy/awtarchy-runtime.sh
      - local/share/awtarchy/awtarchy-package-reconcile.sh
      - tests/test-current-package-catalog.sh
      - tests/test-cheese-snapshot-migration.sh
      - tests/test-update-package-preflight.sh
      - .github/workflows/validate-current-package-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Syntax
        run: |
          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n tests/test-current-package-catalog.sh
          bash -n tests/test-cheese-snapshot-migration.sh
          bash -n tests/test-update-package-preflight.sh
      - name: Catalog regression
        run: bash tests/test-current-package-catalog.sh
      - name: Cheese replacement regression
        run: bash tests/test-cheese-snapshot-migration.sh
      - name: Update package preflight regression
        run: bash tests/test-update-package-preflight.sh
      - name: Package reconciler regressions
        run: |
          bash tests/test-package-reconciler.sh
          bash tests/test-package-reconciler-alternatives.sh
          bash tests/test-package-reconciler-interrupted-recovery.sh
          bash tests/test-package-reconciler-aur-equivalents.sh
      - name: Installer regression
        run: bash tests/test-installer-aur-scanner-delegation.sh
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
