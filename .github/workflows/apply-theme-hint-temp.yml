name: Temporary Apply Themes Hint

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/apply-theme-hint-temp.yml'
      - '.github/scripts/apply-theme-hint.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply production changes
        run: python3 .github/scripts/apply-theme-hint.py
      - name: Validate
        run: |
          bash -n tests/test-quick-settings-theme-hint.sh
          bash -n tests/test-quick-settings-bar-customize-flow.sh
          bash tests/test-quick-settings-theme-hint.sh
          bash tests/test-quick-settings-bar-customize-flow.sh
          git diff --check
      - name: Commit production files
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            tests/test-quick-settings-bar-customize-flow.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'Document Themes shortcut in Bar settings'
          git push origin HEAD:feature/bar-transparency
