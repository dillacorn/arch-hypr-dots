name: Apply Update Session Recovery Fix

on:
  push:
    branches: [fix/update-terminal-sudo-disk-recovery]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply bounded updater fix
        run: |
          python3 .github/scripts/apply-update-session-recovery.py
          bash -n local/bin/awtarchy
          bash -n config/hypr/scripts/quickshell_update_notifications.sh
          bash tests/test-awtarchy-update-session.sh
          git diff --check

          if git diff --quiet; then
            echo 'Updater session recovery fix already applied.'
          else
            git config user.name 'dillacorn'
            git config user.email '28743863+dillacorn@users.noreply.github.com'
            git add local/bin/awtarchy config/hypr/scripts/quickshell_update_notifications.sh
            git commit -m 'Fix update terminal, sudo session, and disk recovery'
            git push origin HEAD:fix/update-terminal-sudo-disk-recovery
          fi
