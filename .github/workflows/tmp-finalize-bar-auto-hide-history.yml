name: Temporary Finalize Bar Auto Hide History

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize-history:
    if: github.event.pull_request.number == 179 && github.head_ref == 'feature/bar-auto-hide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/bar-auto-hide
          fetch-depth: 0
      - name: Verify and append final managed hash
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          current_hash="$(sha256sum config/hypr/scripts/hypr_quicksettings.sh | awk '{print $1}')"
          test "$current_hash" = '61876c751d4925ea1bc781f6629bff7f943f457f60ec52df70d9a34a51b65ab3'
          if ! grep -Fq "$current_hash" "$history"; then
            printf '%s\t%s\n' "$current_hash" '.config/hypr/scripts/hypr_quicksettings.sh' >> "$history"
          fi
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history"
          git commit -m 'Register final Quick Settings stock hash'
          git push origin HEAD:feature/bar-auto-hide
