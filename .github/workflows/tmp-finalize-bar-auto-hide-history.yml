name: Temporary Finalize Bar Auto Hide History

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize-history:
    if: github.event.pull_request.number == 179 && github.head_ref == 'feature/bar-auto-hide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/bar-auto-hide
          fetch-depth: 0
      - name: Verify and append final managed hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          shell_hash="$(sha256sum config/quickshell/awtarchy/shell.qml | awk '{print $1}')"
          quick_hash="$(sha256sum config/quickshell/awtarchy/QuickSettings.qml | awk '{print $1}')"
          test "$shell_hash" = 'a33ecd2549fe639bc3fa929924a7f8a6daf6f32cc0aba2da01a99536a9f460c0'
          test "$quick_hash" = 'a9b016fa13c97e638d74fc9e5def917ec38cacb714d8179fc55c5ab12f22c048'
          if ! grep -Fq "$shell_hash" "$history" || ! grep -Fq "$quick_hash" "$history"; then
            printf '\n# 2026-09-08 bar auto-hide responsiveness and primary toggle follow-up.\n%s\t%s\n%s\t%s\n' \
              "$shell_hash" '.config/quickshell/awtarchy/shell.qml' \
              "$quick_hash" '.config/quickshell/awtarchy/QuickSettings.qml' >> "$history"
          fi
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history"
          git commit -m 'Register final bar auto-hide stock hashes'
          git push origin HEAD:feature/bar-auto-hide
