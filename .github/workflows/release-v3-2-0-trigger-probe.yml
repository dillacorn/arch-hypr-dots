name: v3.2.0 Trigger Probe

on:
  issues:
    types: [edited]

permissions:
  issues: write

jobs:
  probe:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.number == 52 &&
      github.event.issue.body == 'AWTARCHY_RELEASE_V3_2_0_PROBE_20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm issue-event trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 52 \
            --repo "$GITHUB_REPOSITORY" \
            --body 'v3.2.0 release trigger probe received successfully.'
