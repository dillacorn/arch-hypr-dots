name: Temporary Lockscreen Managed History Append

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths:
      - .github/workflows/tmp-append-lockscreen-managed-history.yml

permissions:
  contents: write

jobs:
  append:
    if: github.repository == 'dillacorn/awtarchy' && github.ref == 'refs/heads/feature/lockscreen-interactive-effects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 1
      - name: Append exact managed hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'

          append_line() {
            local hash="$1" path="$2" line
            line="${hash}"$'\t'"${path}"
            if ! grep -Fqx -- "$line" "$history"; then
              printf '%s\n' "$line" >>"$history"
            fi
          }

          append_line '898659890fbd79f189a6560ab2732899becc80ca51763b10734cac9c62f08cce' '.config/quickshell/awtarchy/LockscreenEditor.qml'
          append_line 'b99b64ccb3e1cc12dc717b9815a3646f5d11117a6f56ed19830b8242553ad396' '.config/quickshell/awtarchy/LockPreviewScene.qml'
          append_line '66f102b1596617316ac016cb5a204643f46ce874157a88b0769529e232022ab6' '.config/quickshell/awtarchy/LockPreviewWallpaperState.qml'

          git diff --check -- "$history"
          if ! git diff --quiet -- "$history"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$history"
            git commit -m 'chore: record lockscreen editor preview managed hashes'
            git push origin HEAD:feature/lockscreen-interactive-effects
          fi
