name: Apply live lockscreen editor phase

on:
  push:
    branches: [feature/lockscreen-interactive-effects]
    paths: [.github/workflows/apply-lockscreen-live-editor.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Apply live editor production changes
        shell: bash
        run: |
          set -euo pipefail

          cat > config/quickshell/awtarchy/LockscreenEditor.qml <<'EOF'
          pragma Singleton
          pragma ComponentBehavior: Bound

          import QtQuick
          import QtQuick.Layouts
          import Quickshell
          import Quickshell.Hyprland
          import Quickshell.Io
          import Quickshell.Wayland
          import "../awtarchy-lock" as LockUi

          Singleton {
              id: root

              readonly property string configHome: Quickshell.env("XDG_CONFIG_HOME")
                  || (Quickshell.env("HOME") + "/.config")
              readonly property string stateBackend: configHome + "/hypr/scripts/quickshell_application_state.sh"
              readonly property bool open: editorWindow.visible
              readonly property var elementNames: ["logo", "time", "date", "username", "weather", "password"]

              property var draftLayout: defaultLayout()
              property var draftVisibility: defaultVisibility()
              property string selectedElement: "logo"
              property string statusMessage: ""

              function defaultLayout() {
                  return ({
                      logo: ({ x: 0.50, y: 0.34, scale: 1.0 }),
                      time: ({ x: 0.50, y: 0.51, scale: 1.0 }),
                      date: ({ x: 0.50, y: 0.555, scale: 1.0 }),
                      username: ({ x: 0.50, y: 0.595, scale: 1.0 }),
                      weather: ({ x: 0.50, y: 0.635, scale: 1.0 }),
                      password: ({ x: 0.50, y: 0.70, scale: 1.0 })
                  });
              }

              function defaultVisibility() {
                  return ({
                      logo: true,
                      time: false,
                      date: false,
                      username: false,
                      weather: false,
                      password: true
                  });
              }

              function cloneObject(value, fallback) {
                  try {
                      const parsed = JSON.parse(JSON.stringify(value));
                      return parsed && typeof parsed === "object" ? parsed : fallback();
                  } catch (error) {
                      return fallback();
                  }
              }

              function cloneLayout(value) {
                  const cloned = cloneObject(value, defaultLayout);
                  const defaults = defaultLayout();
                  const result = ({});
                  for (const name of elementNames) {
                      const raw = cloned[name] || defaults[name];
                      const password = name === "password";
                      const x = Number(raw.x);
                      const y = Number(raw.y);
                      const scale = Number(raw.scale === undefined ? 1 : raw.scale);
                      result[name] = ({
                          x: Math.max(password ? 0.15 : 0.05,
                              Math.min(password ? 0.85 : 0.95,
                                  Number.isFinite(x) ? x : defaults[name].x)),
                          y: Math.max(password ? 0.20 : 0.08,
                              Math.min(password ? 0.86 : 0.92,
                                  Number.isFinite(y) ? y : defaults[name].y)),
                          scale: Math.max(0.50, Math.min(2.00,
                              Number.isFinite(scale) ? scale : 1))
                      });
                  }
                  return result;
              }

              function cloneVisibility(value) {
                  const defaults = defaultVisibility();
                  const cloned = cloneObject(value, defaultVisibility);
                  const result = ({});
                  for (const name of elementNames)
                      result[name] = name === "password" ? true
                          : (typeof cloned[name] === "boolean" ? cloned[name] : defaults[name]);
                  return result;
              }

              function clampPoint(name, x, y) {
                  const password = name === "password";
                  return ({
                      x: Math.max(password ? 0.15 : 0.05, Math.min(password ? 0.85 : 0.95, x)),
                      y: Math.max(password ? 0.20 : 0.08, Math.min(password ? 0.86 : 0.92, y))
                  });
              }

              function setDraftPoint(name, x, y) {
                  if (elementNames.indexOf(name) < 0)
                      return;
                  const next = cloneLayout(draftLayout);
                  const point = clampPoint(name, Number(x), Number(y));
                  next[name] = ({ x: point.x, y: point.y, scale: next[name].scale });
                  draftLayout = next;
                  selectedElement = name;
              }

              function elementScale(name) {
                  const point = draftLayout[name] || defaultLayout()[name];
                  const value = Number(point.scale === undefined ? 1 : point.scale);
                  return Number.isFinite(value) ? Math.max(0.50, Math.min(2.00, value)) : 1;
              }

              function setDraftScale(name, scale) {
                  if (elementNames.indexOf(name) < 0)
                      return;
                  const next = cloneLayout(draftLayout);
                  const value = Number(scale);
                  if (!Number.isFinite(value))
                      return;
                  next[name].scale = Math.round(Math.max(0.50, Math.min(2.00, value)) * 100) / 100;
                  draftLayout = next;
                  selectedElement = name;
              }

              function elementCanHide(name) {
                  return name !== "password";
              }

              function setDraftVisible(name, visible) {
                  if (elementNames.indexOf(name) < 0 || !elementCanHide(name))
                      return;
                  const next = cloneVisibility(draftVisibility);
                  next[name] = !!visible;
                  draftVisibility = next;
                  selectedElement = name;
              }

              function elementEnabled(name) {
                  return draftVisibility[name] !== false;
              }

              function resetDraft() {
                  draftLayout = defaultLayout();
                  draftVisibility = defaultVisibility();
                  selectedElement = "logo";
                  statusMessage = "Defaults loaded. Save to apply.";
              }

              function loadPersistedDraft() {
                  draftLayout = cloneLayout(BarState.lockscreenLayout());
                  draftVisibility = cloneVisibility(({
                      logo: BarState.lockscreenShowLogo(),
                      time: BarState.lockscreenShowTime(),
                      date: BarState.lockscreenShowDate(),
                      username: BarState.lockscreenShowUsername(),
                      weather: BarState.lockscreenShowWeather(),
                      password: true
                  }));
                  selectedElement = elementNames.indexOf(selectedElement) >= 0 ? selectedElement : "logo";
                  statusMessage = "";
              }

              function focusedScreen() {
                  const name = Hyprland.focusedMonitor ? Hyprland.focusedMonitor.name : "";
                  const screens = Quickshell.screens || [];
                  for (let i = 0; i < screens.length; ++i) {
                      if (screens[i] && screens[i].name === name)
                          return screens[i];
                  }
                  return screens.length > 0 ? screens[0] : null;
              }

              function openForScreen(target) {
                  if (target)
                      editorWindow.screen = target;
                  loadPersistedDraft();
                  editorWindow.visible = true;
                  FlyoutManager.claimOverlay("lockscreen-editor");
                  Qt.callLater(() => editorFocus.forceActiveFocus());
              }

              function openFocused() {
                  openForScreen(focusedScreen());
              }

              function close() {
                  FlyoutManager.releaseOverlay("lockscreen-editor");
                  editorWindow.visible = false;
                  loadPersistedDraft();
              }

              function save() {
                  if (saveProcess.running)
                      return;
                  statusMessage = "Saving…";
                  saveProcess.exec([
                      "bash",
                      stateBackend,
                      "save-lockscreen-editor",
                      JSON.stringify(draftLayout),
                      JSON.stringify(draftVisibility)
                  ]);
              }

              function elementLabel(name) {
                  if (name === "logo") return "Logo";
                  if (name === "time") return "Time";
                  if (name === "date") return "Date";
                  if (name === "username") return "Username";
                  if (name === "weather") return "Weather";
                  if (name === "password") return "Password";
                  return name;
              }

              Process {
                  id: saveProcess
                  onExited: (exitCode, exitStatus) => {
                      if (exitCode === 0) {
                          BarState.refresh();
                          root.statusMessage = "Saved";
                          closeAfterSave.restart();
                      } else {
                          root.statusMessage = "Could not save lockscreen presentation";
                      }
                  }
              }

              Timer {
                  id: closeAfterSave
                  interval: 180
                  repeat: false
                  onTriggered: root.close()
              }

              LockUi.LockWallpaperState {
                  id: wallpaperState
              }

              Shortcut {
                  sequence: "Escape"
                  context: Qt.ApplicationShortcut
                  enabled: root.open
                  autoRepeat: false
                  onActivated: root.close()
              }

              PanelWindow {
                  id: editorWindow
                  WlrLayershell.namespace: "awtarchy-lockscreen-editor"
                  visible: false
                  color: "transparent"
                  WlrLayershell.keyboardFocus: WlrKeyboardFocus.Exclusive
                  aboveWindows: true
                  exclusionMode: ExclusionMode.Ignore
                  anchors.top: true
                  anchors.left: true
                  implicitWidth: Math.max(1, screen ? screen.width : 1920)
                  implicitHeight: Math.max(1, screen ? screen.height : 1080)

                  Rectangle {
                      id: editorFocus
                      anchors.fill: parent
                      color: "#000000"
                      focus: true

                      LockUi.LockScene {
                          id: previewScene
                          anchors.fill: parent
                          theme: Theme
                          animationPreference: BarState.lockscreenAnimationPreference()
                          randomFormationMode: 3
                          audioReactive: false
                          audioLow: 0
                          audioMid: 0
                          audioHigh: 0
                          audioOverall: 0
                          mouseInteractive: BarState.lockscreenMouseInteractiveEnabled()
                          showLogo: root.draftVisibility.logo
                          showTime: root.draftVisibility.time
                          showDate: root.draftVisibility.date
                          showUsername: root.draftVisibility.username
                          showWeather: root.draftVisibility.weather
                          weatherText: "Weather preview"
                          backgroundMode: BarState.lockscreenBackground()
                          wallpaperSource: wallpaperState.source
                          layout: root.draftLayout
                          previewMode: true
                      }

                      Repeater {
                          model: root.elementNames

                          Rectangle {
                              required property string modelData
                              readonly property string elementName: modelData
                              readonly property bool enabledElement: root.elementEnabled(elementName)
                              readonly property var point: root.draftLayout[elementName]
                                  || root.defaultLayout()[elementName]
                              width: Math.max(64, label.implicitWidth + 18)
                              height: 24
                              x: Math.max(0, Math.min(parent.width - width,
                                  Number(point.x) * parent.width - width / 2))
                              y: Math.max(0, Math.min(parent.height - height,
                                  Number(point.y) * parent.height - height / 2))
                              color: root.selectedElement === elementName
                                  ? Theme.focus : Theme.popupBackground
                              border.width: root.selectedElement === elementName ? 2 : 1
                              border.color: Theme.foreground
                              opacity: enabledElement ? 0.88 : 0.52
                              z: 200

                              Text {
                                  id: label
                                  anchors.centerIn: parent
                                  text: root.elementLabel(parent.elementName)
                                      + (parent.enabledElement ? "" : " · Off")
                                  color: Theme.foreground
                                  font.family: Theme.fontFamily
                                  font.pixelSize: 10
                              }

                              MouseArea {
                                  id: dragArea
                                  anchors.fill: parent
                                  hoverEnabled: true
                                  cursorShape: Qt.SizeAllCursor
                                  preventStealing: true
                                  property real pressOffsetX: 0
                                  property real pressOffsetY: 0

                                  onPressed: mouse => {
                                      root.selectedElement = parent.elementName;
                                      pressOffsetX = mouse.x;
                                      pressOffsetY = mouse.y;
                                  }

                                  onPositionChanged: mouse => {
                                      if (!pressed || editorFocus.width <= 0 || editorFocus.height <= 0)
                                          return;
                                      const scenePoint = parent.mapToItem(editorFocus,
                                          mouse.x - pressOffsetX + parent.width / 2,
                                          mouse.y - pressOffsetY + parent.height / 2);
                                      root.setDraftPoint(parent.elementName,
                                          scenePoint.x / editorFocus.width,
                                          scenePoint.y / editorFocus.height);
                                  }
                              }
                          }
                      }

                      Rectangle {
                          anchors.left: parent.left
                          anchors.right: parent.right
                          anchors.bottom: parent.bottom
                          height: 92
                          color: Theme.popupBackground
                          border.width: 1
                          border.color: Theme.muted
                          z: 300

                          ColumnLayout {
                              anchors.fill: parent
                              anchors.margins: 9
                              spacing: 6

                              RowLayout {
                                  Layout.fillWidth: true
                                  spacing: 7

                                  Text {
                                      text: root.elementLabel(root.selectedElement)
                                      color: Theme.foreground
                                      font.family: Theme.fontFamily
                                      font.pixelSize: 10
                                      font.bold: true
                                  }

                                  SettingsButton {
                                      label: root.elementCanHide(root.selectedElement)
                                          ? (root.elementEnabled(root.selectedElement) ? "Visible" : "Hidden")
                                          : "Always visible"
                                      active: root.elementEnabled(root.selectedElement)
                                      available: root.elementCanHide(root.selectedElement)
                                      textSize: 9
                                      onClicked: root.setDraftVisible(root.selectedElement,
                                          !root.elementEnabled(root.selectedElement))
                                  }

                                  Text {
                                      text: "Scale"
                                      color: Theme.muted
                                      font.family: Theme.fontFamily
                                      font.pixelSize: 9
                                  }

                                  SettingsButton {
                                      label: "−"
                                      available: root.elementScale(root.selectedElement) > 0.50
                                      textSize: 10
                                      onClicked: root.setDraftScale(root.selectedElement,
                                          root.elementScale(root.selectedElement) - 0.10)
                                  }

                                  Text {
                                      text: Math.round(root.elementScale(root.selectedElement) * 100) + "%"
                                      color: Theme.foreground
                                      font.family: Theme.fontFamily
                                      font.pixelSize: 9
                                      Layout.preferredWidth: 42
                                      horizontalAlignment: Text.AlignHCenter
                                  }

                                  SettingsButton {
                                      label: "+"
                                      available: root.elementScale(root.selectedElement) < 2.00
                                      textSize: 10
                                      onClicked: root.setDraftScale(root.selectedElement,
                                          root.elementScale(root.selectedElement) + 0.10)
                                  }

                                  Item { Layout.fillWidth: true }

                                  Text {
                                      text: root.statusMessage.length > 0
                                          ? root.statusMessage
                                          : "Drag any handle. Hidden elements keep a handle so they can be restored."
                                      color: Theme.muted
                                      font.family: Theme.fontFamily
                                      font.pixelSize: 9
                                      elide: Text.ElideRight
                                      Layout.maximumWidth: 520
                                  }
                              }

                              RowLayout {
                                  Layout.fillWidth: true
                                  spacing: 8

                                  Text {
                                      Layout.fillWidth: true
                                      text: "Changes are live preview only until Save. Password cannot be hidden."
                                      color: Theme.muted
                                      font.family: Theme.fontFamily
                                      font.pixelSize: 9
                                      elide: Text.ElideRight
                                  }

                                  SettingsButton {
                                      label: "Restore Defaults"
                                      textSize: 10
                                      onClicked: root.resetDraft()
                                  }

                                  SettingsButton {
                                      label: "Cancel"
                                      textSize: 10
                                      onClicked: root.close()
                                  }

                                  SettingsButton {
                                      label: "Save"
                                      active: true
                                      textSize: 10
                                      available: !saveProcess.running
                                      onClicked: root.save()
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{label} target not found in {path}")
              path.write_text(text.replace(old, new, 1))

          state = Path("config/hypr/scripts/quickshell_application_state.sh")
          replace_once(
              state,
              "LOCKSCREEN_LAYOUT_DEFAULT_JSON='{\"logo\":{\"x\":0.5,\"y\":0.34},\"time\":{\"x\":0.5,\"y\":0.51},\"date\":{\"x\":0.5,\"y\":0.555},\"username\":{\"x\":0.5,\"y\":0.595},\"weather\":{\"x\":0.5,\"y\":0.635},\"password\":{\"x\":0.5,\"y\":0.7}}'",
              "LOCKSCREEN_LAYOUT_DEFAULT_JSON='{\"logo\":{\"x\":0.5,\"y\":0.34,\"scale\":1},\"time\":{\"x\":0.5,\"y\":0.51,\"scale\":1},\"date\":{\"x\":0.5,\"y\":0.555,\"scale\":1},\"username\":{\"x\":0.5,\"y\":0.595,\"scale\":1},\"weather\":{\"x\":0.5,\"y\":0.635,\"scale\":1},\"password\":{\"x\":0.5,\"y\":0.7,\"scale\":1}}'",
              "layout defaults")
          replace_once(
              state,
              "        lockscreen_audio_reactive|lockscreen_mouse_interactive|lockscreen_show_time|lockscreen_show_date|lockscreen_show_username|lockscreen_show_weather) ;;",
              "        lockscreen_audio_reactive|lockscreen_mouse_interactive|lockscreen_show_logo|lockscreen_show_time|lockscreen_show_date|lockscreen_show_username|lockscreen_show_weather) ;;",
              "lockscreen option allowlist")

          text = state.read_text()
          start = text.index("validate_lockscreen_layout() {")
          end = text.index("\nreset_lockscreen_presentation() {", start)
          replacement = r'''normalize_lockscreen_layout_json() {
              local value="$1"
              jq -ce -n \
                  --argjson candidate "$value" \
                  --argjson keys "$LOCKSCREEN_LAYOUT_KEYS_JSON" '
                  ($candidate | type) == "object"
                  and (($candidate | keys | sort) == ($keys | sort))
                  and all($keys[];
                      . as $key
                      | ($candidate[$key] | type) == "object"
                      and ((($candidate[$key] | keys | sort) == ["x", "y"])
                          or (($candidate[$key] | keys | sort) == ["scale", "x", "y"]))
                      and ($candidate[$key].x | type) == "number"
                      and ($candidate[$key].y | type) == "number"
                      and (($candidate[$key] | has("scale") | not)
                          or ($candidate[$key].scale | type) == "number")
                      and (($candidate[$key].scale // 1) >= 0.50)
                      and (($candidate[$key].scale // 1) <= 2.00)
                      and (if $key == "password" then
                          $candidate[$key].x >= 0.15 and $candidate[$key].x <= 0.85
                          and $candidate[$key].y >= 0.20 and $candidate[$key].y <= 0.86
                      else
                          $candidate[$key].x >= 0.05 and $candidate[$key].x <= 0.95
                          and $candidate[$key].y >= 0.08 and $candidate[$key].y <= 0.92
                      end)
                  )
                  | reduce $keys[] as $key ({};
                      .[$key] = {
                          x: $candidate[$key].x,
                          y: $candidate[$key].y,
                          scale: ($candidate[$key].scale // 1)
                      })
              '
          }

          validate_lockscreen_layout() {
              local normalized
              if ! normalized="$(normalize_lockscreen_layout_json "$1" 2>/dev/null)"; then
                  printf 'invalid lockscreen layout\n' >&2
                  exit 2
              fi
          }

          save_lockscreen_layout() {
              local normalized
              if ! normalized="$(normalize_lockscreen_layout_json "$1" 2>/dev/null)"; then
                  printf 'invalid lockscreen layout\n' >&2
                  exit 2
              fi
              new_tmp
              jq --argjson value "$normalized" '.lockscreen_layout = $value' "$STATE_FILE" >"$TMP_FILE"
              commit_tmp
          }

          validate_lockscreen_editor_visibility() {
              local value="$1"
              if ! jq -e -n \
                  --argjson candidate "$value" \
                  --argjson keys "$LOCKSCREEN_LAYOUT_KEYS_JSON" '
                  ($candidate | type) == "object"
                  and (($candidate | keys | sort) == ($keys | sort))
                  and all($keys[]; . as $key | ($candidate[$key] | type) == "boolean")
                  and $candidate.password == true
              ' >/dev/null 2>&1; then
                  printf 'invalid lockscreen editor visibility\n' >&2
                  exit 2
              fi
          }

          save_lockscreen_editor() {
              local normalized visibility="$2"
              if ! normalized="$(normalize_lockscreen_layout_json "$1" 2>/dev/null)"; then
                  printf 'invalid lockscreen layout\n' >&2
                  exit 2
              fi
              validate_lockscreen_editor_visibility "$visibility"
              new_tmp
              jq \
                  --argjson layout "$normalized" \
                  --argjson visibility "$visibility" '
                  .lockscreen_layout = $layout
                  | .lockscreen_show_logo = $visibility.logo
                  | .lockscreen_show_time = $visibility.time
                  | .lockscreen_show_date = $visibility.date
                  | .lockscreen_show_username = $visibility.username
                  | .lockscreen_show_weather = $visibility.weather
              ' "$STATE_FILE" >"$TMP_FILE"
              commit_tmp
          }
          '''
          state.write_text(text[:start] + replacement + text[end:])

          replace_once(
              state,
              '        | .lockscreen_mouse_interactive = true\n        | .lockscreen_show_time = false\n',
              '        | .lockscreen_mouse_interactive = true\n        | .lockscreen_show_logo = true\n        | .lockscreen_show_time = false\n',
              "reset logo visibility")
          replace_once(
              state,
              '''    set-lockscreen-show-time)
                  [[ -n ${2:-} ]] || exit 2
                  set_lockscreen_option lockscreen_show_time "$2" 'lockscreen show time'
                  ;;
          ''',
              '''    set-lockscreen-show-logo)
                  [[ -n ${2:-} ]] || exit 2
                  set_lockscreen_option lockscreen_show_logo "$2" 'lockscreen show logo'
                  ;;
              set-lockscreen-show-time)
                  [[ -n ${2:-} ]] || exit 2
                  set_lockscreen_option lockscreen_show_time "$2" 'lockscreen show time'
                  ;;
          ''',
              "show-logo command")
          replace_once(
              state,
              '''    save-lockscreen-layout)
                  [[ -n ${2:-} ]] || exit 2
                  save_lockscreen_layout "$2"
                  ;;
              reset-lockscreen-presentation)
          ''',
              '''    save-lockscreen-layout)
                  [[ -n ${2:-} ]] || exit 2
                  save_lockscreen_layout "$2"
                  ;;
              save-lockscreen-editor)
                  [[ $# -eq 3 ]] || exit 2
                  save_lockscreen_editor "$2" "$3"
                  ;;
              reset-lockscreen-presentation)
          ''',
              "atomic editor command")
          text = state.read_text()
          text = text.replace(
              'set-lockscreen-mouse-interactive <true|false>|set-lockscreen-show-time',
              'set-lockscreen-mouse-interactive <true|false>|set-lockscreen-show-logo <true|false>|set-lockscreen-show-time',
              1)
          text = text.replace(
              'save-lockscreen-layout <json>|reset-lockscreen-presentation',
              'save-lockscreen-layout <json>|save-lockscreen-editor <layout_json> <visibility_json>|reset-lockscreen-presentation',
              1)
          state.write_text(text)

          bar = Path("config/quickshell/awtarchy/BarState.qml")
          replace_once(
              bar,
              '''    readonly property var defaultLockscreenLayout: ({
                  logo: ({ x: 0.50, y: 0.34 }),
                  time: ({ x: 0.50, y: 0.51 }),
                  date: ({ x: 0.50, y: 0.555 }),
                  username: ({ x: 0.50, y: 0.595 }),
                  weather: ({ x: 0.50, y: 0.635 }),
                  password: ({ x: 0.50, y: 0.70 })
              })
          ''',
              '''    readonly property var defaultLockscreenLayout: ({
                  logo: ({ x: 0.50, y: 0.34, scale: 1.0 }),
                  time: ({ x: 0.50, y: 0.51, scale: 1.0 }),
                  date: ({ x: 0.50, y: 0.555, scale: 1.0 }),
                  username: ({ x: 0.50, y: 0.595, scale: 1.0 }),
                  weather: ({ x: 0.50, y: 0.635, scale: 1.0 }),
                  password: ({ x: 0.50, y: 0.70, scale: 1.0 })
              })
          ''',
              "BarState layout defaults")
          replace_once(
              bar,
              '            lockscreen_mouse_interactive: true,\n            lockscreen_show_time: false,\n',
              '            lockscreen_mouse_interactive: true,\n            lockscreen_show_logo: true,\n            lockscreen_show_time: false,\n',
              "BarState logo default")
          replace_once(
              bar,
              '''    function lockscreenShowTime() {
                  return lockscreenBooleanPreference("lockscreen_show_time", false);
              }
          ''',
              '''    function lockscreenShowLogo() {
                  return lockscreenBooleanPreference("lockscreen_show_logo", true);
              }

              function lockscreenShowTime() {
                  return lockscreenBooleanPreference("lockscreen_show_time", false);
              }
          ''',
              "BarState logo reader")
          text = bar.read_text()
          start = text.index("    function lockscreenLayoutPoint(value, fallback, password) {")
          end = text.index("\n    function lockscreenLayout() {", start)
          replacement = '''    function lockscreenLayoutPoint(value, fallback, password) {
                  if (!value || typeof value !== "object" || Array.isArray(value))
                      return ({ x: fallback.x, y: fallback.y, scale: fallback.scale });
                  const x = Number(value.x);
                  const y = Number(value.y);
                  const scale = Number(value.scale === undefined ? 1 : value.scale);
                  const minX = password ? 0.15 : 0.05;
                  const maxX = password ? 0.85 : 0.95;
                  const minY = password ? 0.20 : 0.08;
                  const maxY = password ? 0.86 : 0.92;
                  if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(scale)
                          || x < minX || x > maxX || y < minY || y > maxY
                          || scale < 0.50 || scale > 2.00)
                      return ({ x: fallback.x, y: fallback.y, scale: fallback.scale });
                  return ({ x: x, y: y, scale: scale });
              }
          '''
          bar.write_text(text[:start] + replacement + text[end:])

          lock_shell = Path("config/quickshell/awtarchy-lock/shell.qml")
          replace_once(
              lock_shell,
              '    property bool lockMouseInteractive: true\n    property bool lockShowTime: false\n',
              '    property bool lockMouseInteractive: true\n    property bool lockShowLogo: true\n    property bool lockShowTime: false\n',
              "lock shell logo property")
          replace_once(
              lock_shell,
              '''        return ({
                      logo: ({ x: 0.50, y: 0.34 }),
                      time: ({ x: 0.50, y: 0.51 }),
                      date: ({ x: 0.50, y: 0.555 }),
                      username: ({ x: 0.50, y: 0.595 }),
                      weather: ({ x: 0.50, y: 0.635 }),
                      password: ({ x: 0.50, y: 0.70 })
                  });
          ''',
              '''        return ({
                      logo: ({ x: 0.50, y: 0.34, scale: 1.0 }),
                      time: ({ x: 0.50, y: 0.51, scale: 1.0 }),
                      date: ({ x: 0.50, y: 0.555, scale: 1.0 }),
                      username: ({ x: 0.50, y: 0.595, scale: 1.0 }),
                      weather: ({ x: 0.50, y: 0.635, scale: 1.0 }),
                      password: ({ x: 0.50, y: 0.70, scale: 1.0 })
                  });
          ''',
              "lock shell layout defaults")
          text = lock_shell.read_text()
          start = text.index("    function layoutPoint(value, fallback, password) {")
          end = text.index("\n    function normalizedLayout(value) {", start)
          replacement = '''    function layoutPoint(value, fallback, password) {
                  if (!value || typeof value !== "object" || Array.isArray(value))
                      return ({ x: fallback.x, y: fallback.y, scale: fallback.scale });
                  const x = Number(value.x);
                  const y = Number(value.y);
                  const scale = Number(value.scale === undefined ? 1 : value.scale);
                  const minX = password ? 0.15 : 0.05;
                  const maxX = password ? 0.85 : 0.95;
                  const minY = password ? 0.20 : 0.08;
                  const maxY = password ? 0.86 : 0.92;
                  if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(scale)
                          || x < minX || x > maxX || y < minY || y > maxY
                          || scale < 0.50 || scale > 2.00)
                      return ({ x: fallback.x, y: fallback.y, scale: fallback.scale });
                  return ({ x: x, y: y, scale: scale });
              }
          '''
          lock_shell.write_text(text[:start] + replacement + text[end:])
          replace_once(
              lock_shell,
              '        lockMouseInteractive = true;\n        lockShowTime = false;\n',
              '        lockMouseInteractive = true;\n        lockShowLogo = true;\n        lockShowTime = false;\n',
              "lock shell reset logo")
          replace_once(
              lock_shell,
              '            lockMouseInteractive = normalizedBoolean(parsed.lockscreen_mouse_interactive, true);\n            lockShowTime = normalizedBoolean(parsed.lockscreen_show_time, false);\n',
              '            lockMouseInteractive = normalizedBoolean(parsed.lockscreen_mouse_interactive, true);\n            lockShowLogo = normalizedBoolean(parsed.lockscreen_show_logo, true);\n            lockShowTime = normalizedBoolean(parsed.lockscreen_show_time, false);\n',
              "lock shell load logo")
          replace_once(
              lock_shell,
              '                mouseInteractive: root.lockMouseInteractive\n                showTime: root.lockShowTime\n',
              '                mouseInteractive: root.lockMouseInteractive\n                showLogo: root.lockShowLogo\n                showTime: root.lockShowTime\n',
              "lock shell surface logo")

          surface = Path("config/quickshell/awtarchy-lock/LockSurface.qml")
          replace_once(
              surface,
              '    required property bool mouseInteractive\n    required property bool showTime\n',
              '    required property bool mouseInteractive\n    required property bool showLogo\n    required property bool showTime\n',
              "surface logo property")
          replace_once(
              surface,
              '        mouseInteractive: root.mouseInteractive\n        showTime: root.showTime\n',
              '        mouseInteractive: root.mouseInteractive\n        showLogo: root.showLogo\n        showTime: root.showTime\n',
              "surface scene logo")
          replace_once(
              surface,
              '    readonly property real uiScale: scene.uiScale\n',
              '    readonly property real uiScale: scene.uiScale\n    readonly property real passwordScale: scene.elementScale("password")\n',
              "surface password scale")
          surface_text = surface.read_text()
          surface_text = surface_text.replace(
              'Math.round((24 + maskedCount * 14) * uiScale)',
              'Math.round((24 + maskedCount * 14) * uiScale * passwordScale)', 1)
          surface_text = surface_text.replace(
              'height: Math.round(14 * root.uiScale)',
              'height: Math.round(14 * root.uiScale * root.passwordScale)', 1)
          surface_text = surface_text.replace(
              'spacing: Math.round(7 * root.uiScale)',
              'spacing: Math.round(7 * root.uiScale * root.passwordScale)', 1)
          surface_text = surface_text.replace(
              'width: Math.round(7 * root.uiScale)',
              'width: Math.round(7 * root.uiScale * root.passwordScale)', 1)
          surface_text = surface_text.replace(
              'height: Math.round(10 * root.uiScale)',
              'height: Math.round(10 * root.uiScale * root.passwordScale)', 1)
          surface_text = surface_text.replace(
              'font.pixelSize: Math.round(18 * root.uiScale)',
              'font.pixelSize: Math.round(18 * root.uiScale * root.passwordScale)', 1)
          surface.write_text(surface_text)

          scene = Path("config/quickshell/awtarchy-lock/LockScene.qml")
          replace_once(
              scene,
              '    required property bool mouseInteractive\n    required property bool showTime\n',
              '    required property bool mouseInteractive\n    required property bool showLogo\n    required property bool showTime\n',
              "scene logo property")
          replace_once(
              scene,
              '''    readonly property real passwordCenterX: normalizedX("password", 0.50) * width
              readonly property real passwordCenterY: normalizedY("password", 0.70) * height
              readonly property real passwordWidth: Math.round(320 * uiScale)
              readonly property real passwordHeight: Math.round(42 * uiScale)
          ''',
              '''    readonly property real passwordCenterX: normalizedX("password", 0.50) * width
              readonly property real passwordCenterY: normalizedY("password", 0.70) * height
              readonly property real passwordWidth: Math.round(320 * uiScale * elementScale("password"))
              readonly property real passwordHeight: Math.round(42 * uiScale * elementScale("password"))
          ''',
              "scene password scale")
          replace_once(
              scene,
              '''    function normalizedY(name, fallback) {
                  const point = normalizedPoint(name);
                  const value = point ? Number(point.y) : Number.NaN;
                  return Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : fallback;
              }
          ''',
              '''    function normalizedY(name, fallback) {
                  const point = normalizedPoint(name);
                  const value = point ? Number(point.y) : Number.NaN;
                  return Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : fallback;
              }

              function elementScale(name) {
                  const point = normalizedPoint(name);
                  const value = point ? Number(point.scale === undefined ? 1 : point.scale) : 1;
                  return Number.isFinite(value) ? Math.max(0.50, Math.min(2.00, value)) : 1;
              }
          ''',
              "scene element scale reader")
          replace_once(
              scene,
              '''    function updateClockText() {
                  const now = new Date();
                  timeText = Qt.formatTime(now, Locale.ShortFormat);
                  dateText = Qt.formatDate(now, Locale.LongFormat);
              }
          ''',
              '''    function minuteTimeFormat() {
                  const localeFormat = String(Qt.locale().timeFormat(Locale.ShortFormat) || "");
                  const withoutTrailingSeconds = localeFormat
                      .replace(/([:\\.\-\\s])s{1,2}(?:\\.z{1,3})?/g, "")
                      .replace(/s{1,2}([:\\.\-\\s])/g, "")
                      .replace(/z{1,3}/g, "")
                      .replace(/\\s{2,}/g, " ")
                      .trim();
                  return withoutTrailingSeconds.length > 0 ? withoutTrailingSeconds : "HH:mm";
              }

              function updateClockText() {
                  const now = new Date();
                  timeText = Qt.formatTime(now, minuteTimeFormat());
                  dateText = Qt.formatDate(now, Locale.LongFormat);
              }
          ''',
              "minute-only time")
          replace_once(
              scene,
              '''        Item {
                  id: wordmarkItem
                  x: root.normalizedX("logo", 0.50) * parent.width - width / 2
                  y: root.normalizedY("logo", 0.34) * parent.height - height / 2
                  width: root.wordmarkWidth
                  height: root.wordmarkHeight
          ''',
              '''        Item {
                  id: wordmarkItem
                  visible: root.showLogo
                  x: root.normalizedX("logo", 0.50) * parent.width - width / 2
                  y: root.normalizedY("logo", 0.34) * parent.height - height / 2
                  width: root.wordmarkWidth
                  height: root.wordmarkHeight
                  scale: root.elementScale("logo")
                  transformOrigin: Item.Center
          ''',
              "logo live presentation")
          for name, anchor in (("time", 'visible: root.showTime'), ("date", 'visible: root.showDate'),
                               ("username", 'visible: root.showUsername'),
                               ("weather", 'visible: root.showWeather && root.weatherText.length > 0')):
              replace_once(
                  scene,
                  f'        Text {{\n            {anchor}\n',
                  f'        Text {{\n            {anchor}\n            scale: root.elementScale("{name}")\n            transformOrigin: Item.Center\n',
                  f"{name} live scale")
          text = scene.read_text()
          text = text.replace(
              'width: Math.round(80 * root.uiScale)',
              'width: Math.round(80 * root.uiScale * root.elementScale("password"))', 1)
          text = text.replace(
              'height: Math.round(14 * root.uiScale)',
              'height: Math.round(14 * root.uiScale * root.elementScale("password"))', 1)
          text = text.replace(
              'spacing: Math.round(7 * root.uiScale)',
              'spacing: Math.round(7 * root.uiScale * root.elementScale("password"))', 1)
          text = text.replace(
              'width: Math.round(7 * root.uiScale)',
              'width: Math.round(7 * root.uiScale * root.elementScale("password"))', 1)
          text = text.replace(
              'height: Math.round(10 * root.uiScale)',
              'height: Math.round(10 * root.uiScale * root.elementScale("password"))', 1)
          scene.write_text(text)
          PY

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq shellcheck >/dev/null
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-quickshell-lockscreen-live-editor.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-runtime-services.sh
          bash tests/test-quickshell-lockscreen-weather.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/shell.qml
          git diff --cached --quiet && exit 0
          git commit -m 'Add live lockscreen scale and visibility editing'
          git push origin HEAD:feature/lockscreen-interactive-effects
