name: Temporary legacy cleanup regression

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: Add regression test and verify RED
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test-awtarchy-command.sh')
          text = p.read_text()
          anchor = '''HOME="$home" USER="$(id -un)" AWTARCHY_SKIP_UPDATE_CHECK=1 \\
  "$home/.local/bin/awtarchy" help >/dev/null
'''
          block = r'''

# Legacy awtarchy-quickshell cleanup must not delete the state directory now
# used by the production Quickshell shell. Only the retired command's own
# command-version state should be removed, and cleanup must be idempotent.
cleanup_home="${TMP}/cleanup-home"
mkdir -p \
  "$cleanup_home/.local/bin" \
  "$cleanup_home/.local/share/awtarchy" \
  "$cleanup_home/.local/share/awtarchy-quickshell" \
  "$cleanup_home/.local/state/awtarchy" \
  "$cleanup_home/.local/state/awtarchy-quickshell"
cp "$LAUNCHER_SOURCE" "$cleanup_home/.local/bin/awtarchy"
cp "$RUNTIME_SOURCE" "$cleanup_home/.local/share/awtarchy/awtarchy-runtime.sh"
chmod 0755 "$cleanup_home/.local/bin/awtarchy" "$cleanup_home/.local/share/awtarchy/awtarchy-runtime.sh"
printf '%s\n' \
  '#!/usr/bin/env bash' \
  '# Temporary branch-only maintenance command for the Quickshell migration.' \
  'exit 0' \
  >"$cleanup_home/.local/bin/awtarchy-quickshell"
chmod 0755 "$cleanup_home/.local/bin/awtarchy-quickshell"
printf 'tag=main\nrevision=%s\nupdated_at=2000-01-01T00:00:00Z\n' "$TEST_MAIN_COMMIT" \
  >"$cleanup_home/.local/state/awtarchy/command-version"
printf 'tag=quickshell-conversion-testing\nrevision=%s\n' "$TEST_MAIN_COMMIT" \
  >"$cleanup_home/.local/state/awtarchy-quickshell/command-version"
printf '{"disableNumlockAtSessionStart":true}\n' \
  >"$cleanup_home/.local/state/awtarchy-quickshell/quick-settings-tweaks.json"
printf '%s\n' legacy-runtime >"$cleanup_home/.local/share/awtarchy-quickshell/marker"

cleanup_first_output="$(
  env "${common_test_env[@]}" HOME="$cleanup_home" USER="$(id -un)" \
    "$cleanup_home/.local/bin/awtarchy" self-update
)"
grep -Fq 'Removed obsolete awtarchy-quickshell testing command state.' <<<"$cleanup_first_output" \
  || fail "legacy cleanup did not report the first real removal"
[[ ! -e "$cleanup_home/.local/bin/awtarchy-quickshell" ]] \
  || fail "legacy cleanup did not remove the retired launcher"
[[ ! -e "$cleanup_home/.local/share/awtarchy-quickshell" ]] \
  || fail "legacy cleanup did not remove the retired runtime data"
[[ ! -e "$cleanup_home/.local/state/awtarchy-quickshell/command-version" ]] \
  || fail "legacy cleanup did not remove the retired command state"
assert_file "$cleanup_home/.local/state/awtarchy-quickshell/quick-settings-tweaks.json"

cleanup_second_output="$(
  env "${common_test_env[@]}" HOME="$cleanup_home" USER="$(id -un)" \
    "$cleanup_home/.local/bin/awtarchy" self-update
)"
! grep -Fq 'Removed obsolete awtarchy-quickshell testing command state.' <<<"$cleanup_second_output" \
  || fail "legacy cleanup reported removal again after the retired state was already gone"
assert_file "$cleanup_home/.local/state/awtarchy-quickshell/quick-settings-tweaks.json"
'''
          if anchor not in text:
              raise SystemExit('test anchor missing')
          p.write_text(text.replace(anchor, anchor + block, 1))
          PY
          set +e
          bash tests/test-awtarchy-command.sh > /tmp/red.log 2>&1
          rc=$?
          set -e
          if (( rc == 0 )); then
            echo 'Regression test unexpectedly passed before fix.' >&2
            exit 1
          fi
          grep -Fq 'missing file:' /tmp/red.log || grep -Fq 'reported removal again' /tmp/red.log || {
            cat /tmp/red.log
            echo 'Regression failed for an unexpected reason.' >&2
            exit 1
          }
      - name: Apply minimal fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('local/bin/awtarchy')
          text = p.read_text()
          old = '''cleanup_legacy_quickshell_command() {
  local legacy_launcher="${TARGET_HOME}/.local/bin/awtarchy-quickshell"
  local legacy_data="${DATA_HOME}/awtarchy-quickshell"
  local legacy_state="${STATE_HOME}/awtarchy-quickshell"
  local marker='Temporary branch-only maintenance command for the Quickshell migration.'
  local recognized=0 removed=0

  if [[ -f $legacy_launcher && ! -L $legacy_launcher ]]; then
    if grep -Fq -- "$marker" "$legacy_launcher"; then
      recognized=1
      rm -f -- "$legacy_launcher"
      removed=1
    fi
  elif [[ ! -e $legacy_launcher && ! -L $legacy_launcher ]]; then
    recognized=1
  fi

  if (( recognized == 1 )); then
    if [[ -e $legacy_data || -L $legacy_data ]]; then
      rm -rf -- "$legacy_data"
      removed=1
    fi
    if [[ -e $legacy_state || -L $legacy_state ]]; then
      rm -rf -- "$legacy_state"
      removed=1
    fi
  fi

  (( removed == 0 )) || log "Removed obsolete awtarchy-quickshell testing command state."
}
'''
          new = '''cleanup_legacy_quickshell_command() {
  local legacy_launcher="${TARGET_HOME}/.local/bin/awtarchy-quickshell"
  local legacy_data="${DATA_HOME}/awtarchy-quickshell"
  local legacy_state_dir="${STATE_HOME}/awtarchy-quickshell"
  local legacy_command_state="${legacy_state_dir}/command-version"
  local marker='Temporary branch-only maintenance command for the Quickshell migration.'
  local recognized=0 removed=0

  if [[ -f $legacy_launcher && ! -L $legacy_launcher ]]; then
    if grep -Fq -- "$marker" "$legacy_launcher"; then
      recognized=1
      rm -f -- "$legacy_launcher"
      removed=1
    fi
  elif [[ ! -e $legacy_launcher && ! -L $legacy_launcher ]]; then
    recognized=1
  fi

  if (( recognized == 1 )); then
    if [[ -e $legacy_data || -L $legacy_data ]]; then
      rm -rf -- "$legacy_data"
      removed=1
    fi
    if [[ -f $legacy_command_state && ! -L $legacy_command_state ]]; then
      rm -f -- "$legacy_command_state"
      removed=1
      rmdir -- "$legacy_state_dir" 2>/dev/null || true
    fi
  fi

  (( removed == 0 )) || log "Removed obsolete awtarchy-quickshell testing command state."
}
'''
          if text.count(old) != 1:
              raise SystemExit('cleanup function anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Verify GREEN
        shell: bash
        run: |
          set -euo pipefail
          bash -n local/bin/awtarchy
          bash -n tests/test-awtarchy-command.sh
          shellcheck -e SC2016 tests/test-awtarchy-command.sh
          shellcheck local/bin/awtarchy
          bash tests/test-awtarchy-command.sh
          git diff --check
      - name: Commit tested fix without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-legacy-cleanup.yml
          git add local/bin/awtarchy tests/test-awtarchy-command.sh
          git commit -m 'Preserve Quickshell state during legacy cleanup'
          git push origin HEAD:tmp-fix-legacy-cleanup-20260815
