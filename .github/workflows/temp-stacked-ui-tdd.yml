name: TEMP stacked UI TDD

on:
  pull_request:
    branches:
      - feature/screenshare-guard-controls

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run focused tests
        run: |
          rc=0
          bash tests/test-quicksettings-tips-header.sh || rc=1
          bash tests/test-workspace-bar-visibility.sh || rc=1
          exit "$rc"
