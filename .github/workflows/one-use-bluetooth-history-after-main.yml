name: One-use Bluetooth history after main sync

on:
  push:
    branches: [fix/bluetooth-resume-restore-stability]
    paths:
      - '.github/workflows/one-use-bluetooth-history-after-main.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/bluetooth-resume-restore-stability
          fetch-depth: 0
      - name: Append Bluetooth helper hash
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          entry=$'0f0afc7ea2a3d2a7dd5bd5a209bb5964f9c1692c6ab3efbe81244af9ea431890\t.config/hypr/scripts/quickshell_bluetooth_state.sh'
          grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
      - name: Commit and remove one-use workflow
        run: |
          rm -f .github/workflows/one-use-bluetooth-history-after-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/quickshell-managed-history.sha256 .github/workflows/one-use-bluetooth-history-after-main.yml
          git diff --cached --check
          git commit -m 'Refresh Bluetooth managed history after main sync'
          git push origin HEAD:fix/bluetooth-resume-restore-stability
