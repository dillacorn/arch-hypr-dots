name: Apply PR138 Sudo Cleanup

on:
  push:
    branches: [fix/update-terminal-sudo-disk-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply PR138 sudo cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Remove abandoned sudo keepalive and AUR-only preauthentication
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-package-reconcile.sh')
          text = path.read_text(encoding='utf-8')

          text = text.replace('PACKAGE_SUDO_KEEPALIVE_PID=""\n', '', 1)

          start = text.index('stop_package_privilege_keepalive() {\n')
          end = text.index('root_free_mib() {\n', start)
          text = text[:start] + text[end:]

          old_recovery = '''    if (( EUID == 0 )); then\n      "$paccache_bin" -rk2\n    elif ! sudo -n "$paccache_bin" -rk2; then\n      die "Automatic pacman cache pruning failed after sudo authorization."\n    fi\n'''
          new_recovery = '''    if ! as_root "$paccache_bin" -rk2; then\n      die "Automatic pacman cache pruning failed."\n    fi\n'''
          if text.count(old_recovery) != 1:
              raise SystemExit(f'expected one package paccache auth block, found {text.count(old_recovery)}')
          text = text.replace(old_recovery, new_recovery, 1)

          old_approval = '''confirm_yes_no 'Apply this package plan?' 0 || { log 'Package reconciliation canceled.'; exit 0; }\nrequire_sudo\nstart_package_privilege_keepalive\ntrap stop_package_privilege_keepalive EXIT HUP INT TERM\nrecover_package_disk_headroom\n'''
          new_approval = '''confirm_yes_no 'Apply this package plan?' 0 || { log 'Package reconciliation canceled.'; exit 0; }\nrecover_package_disk_headroom\n'''
          if text.count(old_approval) != 1:
              raise SystemExit(f'expected one package approval preauth block, found {text.count(old_approval)}')
          text = text.replace(old_approval, new_approval, 1)

          old_aur = '''if (( ${#selected_aur[@]} )); then\n  stop_package_privilege_keepalive\n  trap - EXIT HUP INT TERM\n  if (( EUID != 0 )); then\n    sudo -k\n  fi\n  log 'AUR build privilege isolation enabled; makepkg may request sudo independently.'\n'''
          new_aur = '''if (( ${#selected_aur[@]} )); then\n  log 'AUR build privilege isolation enabled; makepkg may request sudo independently.'\n'''
          if text.count(old_aur) != 1:
              raise SystemExit(f'expected one outer AUR sudo block, found {text.count(old_aur)}')
          text = text.replace(old_aur, new_aur, 1)

          text = text.replace('  resume_package_privilege_keepalive\n', '', 1)
          text = text.replace("\nstop_package_privilege_keepalive\ntrap - EXIT HUP INT TERM\n", "\n", 1)

          for forbidden in (
              'PACKAGE_SUDO_KEEPALIVE_PID',
              'start_package_privilege_keepalive',
              'stop_package_privilege_keepalive',
              'resume_package_privilege_keepalive',
          ):
              if forbidden in text:
                  raise SystemExit(f'cleanup left stale sudo keepalive symbol: {forbidden}')

          path.write_text(text, encoding='utf-8')

          launcher = Path('local/bin/awtarchy')
          text = launcher.read_text(encoding='utf-8')
          old = '''      offer_package_reconciliation_before_update "$@"\nensure_update_disk_headroom\nif ! config_release_ready_or_noop "$@"; then\n  return 0\nfi\nrun_runtime update-reset-backup --mode preserve "$@"\nreconcile_quickshell_ui_after_update\n;;\n'''
          new = '''      offer_package_reconciliation_before_update "$@"\n      ensure_update_disk_headroom\n      if ! config_release_ready_or_noop "$@"; then\n        return 0\n      fi\n      run_runtime update-reset-backup --mode preserve "$@"\n      reconcile_quickshell_ui_after_update\n      ;;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed update-arm indentation block, found {text.count(old)}')
          launcher.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/apply-pr138-sudo-cleanup.yml
          rm -f .github/workflows/verify-pr138-cleanup-red.yml
          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n tests/test-awtarchy-update-session.sh
          bash tests/test-awtarchy-update-session.sh
          git diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add local/bin/awtarchy local/share/awtarchy/awtarchy-package-reconcile.sh tests/test-awtarchy-update-session.sh .github/workflows/apply-pr138-sudo-cleanup.yml .github/workflows/verify-pr138-cleanup-red.yml
          git commit -m 'Simplify package sudo boundaries'
          git push origin HEAD:fix/update-terminal-sudo-disk-recovery