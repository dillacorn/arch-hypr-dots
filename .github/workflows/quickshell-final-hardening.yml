name: Quickshell Final Privacy Hardening

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply final privacy hardening
        id: patch
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("config/quickshell/awtarchy/NetworkMenu.qml"); t=p.read_text(); old="    Component.onCompleted: {\n        root.vpnPrivacyAction = \"unlock\";\n"; new="    Component.onCompleted: {\n        networkWindow.visible = false;\n        root.vpnPrivacyAction = \"unlock\";\n"; assert old in t or new in t; p.write_text(t.replace(old,new,1)) if old in t else None'
          python3 -c 'from pathlib import Path; p=Path("config/quickshell/awtarchy/Launcher.qml"); t=p.read_text(); old="                        CaptureEyeButton {\n                    captureAllowed: root.captureAllowed\n                    textSize: 13\n                    onClicked: {\n                        root.toggleCaptureAllowed();\n                        Qt.callLater(() => search.forceActiveFocus());\n                    }\n                }\n"; new="                        CaptureEyeButton {\n                            captureAllowed: root.captureAllowed\n                            textSize: 13\n                            onClicked: {\n                                root.toggleCaptureAllowed();\n                                Qt.callLater(() => search.forceActiveFocus());\n                            }\n                        }\n"; assert old in t or new in t; p.write_text(t.replace(old,new,1)) if old in t else None'

          if git diff --quiet -- config/quickshell/awtarchy/NetworkMenu.qml config/quickshell/awtarchy/Launcher.qml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify focused privacy regression
        if: steps.patch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash tests/test-quickshell-capture-privacy.sh
          git diff --check

      - name: Refresh managed history
        if: steps.patch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          for source in config/quickshell/awtarchy/NetworkMenu.qml config/quickshell/awtarchy/Launcher.qml; do
            managed=".${source#config}"
            hash="$(sha256sum "$source" | awk '{print $1}')"
            line="${hash}	${managed}"
            grep -Fqx -- "$line" "$manifest" || printf '%b\n' "$line" >> "$manifest"
          done

      - name: Commit hardening
        if: steps.patch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy/NetworkMenu.qml config/quickshell/awtarchy/Launcher.qml local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Finish flyout privacy hardening'
          git push origin HEAD:quickshell-conversion-testing
