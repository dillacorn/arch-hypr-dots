name: Final Quickshell QML fixes

on:
  push:
    branches:
      - quickshell-conversion-testing
    paths:
      - '.github/workflows/quickshell-final-qml-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0
      - name: Apply QML fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"missing anchor in {path}: {old[:40]!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          for path in [
              'config/quickshell/awtarchy/Bar.qml',
              'config/quickshell/awtarchy/ClipboardMenu.qml',
          ]:
              p = Path(path)
              text = p.read_text()
              if 'pragma ComponentBehavior: Bound' not in text:
                  text = 'pragma ComponentBehavior: Bound\n\n' + text
              p.write_text(text)

          once(
              'config/quickshell/awtarchy/Launcher.qml',
              '                        required property var modelData\n                        property var entry: modelData\n',
              '                        required property var modelData\n                        required property int index\n                        property var entry: modelData\n',
          )
          once(
              'config/quickshell/awtarchy/Launcher.qml',
              '                                    if (appList.currentItem && appList.currentItem.entry)\n                                        root.launchEntry(appList.currentItem.entry);\n',
              '                                    const values = root.filteredApps();\n                                    if (appList.currentIndex >= 0 && appList.currentIndex < values.length)\n                                        root.launchEntry(values[appList.currentIndex]);\n',
          )
          once(
              'config/quickshell/awtarchy/ThemePicker.qml',
              '                                } else if ((event.key === Qt.Key_Return || event.key === Qt.Key_Enter) && themeList.currentItem) {\n                                    root.choose(themeList.currentItem.themeName);\n                                    event.accepted = true;\n                                }\n',
              '                                } else if (event.key === Qt.Key_Return || event.key === Qt.Key_Enter) {\n                                    const values = root.filteredThemes();\n                                    if (themeList.currentIndex >= 0 && themeList.currentIndex < values.length)\n                                        root.choose(values[themeList.currentIndex]);\n                                    event.accepted = true;\n                                }\n',
          )
          once(
              'config/quickshell/awtarchy/Bar.qml',
              '    Item {\n        id: horizontalLayout\n        anchors.fill: parent\n        visible: !bar.vertical\n',
              '    Item {\n        id: horizontalLayout\n        anchors.fill: parent\n        anchors.leftMargin: 6\n        anchors.rightMargin: 6\n        visible: !bar.vertical\n',
          )
          once(
              'config/quickshell/awtarchy/Bar.qml',
              '                tooltip: "app-launcher"\n                onClicked: Launcher.openForScreen(bar.screen)\n',
              '                tooltip: "app-launcher"\n                hoverBackground: Theme.strongHover\n                onClicked: Launcher.openForScreen(bar.screen)\n',
          )
          once(
              'config/quickshell/awtarchy/Bar.qml',
              '                tooltip: Qt.formatDateTime(bar.now, "dddd, MMMM d, yyyy") + "\\n24h: " + Qt.formatDateTime(bar.now, "HH:mm") + "\\n12h: " + Qt.formatDateTime(bar.now, "h:mm AP")\n                onClicked: bar.clockDate = !bar.clockDate\n',
              '                tooltip: Qt.formatDateTime(bar.now, "dddd, MMMM d, yyyy") + "\\n24h: " + Qt.formatDateTime(bar.now, "HH:mm") + "\\n12h: " + Qt.formatDateTime(bar.now, "h:mm AP")\n                horizontalPadding: 6\n                onClicked: bar.clockDate = !bar.clockDate\n',
          )
          PY
          git diff --check
      - name: Commit fixes
        run: |
          rm .github/workflows/quickshell-final-qml-fixes.yml
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/quickshell/awtarchy .github/workflows/quickshell-final-qml-fixes.yml
          git diff --cached --check
          git commit -m 'Fix Quickshell QML scoping and spacing'
          git push origin HEAD:quickshell-conversion-testing
