name: Apply Stage 3 scxctl Patch

on:
  push:
    branches: [scxctl-passive-status-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: implement sudo-free scxctl status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: scxctl-passive-status-fix
          fetch-depth: 0

      - name: Apply exact Stage 3 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('config/hypr/scripts/hypr_quicksettings_core.sh')
          backend_path = Path('config/hypr/scripts/hypr_quicksettings.sh')
          core = core_path.read_text(encoding='utf-8')
          backend = backend_path.read_text(encoding='utf-8')

          state_old = 'SCHED_EXT_STATE_FILE="${STATE_DIR}/sched_ext_state.sh"\n'
          state_new = state_old + 'SCHED_EXT_AUTH_STATE_FILE="${STATE_DIR}/scxctl_authorized"\n'
          if core.count(state_old) != 1:
              raise SystemExit('expected one scheduler state-file anchor')
          core = core.replace(state_old, state_new, 1)

          auth_anchor = 'sudo_can_run_scxctl_noninteractive() {\n'
          if core.count(auth_anchor) != 1:
              raise SystemExit('expected one sudo authorization function anchor')
          auth_helpers = '''scxctl_auth_state_cached() {
            # UI hint only. Privileged scheduler actions always re-check sudo.
            [[ -f "$SCHED_EXT_AUTH_STATE_FILE" && ! -L "$SCHED_EXT_AUTH_STATE_FILE" ]]
          }

          scxctl_auth_state_mark() {
            local tmp="${SCHED_EXT_AUTH_STATE_FILE}.tmp.$$"

            mkdir -p -- "$STATE_DIR" 2>/dev/null || return 1
            (
              umask 077
              printf '%s\\n' authorized >"$tmp"
            ) || {
              rm -f -- "$tmp"
              return 1
            }
            if ! mv -fT -- "$tmp" "$SCHED_EXT_AUTH_STATE_FILE"; then
              rm -f -- "$tmp"
              return 1
            fi
          }

          scxctl_auth_state_clear() {
            rm -f -- "$SCHED_EXT_AUTH_STATE_FILE" 2>/dev/null || true
          }

          '''
          auth_helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in auth_helpers.splitlines()) + '\n'
          core = core.replace(auth_anchor, auth_helpers + auth_anchor, 1)

          start = core.index('sudo_can_run_scxctl_noninteractive() {\n')
          end = core.index('\nsudoers_included() {', start)
          new_sudo = '''sudo_can_run_scxctl_noninteractive() {
            if ! scxctl_helper_is_safe; then
              scxctl_auth_state_clear
              return 1
            fi
            if (( EUID == 0 )); then
              "$SCXCTL_HELPER" list >/dev/null 2>&1
              return $?
            fi
            if ! have_cmd sudo; then
              scxctl_auth_state_clear
              return 1
            fi
            if sudo -n "$SCXCTL_HELPER" list >/dev/null 2>&1; then
              scxctl_auth_state_mark || true
              return 0
            fi
            scxctl_auth_state_clear
            return 1
          }
          '''
          new_sudo = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_sudo.splitlines()) + '\n'
          core = core[:start] + new_sudo + core[end + 1:]

          cold_old = '''  sudo -k
          if ! sudo -n "$SCXCTL_HELPER" list >/dev/null 2>&1; then
            MSG='sched-ext: sudoers rule installed but unusable'
            return 1
          fi

          MSG='sched-ext: restricted scheduler helper setup complete'
          '''
          cold_old = '\n'.join(line[10:] if line.startswith('          ') else line for line in cold_old.splitlines()) + '\n'
          cold_new = '''  sudo -k
          if ! sudo -n "$SCXCTL_HELPER" list >/dev/null 2>&1; then
            scxctl_auth_state_clear
            MSG='sched-ext: sudoers rule installed but unusable'
            return 1
          fi
          if ! scxctl_auth_state_mark; then
            MSG='sched-ext: authorization succeeded but UI state could not be saved'
            return 1
          fi

          MSG='sched-ext: restricted scheduler helper setup complete'
          '''
          cold_new = '\n'.join(line[10:] if line.startswith('          ') else line for line in cold_new.splitlines()) + '\n'
          if core.count(cold_old) != 1:
              raise SystemExit('expected one post-install sudo cold-test block')
          core = core.replace(cold_old, cold_new, 1)

          capture_start = core.index('scxctl_run_capture() {\n')
          capture_end = core.index('\nsched_ext_deps_ok() {', capture_start)
          capture_new = '''scxctl_run_capture() {
            local out rc=0

            scxctl_helper_is_safe || return 1
            case "${1:-}" in
              get|list)
                out="$(run_capture "$SCXCTL_HELPER" "$@")" || rc=$?
                printf '%s' "$out"
                return "$rc"
                ;;
            esac

            if (( EUID == 0 )); then
              out="$(run_capture "$SCXCTL_HELPER" "$@")" || rc=$?
              printf '%s' "$out"
              return "$rc"
            fi

            if ! sudo_can_run_scxctl_noninteractive; then
              return 1
            fi

            out="$(run_capture sudo -n "$SCXCTL_HELPER" "$@")" || rc=$?
            printf '%s' "$out"
            return "$rc"
          }
          '''
          capture_new = '\n'.join(line[10:] if line.startswith('          ') else line for line in capture_new.splitlines()) + '\n'
          core = core[:capture_start] + capture_new + core[capture_end + 1:]

          status_old = '''  scheduler_authorized=false
          if (( EUID == 0 )) || sudo_can_run_scxctl_noninteractive; then
            scheduler_authorized=true
          fi
          '''
          status_old = '\n'.join(line[10:] if line.startswith('          ') else line for line in status_old.splitlines()) + '\n'
          status_new = '''  scheduler_authorized=false
          if (( EUID == 0 )) || scxctl_auth_state_cached; then
            scheduler_authorized=true
          fi
          '''
          status_new = '\n'.join(line[10:] if line.startswith('          ') else line for line in status_new.splitlines()) + '\n'
          if backend.count(status_old) != 1:
              raise SystemExit('expected one passive scheduler authorization probe')
          backend = backend.replace(status_old, status_new, 1)

          core_path.write_text(core, encoding='utf-8')
          backend_path.write_text(backend, encoding='utf-8')
          PY

          bash -n config/hypr/scripts/hypr_quicksettings_core.sh
          bash -n config/hypr/scripts/hypr_quicksettings.sh
          shellcheck -e SC2015 config/hypr/scripts/hypr_quicksettings_core.sh
          shellcheck -e SC2034,SC2153 config/hypr/scripts/hypr_quicksettings.sh
          bash tests/test-scxctl-auth-stale-rule.sh
          bash tests/test-scxctl-auth-ui.sh
          bash tests/test-security-boundaries.sh
          git diff --check

      - name: Commit Stage 3 patch
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/scripts/hypr_quicksettings_core.sh config/hypr/scripts/hypr_quicksettings.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: implement sudo-free scxctl status'
          git push origin HEAD:scxctl-passive-status-fix
