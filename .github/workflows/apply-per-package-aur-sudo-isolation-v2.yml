name: Apply Per-Package AUR Sudo Isolation v2

on:
  push:
    branches: [fix/update-terminal-sudo-disk-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply per-package AUR sudo isolation v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply per-package sudo invalidation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-package-reconcile.sh')
          text = path.read_text(encoding='utf-8')
          needle = '    log "Installing AUR package through upstream aur-scanner: ${pkg}"\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one aur-scan install marker, found {text.count(needle)}')
          insertion = '    if (( EUID != 0 )); then\n      sudo -k\n    fi\n' + needle
          text = text.replace(needle, insertion, 1)
          path.write_text(text, encoding='utf-8')
          PY

          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash tests/test-awtarchy-update-session.sh
          git diff --check
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-package-reconcile.sh
          git commit -m 'Invalidate sudo before each AUR package'
          git push origin HEAD:fix/update-terminal-sudo-disk-recovery
