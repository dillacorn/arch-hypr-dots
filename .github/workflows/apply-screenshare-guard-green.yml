name: Apply Screen Share Guard integration

on:
  push:
    branches: [feature/screenshare-guard-controls]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Apply integration
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path.cwd()
          history = root / "local/share/awtarchy/quickshell-managed-history.sha256"

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          def remember(path, installed_rel):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              line = f"{digest}\t{installed_rel}\n"
              text = history.read_text()
              if line not in text:
                  if text and not text.endswith("\n"):
                      text += "\n"
                  history.write_text(text + line)

          hypr = root / "config/hypr/hyprland.lua"
          start_marker = "-- ───────────────────────────────────────────────────────────────────────────────\n-- SCREENSHARE GUARD\n-- ───────────────────────────────────────────────────────────────────────────────\n"
          end_marker = "-- ───────────────────────────────────────────────────────────────────────────────\n-- MANUAL SETUP\n-- ───────────────────────────────────────────────────────────────────────────────\n"
          text = hypr.read_text()
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("hyprland.lua Screen Share Guard markers not found")
          replacement = start_marker + '''

          local awtarchy_config_home = os.getenv("XDG_CONFIG_HOME")
          if not awtarchy_config_home or awtarchy_config_home == "" then
              awtarchy_config_home = assert(os.getenv("HOME")) .. "/.config"
          end
          awtarchy_screenshare_guard_v1 = dofile(awtarchy_config_home .. "/hypr/screenshare_guard.lua")
          awtarchy_screenshare_guard_rules_v1 = awtarchy_screenshare_guard_v1.rules

          function awtarchy_screenshare_guard_set_group_v1(target, enabled)
              return awtarchy_screenshare_guard_v1.set_group(target, enabled)
          end

          function awtarchy_screenshare_guard_group_enabled_v1(target)
              return awtarchy_screenshare_guard_v1.group_enabled(target)
          end

          function awtarchy_screenshare_guard_status_v1()
              return awtarchy_screenshare_guard_v1.status()
          end

          '''
          hypr.write_text(text[:start] + replacement + text[end:])

          runtime = root / "config/hypr/scripts/quickshell_runtime_rules.sh"
          remember(runtime, ".config/hypr/scripts/quickshell_runtime_rules.sh")
          replace_once(
              runtime,
              'STATE_FILE="${CACHE_HOME}/awtarchy/quickshell-state.json"\n',
              'STATE_FILE="${CACHE_HOME}/awtarchy/quickshell-state.json"\nSCREENSHARE_GUARD="${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/screenshare_guard.sh"\n',
          )
          replace_once(
              runtime,
              'NETWORK_SENSITIVE_LOCK="${RUNTIME_ROOT}/awtarchy/network-sensitive-capture.lock"\n',
              'NETWORK_SENSITIVE_LOCK="${RUNTIME_ROOT}/awtarchy/network-sensitive-capture.lock"\n\nif [[ -x "$SCREENSHARE_GUARD" ]]; then\n    "$SCREENSHARE_GUARD" apply >/dev/null 2>&1 || true\nfi\n',
          )

          app_state = root / "config/hypr/scripts/quickshell_application_state.sh"
          remember(app_state, ".config/hypr/scripts/quickshell_application_state.sh")
          replace_once(
              app_state,
              '"bar","display-effects","submap"',
              '"bar","display-effects","screen-share-guard","submap"',
          )

          bar_state = root / "config/quickshell/awtarchy/BarState.qml"
          remember(bar_state, ".config/quickshell/awtarchy/BarState.qml")
          replace_once(
              bar_state,
              '        "display-effects",\n        "submap",',
              '        "display-effects",\n        "screen-share-guard",\n        "submap",',
          )

          layout_editor = root / "config/quickshell/awtarchy/QuickSettingsLayoutEditor.qml"
          remember(layout_editor, ".config/quickshell/awtarchy/QuickSettingsLayoutEditor.qml")
          replace_once(
              layout_editor,
              '            "display-effects": "Night Light + Vibrance",\n            "submap": "Hyprland Submap",',
              '            "display-effects": "Night Light + Vibrance",\n            "screen-share-guard": "Screen Share Guard",\n            "submap": "Hyprland Submap",',
          )

          flyout = root / "config/quickshell/awtarchy/FlyoutSettings.qml"
          remember(flyout, ".config/quickshell/awtarchy/FlyoutSettings.qml")
          replace_once(
              flyout,
              '            "display-effects": "Night + Vibrance",\n            "submap": "Submap",',
              '            "display-effects": "Night + Vibrance",\n            "screen-share-guard": "Screen Share Guard",\n            "submap": "Submap",',
          )

          quick = root / "config/quickshell/awtarchy/QuickSettings.qml"
          remember(quick, ".config/quickshell/awtarchy/QuickSettings.qml")
          submap_anchor = '                        Rectangle {\n                            Layout.row: root.quickSettingsSectionRow("submap")\n'
          card = '''                        ScreenShareGuardCard {
                              Layout.row: root.quickSettingsSectionRow("screen-share-guard")
                              visible: root.quickSettingsSectionVisible("screen-share-guard")
                              active: quickSettingsWindow.visible && visible
                              textScale: root.effectiveTextScale
                              iconScale: root.effectiveIconScale
                          }

          '''
          replace_once(quick, submap_anchor, card + submap_anchor)

          card_path = root / "config/quickshell/awtarchy/ScreenShareGuardCard.qml"
          card_text = card_path.read_text()
          first_anchor = '            RowLayout {\n                required property var modelData\n'
          if card_text.count(first_anchor) != 2:
              raise SystemExit("Screen Share Guard card row anchors changed unexpectedly")
          card_text = card_text.replace(
              first_anchor,
              '            RowLayout {\n                id: protectedRow\n                required property var modelData\n',
              1,
          )
          first_pairs = [
              ('parent.parent.modelData.label', 'protectedRow.modelData.label'),
              ('parent.parent.modelData.id', 'protectedRow.modelData.id'),
              ('root.stateLabel(parent.parent.modelData)', 'root.stateLabel(protectedRow.modelData)'),
              ('Boolean(parent.modelData.desired_protected)', 'Boolean(protectedRow.modelData.desired_protected)'),
              ('String(parent.modelData.id)', 'String(protectedRow.modelData.id)'),
              ('Boolean(parent.modelData.locked)', 'Boolean(protectedRow.modelData.locked)'),
          ]
          for old, new in first_pairs:
              if old not in card_text:
                  raise SystemExit(f"protected row replacement missing: {old}")
              card_text = card_text.replace(old, new, 1)
          if first_anchor not in card_text:
              raise SystemExit("optional Screen Share Guard row anchor missing")
          card_text = card_text.replace(
              first_anchor,
              '            RowLayout {\n                id: optionalRow\n                required property var modelData\n',
              1,
          )
          second_pairs = [
              ('parent.parent.modelData.label', 'optionalRow.modelData.label'),
              ('parent.parent.modelData.id', 'optionalRow.modelData.id'),
              ('root.stateLabel(parent.parent.modelData)', 'root.stateLabel(optionalRow.modelData)'),
              ('Boolean(parent.modelData.desired_protected)', 'Boolean(optionalRow.modelData.desired_protected)'),
              ('String(parent.modelData.id)', 'String(optionalRow.modelData.id)'),
              ('Boolean(parent.modelData.locked)', 'Boolean(optionalRow.modelData.locked)'),
          ]
          for old, new in second_pairs:
              if old not in card_text:
                  raise SystemExit(f"optional row replacement missing: {old}")
              card_text = card_text.replace(old, new, 1)
          card_path.write_text(card_text)

          test = root / "tests/test-screenshare-guard-controls.sh"
          replace_once(
              test,
              'HYPR="$ROOT/config/hypr/hyprland.lua"\n',
              'HYPR="$ROOT/config/hypr/hyprland.lua"\nSCREENSHARE_LUA="$ROOT/config/hypr/screenshare_guard.lua"\n',
          )
          test_text = test.read_text()
          old = "require_source \"$HYPR\" ':is_enabled()'"
          new = "require_source \"$SCREENSHARE_LUA\" ':is_enabled()'"
          if test_text.count(old) != 1:
              raise SystemExit("Screen Share Guard is_enabled test anchor changed unexpectedly")
          test_text = test_text.replace(old, new, 1)
          old = "require_source \"$HYPR\" 'screenshare_guard.sh apply'"
          new = "require_source \"$SCREENSHARE_LUA\" 'screenshare_guard.sh apply'"
          if test_text.count(old) != 1:
              raise SystemExit("Screen Share Guard startup test anchor changed unexpectedly")
          test.write_text(test_text.replace(old, new, 1))

          validate = root / ".github/workflows/validate-awtarchy.yml"
          replace_once(
              validate,
              '          bash -n config/hypr/scripts/quickshell_runtime_rules.sh\n',
              '          bash -n config/hypr/scripts/quickshell_runtime_rules.sh\n          bash -n config/hypr/scripts/screenshare_guard.sh\n',
          )
          replace_once(
              validate,
              '          bash -n tests/test-quickshell-capture-privacy.sh\n',
              '          bash -n tests/test-quickshell-capture-privacy.sh\n          bash -n tests/test-screenshare-guard-controls.sh\n',
          )
          replace_once(
              validate,
              '            config/hypr/scripts/quickshell_runtime_rules.sh \\\n',
              '            config/hypr/scripts/quickshell_runtime_rules.sh \\\n            config/hypr/scripts/screenshare_guard.sh \\\n',
          )
          replace_once(
              validate,
              '            tests/test-quickshell-updater-migration.sh \\\n',
              '            tests/test-quickshell-updater-migration.sh \\\n            tests/test-screenshare-guard-controls.sh \\\n',
          )
          replace_once(
              validate,
              '          bash tests/test-quickshell-capture-privacy.sh\n',
              '          bash tests/test-quickshell-capture-privacy.sh\n          bash tests/test-screenshare-guard-controls.sh\n',
          )
          replace_once(
              validate,
              '          test -x config/hypr/scripts/quickshell_sensitive_capture.sh\n',
              '          test -x config/hypr/scripts/quickshell_sensitive_capture.sh\n          test -x config/hypr/scripts/screenshare_guard.sh\n',
          )
          PY
      - name: Validate candidate
        run: |
          bash -n config/hypr/scripts/screenshare_guard.sh
          bash -n config/hypr/scripts/quickshell_runtime_rules.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-screenshare-guard-controls.sh
          shellcheck config/hypr/scripts/screenshare_guard.sh
          shellcheck config/hypr/scripts/quickshell_runtime_rules.sh
          shellcheck tests/test-screenshare-guard-controls.sh
          lua -e 'assert(loadfile("config/hypr/hyprland.lua")); assert(loadfile("config/hypr/screenshare_guard.lua"))'
          bash tests/test-screenshare-guard-controls.sh
          git diff --check
      - name: Commit candidate and remove writer
        run: |
          rm -f .github/workflows/apply-screenshare-guard-green.yml
          git config user.name "dillacorn"
          git config user.email "28743863+dillacorn@users.noreply.github.com"
          git add -A
          git commit -m "Implement Screen Share Guard controls"
          git push origin HEAD:feature/screenshare-guard-controls
