name: Quickshell Privacy Regression

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run capture privacy and Num Lock regression
        run: bash tests/test-quickshell-capture-privacy.sh
