name: One-use Battery Care charge-type guard

on:
  push:
    branches:
      - refactor/tlp-battery-care-thin-client

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Install focused test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4

      - name: Apply and verify charge-type guard
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_parent='959b0b352f7cde2d27529531e321a86b593bdb8e'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            printf 'No-op: expected parent %s, found %s\n' "$expected_parent" "$actual_parent"
            exit 0
          fi

          detector='config/hypr/scripts/quickshell_battery_care.sh'
          history='local/share/awtarchy/quickshell-managed-history.sha256'

          python3 - "$detector" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = '    if range="$(parse_range "$stop_spec" 2>/dev/null)"; then\n'
          new = (
              '    if [[ "$features_lower" != *"charge threshold"* ]]; then\n'
              '        :\n'
              '    elif range="$(parse_range "$stop_spec" 2>/dev/null)"; then\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one detector range gate, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n "$detector"
          shellcheck "$detector"
          bash tests/test-battery-care-detector-profiles.sh

          hash="$(sha256sum "$detector" | awk '{print $1}')"
          rel='.config/hypr/scripts/quickshell_battery_care.sh'
          entry="${hash}"$'\t'"${rel}"
          if ! grep -Fqx -- "$entry" "$history"; then
            printf '%s\t%s\n' "$hash" "$rel" >>"$history"
          fi
          printf 'Battery Care detector SHA-256: %s\n' "$hash"

          aur_scan_fixture_installed=0
          cleanup_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_fixture EXIT
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi

          bash tests/test-quickshell-updater-migration.sh
          git diff --check

          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$detector" "$history" | LC_ALL=C sort)"
          [[ "$changed" == "$expected" ]] || {
            printf 'Unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          }

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- "$detector" "$history"
          git commit -m 'fix: keep charge-type selectors read-only'
          git push origin HEAD:refactor/tlp-battery-care-thin-client
