name: Validate Battery Compatibility Dev

on:
  push:
    branches:
      - hardening/tlp-battery-compatibility
  pull_request:
    paths:
      - 'config/hypr/scripts/quickshell_battery_care.sh'
      - 'config/quickshell/awtarchy/BatteryCareCard.qml'
      - 'local/libexec/awtarchy/power-profile-helper'
      - 'tests/test-battery-care-compatibility.sh'
      - 'tests/test-battery-care-detector-profiles.sh'
      - 'tests/test-battery-care-vendor-semantics.sh'
      - 'tests/test-battery-care-write-gating.sh'
      - '.github/workflows/validate-battery-compatibility-dev.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Battery compatibility syntax
        run: |
          bash -n config/hypr/scripts/quickshell_battery_care.sh
          bash -n local/libexec/awtarchy/power-profile-helper
          bash -n tests/test-battery-care-compatibility.sh
          bash -n tests/test-battery-care-detector-profiles.sh
          bash -n tests/test-battery-care-vendor-semantics.sh
          bash -n tests/test-battery-care-write-gating.sh
      - name: Battery compatibility ShellCheck
        run: |
          shellcheck config/hypr/scripts/quickshell_battery_care.sh
          shellcheck local/libexec/awtarchy/power-profile-helper
          shellcheck tests/test-battery-care-compatibility.sh
          shellcheck tests/test-battery-care-detector-profiles.sh
          shellcheck tests/test-battery-care-vendor-semantics.sh
          shellcheck tests/test-battery-care-write-gating.sh
      - name: Battery compatibility regression
        run: |
          status=0
          for test_file in \
            tests/test-battery-care-compatibility.sh \
            tests/test-battery-care-detector-profiles.sh \
            tests/test-battery-care-vendor-semantics.sh \
            tests/test-battery-care-write-gating.sh
          do
            if ! bash "$test_file"; then
              status=1
            fi
          done
          exit "$status"
