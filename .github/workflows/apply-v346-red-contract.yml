name: Apply v3.4.6 RED Contract

on:
  push:
    branches:
      - release/v3.4.6-flyout-latency
    paths:
      - '.github/workflows/apply-v346-red-contract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Add production flyout refresh regression contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/validate-awtarchy.yml')
          text = workflow.read_text()

          replacements = [
              (
                  '          bash -n tests/test-flyout-runtime-centering.sh\n',
                  '          bash -n tests/test-flyout-runtime-centering.sh\n'
                  '          bash -n tests/test-flyout-open-state-refresh.sh\n',
              ),
              (
                  '            tests/test-flyout-runtime-centering.sh \\\n',
                  '            tests/test-flyout-runtime-centering.sh \\\n'
                  '            tests/test-flyout-open-state-refresh.sh \\\n',
              ),
              (
                  '          bash tests/test-flyout-runtime-centering.sh\n',
                  '          bash tests/test-flyout-runtime-centering.sh\n'
                  '          bash tests/test-flyout-open-state-refresh.sh\n',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'validate-awtarchy anchor count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)

          workflow.write_text(text)

          test = Path('tests/test-flyout-open-state-refresh.sh')
          if test.exists():
              raise SystemExit(f'{test}: already exists')
          test.write_text("""#!/usr/bin/env bash
          set -Eeuo pipefail
          IFS=$'\\n\\t'

          ROOT=\"$(cd -- \"$(dirname -- \"${BASH_SOURCE[0]}\")/..\" && pwd)\"

          fail() {
              printf 'FAIL: %s\\n' \"$*\" >&2
              exit 1
          }

          check_load_saved_view() {
              local path=\"$1\"
              local label=\"$2\"
              local body

              body=\"$(awk '
                  /function loadSavedView\\(targetScreen/ { in_fn = 1 }
                  in_fn { print }
                  in_fn && /^    }$/ { exit }
              ' \"$path\")\"

              [[ -n \"$body\" ]] || fail \"$label loadSavedView() was not found\"
              if grep -Fq 'BarState.refresh();' <<<\"$body\"; then
                  fail \"$label forces BarState.refresh() during every open\"
              fi
          }

          check_load_saved_view \"$ROOT/config/quickshell/awtarchy/ClipboardMenu.qml\" 'Clipboard'
          check_load_saved_view \"$ROOT/config/quickshell/awtarchy/QuickSettings.qml\" 'Quick Settings'
          check_load_saved_view \"$ROOT/config/quickshell/awtarchy/NetworkMenu.qml\" 'Network'
          check_load_saved_view \"$ROOT/config/quickshell/awtarchy/BluetoothMenu.qml\" 'Bluetooth'
          check_load_saved_view \"$ROOT/config/quickshell/awtarchy/BatteryMenu.qml\" 'Battery'
          check_load_saved_view \"$ROOT/config/quickshell/awtarchy/Notifications.qml\" 'Notifications'

          printf '%s\\n' 'PASS: flyout open paths reuse watched BarState without forced refreshes.'
          """.replace('          ', ''))
          PY

          git diff --check
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add .github/workflows/validate-awtarchy.yml tests/test-flyout-open-state-refresh.sh
          git commit -m 'Guard flyout open state reuse'
          git push origin HEAD:release/v3.4.6-flyout-latency
