name: Validate Theme Revamp

on:
  push:
    branches: [feature/theme-revamp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Register managed theme hashes
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          changed=0
          while IFS='|' read -r file rel; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            entry="${hash}"$'\t'"${rel}"
            if ! grep -Fxq "$entry" "$history"; then
              printf '%s\n' "$entry" >>"$history"
              changed=1
            fi
          done <<'EOF'
          config/quickshell/awtarchy/ThemePicker.qml|.config/quickshell/awtarchy/ThemePicker.qml
          config/hypr/scripts/quickshell_theme_catalog.sh|.config/hypr/scripts/quickshell_theme_catalog.sh
          EOF

          if (( changed == 1 )); then
            git config user.name 'dillacorn'
            git config user.email '28743863+dillacorn@users.noreply.github.com'
            git add "$history"
            git commit -m 'Register visual theme browser history'
            git push origin HEAD:feature/theme-revamp
          fi
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Theme catalog and picker tests
        run: |
          bash -n config/hypr/scripts/quickshell_theme_catalog.sh
          bash -n tests/test-quickshell-theme-catalog.sh
          bash -n tests/test-quickshell-theme-picker.sh
          shellcheck config/hypr/scripts/quickshell_theme_catalog.sh tests/test-quickshell-theme-catalog.sh tests/test-quickshell-theme-picker.sh
          bash tests/test-quickshell-theme-catalog.sh
          bash tests/test-quickshell-theme-picker.sh
