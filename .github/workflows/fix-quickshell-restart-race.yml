name: Fix Quickshell restart race

on:
  push:
    paths:
      - .github/workflows/fix-quickshell-restart-race.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 2

      - name: Verify guarded staging commit
        shell: bash
        run: |
          set -euo pipefail
          expected=e6ba27632fe41b07c24639c63dc7442b02bdf43d
          actual="$(git rev-parse HEAD^)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected parent %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Verify restart race exists
        shell: bash
        run: |
          set -euo pipefail
          manager=config/hypr/scripts/quickshell.sh
          grep -Fq 'qs -c "$CONFIG_NAME" kill >/dev/null 2>&1 || true' "$manager"
          grep -Fq 'wait_for_shell_stop && return 0' "$manager"
          ! grep -Fq 'wait_for_pids_stop' "$manager"
          printf 'RED confirmed: stop waits only on IPC visibility, not old process exit\n'

      - name: Apply restart race fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("config/hypr/scripts/quickshell.sh")
          text = path.read_text(encoding="utf-8")

          old = '''wait_for_shell_stop() {\n    for _ in {1..100}; do\n        if ! is_running; then\n            return 0\n        fi\n        sleep 0.05\n    done\n\n    return 1\n}\n'''
          new = '''instance_pids() {\n    qs -c "$CONFIG_NAME" list --json 2>/dev/null \\\n        | jq -r '.[] | .pid | select(type == "number" and . > 0)' 2>/dev/null\n}\n\nwait_for_pids_stop() {\n    local pid alive\n    local -a pids=("$@")\n\n    for _ in {1..100}; do\n        alive=0\n        for pid in "${pids[@]}"; do\n            if kill -0 "$pid" 2>/dev/null; then\n                alive=1\n                break\n            fi\n        done\n        (( alive == 0 )) && return 0\n        sleep 0.05\n    done\n\n    return 1\n}\n'''
          if text.count(old) != 1:
              raise SystemExit("wait_for_shell_stop block mismatch")
          text = text.replace(old, new, 1)

          old = '''stop_shell() {\n    if ! is_running; then\n        return 0\n    fi\n\n    # Explicit stop/restart operations need the instance gone before the new\n    # QML tree can start. The IPC Qt.quit() path routinely leaves the endpoint\n    # alive until the full timeout, while the config-scoped Quickshell kill\n    # command is the existing reliable fallback. Use it immediately.\n    for _ in {1..3}; do\n        qs -c "$CONFIG_NAME" kill >/dev/null 2>&1 || true\n        wait_for_shell_stop && return 0\n    done\n\n    printf 'quickshell.sh: Quickshell did not stop cleanly\\n' >&2\n    return 1\n}\n'''
          new = '''stop_shell() {\n    local pid\n    local -a pids=()\n\n    mapfile -t pids < <(instance_pids)\n    (( ${#pids[@]} > 0 )) || return 0\n\n    # Quickshell's kill command is an IPC shutdown request. Target each exact\n    # old PID, then wait for those processes to really exit before starting a\n    # replacement. IPC can disappear slightly before Qt/Wayland teardown is\n    # complete, and starting the new instance in that gap can race the old one.\n    for pid in "${pids[@]}"; do\n        qs kill --pid "$pid" >/dev/null 2>&1 || true\n    done\n\n    wait_for_pids_stop "${pids[@]}" && return 0\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n}\n'''
          if text.count(old) != 1:
              raise SystemExit("stop_shell block mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test-quickshell-production-readiness.sh")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''assert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs -c "$CONFIG_NAME" kill'\n'''
          replacement = '''assert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs kill --pid "$pid"'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs -c "$CONFIG_NAME" list --json'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'wait_for_pids_stop "${pids[@]}"'\nassert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'wait_for_shell_stop'\n'''
          if tests.count(marker) != 1:
              raise SystemExit("production readiness Quickshell stop marker mismatch")
          test_path.write_text(tests.replace(marker, replacement, 1), encoding="utf-8")
          PY

      - name: Refresh managed history
        shell: bash
        run: |
          set -euo pipefail
          manifest=local/share/awtarchy/quickshell-managed-history.sha256
          hash="$(sha256sum config/hypr/scripts/quickshell.sh | awk '{print $1}')"
          {
            printf '\n# 2026-08-14 PID-safe Quickshell restart\n'
            printf '%s\t.config/hypr/scripts/quickshell.sh\n' "$hash"
          } >> "$manifest"

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          bash tests/test-quickshell-production-readiness.sh
          grep -Fq 'qs kill --pid "$pid"' config/hypr/scripts/quickshell.sh
          grep -Fq 'wait_for_pids_stop "${pids[@]}"' config/hypr/scripts/quickshell.sh
          ! grep -Fq 'wait_for_shell_stop' config/hypr/scripts/quickshell.sh

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell.sh \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-quickshell-production-readiness.sh
          git commit -m 'Fix Quickshell restart race'
          git push origin HEAD:main
