name: Refresh v3.0.0 sched-ext patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-v3-sched-ext.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Refresh existing release and self-clean
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          release_json="$(mktemp)"
          body_file="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" >"$release_json"
          test "$(jq -r '.id' "$release_json")" = '370945153'
          test "$(jq -r '.name' "$release_json")" = 'Awtarchy v3.0.0 Quickshell'
          jq -r '.body // ""' "$release_json" >"$body_file"

          bullet='- Fixed sched-ext Quick Settings preset forwarding so validated scheduler arguments are passed to `scxctl` as a single `--args=VALUE` token, restoring argument-bearing profiles for Bpfland, Cosmos, Flash, LAVD, P2DQ, and Tickless.'
          if ! grep -Fqx -- "$bullet" "$body_file"; then
            printf '\n%s\n' "$bullet" >>"$body_file"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-v3-sched-ext.yml
          git commit -m 'Finalize v3.0.0 sched-ext patch'
          git push origin HEAD:main

          final_sha="$(git rev-parse HEAD)"
          git tag -f v3.0.0 "$final_sha"
          git push origin refs/tags/v3.0.0 --force

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/370945153" \
            -f tag_name='v3.0.0' \
            -f target_commitish="$final_sha" \
            -f name='Awtarchy v3.0.0 Quickshell' \
            -F draft=false \
            -F prerelease=false \
            -f body="$(cat "$body_file")" \
            >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" --jq '.id')" = '370945153'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.0.0" --jq '.name')" = 'Awtarchy v3.0.0 Quickshell'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.0.0" --jq '.object.sha')" = "$final_sha"
