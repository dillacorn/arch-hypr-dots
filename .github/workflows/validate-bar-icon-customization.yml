name: Validate Bar Icon Customization

on:
  push:
    branches: [feature/bar-icon-customization]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bar-icon-customization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck
      - name: Integrate permanent CI coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/validate-awtarchy.yml')
          text = path.read_text(encoding='utf-8')
          if 'test-bar-icon-customization.sh' not in text:
              replacements = [
                  (
                      '          bash -n tests/test-bar-control-actions.sh\n'
                      '          bash -n tests/test-bar-wheel-input.sh',
                      '          bash -n tests/test-bar-control-actions.sh\n'
                      '          bash -n tests/test-bar-icon-customization.sh\n'
                      '          bash -n tests/test-bar-wheel-input.sh',
                  ),
                  (
                      '            tests/test-bar-control-actions.sh \\\n'
                      '            tests/test-bar-wheel-input.sh \\',
                      '            tests/test-bar-control-actions.sh \\\n'
                      '            tests/test-bar-icon-customization.sh \\\n'
                      '            tests/test-bar-wheel-input.sh \\',
                  ),
                  (
                      '          bash tests/test-bar-control-actions.sh\n'
                      '          bash tests/test-bar-wheel-input.sh',
                      '          bash tests/test-bar-control-actions.sh\n'
                      '          bash tests/test-bar-icon-customization.sh\n'
                      '          bash tests/test-bar-wheel-input.sh',
                  ),
              ]
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected one permanent-CI insertion point: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- .github/workflows/validate-awtarchy.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/validate-awtarchy.yml
            git commit -m 'Validate bar icon customization'
            git push origin HEAD:feature/bar-icon-customization
          fi
      - name: Focused syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-bar-icon-customization.sh
          shellcheck tests/test-bar-icon-customization.sh
      - name: Focused regression
        run: bash tests/test-bar-icon-customization.sh
      - name: Quickshell production readiness
        run: bash tests/test-quickshell-production-readiness.sh
      - name: Quickshell updater migration
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Branch diff whitespace
        run: git diff --check origin/main...HEAD
