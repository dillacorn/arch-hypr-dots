name: Validate Bar Icon Customization

on:
  push:
    branches: [feature/bar-icon-customization]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bar-icon-customization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck
      - name: Apply scroll-safe icon editor placement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          quick = Path('config/quickshell/awtarchy/QuickSettings.qml')
          text = quick.read_text(encoding='utf-8')

          if 'property bool barIconEditorOpen: false' not in text:
              marker = '    property bool layoutEditorOpen: false\n'
              if text.count(marker) != 1:
                  raise SystemExit('expected one Quick Settings editor-state insertion point')
              text = text.replace(
                  marker,
                  marker + '    property bool barIconEditorOpen: false\n',
                  1,
              )

          if 'label: "Customize Icons…"' not in text:
              marker = (
                  '                            }\n'
                  '                        }\n\n'
                  '                        RowLayout {\n'
                  '                            id: nightLightVibranceRow'
              )
              if text.count(marker) != 1:
                  raise SystemExit('expected one scrolling Bar-section insertion point')
              replacement = (
                  '                                SettingsButton {\n'
                  '                                    Layout.fillWidth: true\n'
                  '                                    label: "Customize Icons…"\n'
                  '                                    active: root.barIconEditorOpen\n'
                  '                                    textSize: root.scaledText(9)\n'
                  '                                    onClicked: {\n'
                  '                                        root.barIconEditorOpen = !root.barIconEditorOpen;\n'
                  '                                        if (root.bottomEdgeLayout)\n'
                  '                                            Qt.callLater(() => root.alignContentToBar());\n'
                  '                                    }\n'
                  '                                }\n\n'
                  '                                BarIconSettings {\n'
                  '                                    Layout.fillWidth: true\n'
                  '                                    visible: root.barIconEditorOpen\n'
                  '                                }\n'
                  '                            }\n'
                  '                        }\n\n'
                  '                        RowLayout {\n'
                  '                            id: nightLightVibranceRow'
              )
              text = text.replace(marker, replacement, 1)

          quick.write_text(text, encoding='utf-8')

          bar_settings = Path('config/quickshell/awtarchy/BarSettingsSection.qml')
          text = bar_settings.read_text(encoding='utf-8')
          hosted = (
              '\n            BarIconSettings {\n'
              '                Layout.fillWidth: true\n'
              '            }\n'
          )
          if hosted in text:
              if text.count(hosted) != 1:
                  raise SystemExit('unexpected duplicate BarIconSettings host')
              text = text.replace(hosted, '', 1)
          bar_settings.write_text(text, encoding='utf-8')
          PY

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for repo_path in \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/Bar.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/quickshell/awtarchy/BarIconSettings.qml \
            config/quickshell/awtarchy/QuickSettings.qml
          do
            hash="$(sha256sum "$repo_path" | awk '{print $1}')"
            entry="${hash}"$'\t'".${repo_path}"
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          done

          if ! git diff --quiet -- \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              config/quickshell/awtarchy/QuickSettings.qml \
              config/quickshell/awtarchy/BarSettingsSection.qml \
              local/share/awtarchy/quickshell-managed-history.sha256
            git commit -m 'Keep bar icon editor scrollable'
            git push origin HEAD:feature/bar-icon-customization
          fi
      - name: Focused syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-bar-icon-customization.sh
          shellcheck tests/test-bar-icon-customization.sh
      - name: Focused regression
        run: bash tests/test-bar-icon-customization.sh
      - name: Quickshell production readiness
        run: bash tests/test-quickshell-production-readiness.sh
      - name: Quickshell updater migration
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Branch diff whitespace
        run: git diff --check origin/main...HEAD
