name: Apply Launcher Capture Eye

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch launcher capture control
        id: patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('config/quickshell/awtarchy/Launcher.qml')
          text = path.read_text()

          if 'CaptureEyeButton {' in text:
              print('Launcher eye already applied.')
              raise SystemExit(0)

          settings_marker = '                        Rectangle {\n                            Layout.preferredWidth: 28\n                            Layout.preferredHeight: 26\n                            color: root.settingsOpen'
          next_settings = text.find(settings_marker)
          if next_settings < 0:
              raise SystemExit('Launcher settings control marker missing')

          eye = '''                        CaptureEyeButton {
                              captureAllowed: root.captureAllowed
                              textSize: 13
                              onClicked: {
                                  root.toggleCaptureAllowed();
                                  Qt.callLater(() => search.forceActiveFocus());
                              }
                          }

          '''
          text = text[:next_settings] + eye + text[next_settings:]

          capture_label = '                                text: "Allow in screenshots and screen recordings"\n'
          label_at = text.find(capture_label)
          if label_at < 0:
              raise SystemExit('Launcher buried capture row missing')
          row_start = text.rfind('                        RowLayout {\n', 0, label_at)
          next_row = text.find('                        RowLayout {\n', label_at)
          if row_start < 0 or next_row < 0:
              raise SystemExit('Launcher capture row bounds missing')
          text = text[:row_start] + text[next_row:]

          old_height = '                        ? (root.copySettingsOpen ? 108 : 170) : 0\n'
          new_height = '                        ? (root.copySettingsOpen ? 108 : 139) : 0\n'
          if text.count(old_height) != 1:
              raise SystemExit('Launcher settings height marker changed')
          text = text.replace(old_height, new_height, 1)
          path.write_text(text)
          PY

          if git diff --quiet -- config/quickshell/awtarchy/Launcher.qml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify launcher regression
        if: steps.patch.outputs.changed == 'true'
        run: bash tests/test-quickshell-capture-privacy.sh

      - name: Refresh launcher managed history
        if: steps.patch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          hash="$(sha256sum config/quickshell/awtarchy/Launcher.qml | awk '{print $1}')"
          line="${hash}	.config/quickshell/awtarchy/Launcher.qml"
          grep -Fqx -- "$line" "$manifest" || printf '%b\n' "$line" >> "$manifest"

      - name: Commit launcher capture eye
        if: steps.patch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/quickshell/awtarchy/Launcher.qml local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Add launcher capture indicator'
          git push origin HEAD:quickshell-conversion-testing
