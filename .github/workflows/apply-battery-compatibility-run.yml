name: Apply Battery Compatibility Run

on:
  push:
    branches:
      - hardening/tlp-battery-compatibility
    paths:
      - '.github/battery-compatibility-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Apply permanent CI and managed-history updates
        run: python3 .github/scripts/finalize-battery-compatibility-dev.py
      - name: Verify focused battery behavior
        run: |
          sudo bash tests/test-battery-care-control.sh
          bash tests/test-battery-care-compatibility.sh
          bash tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-care-vendor-semantics.sh
          bash tests/test-battery-care-write-gating.sh
          bash tests/test-battery-charge-limit-detection.sh
          bash tests/test-battery-care-annotated-range.sh
          bash tests/test-battery-care-thinkpad-readback.sh
          bash tests/test-battery-care-multibattery.sh
          bash tests/test-battery-health-fallback.sh
          bash tests/test-power-profile-helper-update.sh
          bash tests/test-power-profile-inline-auth.sh
      - name: Verify updater migration behavior
        run: |
          aur_scan_fixture_installed=0
          cleanup_aur_scan_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_aur_scan_fixture EXIT
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi
          bash tests/test-quickshell-updater-migration.sh
          cleanup_aur_scan_fixture
          aur_scan_fixture_installed=0
          trap - EXIT
          bash tests/test-quickshell-updater-bootstrap.sh
      - name: Verify syntax, ShellCheck, history, and diff integrity
        run: |
          bash -n config/hypr/scripts/quickshell_battery_care.sh
          bash -n local/libexec/awtarchy/power-profile-helper
          bash -n tests/test-battery-care-control.sh
          bash -n tests/test-battery-care-compatibility.sh
          bash -n tests/test-battery-care-detector-profiles.sh
          bash -n tests/test-battery-care-vendor-semantics.sh
          bash -n tests/test-battery-care-write-gating.sh
          shellcheck config/hypr/scripts/quickshell_battery_care.sh
          shellcheck local/libexec/awtarchy/power-profile-helper
          shellcheck tests/test-battery-care-compatibility.sh
          shellcheck tests/test-battery-care-detector-profiles.sh
          shellcheck tests/test-battery-care-vendor-semantics.sh
          shellcheck tests/test-battery-care-write-gating.sh
          shellcheck -e SC2016 tests/test-battery-care-control.sh
          detector_hash="$(sha256sum config/hypr/scripts/quickshell_battery_care.sh | awk '{print $1}')"
          card_hash="$(sha256sum config/quickshell/awtarchy/BatteryCareCard.qml | awk '{print $1}')"
          grep -Fxq "${detector_hash}	.config/hypr/scripts/quickshell_battery_care.sh" local/share/awtarchy/quickshell-managed-history.sha256
          grep -Fxq "${card_hash}	.config/quickshell/awtarchy/BatteryCareCard.qml" local/share/awtarchy/quickshell-managed-history.sha256
          grep -Fq 'bash tests/test-battery-care-compatibility.sh' .github/workflows/validate-awtarchy.yml
          grep -Fq 'bash tests/test-battery-care-detector-profiles.sh' .github/workflows/validate-awtarchy.yml
          grep -Fq 'bash tests/test-battery-care-vendor-semantics.sh' .github/workflows/validate-awtarchy.yml
          grep -Fq 'bash tests/test-battery-care-write-gating.sh' .github/workflows/validate-awtarchy.yml
          git diff --check
      - name: Remove temporary development automation and commit final branch state
        run: |
          rm -f -- \
            .github/workflows/apply-battery-compatibility-dev.yml \
            .github/workflows/apply-battery-compatibility-run.yml \
            .github/workflows/validate-battery-compatibility-dev.yml \
            .github/scripts/apply-battery-compatibility-dev.py \
            .github/scripts/apply-battery-compatibility-dev-v2.py \
            .github/scripts/finalize-battery-compatibility-dev.py \
            .github/battery-compatibility-trigger
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test: complete TLP battery compatibility coverage'
          git push origin HEAD:hardening/tlp-battery-compatibility
