name: Apply Battery Compatibility Run

on:
  push:
    branches:
      - hardening/tlp-battery-compatibility
    paths:
      - '.github/battery-compatibility-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-battery-compatibility-dev.py
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Verify focused battery behavior
        run: |
          sudo bash tests/test-battery-care-control.sh
          bash tests/test-battery-care-compatibility.sh
          bash tests/test-battery-care-vendor-semantics.sh
          bash tests/test-battery-care-write-gating.sh
          bash tests/test-battery-charge-limit-detection.sh
          bash tests/test-battery-care-annotated-range.sh
          bash tests/test-battery-care-thinkpad-readback.sh
          bash tests/test-battery-care-multibattery.sh
      - name: Verify syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/quickshell_battery_care.sh
          bash -n local/libexec/awtarchy/power-profile-helper
          bash -n tests/test-battery-care-control.sh
          bash -n tests/test-battery-care-compatibility.sh
          bash -n tests/test-battery-care-vendor-semantics.sh
          bash -n tests/test-battery-care-write-gating.sh
          shellcheck config/hypr/scripts/quickshell_battery_care.sh
          shellcheck local/libexec/awtarchy/power-profile-helper
          shellcheck tests/test-battery-care-compatibility.sh
          shellcheck tests/test-battery-care-vendor-semantics.sh
          shellcheck tests/test-battery-care-write-gating.sh
          shellcheck -e SC2016 tests/test-battery-care-control.sh
      - name: Commit implementation
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/hypr/scripts/quickshell_battery_care.sh \
            config/quickshell/awtarchy/BatteryCareCard.qml \
            local/libexec/awtarchy/power-profile-helper \
            tests/test-battery-care-control.sh
          git diff --cached --check
          git commit -m 'fix: harden TLP battery compatibility semantics'
          git push origin HEAD:hardening/tlp-battery-compatibility
