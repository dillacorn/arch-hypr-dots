name: Apply Lockscreen Design Contract Refresh

on:
  push:
    branches: [feature/quickshell-lockscreen]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage lockscreen design contract refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quickshell-lockscreen
      - name: Refresh exact lockscreen design contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-quickshell-lockscreen-foundation.sh')
          text = path.read_text()
          old = '''require_text "$SURFACE_QML" 'text: "── AWTARCHY ──"' \\
              'lock surface does not use the compact TUI-style Awtarchy heading'
          '''
          new = '''require_text "$SURFACE_QML" '▄▄▄· ▄▄▌ ▐ ▄▌▄▄▄▄▄ ▄▄▄· ▄▄▄' \\
              'lock surface does not use the approved large Option-B ASCII Awtarchy wordmark'
          reject_text "$SURFACE_QML" 'text: "── AWTARCHY ──"' \\
              'lock surface still uses the retired compact Awtarchy heading'
          '''
          if old not in text:
              raise SystemExit('expected compact-heading contract not found')
          path.write_text(text.replace(old, new))
          PY

          rm -f .github/workflows/apply-lockscreen-design-contract-refresh.yml
      - name: Verify focused lockscreen contracts
        run: |
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
      - name: Commit contract refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-quickshell-lockscreen-foundation.sh .github/workflows/apply-lockscreen-design-contract-refresh.yml
          git commit -m 'Align lockscreen design contracts'
          git push origin HEAD:feature/quickshell-lockscreen
