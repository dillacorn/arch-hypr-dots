name: Waybar event-driven checks

on:
  push:
    paths:
      - "awtarchy-install.sh"
      - "local/bin/awtarchy"
      - "local/share/awtarchy/awtarchy-runtime.sh"
      - "config/waybar/config"
      - "config/waybar/scripts/ddc_brightness.sh"
      - "config/waybar/scripts/ddc_brightness_vertical.sh"
      - "config/waybar/scripts/idle_inhibitor_global.sh"
      - "config/hypr/scripts/dim_display.sh"
      - "config/hypr/scripts/restore_brightness.sh"
      - "config/ddcutil/ddcutilrc"
      - ".github/workflows/waybar-event-driven-checks.yml"
  pull_request:
    paths:
      - "awtarchy-install.sh"
      - "local/bin/awtarchy"
      - "local/share/awtarchy/awtarchy-runtime.sh"
      - "config/waybar/config"
      - "config/waybar/scripts/ddc_brightness.sh"
      - "config/waybar/scripts/ddc_brightness_vertical.sh"
      - "config/waybar/scripts/idle_inhibitor_global.sh"
      - "config/hypr/scripts/dim_display.sh"
      - "config/hypr/scripts/restore_brightness.sh"
      - "config/ddcutil/ddcutilrc"
      - ".github/workflows/waybar-event-driven-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Validate shell syntax
        run: |
          bash -n awtarchy-install.sh
          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n config/waybar/scripts/ddc_brightness.sh
          bash -n config/waybar/scripts/ddc_brightness_vertical.sh
          bash -n config/waybar/scripts/idle_inhibitor_global.sh
          bash -n config/hypr/scripts/dim_display.sh
          bash -n config/hypr/scripts/restore_brightness.sh

      - name: Run ShellCheck errors
        run: |
          shellcheck -S error \
            config/waybar/scripts/ddc_brightness.sh \
            config/waybar/scripts/ddc_brightness_vertical.sh \
            config/waybar/scripts/idle_inhibitor_global.sh \
            config/hypr/scripts/dim_display.sh \
            config/hypr/scripts/restore_brightness.sh

      - name: Validate event-driven Waybar config
        run: |
          jq -e '
            .[0]["custom/idle_inhibitor"] as $idle
            | .[0]["custom/ddc-brightness"] as $ddc
            | ($idle.interval == "once")
            and ($idle.signal == 13)
            and ($idle["exec-on-event"] == false)
            and ($ddc.exec | endswith("ddc_brightness.sh watch"))
            and ($ddc["exec-on-event"] == false)
            and (($ddc | has("interval")) | not)
            and (($ddc | has("signal")) | not)
          ' config/waybar/config >/dev/null

          grep -Fxq 'options: --syslog never' config/ddcutil/ddcutilrc

      - name: Validate ddcutil config deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("local/share/awtarchy/awtarchy-runtime.sh").read_text(encoding="utf-8")
          installer = "local -a config_dirs=(hypr waybar alacritty wlogout mako wofi fuzzel gtk-3.0 Kvantum SpeedCrunch fastfetch pcmanfm-qt yazi xdg-desktop-portal qt5ct qt6ct lsfg-vk wiremix cava micro ddcutil)"
          updater_find = 'done < <(find "${repo_dir}/config" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)'
          updater_copy = 'cp -a --no-preserve=ownership -- "${config_dir}/." "${target_home}/.config/${d}/"'

          if installer not in text:
              raise SystemExit("fresh installer does not deploy config/ddcutil")
          if updater_find not in text or updater_copy not in text:
              raise SystemExit("update/reset path does not dynamically deploy config directories")
          PY

      - name: Verify cached status avoids DDC access
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/cache/hypr-ddc-brightness" "$tmp/bin"

          now_ms="$(date +%s%3N)"
          printf '42\t100\t%s\n' "$now_ms" > "$tmp/cache/hypr-ddc-brightness/state_DP-1.tsv"

          cat > "$tmp/bin/fake-brightness" <<'SH'
          #!/usr/bin/env bash
          : > "${DDC_CALLED_MARKER:?}"
          exit 1
          SH
          chmod +x "$tmp/bin/fake-brightness"

          output="$(
            WAYBAR_OUTPUT_NAME=DP-1 \
            XDG_CACHE_HOME="$tmp/cache" \
            HYPR_BRIGHTNESS_SCRIPT="$tmp/bin/fake-brightness" \
            DDC_CALLED_MARKER="$tmp/ddc-called" \
              config/waybar/scripts/ddc_brightness.sh status
          )"

          jq -e '.text == " 42" and .percentage == 42' <<<"$output" >/dev/null
          test ! -e "$tmp/ddc-called"

      - name: Verify concurrent startup performs one DDC query
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/cache/hypr-ddc-brightness" "$tmp/bin"
          printf '0\n' > "$tmp/query-count"

          cat > "$tmp/bin/fake-brightness" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          exec 9>"${QUERY_COUNT_LOCK:?}"
          flock -x 9
          read -r count < "${QUERY_COUNT_FILE:?}"
          printf '%s\n' "$((count + 1))" > "$QUERY_COUNT_FILE"
          flock -u 9
          exec 9>&-

          sleep 0.25
          now_ms="$(date +%s%3N)"
          printf '44\t100\t%s\n' "$now_ms" > "${STATE_FILE:?}.tmp"
          mv -f "$STATE_FILE.tmp" "$STATE_FILE"
          printf 'conn=DP-1\ncur=44\nmax=100\nbus=3\n'
          SH
          chmod +x "$tmp/bin/fake-brightness"

          pids=()
          for output in one two; do
            WAYBAR_OUTPUT_NAME=DP-1 \
            XDG_CACHE_HOME="$tmp/cache" \
            HYPR_BRIGHTNESS_SCRIPT="$tmp/bin/fake-brightness" \
            QUERY_COUNT_FILE="$tmp/query-count" \
            QUERY_COUNT_LOCK="$tmp/query-count.lock" \
            STATE_FILE="$tmp/cache/hypr-ddc-brightness/state_DP-1.tsv" \
              config/waybar/scripts/ddc_brightness.sh status > "$tmp/$output.json" &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          test "$(cat "$tmp/query-count")" = 1
          jq -e '.text == " 44" and .percentage == 44' "$tmp/one.json" >/dev/null
          jq -e '.text == " 44" and .percentage == 44' "$tmp/two.json" >/dev/null

      - name: Verify inotify updates every watcher
        run: |
          tmp="$(mktemp -d)"
          pids=()
          mkdir -p "$tmp/cache/hypr-ddc-brightness" "$tmp/bin"

          now_ms="$(date +%s%3N)"
          printf '40\t100\t%s\n' "$now_ms" > "$tmp/cache/hypr-ddc-brightness/state_DP-1.tsv"

          cat > "$tmp/bin/fake-brightness" <<'SH'
          #!/usr/bin/env bash
          exit 1
          SH
          chmod +x "$tmp/bin/fake-brightness"

          for watcher in one two; do
            WAYBAR_OUTPUT_NAME=DP-1 \
            XDG_CACHE_HOME="$tmp/cache" \
            HYPR_BRIGHTNESS_SCRIPT="$tmp/bin/fake-brightness" \
              config/waybar/scripts/ddc_brightness.sh watch > "$tmp/$watcher.log" &
            pids+=("$!")
          done

          for _ in $(seq 1 100); do
            if grep -q ' 40' "$tmp/one.log" 2>/dev/null && grep -q ' 40' "$tmp/two.log" 2>/dev/null; then
              break
            fi
            sleep 0.05
          done

          now_ms="$(date +%s%3N)"
          printf '55\t100\t%s\n' "$now_ms" > "$tmp/cache/hypr-ddc-brightness/state_DP-1.tsv.tmp"
          mv -f "$tmp/cache/hypr-ddc-brightness/state_DP-1.tsv.tmp" "$tmp/cache/hypr-ddc-brightness/state_DP-1.tsv"

          for _ in $(seq 1 100); do
            if grep -q ' 55' "$tmp/one.log" 2>/dev/null && grep -q ' 55' "$tmp/two.log" 2>/dev/null; then
              success=1
              break
            fi
            sleep 0.05
          done

          for pid in "${pids[@]}"; do
            kill "$pid" 2>/dev/null || true
          done
          for pid in "${pids[@]}"; do
            wait "$pid" 2>/dev/null || true
          done

          if [[ "${success:-0}" != 1 ]]; then
            printf '%s\n' 'watchers did not receive the cache update' >&2
            cat "$tmp/one.log" >&2 || true
            cat "$tmp/two.log" >&2 || true
            rm -rf "$tmp"
            exit 1
          fi

          rm -rf "$tmp"
