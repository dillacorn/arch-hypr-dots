name: Sync Bar Icon Branch Main

on:
  push:
    branches: [feature/bar-icon-customization]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck
      - name: Merge current main when needed
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            printf '%s\n' 'Branch already contains current main.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            set +e
            git merge --no-edit origin/main
            merge_status=$?
            set -e
            if (( merge_status != 0 )); then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              expected='local/share/awtarchy/quickshell-managed-history.sha256'
              if (( ${#conflicts[@]} != 1 )) || [[ ${conflicts[0]} != "$expected" ]]; then
                printf 'Unexpected merge conflicts:\n' >&2
                printf '  %s\n' "${conflicts[@]}" >&2
                git merge --abort
                return 1
              fi
              ours="$(mktemp)"
              theirs="$(mktemp)"
              git show ":2:${expected}" >"$ours"
              git show ":3:${expected}" >"$theirs"
              cp "$ours" "$expected"
              while IFS= read -r line || [[ -n $line ]]; do
                grep -Fqx -- "$line" "$expected" || printf '%s\n' "$line" >>"$expected"
              done <"$theirs"
              rm -f -- "$ours" "$theirs"
              git add "$expected"
              git commit --no-edit
            fi
            git push origin HEAD:feature/bar-icon-customization
          fi
      - name: Focused syntax and ShellCheck
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-bar-icon-customization.sh
          shellcheck tests/test-bar-icon-customization.sh
      - name: Feature regression
        run: bash tests/test-bar-icon-customization.sh
      - name: Current-main regressions
        run: |
          bash tests/test-bluetooth-state-persistence.sh
          bash tests/test-night-light-schedule.sh
      - name: Quickshell production readiness
        run: bash tests/test-quickshell-production-readiness.sh
      - name: Quickshell updater migration
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Branch diff whitespace
        run: git diff --check origin/main...HEAD
