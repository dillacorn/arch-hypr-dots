name: Hardware Root Write Hardening

on:
  push:
    branches: [hardware-reconcile-sudo-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply hardening
        run: python3 .github/hardware-reconcile-hardening.py
      - name: Verify
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          git diff --check
      - name: Commit runtime hardening
        run: |
          if git diff --quiet -- local/share/awtarchy/awtarchy-runtime.sh; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'fix: harden privileged hardware config writes'
          git push origin HEAD:hardware-reconcile-sudo-fix
