name: Validate Floating Windows Global Mode

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - 'tests/test-floating-windows-global-mode.sh'
      - '.github/workflows/validate-floating-windows-global-mode.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - run: |
          bash -n tests/test-floating-windows-global-mode.sh
          shellcheck tests/test-floating-windows-global-mode.sh
          bash tests/test-floating-windows-global-mode.sh
