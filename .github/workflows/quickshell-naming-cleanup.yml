name: Quickshell naming cleanup

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('config/hypr/hyprland.lua')
          text = path.read_text(encoding='utf-8')
          for old, new in (
              ('waybar_toggle', 'bar_toggle'),
              ('waybar_flip', 'bar_flip'),
              ('waybar_rotate', 'bar_rotate'),
              ('mako_dismiss', 'notification_dismiss'),
          ):
              text = re.sub(rf'\b{old}\b', new, text)
          text = text.replace('Waybar', 'Quickshell bar')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm -f .github/workflows/quickshell-naming-cleanup.yml
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git commit -m "Clean legacy shell names from Hyprland config"
          git push origin HEAD:quickshell-conversion-testing
