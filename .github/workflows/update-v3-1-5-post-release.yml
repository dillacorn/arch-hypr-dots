name: Update v3.1.5 Post-Release

on:
  workflow_run:
    workflows:
      - Validate Awtarchy
    types:
      - completed

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Report validation result
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [[ "$CONCLUSION" == success ]]; then
            state=success
            description='Validate Awtarchy passed'
          else
            state=failure
            failed_steps="$(
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
                --jq '[.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name] | unique | join(", ")'
            )"
            [[ -n "$failed_steps" ]] || failed_steps="workflow conclusion: $CONCLUSION"
            description="Validate Awtarchy failed: ${failed_steps}"
            description="${description:0:140}"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$EVENT_SHA" \
            --raw-field state="$state" \
            --raw-field context='release-gate/validate-awtarchy' \
            --raw-field description="$description" \
            --raw-field target_url="$RUN_URL" >/dev/null

      - name: Stop on failed validation
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: exit 1

      - name: Check out repository
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Update v3.1.5 after validation
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_SHA: beb348c996a58396d5b7b35dbda2bfd8cc9cf747
          TARGET_TREE: 237e91a30902a0bf00e276af41658056e0a609c1
          EXPECTED_OLD_TAG: cd807d36e2fe1c97a4606b7d91b06bfe9d23557d
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          git merge-base --is-ancestor "$TARGET_SHA" "$EVENT_SHA"
          git diff --quiet "$TARGET_SHA" "$EVENT_SHA" -- . \
            ':(exclude).github/workflows/update-v3-1-5-post-release.yml'
          test "$(git rev-list -n1 v3.1.5)" = "$EXPECTED_OLD_TAG"

          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' >release-notes.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path("release-notes.md")
          body = path.read_text()
          marker = "### August 22, 2026\n"
          fingerprint = "Bluetooth power preference now survives real suspend/resume cycles"
          addition = """
          - Bluetooth power preference now survives real suspend/resume cycles instead of being reset when the controller wakes back up.
          - Resume recovery now waits for BlueZ to become usable, retries the requested adapter power state for a bounded window, and verifies `Powered:` actually matches the saved preference.
          - Added regression coverage for normal Quickshell resume, transient BlueZ power-command failures, and the existing no-rfkill-disabled-state behavior.

          This update passed Bash syntax, ShellCheck, Bluetooth persistence regression tests, Quickshell resume regression tests, and a live suspend/resume hardware test with Bluetooth saved as disabled before publication.

          """
          if fingerprint not in body:
              if body.count(marker) != 1:
                  raise SystemExit("expected v3.1.5 August 22 post-release heading exactly once")
              body = body.replace(marker, marker + addition, 1)
          path.write_text(body)
          PY

          grep -Fq '### August 21, 2026' release-notes.md
          grep -Fq '### August 22, 2026' release-notes.md
          grep -Fq 'Bluetooth power preference now survives real suspend/resume cycles' release-notes.md

          git tag -f v3.1.5 "$TARGET_SHA"
          git push --force origin refs/tags/v3.1.5

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.1.5" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --raw-field name='Awtarchy v3.1.5 Quickshell' \
            --raw-field body="$(cat release-notes.md)" \
            --raw-field target_commitish="$TARGET_SHA" >/dev/null

          test "$(git ls-remote origin refs/tags/v3.1.5 | awk '{print $1}')" = "$TARGET_SHA"
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json name --jq '.name' | grep -Fxq 'Awtarchy v3.1.5 Quickshell'
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish' | grep -Fxq "$TARGET_SHA"
          verified_body="$(gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          grep -Fq 'Bluetooth power preference now survives real suspend/resume cycles' <<<"$verified_body"
          grep -Fq 'live suspend/resume hardware test' <<<"$verified_body"

      - name: Remove temporary updater
        if: ${{ github.event.workflow_run.conclusion == 'success' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm -- .github/workflows/update-v3-1-5-post-release.yml
          git commit -m 'chore: remove v3.1.5 post-release updater'
          git push origin HEAD:main
