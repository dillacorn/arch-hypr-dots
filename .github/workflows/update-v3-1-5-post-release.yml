name: Fix Quickshell Updater Lock Leak

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v3-1-5-post-release.yml

permissions:
  contents: write
  statuses: write

jobs:
  fix-updater-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Report fix run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --raw-field state=pending \
            --raw-field context='updater-lock-fix' \
            --raw-field description='Running targeted updater migration regression' \
            --raw-field target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Install migration test dependency
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Close updater lock before Quickshell enumeration
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("local/share/awtarchy/awtarchy-runtime.sh")
          text = path.read_text()
          old = 'instances="$(run_target qs -c "$config_name" list --json 2>/dev/null)" || return 1'
          new = 'instances="$(run_target qs -c "$config_name" list --json 9>&- 2>/dev/null)" || return 1'
          if text.count(old) != 1:
              raise SystemExit("expected updater Quickshell enumeration exactly once")
          path.write_text(text.replace(old, new, 1))
          PY

          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash tests/test-quickshell-updater-migration.sh
          git diff --check

      - name: Commit fix and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- local/share/awtarchy/awtarchy-runtime.sh
          git rm -- .github/workflows/update-v3-1-5-post-release.yml
          git diff --cached --check
          git commit -m 'Close updater lock before Quickshell enumeration'
          git push origin HEAD:main

      - name: Report fix result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Targeted updater migration regression passed'
          else
            state=failure
            description='Targeted updater migration regression failed'
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --raw-field state="$state" \
            --raw-field context='updater-lock-fix' \
            --raw-field description="$description" \
            --raw-field target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
