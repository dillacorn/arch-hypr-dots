name: Update v3.1.5 Post-Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v3-1-5-post-release.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Update v3.1.5
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 7483c317f579a7358e9006c36fae81ab85ff329d
          TARGET_TREE: c79eaa806aa6120b10b482d0166f57a9b29fd92a
        run: |
          set -euo pipefail

          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" --json body --jq '.body' >release-notes.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path("release-notes.md")
          body = path.read_text()
          old = """## Post-release updates

          _No post-release updates yet. This section is reserved for fixes or additions published after v3.1.5._"""
          new = """## Post-release updates

          ### August 21, 2026

          - Fixed the Hyprland crash triggered by clicking the active Mouse bar indicator to leave the mouse submap.
          - Fixed bar volume scrolling becoming stuck below the configured maximum after lowering the volume.
          - Fixed external-monitor brightness remaining unavailable after login until Quick Settings was opened.

          These post-release fixes passed the full Awtarchy GitHub Actions validation suite. The mouse-submap and volume fixes were also verified on a live Awtarchy desktop."""
          if body.count(old) != 1:
              raise SystemExit("expected v3.1.5 post-release placeholder exactly once")
          path.write_text(body.replace(old, new, 1))
          PY

          git tag -f v3.1.5 "$TARGET_SHA"
          git push --force origin refs/tags/v3.1.5

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.1.5" --jq '.id')"
          gh api             --method PATCH             "repos/$GITHUB_REPOSITORY/releases/$release_id"             --raw-field name='Awtarchy v3.1.5 Quickshell'             --raw-field body="$(cat release-notes.md)"             --raw-field target_commitish="$TARGET_SHA" >/dev/null

          test "$(git ls-remote origin refs/tags/v3.1.5 | awk '{print $1}')" = "$TARGET_SHA"
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish'             | grep -Fxq "$TARGET_SHA"
          verified_body="$(gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          grep -Fq 'clicking the active Mouse bar indicator' <<<"$verified_body"
          grep -Fq 'volume scrolling becoming stuck' <<<"$verified_body"
          grep -Fq 'brightness remaining unavailable after login' <<<"$verified_body"

      - name: Remove temporary updater
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm -- .github/workflows/update-v3-1-5-post-release.yml
          git commit -m 'chore: remove v3.1.5 post-release updater'
          git push origin HEAD:main
