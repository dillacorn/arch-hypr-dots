name: Update v3.1.5 Post-Release

on:
  workflow_run:
    workflows:
      - Validate Awtarchy
    types:
      - completed

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  release-gate:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Report validation result
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [[ "$CONCLUSION" == success ]]; then
            state=success
            description='Validate Awtarchy passed'
          else
            state=failure
            failed_steps="$(
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
                --jq '[.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name] | unique | join(", ")'
            )"
            [[ -n "$failed_steps" ]] || failed_steps="workflow conclusion: $CONCLUSION"
            description="Validate Awtarchy failed: ${failed_steps}"
            description="${description:0:140}"
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$EVENT_SHA" \
            --raw-field state="$state" \
            --raw-field context='release-gate/validate-awtarchy' \
            --raw-field description="$description" \
            --raw-field target_url="$RUN_URL" >/dev/null

      - name: Stop on failed validation
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: exit 1

      - name: Check out repository
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Update v3.1.5 after validation
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_SHA: b769b7fef3ce0035e4ec86773814de7f9104e71c
          TARGET_TREE: c93d20e109694c122ec8dc8dfbc5a9af12d1994f
          EXPECTED_OLD_TAG: 7483c317f579a7358e9006c36fae81ab85ff329d
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          git merge-base --is-ancestor "$TARGET_SHA" "$EVENT_SHA"
          git diff --quiet "$TARGET_SHA" "$EVENT_SHA" -- . \
            ':(exclude).github/workflows/update-v3-1-5-post-release.yml'
          test "$(git rev-list -n1 v3.1.5)" = "$EXPECTED_OLD_TAG"

          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' >release-notes.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path("release-notes.md")
          body = path.read_text()
          heading = "## Post-release updates\n\n"
          marker = "### August 22, 2026"
          addition = """### August 22, 2026

          - Fixed Quickshell restart failures after package upgrades replace the executable used by the still-running shell process.
          - Added updater-level Quickshell restart recovery so a normal `awtarchy update` can recover even when the installed release manager is older than the refreshed updater runtime.
          - Hardened Quickshell shutdown against PID reuse and executable mismatches by binding termination to the verified process identity.

          These fixes passed a fresh Awtarchy GitHub Actions validation run before publication. The normal `awtarchy update` path was also verified on a live Awtarchy desktop.

          """
          if marker not in body:
              if body.count(heading) != 1:
                  raise SystemExit("expected v3.1.5 post-release heading exactly once")
              body = body.replace(heading, heading + addition, 1)
          path.write_text(body)
          PY

          grep -Fq '### August 21, 2026' release-notes.md
          grep -Fq '### August 22, 2026' release-notes.md

          git tag -f v3.1.5 "$TARGET_SHA"
          git push --force origin refs/tags/v3.1.5

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.1.5" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --raw-field name='Awtarchy v3.1.5 Quickshell' \
            --raw-field body="$(cat release-notes.md)" \
            --raw-field target_commitish="$TARGET_SHA" >/dev/null

          test "$(git ls-remote origin refs/tags/v3.1.5 | awk '{print $1}')" = "$TARGET_SHA"
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json name --jq '.name' | grep -Fxq 'Awtarchy v3.1.5 Quickshell'
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish' | grep -Fxq "$TARGET_SHA"
          verified_body="$(gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          grep -Fq '### August 22, 2026' <<<"$verified_body"
          grep -Fq 'updater-level Quickshell restart recovery' <<<"$verified_body"

      - name: Remove temporary updater
        if: ${{ github.event.workflow_run.conclusion == 'success' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm -- .github/workflows/update-v3-1-5-post-release.yml
          git commit -m 'chore: remove v3.1.5 post-release updater'
          git push origin HEAD:main
