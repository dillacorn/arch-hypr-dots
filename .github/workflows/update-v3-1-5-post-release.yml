name: Fix Quickshell Validator Warning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v3-1-5-post-release.yml

permissions:
  contents: write

jobs:
  fix-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Fix test-only ShellCheck warnings
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/test-quickshell-process-lifecycle.sh"): (
                  '''write_stop_fixture_stat() {
            local stat_file="$1" state="$2" start_time="$3" field
            printf '424242 (quickshell) %s' "$state" >"$stat_file"
            for field in {4..21}; do
          ''',
                  '''write_stop_fixture_stat() {
            local stat_file="$1" state="$2" start_time="$3"
            printf '424242 (quickshell) %s' "$state" >"$stat_file"
            for _ in {4..21}; do
          ''',
              ),
              Path("tests/test-quickshell-updater-bootstrap.sh"): (
                  '''write_proc_stat() {
            local stat_file="$1" state="$2" start_time="$3" field
            printf '424242 (quickshell) %s' "$state" >"$stat_file"
            for field in {4..21}; do
          ''',
                  '''write_proc_stat() {
            local stat_file="$1" state="$2" start_time="$3"
            printf '424242 (quickshell) %s' "$state" >"$stat_file"
            for _ in {4..21}; do
          ''',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact SC2034 fixture in {path}")
              path.write_text(text.replace(old, new, 1))
          PY

          bash -n tests/test-quickshell-process-lifecycle.sh
          bash -n tests/test-quickshell-updater-bootstrap.sh
          shellcheck tests/test-quickshell-process-lifecycle.sh tests/test-quickshell-updater-bootstrap.sh
          git diff --check

      - name: Commit fix and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- tests/test-quickshell-process-lifecycle.sh tests/test-quickshell-updater-bootstrap.sh
          git rm -- .github/workflows/update-v3-1-5-post-release.yml
          git diff --cached --check
          git commit -m 'Fix Quickshell lifecycle test ShellCheck'
          git push origin HEAD:main
