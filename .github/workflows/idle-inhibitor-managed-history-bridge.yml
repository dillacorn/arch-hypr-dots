name: One-use idle inhibitor managed history bridge

on:
  push:
    branches: [fix/idle-inhibitor-instant-feedback]

permissions:
  contents: write

jobs:
  update-managed-history:
    if: github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/idle-inhibitor-instant-feedback
          fetch-depth: 0

      - name: Append current SystemState hash and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/idle-inhibitor-instant-feedback'
          source_file='config/quickshell/awtarchy/SystemState.qml'
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          bridge='.github/workflows/idle-inhibitor-managed-history-bridge.yml'
          managed_path='.config/quickshell/awtarchy/SystemState.qml'

          test "$GITHUB_REF_NAME" = "$branch"
          digest="$(sha256sum "$source_file" | awk '{print $1}')"
          entry="${digest}"$'\t'"${managed_path}"

          if ! grep -Fqx -- "$entry" "$history"; then
            printf '\n# 2026-09-01 instant idle inhibitor bar feedback.\n%s\n' "$entry" >>"$history"
          fi

          git rm -- "$bridge"
          git add -- "$history"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Track idle inhibitor managed hash'
          git push origin "HEAD:${branch}"
