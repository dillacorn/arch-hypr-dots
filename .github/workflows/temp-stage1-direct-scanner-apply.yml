name: Apply Direct AUR Scanner Stage 1

on:
  push:
    branches:
      - feature/direct-aur-scanner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/direct-aur-scanner

      - name: Apply scanner PGP bootstrap
        run: python3 .github/temp-stage1-pgpfetch-apply.py

      - name: Validate Stage 1
        shell: bash
        run: |
          set -euo pipefail
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-installer-aur-scanner-delegation.sh
          shellcheck tests/test-installer-aur-scanner-delegation.sh
          bash tests/test-installer-aur-scanner-delegation.sh
          bash tests/test-security-boundaries.sh
          git diff --check

      - name: Commit Stage 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Fetch upstream scanner signing keys'
          git push origin HEAD:feature/direct-aur-scanner
