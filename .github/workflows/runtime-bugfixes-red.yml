name: Runtime Bugfix TDD

on:
  push:
    branches: [quickshell-runtime-bugfixes]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Apply guarded network bar fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("config/quickshell/awtarchy/NetworkMenu.qml")
          text = path.read_text(encoding="utf-8")

          old_property = "    readonly property var connectedWiredDevices: wiredDevices.filter(device => device.connected)"
          new_property = "    readonly property var connectedWiredDevices: wiredDevices.filter(device => device && device.network && device.network.connected)"
          if text.count(old_property) == 1 and new_property not in text:
              text = text.replace(old_property, new_property)
          elif text.count(old_property) == 0 and text.count(new_property) == 1:
              pass
          else:
              raise SystemExit("guard mismatch for connectedWiredDevices")

          replacements = {
              "buildBarLabel": '''    function buildBarLabel() {
              if (wifiConnected)
                  return "__WIFI__";
              if (wiredConnected)
                  return "󰈀";
              if (wifiPresent)
                  return "󰤯";
              if (wiredPresent)
                  return "󰈂";
              return "";
          }
          ''',
              "buildVerticalBarLabel": '''    function buildVerticalBarLabel() {
              if (wifiConnected)
                  return "__WIFI__";
              if (wiredConnected)
                  return "󰈀";
              if (wifiPresent)
                  return "󰤯";
              if (wiredPresent)
                  return "󰈂";
              return "";
          }
          ''',
          }

          for name, template in replacements.items():
              replacement = template.replace('return "__WIFI__";', 'return wifiSignalIcon(connectedWifiNetworks[0]);')
              pattern = re.compile(
                  rf"^    function {name}\(\) \{{\n.*?^    \}}\n",
                  re.MULTILINE | re.DOTALL,
              )
              matches = pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f"guard mismatch for {name}: matches={len(matches)}")
              current = matches[0]
              if current != replacement:
                  text = pattern.sub(lambda _match, value=replacement: value, text, count=1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          if ! git diff --quiet -- config/quickshell/awtarchy/NetworkMenu.qml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/quickshell/awtarchy/NetworkMenu.qml
            git commit -m "fix: correct network bar connection state"
            git push origin HEAD:quickshell-runtime-bugfixes
          fi

      - name: Run new regression tests
        shell: bash
        run: |
          set +e
          failures=0
          for test_file in \
            tests/test-power-profile-inline-auth.sh \
            tests/test-power-profile-helper-update.sh \
            tests/test-quickshell-backend-readiness.sh \
            tests/test-hyprbars-quicksettings.sh \
            tests/test-network-bar-state.sh
          do
            printf '\n=== %s ===\n' "$test_file"
            bash "$test_file" || failures=$((failures + 1))
          done
          exit "$failures"
