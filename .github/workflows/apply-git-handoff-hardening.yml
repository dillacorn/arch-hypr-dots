name: Apply Git-Testing Handoff Hardening

on:
  pull_request:
    paths:
      - .github/workflows/apply-git-handoff-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Harden launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/bin/awtarchy')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '  [[ $config =~ ^(.+)@([0-9a-fA-F]{40})$ ]] || return 2\n',
              '  [[ $config =~ ^(.+)@([0-9a-fA-F]{40})$ ]] \\\n    || die "Active Git-testing configuration has no valid exact revision for package reconciliation."\n',
              1,
          )

          text = text.replace(
              '  tar -xzf "$archive" -C "$tmp"\n',
              '  if ! tar -xzf "$archive" -C "$tmp"; then\n    rm -rf -- "$tmp"\n    die "Failed to extract Git-testing package archive for revision ${revision}."\n  fi\n',
              1,
          )

          old = '''run_package_reconciler() {
            local rc=0
            if config_is_git_testing; then
              run_git_testing_package_reconciler "$@" || rc=$?
              (( rc != 2 )) || die "Active Git-testing configuration has no valid exact revision for package reconciliation."
              return "$rc"
            fi

            require_package_reconciler
            AWTARCHY_RUNTIME="$RUNTIME" bash "$PACKAGE_RECONCILER" "$@"
          }
          '''
          new = '''run_package_reconciler() {
            if config_is_git_testing; then
              run_git_testing_package_reconciler "$@"
              return $?
            fi

            require_package_reconciler
            AWTARCHY_RUNTIME="$RUNTIME" bash "$PACKAGE_RECONCILER" "$@"
          }
          '''
          if old not in text:
              raise SystemExit('run_package_reconciler hardening anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- local/bin/awtarchy; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local/bin/awtarchy
          git commit -m 'fix: harden git-testing package handoff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
