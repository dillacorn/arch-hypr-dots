name: Publish v3.2.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3-2-0-release.yml

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Publish v3.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 9a96b5352461fc88e31c8fe690eb4487a3e16de4
          TARGET_TREE: 192934acba334e350abd6e2e76de27a664880bc2
          RELEASE_TAG: v3.2.0
          RELEASE_NAME: Awtarchy v3.2.0 Quickshell
        run: |
          set -euo pipefail

          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git diff --quiet "$TARGET_SHA" HEAD -- . \
            ':(exclude).github/workflows/publish-v3-2-0-release.yml'

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} tag already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} release already exists" >&2
            exit 1
          fi

          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' >v3.1.5-release.md
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json name --jq '.name' | grep -Fxq 'Awtarchy v3.1.5 Quickshell'
          gh release view v3.1.5 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fxq true

          python3 - <<'PY'
          from pathlib import Path
          import re

          def sections(text):
              lines = text.splitlines(keepends=True)
              indexes = [i for i, line in enumerate(lines) if re.match(r'^##\s+\S', line)]
              result = []
              for pos, start in enumerate(indexes):
                  end = indexes[pos + 1] if pos + 1 < len(indexes) else len(lines)
                  title = re.sub(r'^##\s+', '', lines[start]).strip()
                  result.append((title, ''.join(lines[start:end]).rstrip() + '\n'))
              return result

          source = Path('v3.1.5-release.md').read_text()
          wanted = {
              'getting started',
              'start here',
              'fresh install',
              'fresh installation',
              'install awtarchy',
              'after installation',
              'existing awtarchy users',
          }
          install_sections = [
              block for title, block in sections(source)
              if title.casefold() in wanted
          ]
          if not install_sections:
              raise SystemExit('could not find v3.1.5 Getting Started/install sections')

          installation = '\n'.join(install_sections).strip()
          required = [
              'sudo pacman -S git --noconfirm',
              'git clone https://github.com/dillacorn/awtarchy',
              'sudo ./awtarchy-install.sh',
          ]
          missing = [item for item in required if item not in installation]
          if missing:
              raise SystemExit(f'v3.1.5 installation text missing expected markers: {missing}')

          Path('v3.1.5-installation.md').write_text(installation + '\n')
          installation_v320 = installation.replace('v3.1.5', 'v3.2.0')

          intro = '''# Awtarchy v3.2.0 Quickshell

Awtarchy v3.2.0 adds user-approved anonymous failure reporting for recognized Awtarchy and Quickshell failures, backed by a production-tested report service designed around explicit consent, strict data minimization, and duplicate-safe GitHub issue creation.
'''

          reporting = '''## Anonymous failure reporting

- Recognized failures can prepare a sanitized report locally without transmitting anything automatically.
- The terminal consent flow provides **Send**, **Review**, and **Don't send**. Review displays the exact structured payload before transmission, and the prompt discloses that an accepted report may become part of a public GitHub issue.
- Noninteractive failures remain pending locally rather than spawning a terminal. Pending reports can resurface through normal Awtarchy maintenance and healthy Quickshell flows.
- Initial reporting hooks cover Quickshell start/restart readiness, exhausted resume recovery, and post-update Quickshell failure after updater recovery is exhausted.
- Recoverable updater attempts suppress intermediate reports so one update failure does not create noisy duplicate failure classes.
'''

          backend = '''## Report service, privacy, and abuse protection

- Added the production Cloudflare Worker and D1 report service plus the restricted Awtarchy Report Bot GitHub App.
- New recognized failure signatures can create a server-generated GitHub issue; repeat reports reuse the same issue through a stable server-generated fingerprint and D1 deduplication.
- Report payloads exclude raw logs, usernames, hostnames, home-directory paths, command history, clipboard contents, VPN details, and persistent machine/install identifiers.
- The client confines send/review/discard operations to known pending-report files and revalidates payloads locally before transmission.
- The public Worker strictly allowlists fields and failure classes, bounds streamed request bodies and GitHub API calls, verifies recovered issues were authored by Awtarchy Report Bot, and protects issue creation with D1 lease ownership/recovery semantics.
- Layered Cloudflare rate limits run before D1/GitHub work: a transient client+signature counter limits one source from flooding a failure class, while a separate signature-wide ceiling limits aggregate abuse. Transport IP is not copied into the report payload, D1, GitHub issue content, or a persistent Awtarchy identifier.
'''

          validation = '''## Validation

- Added dedicated anonymous-reporting and report-service CI, Node 20/22 backend tests, Wrangler deployment dry-runs, managed-history checks, and security/concurrency regressions.
- The production Worker was deployed and health-checked before release.
- A real reviewed user-style submission created bot-authored issue #50, and a second identical submission resolved to the same issue, proving the production deduplication path end-to-end.
'''

          placeholder = '''## Post-release updates

_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._
'''

          body = (
              intro.rstrip() + '\n\n' +
              installation_v320.rstrip() + '\n\n' +
              reporting.rstrip() + '\n\n' +
              backend.rstrip() + '\n\n' +
              validation.rstrip() + '\n\n' +
              placeholder
          )
          Path('release-notes.md').write_text(body)
          PY

          grep -Fq '# Awtarchy v3.2.0 Quickshell' release-notes.md
          grep -Fq '## Anonymous failure reporting' release-notes.md
          grep -Fq '## Report service, privacy, and abuse protection' release-notes.md
          grep -Fq '## Validation' release-notes.md
          grep -Fq '## Post-release updates' release-notes.md
          grep -Fq '_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._' release-notes.md
          grep -Fq 'sudo pacman -S git --noconfirm' release-notes.md
          grep -Fq 'git clone https://github.com/dillacorn/awtarchy' release-notes.md
          grep -Fq 'sudo ./awtarchy-install.sh' release-notes.md
          grep -Fq 'issue #50' release-notes.md

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md

          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$TARGET_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json name --jq '.name' | grep -Fxq "$RELEASE_NAME"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish' | grep -Fxq "$TARGET_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fxq true
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' >verified-release.md

          grep -Fq '## Post-release updates' verified-release.md
          grep -Fq '_No post-release updates yet. This section is reserved for fixes or additions published after v3.2.0._' verified-release.md
          grep -Fq 'issue #50' verified-release.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          wanted = {
              'getting started', 'start here', 'fresh install', 'fresh installation',
              'install awtarchy', 'after installation', 'existing awtarchy users',
          }

          def installation_sections(text):
              lines = text.splitlines(keepends=True)
              indexes = [i for i, line in enumerate(lines) if re.match(r'^##\s+\S', line)]
              result = []
              for pos, start in enumerate(indexes):
                  end = indexes[pos + 1] if pos + 1 < len(indexes) else len(lines)
                  title = re.sub(r'^##\s+', '', lines[start]).strip()
                  if title.casefold() in wanted:
                      result.append(''.join(lines[start:end]).rstrip() + '\n')
              return '\n'.join(result).strip()

          old = installation_sections(Path('v3.1.5-release.md').read_text())
          new = installation_sections(Path('verified-release.md').read_text())
          if not old or not new:
              raise SystemExit('could not verify copied Getting Started/install sections')
          if new.replace('v3.2.0', 'v3.1.5') != old:
              raise SystemExit('v3.2.0 Getting Started/install text does not match v3.1.5')
          PY

      - name: Remove temporary publisher
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm -- .github/workflows/publish-v3-2-0-release.yml
          git commit -m 'chore: remove v3.2.0 release publisher'
          git push origin HEAD:main
