name: Apply Quick Settings Bar Customize Flow

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/apply-quick-settings-bar-customize-flow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_quick_settings_bar_customize_flow.py')
          text = path.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label in ("open transient reset", "close transient reset"):
                  if count < 1:
                      raise SystemExit(f"{label}: expected at least one match, found {count}")
                  return text.replace(old, new, 1)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)
          '''
          if old not in text:
              raise SystemExit('replace_once helper block changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python3 .github/scripts/apply_quick_settings_bar_customize_flow.py
      - run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell_flyout_position.sh
          shellcheck config/hypr/scripts/quickshell_flyout_position.sh
          bash -n tests/test-quick-settings-bar-customize-flow.sh
          shellcheck tests/test-quick-settings-bar-customize-flow.sh
          bash tests/test-quick-settings-bar-customize-flow.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-ux-flow.sh
          bash tests/test-quick-settings-layout.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-display-options.sh
          bash tests/test-bar-icon-customization.sh
      - run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/FlyoutSettings.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            config/hypr/scripts/quickshell_flyout_position.sh \
            tests/test-bar-icon-customization.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Refine Quick Settings customization flow'
          git push origin HEAD:feature/bar-transparency
