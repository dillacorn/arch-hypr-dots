name: Fix volume slider and Quickshell stop

on:
  push:
    paths:
      - .github/workflows/fix-volume-slider-stop.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 2

      - name: Verify guarded staging commit
        shell: bash
        run: |
          set -euo pipefail
          expected=af0ddb294eaa0e5df1bcf5cb1d81b8b145522f0e
          actual="$(git rev-parse HEAD^)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Expected parent %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }

      - name: Verify regressions exist before patch
        shell: bash
        run: |
          set -euo pipefail
          audio=config/quickshell/awtarchy/AudioLimitState.qml
          manager=config/hypr/scripts/quickshell.sh

          if grep -Fq 'const rounded = Math.round(numeric);' "$audio"; then
            printf 'Expected single-percent volume-limit regression test to fail before patch\n' >&2
            exit 1
          fi
          grep -Fq 'const rounded = Math.round(numeric / stepPercent) * stepPercent;' "$audio"

          if ! grep -Fq 'ipc control quit >/dev/null 2>&1 || true' "$manager"; then
            printf 'Expected graceful-stop regression test to fail before patch\n' >&2
            exit 1
          fi

          printf 'RED confirmed: slider still snaps to 5%% and stop still waits on Qt.quit()\n'

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "config/quickshell/awtarchy/AudioLimitState.qml",
              '''        const rounded = Math.round(numeric / stepPercent) * stepPercent;\n        return Math.max(minimumPercent, Math.min(maximumPercent, rounded));\n''',
              '''        const rounded = Math.round(numeric);\n        return Math.max(minimumPercent, Math.min(maximumPercent, rounded));\n'''
          )

          replace_once(
              "config/hypr/scripts/quickshell.sh",
              '''stop_shell() {\n    if ! is_running; then\n        return 0\n    fi\n\n    ipc control quit >/dev/null 2>&1 || true\n\n    wait_for_shell_stop && return 0\n\n    # Qt can remove the visible shell before its process and IPC endpoint have\n    # finished shutting down. Fall back to Quickshell's instance-aware kill\n    # command, repeating it in case an older duplicate instance is exposed.\n    printf 'quickshell.sh: Graceful stop timed out; forcing the Awtarchy instance to stop\\n' >&2\n    for _ in {1..3}; do\n        qs -c "$CONFIG_NAME" kill >/dev/null 2>&1 || true\n        wait_for_shell_stop && return 0\n    done\n\n    printf 'quickshell.sh: Quickshell did not stop cleanly\\n' >&2\n    return 1\n}\n''',
              '''stop_shell() {\n    if ! is_running; then\n        return 0\n    fi\n\n    # Explicit stop/restart operations need the instance gone before the new\n    # QML tree can start. The IPC Qt.quit() path routinely leaves the endpoint\n    # alive until the full timeout, while the config-scoped Quickshell kill\n    # command is the existing reliable fallback. Use it immediately.\n    for _ in {1..3}; do\n        qs -c "$CONFIG_NAME" kill >/dev/null 2>&1 || true\n        wait_for_shell_stop && return 0\n    done\n\n    printf 'quickshell.sh: Quickshell did not stop cleanly\\n' >&2\n    return 1\n}\n'''
          )

          path = Path("tests/test-quickshell-production-readiness.sh")
          text = path.read_text(encoding="utf-8")
          marker = '''assert_contains "${REPO_ROOT}/config/quickshell/awtarchy/AudioLimitState.qml" 'readonly property int minimumPercent: 100'\n'''
          addition = marker + '''assert_contains "${REPO_ROOT}/config/quickshell/awtarchy/AudioLimitState.qml" 'const rounded = Math.round(numeric);'\nassert_not_contains "${REPO_ROOT}/config/quickshell/awtarchy/AudioLimitState.qml" 'Math.round(numeric / stepPercent)'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs -c "$CONFIG_NAME" kill'\nassert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'ipc control quit >/dev/null 2>&1 || true'\nassert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'Graceful stop timed out'\n'''
          if text.count(marker) != 1:
              raise SystemExit("production readiness insertion marker mismatch")
          path.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY

      - name: Refresh managed history
        shell: bash
        run: |
          set -euo pipefail
          manifest=local/share/awtarchy/quickshell-managed-history.sha256
          {
            printf '\n# 2026-08-14 single-percent volume cap and immediate Quickshell stop\n'
            for src in \
              config/quickshell/awtarchy/AudioLimitState.qml \
              config/hypr/scripts/quickshell.sh
            do
              hash="$(sha256sum "$src" | awk '{print $1}')"
              printf '%s\t.%s\n' "$hash" "$src"
            done
          } >> "$manifest"

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          shellcheck -e SC2034 config/hypr/scripts/quickshell.sh
          bash tests/test-quickshell-production-readiness.sh
          grep -Fq 'const rounded = Math.round(numeric);' config/quickshell/awtarchy/AudioLimitState.qml
          ! grep -Fq 'ipc control quit >/dev/null 2>&1 || true' config/hypr/scripts/quickshell.sh

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/AudioLimitState.qml \
            config/hypr/scripts/quickshell.sh \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-quickshell-production-readiness.sh
          git commit -m 'Refine volume cap control and Quickshell restart'
          git push origin HEAD:main
