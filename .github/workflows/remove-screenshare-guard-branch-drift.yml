name: Remove Screen Share Guard branch drift

on:
  push:
    branches:
      - feature/screenshare-guard-controls

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove Screen Share Guard branch drift'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/screenshare-guard-controls
          fetch-depth: 0

      - name: Remove unrelated noalt drift
        shell: bash
        run: |
          set -Eeuo pipefail
          file='config/hypr/hyprland.lua'
          old='        hl.bind("SUPER + SHIFT + " .. bind[1], hl.dsp.window.move({ direction = bind[2], follow = false }), {})'
          new='        hl.bind("SUPER + SHIFT + " .. bind[1], hl.dsp.window.move({ direction = bind[2] }), {})'

          OLD="$old" NEW="$new" python3 - "$file" <<'PY'
          from pathlib import Path
          import os, sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = os.environ["OLD"]
          new = os.environ["NEW"]
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one unrelated noalt drift line, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          grep -Fqx -- "$new" "$file"
          ! grep -Fq -- "$old" "$file"

          sudo apt-get update
          sudo apt-get install -y jq lua5.4
          luac -p config/hypr/hyprland.lua
          luac -p config/hypr/screenshare_guard.lua
          bash tests/test-screenshare-guard-controls.sh
          bash tests/test-quick-settings-layout.sh
          git diff --check

          rm -f .github/workflows/remove-screenshare-guard-branch-drift.yml

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add config/hypr/hyprland.lua .github/workflows/remove-screenshare-guard-branch-drift.yml
          git commit -m 'Remove unrelated Screen Share Guard branch drift'
          git push origin HEAD:feature/screenshare-guard-controls
