name: One-use Lenovo readback fix

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
          fetch-depth: 0
      - name: Fix Lenovo all-battery readback
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/awtarchy-lenovo-readback.py
          python3 /tmp/awtarchy-lenovo-readback.py

          bash -n local/libexec/awtarchy/power-profile-helper
          bash -n tests/test-battery-care-multibattery.sh
          shellcheck local/libexec/awtarchy/power-profile-helper tests/test-battery-care-multibattery.sh
          bash tests/test-battery-care-multibattery.sh
          bash tests/test-battery-care-compatibility.sh
          bash tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-care-vendor-semantics.sh
          bash tests/test-battery-care-write-gating.sh
          git diff --check

          rm -- .github/workflows/one-use-lenovo-readback.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add local/libexec/awtarchy/power-profile-helper \
                  .github/workflows/one-use-lenovo-readback.yml
          git commit -m 'Verify Lenovo battery mode on every pack'
          git push origin HEAD:hardening/tlp-battery-compatibility
