name: Apply lockscreen test rewire

on:
  pull_request:
    paths:
      - .github/workflows/apply-lockscreen-test-rewire.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Rewire architecture-aware tests
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Foundation: security stays on LockSurface; presentation moved to LockScene.
          path = "tests/test-quickshell-lockscreen-foundation.sh"
          replace_once(path,
              'SURFACE_QML="${LOCK_DIR}/LockSurface.qml"\n',
              'SURFACE_QML="${LOCK_DIR}/LockSurface.qml"\nSCENE_QML="${LOCK_DIR}/LockScene.qml"\n')
          replace_once(path,
              'require_file "$SURFACE_QML"\n',
              'require_file "$SURFACE_QML"\nrequire_file "$SCENE_QML"\n')
          replace_once(path,
              'reject_text "$SURFACE_QML" \'/fastfetch/ascii/awtarchy.txt\' \\\n    \'lock surface still references the retired Fastfetch ASCII mark\'\nrequire_text "$SURFACE_QML" \'▄▄▄      ██     █ ▄▄▄█████ ▄▄▄      ██▀███  ▄████▄  ██  ██ ██   ██\' \\\n    \'lock surface does not use the approved large Awtarchy ASCII wordmark\'\n',
              'reject_text "$SCENE_QML" \'/fastfetch/ascii/awtarchy.txt\' \\\n    \'shared lock scene still references the retired Fastfetch ASCII mark\'\nrequire_text "$SCENE_QML" \'▄▄▄      ██     █ ▄▄▄█████ ▄▄▄      ██▀███  ▄████▄  ██  ██ ██   ██\' \\\n    \'shared lock scene does not use the approved large Awtarchy ASCII wordmark\'\n')

          # Physics assertions follow the presentation-only scene.
          path = "tests/test-quickshell-lockscreen-interactive-physics-regressions.sh"
          p = Path(path)
          text = p.read_text()
          old = 'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"'
          if text.count(old) != 1:
              raise SystemExit(f"{path}: surface variable target mismatch")
          text = text.replace(old,
              'SCENE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockScene.qml"', 1)
          text = text.replace('$SURFACE_QML', '$SCENE_QML')
          p.write_text(text)

          # Interactive-effects test keeps secure-surface assertions on LockSurface
          # and moves physics/metadata rendering assertions to LockScene.
          path = "tests/test-quickshell-lockscreen-interactive-effects.sh"
          replace_once(path,
              'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"\n',
              'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"\nSCENE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockScene.qml"\n')
          p = Path(path)
          text = p.read_text()
          move_tokens = [
              'readonly property int ghostTrailLength: 6',
              'readonly property int pointerUpdateIntervalMs: 16',
              'readonly property int cursorFadeDelayMs: 180',
              'readonly property int cursorFadeDurationMs: 320',
              'readonly property real pointerInfluenceRadius: 72 * root.uiScale',
              'readonly property real pointerDisplacementCap: 24 * root.uiScale',
              'readonly property real audioDisplacementCap: 6 * root.uiScale',
              'readonly property bool pointerEffectsEnabled: root.mouseInteractive && root.pointerActive',
              'readonly property bool audioEffectsEnabled: root.audioReactive && root.audioLevel > root.audioSilenceThreshold',
              'property real pointerOffsetX: 0',
              'property real pointerOffsetY: 0',
              'readonly property real audioOffsetX:',
              'readonly property real audioOffsetY:',
              'NumberAnimation on pointerOffsetX',
              'NumberAnimation on pointerOffsetY',
              'root.showWeather && root.weatherText.length > 0',
              'Quickshell.env("USER")',
          ]
          for token in move_tokens:
              old = f'require_text "$SURFACE_QML" \'{token}\''
              new = f'require_text "$SCENE_QML" \'{token}\''
              if old not in text:
                  raise SystemExit(f"{path}: missing assertion target for {token}")
              text = text.replace(old, new, 1)
          old = 'reject_text "$SURFACE_QML" \'readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"\''
          if old not in text:
              raise SystemExit(f"{path}: missing obsolete master-switch rejection")
          text = text.replace(old,
              'reject_text "$SCENE_QML" \'readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"\'', 1)
          p.write_text(text)

          # Animation-family implementation moved into LockScene; pass-through
          # preference properties remain required on LockSurface.
          path = "tests/test-quickshell-lockscreen-animation-preference.sh"
          replace_once(path,
              'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"\n',
              'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"\nSCENE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockScene.qml"\n')
          p = Path(path)
          text = p.read_text()
          move_tokens = [
              'animationPreference === "swarm"',
              'animationPreference === "edges"',
              'animationPreference === "center"',
              'animationPreference === "split"',
              'root.animationPreference === "off" ? 1 : 0',
              'root.animationPreference !== "off"',
              'readonly property bool pointerEffectsEnabled: root.mouseInteractive && root.pointerActive',
              'readonly property bool audioEffectsEnabled: root.audioReactive && root.audioLevel > root.audioSilenceThreshold',
              'readonly property int formationDelay: Math.floor(Math.random() * 301)',
              'readonly property int formationDuration: 1700',
              '+ Math.floor(Math.random() * 351)',
          ]
          for token in move_tokens:
              old = f'require_text "$SURFACE_QML" \'{token}\''
              new = f'require_text "$SCENE_QML" \'{token}\''
              if old not in text:
                  raise SystemExit(f"{path}: missing assertion target for {token}")
              text = text.replace(old, new, 1)
          old = 'reject_text "$SURFACE_QML" \'readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"\''
          if old not in text:
              raise SystemExit(f"{path}: missing master-switch rejection")
          text = text.replace(old,
              'reject_text "$SCENE_QML" \'readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"\'', 1)
          p.write_text(text)

          # Runtime regression: presentation identity/geometry/formation/metadata
          # are verified in LockScene; password/PAM/unlock remain on LockSurface.
          path = "tests/test-quickshell-lockscreen-runtime-regressions.sh"
          replace_once(path,
              'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"\n',
              'SURFACE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockSurface.qml"\nSCENE_QML="${ROOT}/config/quickshell/awtarchy-lock/LockScene.qml"\n')
          p = Path(path)
          text = p.read_text()
          # Exact rows and geometric renderer checks.
          text = text.replace('require_text "$SURFACE_QML" "$row"', 'require_text "$SCENE_QML" "$row"')
          move_tokens = [
              '/fastfetch/ascii/awtarchy.txt',
              'id: logoFile',
              'readonly property int wordmarkCellWidth:',
              'readonly property int wordmarkCellHeight:',
              'readonly property var wordmarkRows:',
              'property string glyph:',
              'antialiasing: false',
              'fontSizeMode: Text.HorizontalFit',
              'animationPreference === "swarm"',
              'animationPreference === "edges"',
              'animationPreference === "center"',
              'animationPreference === "split"',
              'root.animationPreference === "off" ? 1 : 0',
              'root.animationPreference !== "off"',
              'Math.random()',
              'readonly property int formationDelay: Math.floor(Math.random() * 301)',
              'readonly property int formationDuration: 1700',
              '+ Math.floor(Math.random() * 351)',
              'SequentialAnimation on formationProgress',
              'PauseAnimation {',
              'wordmarkCell.formationProgress <= 0 ? 0',
              'visible: root.showTime',
              'visible: root.showDate',
              'visible: root.showUsername',
          ]
          for token in move_tokens:
              for prefix in ('require_text', 'reject_text'):
                  old = f'{prefix} "$SURFACE_QML" \'{token}\''
                  if old in text:
                      text = text.replace(old, f'{prefix} "$SCENE_QML" \'{token}\'', 1)
                      break
          # Dedicated lock accent now primarily paints the shared scene.
          old = 'lock_accent_uses="$(grep -Fc \'color: root.theme.lockAccent\' "$SURFACE_QML" || true)"'
          if old not in text:
              raise SystemExit(f"{path}: lock accent count target missing")
          text = text.replace(old,
              'lock_accent_uses="$(grep -Fc \'color: root.theme.lockAccent\' "$SCENE_QML" || true)"', 1)
          # Old metadata stack collapse is obsolete because elements are independent.
          old_block = '''require_text "$SURFACE_QML" 'readonly property bool metadataVisible: root.showTime || root.showDate || root.showUsername' \\
    'lockscreen metadata does not collapse when every local-info option is disabled'\n'''
          if old_block not in text:
              raise SystemExit(f"{path}: obsolete metadata stack assertion missing")
          text = text.replace(old_block, '', 1)
          p.write_text(text)
          PY
      - name: Validate rewired tests
        run: |
          shellcheck tests/test-quickshell-lockscreen-foundation.sh
          shellcheck tests/test-quickshell-lockscreen-runtime-regressions.sh
          shellcheck tests/test-quickshell-lockscreen-animation-preference.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-effects.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          git diff --check
      - name: Commit validated rewiring
        run: |
          rm -f .github/workflows/apply-lockscreen-test-rewire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test-quickshell-lockscreen-foundation.sh \
                  tests/test-quickshell-lockscreen-runtime-regressions.sh \
                  tests/test-quickshell-lockscreen-animation-preference.sh \
                  tests/test-quickshell-lockscreen-interactive-effects.sh \
                  tests/test-quickshell-lockscreen-interactive-physics-regressions.sh \
                  .github/workflows/apply-lockscreen-test-rewire.yml
          git diff --cached --check
          git commit -m "Rewire lockscreen tests for shared scene"
          git push origin HEAD:feature/lockscreen-interactive-effects
