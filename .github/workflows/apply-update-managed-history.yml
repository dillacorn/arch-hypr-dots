name: Apply Update Notifier Managed History

on:
  push:
    branches: [fix/update-terminal-sudo-disk-recovery]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Record current notifier hash
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          hash='629c2952f254283926dd827f1681c0905a4aaf71db972eb6dd5ee7daffe445ae'
          path='.config/hypr/scripts/quickshell_update_notifications.sh'
          line="${hash}"$'\t'"${path}"

          if grep -Fqx -- "$line" "$history"; then
            echo 'Managed notifier hash already recorded.'
          else
            printf '%s\n' "$line" >>"$history"
            git diff --check
            git config user.name 'dillacorn'
            git config user.email '28743863+dillacorn@users.noreply.github.com'
            git add "$history"
            git commit -m 'Record update notifier managed hash'
            git push origin HEAD:fix/update-terminal-sudo-disk-recovery
          fi
