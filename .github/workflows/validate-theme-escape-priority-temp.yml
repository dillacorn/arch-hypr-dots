name: Temporary Validate Theme Escape Priority

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-theme-escape-priority-temp.yml'
      - 'tests/test-quickshell-theme-escape-priority.sh'
      - 'tests/test-quickshell-theme-picker.sh'
      - 'config/quickshell/awtarchy/shell.qml'
      - 'config/quickshell/awtarchy/ThemePicker.qml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          bash -n tests/test-quickshell-theme-escape-priority.sh
          bash -n tests/test-quickshell-theme-picker.sh
      - name: ShellCheck
        run: |
          shellcheck tests/test-quickshell-theme-escape-priority.sh
          shellcheck tests/test-quickshell-theme-picker.sh
      - name: Focused regressions
        run: |
          bash tests/test-quickshell-theme-picker.sh
          bash tests/test-quickshell-theme-escape-priority.sh
