name: Validate hyprmoncfg idle safety

on:
  push:
    branches: [feature/hyprmoncfg-idle-safety]
  pull_request:
    paths:
      - config/hypr/hyprland.lua
      - config/hypr/hypridle.conf
      - config/hypr/scripts/launch_handler.sh
      - config/hypr/scripts/idle_inhibitor_global.sh
      - config/hypr/scripts/hypridle_action.sh
      - config/quickshell/awtarchy/SystemState.qml
      - config/quickshell/awtarchy/QuickSettings.qml
      - config/quickshell/awtarchy/Bar.qml
      - tests/test-hyprmoncfg-idle-safety.sh
      - .github/workflows/validate-hyprmoncfg-idle-safety.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Syntax
        run: |
          bash -n config/hypr/scripts/launch_handler.sh
          bash -n config/hypr/scripts/idle_inhibitor_global.sh
          bash -n config/hypr/scripts/hypridle_action.sh
          bash -n tests/test-hyprmoncfg-idle-safety.sh
      - name: Focused regression
        run: bash tests/test-hyprmoncfg-idle-safety.sh
