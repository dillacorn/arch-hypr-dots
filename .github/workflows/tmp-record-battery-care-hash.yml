name: One-use Battery Care managed hash

on:
  push:
    branches:
      - refactor/tlp-battery-care-thin-client

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: refactor/tlp-battery-care-thin-client

      - name: Record exact Battery Care detector hash
        shell: bash
        run: |
          set -Eeuo pipefail

          detector='config/hypr/scripts/quickshell_battery_care.sh'
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          expected='1b76cc179a1f3aa13a98fad6abc566bf88dbde3b26e905fbc86196d0d8a1b93a'
          actual="$(sha256sum "$detector" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            printf 'Refusing: expected detector hash %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }

          entry="${expected}"$'\t''.config/hypr/scripts/quickshell_battery_care.sh'
          if grep -Fqx "$entry" "$history"; then
            printf '%s\n' 'Managed hash already recorded; no-op.'
            exit 0
          fi

          printf '\n# 2026-09-06 generic TLP stop-only logical readback.\n%s\n' "$entry" >>"$history"
          bash tests/test-battery-care-detector-profiles.sh
          git diff --check

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- "$history"
          git commit -m 'chore: record Battery Care detector hash'
          git push origin HEAD:refactor/tlp-battery-care-thin-client
