name: Mark Handoff PR Ready

on:
  pull_request:
    paths:
      - .github/workflows/mark-pr111-ready.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: github.event.pull_request.number == 111 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready "$PR_URL"
