name: One-use Battery Care managed-history refresh

on:
  push:
    branches:
      - refactor/tlp-battery-care-thin-client

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Install updater regression dependency
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Refresh current managed stock hashes
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_parent='0695e697a7970c0269340a4f171bf80913430916'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            printf 'No-op: expected parent %s, found %s\n' "$expected_parent" "$actual_parent"
            exit 0
          fi

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          added=0
          while IFS= read -r repo_path; do
            repo_rel="${repo_path#./}"
            hash="$(sha256sum "$repo_path" | awk '{print $1}')"
            entry="${hash}"$'\t'".${repo_rel}"
            if ! grep -Fqx -- "$entry" "$history"; then
              printf '%s\t.%s\n' "$hash" "$repo_rel" >>"$history"
              printf 'Added managed hash: %s  .%s\n' "$hash" "$repo_rel"
              added=$((added + 1))
            fi
          done < <(
            {
              find ./config/quickshell/awtarchy -maxdepth 1 -type f -print
              find ./config/hypr/scripts -maxdepth 1 -type f \
                \( -name 'quickshell*' -o -name 'ddc_brightness.sh' -o -name 'hypr-ddc-brightness.sh' \) -print
            } | sort
          )

          (( added > 0 )) || {
            printf 'No missing current managed hashes.\n'
            exit 0
          }

          aur_scan_fixture_installed=0
          cleanup_fixture() {
            if (( aur_scan_fixture_installed == 1 )); then
              sudo rm -f -- /usr/bin/aur-scan
            fi
          }
          trap cleanup_fixture EXIT
          if [[ ! -x /usr/bin/aur-scan ]]; then
            sudo install -m 0755 tests/fixtures/aur-scan-version-only.sh /usr/bin/aur-scan
            aur_scan_fixture_installed=1
          fi

          bash tests/test-quickshell-updater-migration.sh
          git diff --check
          [[ "$(git diff --name-only)" == "$history" ]]

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- "$history"
          git commit -m 'chore: refresh Battery Care managed hashes'
          git push origin HEAD:refactor/tlp-battery-care-thin-client
