name: Refresh Launcher Managed History

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-launcher-managed-history.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Record verified launcher stock hash and remove helper
        env:
          EXPECTED_HASH: 774c3639210b767e6e772be1984a9d50c9f2220fb2666a8cf1c3b05a8039d70c
        run: |
          set -euo pipefail

          launcher='config/quickshell/awtarchy/Launcher.qml'
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          helper='.github/workflows/refresh-launcher-managed-history.yml'
          managed_path='.config/quickshell/awtarchy/Launcher.qml'

          actual_hash="$(sha256sum "$launcher" | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_HASH"

          entry="${EXPECTED_HASH}"$'\t'"${managed_path}"
          if ! grep -Fqx -- "$entry" "$history"; then
            printf '%s\n' "$entry" >>"$history"
          fi

          git rm -- "$helper"
          git add -- "$history"
          git diff --cached --check

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git commit -m 'chore: record launcher managed stock hash'
          git push origin HEAD:main
