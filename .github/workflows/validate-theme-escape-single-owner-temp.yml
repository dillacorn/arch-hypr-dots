name: Temporary Validate Theme Escape Single Owner

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-theme-escape-single-owner-temp.yml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'config/quickshell/awtarchy/shell.qml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Escape ownership regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          quick = Path('config/quickshell/awtarchy/QuickSettings.qml').read_text(encoding='utf-8')
          start = quick.index('        Rectangle {\n            id: panel')
          end = quick.index('\n            MouseArea {', start)
          panel = quick[start:end]
          if 'Keys.onEscapePressed:' in panel:
              raise SystemExit('FAIL: Quick Settings main panel still owns Escape')

          shell = Path('config/quickshell/awtarchy/shell.qml').read_text(encoding='utf-8')
          start = shell.index('    function closeActiveFloatingSurface() {')
          end = shell.index('\n    function flyoutWidth', start)
          block = shell[start:end]
          theme = block.index('if (ThemePicker.open)')
          close = block.index('ThemePicker.close();')
          surface = block.index('const surface = String(FlyoutManager.activeSurface')
          if not theme < close < surface:
              raise SystemExit('FAIL: application Escape stack does not prioritize ThemePicker')

          print('PASS: Escape has one application-level owner with ThemePicker priority.')
          PY
