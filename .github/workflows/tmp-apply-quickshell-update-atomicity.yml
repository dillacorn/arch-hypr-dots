name: TEMP Apply Quickshell Update Atomicity Fix

on:
  push:
    branches: [fix/quickshell-update-atomicity]
    paths:
      - '.github/workflows/tmp-apply-quickshell-update-atomicity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/quickshell-update-atomicity
      - name: Apply exact updater ordering fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')
          old = '''  ensure_quickshell_update_prerequisites
            snapshot_quickshell_update_legacy_paths

            apply_plan "$plan_file" || die "Update failed and user files were rolled back."
          '''
          new = '''  ensure_quickshell_update_prerequisites
            snapshot_quickshell_update_legacy_paths

            stop_quickshell_update_instances \\
              || die "Could not stop Quickshell safely before updating managed files."
            apply_plan "$plan_file" || die "Update failed and user files were rolled back."
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one updater mutation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused regression and runtime syntax
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash tests/test-quickshell-update-atomicity.sh
      - name: Commit updater fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'Stop Quickshell before managed updates'
          git push origin HEAD:fix/quickshell-update-atomicity
