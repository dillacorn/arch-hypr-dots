name: Apply tested flyout panel fade from PR

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 43 && github.event.pull_request.head.ref == 'flyout-panel-fade-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: flyout-panel-fade-fix
          fetch-depth: 0

      - name: Apply exact live-tested transform
        shell: bash
        run: |
          python3 tools/tmp_apply_flyout_fade.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test-flyout-toggle-debounce.sh')
          text = path.read_text()
          text, count = re.subn(
              r'require_source "\$MANAGER" \\\n'
              r"  'property int windowLookupRevision: 0' \\\n"
              r"  'managed flyout window lookup has no lifecycle refresh revision'\n"
              r'require_source "\$MANAGER" \\\n'
              r"  'const dependency = windowLookupRevision;' \\\n"
              r"  'managed flyout title lookup does not depend on the lifecycle refresh revision'\n"
              r'require_source "\$MANAGER" \\\n'
              r"  'windowLookupRevision\+\+;' \\\n"
              r"  'claiming a flyout does not refresh managed window bindings before show'\n\n",
              '',
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError('obsolete manager lifecycle assertions not found')
          path.write_text(text)
          PY
          bash -n tests/test-flyout-toggle-debounce.sh
          bash tests/test-flyout-toggle-debounce.sh
          git diff --check

      - name: Publish clean patched tree
        shell: bash
        run: |
          rm -f -- \
            tools/tmp_apply_flyout_fade.py \
            .github/workflows/apply-flyout-panel-fade-fix.yml \
            .github/workflows/pr-apply-flyout-panel-fade.yml \
            tmp-flyout-fade-trigger \
            tmp-flyout-fade-trigger-2 \
            tmp-flyout-fade-trigger-3
          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'fix: fade flyouts on their panels'
          git push origin HEAD:flyout-panel-fade-fix
