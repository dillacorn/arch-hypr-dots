name: TEMP Fix Quickshell Update Headless Path

on:
  push:
    branches: [fix/quickshell-update-atomicity]
    paths:
      - '.github/workflows/tmp-fix-quickshell-update-headless.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/quickshell-update-atomicity
          fetch-depth: 0
      - name: Install validation dependency
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Apply session-aware Quickshell stop logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')

          marker = 'start_quickshell_update_shell() {\n'
          helper = '''stop_quickshell_update_shell() {
            command -v hyprctl >/dev/null 2>&1 || return 0
            [[ -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" ]] || return 0
            stop_quickshell_update_instances
          }

          start_quickshell_update_shell() {
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one start helper marker, found {text.count(marker)}')
          text = text.replace(marker, helper, 1)

          main_start = text.find('  ensure_quickshell_update_prerequisites\n  snapshot_quickshell_update_legacy_paths')
          if main_start < 0:
              raise SystemExit('could not locate updater mutation section')
          apply_index = text.find('  apply_plan "$plan_file"', main_start)
          if apply_index < 0:
              raise SystemExit('could not locate apply_plan in updater mutation section')
          stop_index = text.find('stop_quickshell_update_instances', main_start, apply_index)
          if stop_index < 0:
              raise SystemExit('could not locate direct Quickshell stop before apply_plan')
          text = text[:stop_index] + 'stop_quickshell_update_shell' + text[stop_index + len('stop_quickshell_update_instances'):]
          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test-quickshell-update-atomicity.sh <<'EOF_TEST'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          IFS=$'\n\t'

          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          RUNTIME="${ROOT}/local/share/awtarchy/awtarchy-runtime.sh"

          python3 - "$RUNTIME" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          helper_start = text.find('stop_quickshell_update_shell() {')
          if helper_start < 0:
              raise SystemExit('FAIL: session-aware Quickshell update stop helper is missing')
          helper_end = text.find('\n}\n', helper_start)
          if helper_end < 0:
              raise SystemExit('FAIL: could not parse Quickshell update stop helper')
          helper = text[helper_start:helper_end]
          if 'command -v hyprctl >/dev/null 2>&1 || return 0' not in helper:
              raise SystemExit('FAIL: headless updates do not bypass Quickshell process shutdown')
          if '[[ -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" ]] || return 0' not in helper:
              raise SystemExit('FAIL: non-Hyprland updates do not bypass Quickshell process shutdown')
          if 'stop_quickshell_update_instances' not in helper:
              raise SystemExit('FAIL: live Hyprland updates do not stop Quickshell instances')

          start = text.find('ensure_quickshell_update_prerequisites\n  snapshot_quickshell_update_legacy_paths')
          if start < 0:
              raise SystemExit('FAIL: could not locate the Quickshell update mutation section')
          apply_index = text.find('apply_plan "$plan_file"', start)
          if apply_index < 0:
              raise SystemExit('FAIL: could not locate apply_plan in the Quickshell update path')
          stop_index = text.find('stop_quickshell_update_shell', start, apply_index)
          if stop_index < 0:
              raise SystemExit('FAIL: live Quickshell is not stopped before managed files are mutated')
          start_index = text.find('start_quickshell_update_shell', apply_index)
          if start_index < 0:
              raise SystemExit('FAIL: Quickshell is not restarted after the managed update')

          print('PASS: live Hyprland updates stop Quickshell before mutation while headless updates remain valid.')
          PY
          EOF_TEST
          chmod 0755 tests/test-quickshell-update-atomicity.sh
      - name: Validate focused and updater integration regressions
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-quickshell-update-atomicity.sh
          shellcheck tests/test-quickshell-update-atomicity.sh
          bash tests/test-quickshell-update-atomicity.sh
          bash tests/test-quickshell-updater-migration.sh
      - name: Commit final fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-quickshell-update-headless.yml
          git rm .github/workflows/tmp-fix-quickshell-update-headless-v2.yml
          git add local/share/awtarchy/awtarchy-runtime.sh tests/test-quickshell-update-atomicity.sh
          git commit -m 'Handle headless Quickshell updates safely'
          git push origin HEAD:fix/quickshell-update-atomicity
