name: One-use clipboard history refresh

on:
  push:
    branches:
      - hardening/clipboard-thumbnail-resource-bounds
    paths:
      - .github/workflows/one-use-clipboard-history.yml

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.repository == 'dillacorn/awtarchy' &&
      github.ref == 'refs/heads/hardening/clipboard-thumbnail-resource-bounds' &&
      github.event.head_commit.message == 'Refresh clipboard managed hash bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append current managed hash
        run: |
          source_path='config/hypr/scripts/quickshell_clipboard.sh'
          managed_path='.config/hypr/scripts/quickshell_clipboard.sh'
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          hash="$(sha256sum -- "$source_path" | awk '{print $1}')"
          line="${hash}"$'\t'"${managed_path}"
          grep -Fxq -- "$line" "$history" || printf '%s\n' "$line" >>"$history"
          bash -n "$source_path"
          bash tests/test-quickshell-clipboard-thumbnails.sh
          git diff --check

      - name: Commit history and remove bridge
        run: |
          rm -- .github/workflows/one-use-clipboard-history.yml
          git add -- \
            .github/workflows/one-use-clipboard-history.yml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Refresh clipboard managed history'
          git push origin HEAD:hardening/clipboard-thumbnail-resource-bounds
