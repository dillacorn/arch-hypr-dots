name: Inspect current v2.0.0 release notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-v2-release-notes.yml

permissions:
  contents: write

jobs:
  inspect-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save current release body to temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" --json body,name,tagName,targetCommitish,publishedAt > /tmp/v2-release.json
          jq -r '.body' /tmp/v2-release.json > /tmp/v2-release-body.md

          git switch -c release-v2-notes-inspection
          cp /tmp/v2-release-body.md .release-v2-current.md
          git add .release-v2-current.md
          git commit -m 'Save current v2.0.0 release notes for review'
          git push origin release-v2-notes-inspection

          git switch main
          git rm .github/workflows/inspect-v2-release-notes.yml
          git commit -m 'Remove one-time v2.0.0 inspection workflow'
          git push origin main
