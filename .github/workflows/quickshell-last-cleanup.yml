name: Quickshell last cleanup

on:
  push:
    branches:
      - quickshell-conversion-testing
    paths:
      - .github/workflows/quickshell-last-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0

      - name: Clean active legacy names and file mode
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("config/hypr/hyprland.lua")
          text = path.read_text()
          text = text.replace(
              "-- Quickshell application launcher: Fuzzel-like floating search window.",
              "-- Quickshell application launcher: bar-aware floating search window.",
          )
          text = text.replace("-- Mako dismiss", "-- Notification dismiss")
          path.write_text(text)
          PY

          chmod +x config/hypr/scripts/quickshell_launcher_position.sh
          rm -f .github/workflows/quickshell-last-cleanup.yml

          ! grep -Fq -- '-- Mako dismiss' config/hypr/hyprland.lua
          ! grep -Fq 'Fuzzel-like' config/hypr/hyprland.lua
          test -x config/hypr/scripts/quickshell_launcher_position.sh
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finish Quickshell conversion cleanup"
          git push origin HEAD:quickshell-conversion-testing
