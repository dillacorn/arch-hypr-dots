name: Apply Direct AUR Scanner Stage 5 Docs

on:
  push:
    branches:
      - feature/direct-aur-scanner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/direct-aur-scanner
          fetch-depth: 0

      - name: Apply Tips AUR documentation migration
        run: python3 .github/temp-stage5-docs-apply.py

      - name: Validate Stage 5 documentation
        shell: bash
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/awtarchy-tips-tui.sh
          bash -n tests/test-aur-scanner-docs.sh
          shellcheck tests/test-aur-scanner-docs.sh
          bash tests/test-awtarchy-tips-links.sh
          bash tests/test-aur-scanner-docs.sh
          bash tests/test-aur-helper-policy.sh
          bash tests/test-aur-scanner-updater-migration.sh
          git diff --check

      - name: Commit Stage 5 Tips migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/hypr/scripts/awtarchy-tips-tui.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Point Awtarchy Tips to upstream aur-scanner'
          git push origin HEAD:feature/direct-aur-scanner
