name: Apply PR77 Clock Date Persistence

on:
  push:
    branches:
      - feature/persist-clock-date-state
    paths:
      - .github/workflows/pr77-clock-date-write.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/persist-clock-date-state
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Apply and validate clock/date persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/pr77-clock-date-persistence.py
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-clock-date-persistence.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh tests/test-clock-date-persistence.sh
          bash tests/test-clock-date-persistence.sh
          git diff --check

      - name: Commit production changes and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr77-clock-date-persistence.py
          git rm .github/workflows/pr77-clock-date-write.yml
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/Bar.qml \
            config/quickshell/awtarchy/BarState.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Persist per-display clock date state'
          git push origin HEAD:feature/persist-clock-date-state
