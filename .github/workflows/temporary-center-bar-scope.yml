name: Temporary Center Bar Appearance Scope

on:
  push:
    branches:
      - feature/bar-icon-customization

permissions:
  contents: write

jobs:
  center-scope:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/bar-icon-customization
          fetch-depth: 0
      - name: Center bar appearance scope selector
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('config/quickshell/awtarchy/BarSettingsSection.qml')
          lines = path.read_text().splitlines(keepends=True)

          title_index = next(i for i, line in enumerate(lines) if 'text: "Bar Appearance"' in line)
          display_index = next(i for i, line in enumerate(lines[title_index + 1:], title_index + 1)
                               if 'text: "Display scale"' in line)
          start = max(i for i in range(title_index + 1) if lines[i].strip() == 'RowLayout {')
          end = max(i for i in range(title_index + 1, display_index + 1)
                    if lines[i].strip() == 'RowLayout {')

          if start >= end:
              raise SystemExit('could not isolate Bar Appearance header row')

          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          i1 = indent + '    '
          i2 = i1 + '    '
          i3 = i2 + '    '

          replacement = [
              indent + 'Item {\n',
              i1 + 'Layout.fillWidth: true\n',
              i1 + 'Layout.preferredHeight: 26\n',
              '\n',
              i1 + 'Text {\n',
              i2 + 'anchors.left: parent.left\n',
              i2 + 'anchors.verticalCenter: parent.verticalCenter\n',
              i2 + 'text: "Bar Appearance"\n',
              i2 + 'color: Theme.foreground\n',
              i2 + 'font.family: Theme.fontFamily\n',
              i2 + 'font.pixelSize: 11\n',
              i2 + 'font.bold: true\n',
              i1 + '}\n',
              '\n',
              i1 + 'Row {\n',
              i2 + 'anchors.horizontalCenter: parent.horizontalCenter\n',
              i2 + 'anchors.verticalCenter: parent.verticalCenter\n',
              i2 + 'spacing: 5\n',
              '\n',
              i2 + 'SettingsButton {\n',
              i3 + 'label: "‹"\n',
              i3 + 'textSize: 11\n',
              i3 + 'onClicked: root.cycleTarget(-1)\n',
              i2 + '}\n',
              '\n',
              i2 + 'Text {\n',
              i3 + 'width: 240\n',
              i3 + 'height: 24\n',
              i3 + 'text: "Apply to: " + root.targetLabel()\n',
              i3 + 'color: Theme.foreground\n',
              i3 + 'font.family: Theme.fontFamily\n',
              i3 + 'font.pixelSize: 10\n',
              i3 + 'horizontalAlignment: Text.AlignHCenter\n',
              i3 + 'verticalAlignment: Text.AlignVCenter\n',
              i3 + 'elide: Text.ElideMiddle\n',
              i2 + '}\n',
              '\n',
              i2 + 'SettingsButton {\n',
              i3 + 'label: "›"\n',
              i3 + 'textSize: 11\n',
              i3 + 'onClicked: root.cycleTarget(1)\n',
              i2 + '}\n',
              i1 + '}\n',
              '\n',
              i1 + 'Row {\n',
              i2 + 'anchors.right: parent.right\n',
              i2 + 'anchors.verticalCenter: parent.verticalCenter\n',
              i2 + 'spacing: 5\n',
              '\n',
              i2 + 'SettingsButton {\n',
              i3 + 'label: "Themes"\n',
              i3 + 'textSize: 9\n',
              i3 + 'onClicked: root.themePickerRequested()\n',
              i2 + '}\n',
              '\n',
              i2 + 'SettingsButton {\n',
              i3 + 'label: "Reset"\n',
              i3 + 'textSize: 9\n',
              i3 + 'onClicked: root.resetAppearance()\n',
              i2 + '}\n',
              i1 + '}\n',
              indent + '}\n',
              '\n',
          ]

          lines[start:end] = replacement
          path.write_text(''.join(lines))
          PY

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          source_file='config/quickshell/awtarchy/BarSettingsSection.qml'
          rel='.config/quickshell/awtarchy/BarSettingsSection.qml'
          digest="$(sha256sum "$source_file" | awk '{print $1}')"
          entry="${digest}"$'\t'"${rel}"
          grep -Fxq -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"

          git diff --check
          git diff -- "$source_file" "$history"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$source_file" "$history"
          git commit -m 'Center bar appearance target selector'
          git push origin HEAD:feature/bar-icon-customization
