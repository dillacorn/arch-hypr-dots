name: Validate Bar Transparency Drag Branch

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-bar-transparency-drag-branch.yml'
      - 'config/quickshell/awtarchy/BarState.qml'
      - 'config/quickshell/awtarchy/BarSettingsSection.qml'
      - 'tests/test-bar-transparency.sh'

permissions:
  contents: read

jobs:
  bar-transparency-drag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate transparency drag contract
        run: |
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bar-transparency.sh
          shellcheck tests/test-bar-transparency.sh
          bash tests/test-bar-transparency.sh
