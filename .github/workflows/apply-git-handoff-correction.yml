name: Apply Git-Testing Handoff Correction

on:
  pull_request:
    paths:
      - .github/workflows/apply-git-handoff-correction.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct extraction guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/bin/awtarchy')
          text = path.read_text(encoding='utf-8')

          wrong = 'die "Failed to extract Git-testing package archive for revision ${revision}."'
          if text.count(wrong) != 1:
              raise SystemExit(f'expected one misplaced extraction message, found {text.count(wrong)}')
          text = text.replace(wrong, 'die "Failed to extract updater commit ${commit}."', 1)

          runtime_anchor = 'testing_runtime="${repo_dir}/local/share/awtarchy/awtarchy-runtime.sh"'
          runtime_pos = text.find(runtime_anchor)
          if runtime_pos < 0:
              raise SystemExit('testing runtime anchor not found')

          tar_line = '  tar -xzf "$archive" -C "$tmp"\n'
          tar_pos = text.rfind(tar_line, 0, runtime_pos)
          if tar_pos < 0:
              raise SystemExit('Git-testing tar extraction before runtime anchor not found')

          guarded = '''  if ! tar -xzf "$archive" -C "$tmp"; then
            rm -rf -- "$tmp"
            die "Failed to extract Git-testing package archive for revision ${revision}."
          fi
          '''
          text = text[:tar_pos] + guarded + text[tar_pos + len(tar_line):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet -- local/bin/awtarchy; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local/bin/awtarchy
          git commit -m 'fix: correct git-testing archive cleanup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
