name: Apply AurGuard Scanner Review Policy V2

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/aur-scan-integration

      - name: Apply scanner review policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bashrc = Path('bashrc')
          text = bashrc.read_text(encoding='utf-8')

          helper_start = text.index('_aur_guard_scan_checkout_with_aur_scan() {')
          helper_end = text.index('\n_aur_guard_normalize_srcinfo() {', helper_start)
          old_helper = text[helper_start:helper_end]
          if '--fail-on high' not in old_helper:
              raise SystemExit('existing helper no longer has the expected old severity gate')

          new_helper = r'''declare -a _AUR_GUARD_SCAN_REVIEW_FINDINGS=()

          _aur_guard_has_scan_review() {
            (( ${#_AUR_GUARD_SCAN_REVIEW_FINDINGS[@]} > 0 ))
          }

          _aur_guard_print_scan_review() {
            local record pkg id severity title location snippet
            local separator=$'\x1f'

            _aur_guard_has_scan_review || return 0

            printf '\nAUR Scan heuristic review findings:\n'
            for record in "${_AUR_GUARD_SCAN_REVIEW_FINDINGS[@]}"; do
              IFS="$separator" read -r pkg id severity title location snippet <<< "$record"
              printf '  [%s] %s %s: %s\n' "$severity" "$id" "$pkg" "$title"
              [[ -z "$location" ]] || printf '    Location: %s\n' "$location"
              [[ -z "$snippet" ]] || printf '    Code: %s\n' "$snippet"
            done
          }

          _aur_guard_review_required() {
            local msg="$1"
            printf '\n\033[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
            printf '\033[1;33mREVIEW REQUIRED:\033[0m %s\n' "$msg"
            printf '\033[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          }

          _aur_guard_confirm_scan_review_install() {
            local pkg="$1"
            local answer

            _aur_guard_has_scan_review || return 0

            _aur_guard_print_scan_review
            printf '\nAUR Guard: aur-scan reported HIGH/CRITICAL heuristic findings for this exact verified transaction.\n'
            printf 'These findings require review but are not, by themselves, proof of malicious code.\n'

            if [[ ! -t 0 || ! -t 1 ]]; then
              _aur_guard_fail "interactive confirmation is required before building $pkg with HIGH/CRITICAL aur-scan findings"
              return 1
            fi

            printf 'Continue to the clean-root build and install for %s? [y/N]: ' "$pkg"
            read -r answer || return 1
            case "${answer,,}" in
              y|yes) return 0 ;;
              *) return 1 ;;
            esac
          }

          _aur_guard_scan_checkout_with_aur_scan() {
            local pkg="$1"
            local pkgdir="$2"
            local scanner status scan_json parsed record
            local severity id category title description location snippet recommendation
            local separator=$'\x1f'

            if [[ ${_AUR_GUARD_AUR_SCAN_BOOTSTRAP:-0} == 1 ]]; then
              printf 'AUR Verify: aur-scan bootstrap is in progress; built-in AUR Guard checks remain active for %s.\n' \
                "$pkg"
              return 0
            fi

            scanner=$(type -P aur-scan 2>/dev/null) || {
              _aur_guard_fail "aur-scan is required before evaluating $pkg. Install $_AUR_GUARD_AUR_SCAN_PACKAGE with: aurinstall $_AUR_GUARD_AUR_SCAN_PACKAGE"
              return 127
            }

            scan_json=$(mktemp) || {
              _aur_guard_fail "could not create temporary aur-scan result storage for $pkg"
              return 1
            }

            printf 'AUR Verify: running aur-scan on the exact fetched checkout for %s.\n' "$pkg"
            if "$scanner" scan "$pkgdir" --format json >"$scan_json"; then
              status=0
            else
              status=$?
            fi

            if (( status != 0 )); then
              rm -f -- "$scan_json"
              _aur_guard_fail "aur-scan could not scan the exact fetched checkout for $pkg"
              return "$status"
            fi

            if ! parsed=$(python3 - "$scan_json" <<'PY_SCAN'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, 'r', encoding='utf-8') as handle:
                  data = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f'invalid aur-scan JSON: {exc}')

          if not isinstance(data, dict):
              raise SystemExit('aur-scan result is not an object')
          if not isinstance(data.get('package_name'), str) or not isinstance(data.get('package_version'), str):
              raise SystemExit('aur-scan result lacks package identity strings')
          findings = data.get('findings')
          if not isinstance(findings, list):
              raise SystemExit('aur-scan result lacks a findings array')

          allowed = {'critical', 'high', 'medium', 'low', 'info'}
          sep = '\x1f'

          def clean(value):
              if value is None:
                  return ''
              if not isinstance(value, str):
                  raise SystemExit('aur-scan finding contains a non-string text field')
              return value.replace('\x1f', ' ').replace('\t', ' ').replace('\r', ' ').replace('\n', ' ').strip()

          for finding in findings:
              if not isinstance(finding, dict):
                  raise SystemExit('aur-scan finding is not an object')
              severity = clean(finding.get('severity')).lower()
              if severity not in allowed:
                  raise SystemExit(f'aur-scan finding has unknown severity: {severity}')
              ident = clean(finding.get('id'))
              category = clean(finding.get('category'))
              title = clean(finding.get('title'))
              description = clean(finding.get('description'))
              recommendation = clean(finding.get('recommendation'))
              if not ident or not category or not title or not description or not recommendation:
                  raise SystemExit('aur-scan finding lacks required evidence fields')
              loc = finding.get('location')
              if not isinstance(loc, dict):
                  raise SystemExit('aur-scan finding lacks a location object')
              file_name = clean(loc.get('file'))
              line = loc.get('line')
              if line is not None and (not isinstance(line, int) or isinstance(line, bool) or line < 1):
                  raise SystemExit('aur-scan finding has an invalid line number')
              location = file_name
              if line is not None:
                  location = f'{file_name}:{line}' if file_name else str(line)
              snippet = clean(loc.get('snippet'))
              print(sep.join([
                  severity.upper(), ident, category, title, description,
                  location, snippet, recommendation,
              ]))
          PY_SCAN
            ); then
              rm -f -- "$scan_json"
              _aur_guard_fail "aur-scan returned malformed or unsupported JSON for $pkg"
              return 1
            fi
            rm -f -- "$scan_json"

            if [[ -z "$parsed" ]]; then
              printf 'AUR Scan: %s reported no security findings.\n' "$pkg"
              return 0
            fi

            printf 'AUR Scan findings for %s:\n' "$pkg"
            while IFS= read -r record; do
              [[ -n "$record" ]] || continue
              IFS="$separator" read -r severity id category title description location snippet recommendation <<< "$record"
              printf '  [%s] %s %s\n' "$severity" "$id" "$title"
              printf '    %s\n' "$description"
              printf '    Category: %s\n' "$category"
              [[ -z "$location" ]] || printf '    Location: %s\n' "$location"
              [[ -z "$snippet" ]] || printf '    Code: %s\n' "$snippet"
              printf '    Recommendation: %s\n' "$recommendation"

              case "$severity" in
                HIGH|CRITICAL)
                  _AUR_GUARD_SCAN_REVIEW_FINDINGS+=(
                    "${pkg}${separator}${id}${separator}${severity}${separator}${title}${separator}${location}${separator}${snippet}"
                  )
                  ;;
              esac
            done <<< "$parsed"
          }
          '''
          text = text[:helper_start] + new_helper + text[helper_end:]

          reset_old = '  _AUR_GUARD_HISTORICAL_MATCHES=()\n  _AUR_GUARD_CONTEXT_WARNINGS=()\n  _AUR_GUARD_INSTALL_STARTED=0\n'
          reset_new = '  _AUR_GUARD_HISTORICAL_MATCHES=()\n  _AUR_GUARD_CONTEXT_WARNINGS=()\n  _AUR_GUARD_SCAN_REVIEW_FINDINGS=()\n  _AUR_GUARD_INSTALL_STARTED=0\n'
          if text.count(reset_old) != 1:
              raise SystemExit(f'expected one verification reset block, found {text.count(reset_old)}')
          text = text.replace(reset_old, reset_new, 1)

          verify_start = text.index('aurverify() {')
          verify_end = text.index('\naurinstall() {', verify_start)
          verify = text[verify_start:verify_end]
          verify_old = '''  if (( status == 0 )); then
            if _aur_guard_has_guarded_matches; then
              _aur_guard_print_historical_summary
              _aur_guard_print_context_summary
              _aur_guard_pass "$pkg and all required AUR dependencies passed ${_AUR_GUARD_MODE} verification. Review warnings remain. The requested package was not installed."
            else
              _aur_guard_pass "$pkg and all required AUR dependencies passed ${_AUR_GUARD_MODE} verification. The requested package was not installed."
            fi
          fi
          '''
          verify_new = '''  if (( status == 0 )); then
            if _aur_guard_has_scan_review; then
              if _aur_guard_has_guarded_matches; then
                _aur_guard_print_historical_summary
                _aur_guard_print_context_summary
              fi
              _aur_guard_print_scan_review
              _aur_guard_review_required "$pkg and all required AUR dependencies passed ${_AUR_GUARD_MODE} hard verification, but HIGH/CRITICAL aur-scan heuristic findings require human review. The requested package was not installed."
              status=2
            elif _aur_guard_has_guarded_matches; then
              _aur_guard_print_historical_summary
              _aur_guard_print_context_summary
              _aur_guard_pass "$pkg and all required AUR dependencies passed ${_AUR_GUARD_MODE} verification. Review warnings remain. The requested package was not installed."
            else
              _aur_guard_pass "$pkg and all required AUR dependencies passed ${_AUR_GUARD_MODE} verification. The requested package was not installed."
            fi
          fi
          '''
          if verify.count(verify_old) != 1:
              raise SystemExit(f'expected one aurverify status block inside aurverify, found {verify.count(verify_old)}')
          verify = verify.replace(verify_old, verify_new, 1)
          text = text[:verify_start] + verify + text[verify_end:]

          install_start = text.index('aurinstall() {')
          install_end = text.index('\n# Backward-compatible AUR Guard install command.', install_start)
          install = text[install_start:install_end]
          build_old = '''    if ! _aur_guard_confirm_identity_changes; then
              _aur_guard_refuse_install "$pkg" 'the maintainer-change confirmation was not accepted'
              _aur_guard_cleanup_work
              return 1
            fi

            if ! _aur_guard_build_verified_artifacts "$pkg"; then
          '''
          build_new = '''    if ! _aur_guard_confirm_identity_changes; then
              _aur_guard_refuse_install "$pkg" 'the maintainer-change confirmation was not accepted'
              _aur_guard_cleanup_work
              return 1
            fi

            if ! _aur_guard_confirm_scan_review_install "$pkg"; then
              _aur_guard_refuse_install "$pkg" 'HIGH/CRITICAL aur-scan heuristic review was not accepted'
              _aur_guard_cleanup_work
              return 1
            fi

            if ! _aur_guard_build_verified_artifacts "$pkg"; then
          '''
          if install.count(build_old) != 1:
              raise SystemExit(f'expected one pre-build boundary inside aurinstall, found {install.count(build_old)}')
          install = install.replace(build_old, build_new, 1)
          text = text[:install_start] + install + text[install_end:]
          bashrc.write_text(text, encoding='utf-8')

          test = Path('tests/test-security-boundaries.sh')
          t = test.read_text(encoding='utf-8')
          comment_old = '# PKGBUILD. High and critical aur-scan findings are a hard failure. The stable\n# aur-scanner package is the automatic bootstrap target when the binary is absent.\n'
          comment_new = '# PKGBUILD. Scanner findings remain visible evidence; scanner execution or malformed\n# output fails closed. The stable aur-scanner package is the automatic bootstrap target.\n'
          if t.count(comment_old) != 1:
              raise SystemExit('old aur-scan policy comment was not found exactly once')
          t = t.replace(comment_old, comment_new, 1)
          assert_old = '# shellcheck disable=SC2016\nassert_contains "$BASHRC" '\''"$scanner" scan "$pkgdir" --fail-on high'\''\n'
          assert_new = '# shellcheck disable=SC2016\nassert_contains "$BASHRC" '\''"$scanner" scan "$pkgdir" --format json'\''\nassert_not_contains "$BASHRC" '\''--fail-on high'\''\n'
          if t.count(assert_old) != 1:
              raise SystemExit('old scanner command assertion was not found exactly once')
          t = t.replace(assert_old, assert_new, 1)

          fake_old = '''cat >"${aur_scan_fakebin}/aur-scan" <<'EOF_AUR_SCAN'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\\n' "$@" >"${AWTARCHY_TEST_AUR_SCAN_LOG:?}"
          status="${AWTARCHY_TEST_AUR_SCAN_STATUS:-0}"
          (( status == 0 ))
          EOF_AUR_SCAN
          '''
          fake_new = '''cat >"${aur_scan_fakebin}/aur-scan" <<'EOF_AUR_SCAN'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\\n' "$@" >"${AWTARCHY_TEST_AUR_SCAN_LOG:?}"
          status="${AWTARCHY_TEST_AUR_SCAN_STATUS:-0}"
          (( status == 0 )) || exit "$status"
          printf '%s\\n' '{"package_name":"fixture","package_version":"1-1","findings":[],"scanned_files":["PKGBUILD"],"timestamp":"2026-09-02T00:00:00Z","scan_duration_ms":1}'
          EOF_AUR_SCAN
          '''
          if t.count(fake_old) != 1:
              raise SystemExit('old fake scanner was not found exactly once')
          t = t.replace(fake_old, fake_new, 1)

          args_old = '''[[ ${aur_scan_args[2]} == --fail-on && ${aur_scan_args[3]} == high ]] \\
            || fail 'AUR Guard did not block high and critical aur-scan findings'
          '''
          args_new = '''[[ ${aur_scan_args[2]} == --format && ${aur_scan_args[3]} == json ]] \\
            || fail 'AUR Guard did not request structured aur-scan JSON output'
          '''
          if t.count(args_old) != 1:
              raise SystemExit('old scanner argument assertion was not found exactly once')
          t = t.replace(args_old, args_new, 1)
          test.write_text(t, encoding='utf-8')
          PY

          bash -n bashrc
          bash -n tests/test-security-boundaries.sh
          bash -n tests/test-aur-scan-review-policy.sh
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bashrc tests/test-security-boundaries.sh
          git commit -m 'Review aur-scan heuristics without blind blocking'
          git push origin HEAD:feature/aur-scan-integration
