name: Apply Bar Transparency Drag

on:
  push:
    branches:
      - feature/bar-transparency

permissions:
  contents: read

jobs:
  apply:
    if: github.event.head_commit.message == 'Run draggable transparency apply helper'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/bar-transparency

      - name: Apply draggable transparency control
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          state = Path("config/quickshell/awtarchy/BarState.qml")
          settings = Path("config/quickshell/awtarchy/BarSettingsSection.qml")

          rep(state,
              "    property var liveIconScales: ({})\n",
              "    property var liveIconScales: ({})\n    property var liveBarTransparencies: ({})\n",
              "live transparency property")

          rep(state,
              "\n    function clearLiveOverrides(name) {\n",
              "\n    function setLiveBarTransparency(name, value) {\n"
              "        const numeric = Number(value);\n"
              "        if (!Number.isFinite(numeric))\n"
              "            return;\n"
              "        const percent = Math.max(0, Math.min(100, Math.round(numeric)));\n"
              "        if (liveBarTransparencies[name] === percent)\n"
              "            return;\n"
              "        const next = Object.assign({}, liveBarTransparencies);\n"
              "        next[name] = percent;\n"
              "        liveBarTransparencies = next;\n"
              "        revision++;\n"
              "    }\n\n"
              "    function clearLiveBarTransparency(name) {\n"
              "        if (liveBarTransparencies[name] === undefined)\n"
              "            return;\n"
              "        const next = Object.assign({}, liveBarTransparencies);\n"
              "        delete next[name];\n"
              "        liveBarTransparencies = next;\n"
              "        revision++;\n"
              "    }\n\n"
              "    function clearLiveOverrides(name) {\n",
              "live transparency helpers")

          rep(state,
              "        const scales = Object.assign({}, liveIconScales);\n",
              "        const scales = Object.assign({}, liveIconScales);\n        const transparencies = Object.assign({}, liveBarTransparencies);\n",
              "clear override clone")
          rep(state,
              "        delete scales[name];\n",
              "        delete scales[name];\n        delete transparencies[name];\n",
              "clear override delete")
          rep(state,
              "        liveIconScales = scales;\n        revision++;\n    }\n\n    FileView {\n",
              "        liveIconScales = scales;\n        liveBarTransparencies = transparencies;\n        revision++;\n    }\n\n    FileView {\n",
              "clear override assignment")

          old_resolver = "    function barTransparencyFor(name) {\n        const dependency = revision;\n        const mon = monitorState(name);\n        const percent = Number(mon.bar_transparency === undefined ? 0 : mon.bar_transparency);\n        if (!Number.isFinite(percent))\n            return 0;\n        return Math.max(0, Math.min(100, Math.round(percent)));\n    }\n"
          new_resolver = "    function barTransparencyFor(name) {\n        const dependency = revision;\n        const override = liveBarTransparencies[name];\n        const mon = monitorState(name);\n        const percent = Number(override !== undefined\n            ? override\n            : (mon.bar_transparency === undefined ? 0 : mon.bar_transparency));\n        if (!Number.isFinite(percent))\n            return 0;\n        return Math.max(0, Math.min(100, Math.round(percent)));\n    }\n"
          rep(state, old_resolver, new_resolver, "transparency resolver")

          rep(settings,
              "    property var commandQueue: []\n",
              "    property var commandQueue: []\n    property var activeCommand: []\n",
              "active command property")
          rep(settings,
              "    property int barTransparencyHoverPercent: -1\n",
              "    property int barTransparencyHoverPercent: -1\n    property bool barTransparencyDragging: false\n    property var barTransparencyDragTargets: []\n",
              "drag properties")

          old_raw = "    function rawBarTransparency(name) {\n        const state = BarState.monitorState(name) || ({});\n        const value = Number(state.bar_transparency === undefined ? 0 : state.bar_transparency);\n        return Number.isFinite(value) ? Math.max(0, Math.min(100, Math.round(value))) : 0;\n    }\n"
          new_raw = "    function rawBarTransparency(name) {\n        const value = Number(BarState.barTransparencyFor(name));\n        return Number.isFinite(value) ? Math.max(0, Math.min(100, Math.round(value))) : 0;\n    }\n"
          rep(settings, old_raw, new_raw, "live transparency reader")

          rep(settings,
              "        commandQueue = commandQueue.slice(1);\n        writer.exec(next);\n",
              "        commandQueue = commandQueue.slice(1);\n        activeCommand = next;\n        writer.exec(next);\n",
              "active command tracking")

          old_functions = "    function setTransparencyPercent(value) {\n        const numeric = Number(value);\n        if (!Number.isFinite(numeric))\n            return;\n        const next = Math.max(0, Math.min(100, Math.round(numeric)));\n        message = \"Bar transparency \" + next + \"%\";\n        enqueue(\"settransparency\", next);\n    }\n\n    function adjustTransparency(delta) {\n        setTransparencyPercent(baseBarTransparency() + delta);\n    }\n"
          new_functions = "    function clampTransparencyPercent(value) {\n        const numeric = Number(value);\n        if (!Number.isFinite(numeric))\n            return -1;\n        return Math.max(0, Math.min(100, Math.round(numeric)));\n    }\n\n    function previewTransparencyPercent(value) {\n        const next = clampTransparencyPercent(value);\n        if (next < 0 || !barTransparencyDragging)\n            return;\n        barTransparencyHoverPercent = next;\n        for (const target of barTransparencyDragTargets)\n            BarState.setLiveBarTransparency(target, next);\n    }\n\n    function beginTransparencyDrag(value) {\n        const targets = resolvedTargets();\n        if (targets.length === 0)\n            return;\n        barTransparencyDragTargets = targets.slice();\n        barTransparencyDragging = true;\n        previewTransparencyPercent(value);\n    }\n\n    function commitTransparencyDrag() {\n        if (!barTransparencyDragging)\n            return;\n        const value = clampTransparencyPercent(barTransparencyHoverPercent);\n        const targets = barTransparencyDragTargets.slice();\n        barTransparencyDragging = false;\n        barTransparencyDragTargets = [];\n        if (value < 0 || targets.length === 0)\n            return;\n        const next = commandQueue.slice();\n        for (const target of targets)\n            next.push([managerScript, \"settransparency\", target, String(value)]);\n        commandQueue = next;\n        message = \"Bar transparency \" + value + \"%\";\n        runNextCommand();\n    }\n\n    function cancelTransparencyDrag() {\n        for (const target of barTransparencyDragTargets)\n            BarState.clearLiveBarTransparency(target);\n        barTransparencyDragging = false;\n        barTransparencyDragTargets = [];\n        barTransparencyHoverPercent = -1;\n    }\n\n    function setTransparencyPercent(value) {\n        const next = clampTransparencyPercent(value);\n        if (next < 0)\n            return;\n        message = \"Bar transparency \" + next + \"%\";\n        enqueue(\"settransparency\", next);\n    }\n\n    function adjustTransparency(delta) {\n        setTransparencyPercent(baseBarTransparency() + delta);\n    }\n"
          rep(settings, old_functions, new_functions, "drag functions")

          old_writer = "    Process {\n        id: writer\n        onExited: {\n            BarState.refresh();\n            root.runNextCommand();\n        }\n    }\n"
          new_writer = "    Process {\n        id: writer\n        onExited: {\n            const completed = root.activeCommand;\n            root.activeCommand = [];\n            BarState.refresh();\n            if (completed.length >= 3 && completed[1] === \"settransparency\")\n                Qt.callLater(() => BarState.clearLiveBarTransparency(String(completed[2])));\n            root.runNextCommand();\n        }\n    }\n"
          rep(settings, old_writer, new_writer, "writer completion")

          tooltip = "\n                    Rectangle {\n                        visible: root.barTransparencyHoverPercent >= 0\n                        width: 46\n                        height: 21\n                        x: Math.max(0, Math.min(parent.width - width,\n                            parent.width * root.barTransparencyHoverPercent / 100 - width / 2))\n                        y: -25\n                        color: Theme.background\n                        border.width: 1\n                        border.color: Theme.focus\n                        z: 4\n\n                        Text {\n                            anchors.centerIn: parent\n                            text: root.barTransparencyHoverPercent + \"%\"\n                            color: Theme.foreground\n                            font.family: Theme.fontFamily\n                            font.pixelSize: 9\n                        }\n                    }\n"
          rep(settings,
              "\n                    MouseArea {\n                        anchors.fill: parent\n                        hoverEnabled: true\n                        cursorShape: Qt.PointingHandCursor\n                        onPositionChanged: mouse => root.barTransparencyHoverPercent = Math.max(0,\n                            Math.min(100, Math.round(mouse.x * 100 / width)))\n                        onExited: root.barTransparencyHoverPercent = -1\n                        onPressed: mouse => root.setTransparencyPercent(mouse.x * 100 / width)\n                    }\n",
              tooltip + "\n                    MouseArea {\n                        anchors.fill: parent\n                        hoverEnabled: true\n                        cursorShape: Qt.PointingHandCursor\n                        onPositionChanged: mouse => {\n                            root.barTransparencyHoverPercent = Math.max(0,\n                                Math.min(100, Math.round(mouse.x * 100 / width)));\n                            if (pressed)\n                                root.previewTransparencyPercent(root.barTransparencyHoverPercent);\n                        }\n                        onExited: {\n                            if (!pressed)\n                                root.barTransparencyHoverPercent = -1;\n                        }\n                        onPressed: mouse => root.beginTransparencyDrag(mouse.x * 100 / width)\n                        onReleased: root.commitTransparencyDrag()\n                        onCanceled: root.cancelTransparencyDrag()\n                    }\n",
              "slider mouse area")

          old_tail = "\n                Text {\n                    Layout.preferredWidth: 52\n                    text: root.barTransparencyHoverPercent >= 0\n                        ? root.barTransparencyHoverPercent + \"%\" : root.transparencyText()\n                    color: Theme.foreground\n                    font.family: Theme.fontFamily\n                    font.pixelSize: 10\n                    horizontalAlignment: Text.AlignHCenter\n                }\n"
          rep(settings, old_tail, "", "permanent transparency percentage")
          PY

      - name: Register managed stock hashes
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          while IFS='|' read -r source rel; do
            digest="$(sha256sum "$source" | awk '{print $1}')"
            entry="${digest}"$'\t'"${rel}"
            grep -Fxq -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          done <<'EOF_HISTORY'
          config/quickshell/awtarchy/BarState.qml|.config/quickshell/awtarchy/BarState.qml
          config/quickshell/awtarchy/BarSettingsSection.qml|.config/quickshell/awtarchy/BarSettingsSection.qml
          EOF_HISTORY

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Validate draggable transparency
        run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bar-transparency.sh
          shellcheck tests/test-bar-transparency.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-customization.sh
          bash tests/test-bar-icon-display-options.sh
          bash tests/test-bar-task-icons.sh

      - name: Commit draggable transparency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/BarSettingsSection.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Improve bar transparency slider'
          git push origin HEAD:feature/bar-transparency
