name: Validate Update Session Recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Validate updater session recovery
        run: |
          bash -n tests/test-awtarchy-update-session.sh
          bash tests/test-awtarchy-update-session.sh

  edit-v354-postrelease-notes:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'dillacorn/awtarchy' &&
      github.actor == 'dillacorn' &&
      github.event.pull_request.title == 'TEMP: Update v3.5.4 Sony post-release notes' &&
      github.event.pull_request.head.ref == 'automation/v354-sony-postrelease-notes'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v3.5.4
      RELEASE_NAME: Awtarchy v3.5.4 Quickshell
      RELEASE_TARGET: 4a7cb022c7001650cfe77467ba94d548e6d0e34a
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Record and validate current release
        run: |
          set -Eeuo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,targetCommitish,isDraft,isPrerelease,body > /tmp/release-before.json
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_TARGET"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('/tmp/release-before.json').read_text())
          expected = {
              'name': os.environ['RELEASE_NAME'],
              'tagName': os.environ['RELEASE_TAG'],
              'targetCommitish': os.environ['RELEASE_TARGET'],
              'isDraft': False,
              'isPrerelease': False,
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'unexpected release {key}: {data.get(key)!r}')

          placeholder = '_Placeholder for possible tested post-release patches to v3.5.4._'
          body = data.get('body', '')
          if body.count(placeholder) != 1:
              raise SystemExit('expected exactly one v3.5.4 post-release placeholder')

          replacement = '''- Sony battery-care OFF verification now accepts the `sony_laptop` driver's raw `battery_care_limiter=0` as TLP's logical `100% (off)` state, preventing a successful OFF request from being falsely rejected and rolled back to the prior limit.
- Stable v3.5.4 updates receive this fix through a tag-scoped maintenance-runtime repair that patches the immutable v3.5.4 helper source before the root-owned Power Mode helper is reconciled; the published `v3.5.4` tag itself remains unchanged at `4a7cb022c7001650cfe77467ba94d548e6d0e34a`.
- Real-machine validation on Sony hardware with TLP 1.10.2 confirmed Battery Care OFF changed the raw limiter from `80` to `0`, removed Awtarchy's managed threshold file, and `tlp-stat -b` reported `0 (100) [%]`.
- PR #144 passed all 14 pull-request workflows on exact tested head `74478811896306665dd1868e750c32833431dcd5`; all eight push workflows then passed on merged `main` commit `eb0f9bf39c87fa97d0948b87be00220d1a8ba4be`.'''

          updated = body.replace(placeholder, replacement, 1)
          Path('/tmp/v354-notes.md').write_text(updated)
          Path('/tmp/expected-body.txt').write_text(updated)
          PY
      - name: Update v3.5.4 release notes
        run: |
          set -Eeuo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/v354-notes.md
      - name: Verify release metadata and body are preserved
        run: |
          set -Eeuo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,targetCommitish,isDraft,isPrerelease,body > /tmp/release-after.json
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_TARGET"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('/tmp/release-after.json').read_text())
          expected = {
              'name': os.environ['RELEASE_NAME'],
              'tagName': os.environ['RELEASE_TAG'],
              'targetCommitish': os.environ['RELEASE_TARGET'],
              'isDraft': False,
              'isPrerelease': False,
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'release metadata changed unexpectedly: {key}={data.get(key)!r}')

          expected_body = Path('/tmp/expected-body.txt').read_text()
          if data.get('body', '') != expected_body:
              raise SystemExit('release body does not exactly match the intended post-release notes')
          if '_Placeholder for possible tested post-release patches to v3.5.4._' in data.get('body', ''):
              raise SystemExit('post-release placeholder remains after release edit')
          PY
