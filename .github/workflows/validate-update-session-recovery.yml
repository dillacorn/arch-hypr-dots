name: Validate Update Session Recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Validate updater session recovery
        run: |
          bash -n tests/test-awtarchy-update-session.sh
          bash tests/test-awtarchy-update-session.sh

  apply-postrelease-delivery:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'dillacorn/awtarchy' &&
      github.actor == 'dillacorn' &&
      github.event.pull_request.title == 'TEMP: Sony v3.5.4 post-release patch bridge' &&
      github.event.pull_request.head.ref == 'automation/sony-v354-postrelease-patch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/sony-battery-disable
          fetch-depth: 0
      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "715e370a3abd310ea0e64f98c341322fd10359d4"
      - name: Apply v3.5.4 delivery implementation
        run: |
          printf '%s' '' | base64 -d >/tmp/patch-green.py
          python3 /tmp/patch-green.py
          git diff --check
          git diff --exit-code -- tests/test-battery-care-control.sh
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n local/libexec/awtarchy/power-profile-helper
          bash -n tests/test-battery-care-control.sh
          sudo bash tests/test-battery-care-control.sh
      - name: Commit validated delivery implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh local/libexec/awtarchy/power-profile-helper
          git diff --cached --check
          git commit -m 'Deliver Sony battery fix to v3.5.4 updates'
          git push origin HEAD:fix/sony-battery-disable
