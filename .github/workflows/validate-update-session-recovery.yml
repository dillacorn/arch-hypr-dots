name: Validate Update Session Recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Validate updater session recovery
        run: |
          bash -n tests/test-awtarchy-update-session.sh
          bash tests/test-awtarchy-update-session.sh

  add-postrelease-regression:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'dillacorn/awtarchy' &&
      github.actor == 'dillacorn' &&
      github.event.pull_request.title == 'TEMP: Sony v3.5.4 post-release patch bridge' &&
      github.event.pull_request.head.ref == 'automation/sony-v354-postrelease-patch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/sony-battery-disable
          fetch-depth: 0
      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "91bebb2b1362c2e44d89ca7f0f048554005c5474"
      - name: Add v3.5.4 delivery regression
        run: |
          printf '%s' '' | base64 -d >/tmp/patch-test.py
          python3 /tmp/patch-test.py
          bash -n tests/test-battery-care-control.sh
      - name: Commit regression to target branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-battery-care-control.sh
          git commit -m 'Test v3.5.4 Sony battery fix delivery'
          git push origin HEAD:fix/sony-battery-disable
      - name: Verify regression fails before delivery code
        run: sudo bash tests/test-battery-care-control.sh
