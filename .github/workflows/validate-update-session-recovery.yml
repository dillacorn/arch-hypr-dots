name: Validate Update Session Recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Validate updater session recovery
        run: |
          bash -n tests/test-awtarchy-update-session.sh
          bash tests/test-awtarchy-update-session.sh

  apply-bibata-migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/bibata-cursor-migration'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/bibata-cursor-migration
          fetch-depth: 0

      - name: Verify Bibata behavior test is red
        shell: bash
        run: |
          set -euo pipefail
          red_log="$(mktemp)"
          if bash tests/test-bibata-cursor-migration.sh >"$red_log" 2>&1; then
            cat "$red_log"
            printf '%s\n' 'Bibata behavior test unexpectedly passed before production integration.' >&2
            false
          fi
          cat "$red_log"
          grep -Fq 'Bibata AUR package is not present in the current runtime catalog' "$red_log"

      - name: Apply and validate Bibata migration
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/apply-bibata-migration.py
          chmod +x config/hypr/scripts/quickshell_cursor_theme.sh tests/test-bibata-cursor-migration.sh

          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_cursor_theme.sh
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bibata-cursor-migration.sh

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          for rel in \
            .config/hypr/scripts/quickshell_application_state.sh \
            .config/hypr/scripts/quickshell_cursor_theme.sh \
            .config/hypr/scripts/quickshell.sh \
            .config/quickshell/awtarchy/CursorThemeSettings.qml \
            .config/quickshell/awtarchy/FlyoutSettings.qml; do
            src="config/${rel#.config/}"
            hash="$(sha256sum "$src" | awk '{print $1}')"
            line="${hash}\t${rel}"
            grep -Fqx -- "$line" "$history" || printf '%b\n' "$line" >>"$history"
          done

          bash tests/test-bibata-cursor-migration.sh
          bash tests/test-current-package-catalog.sh
          bash tests/test-package-reconciler.sh
          bash tests/test-package-reconciler-aur-equivalents.sh
          git diff --check

          git show origin/main:.github/workflows/validate-update-session-recovery.yml \
            >.github/workflows/validate-update-session-recovery.yml
          rm -f -- \
            .github/workflows/bibata-cursor-apply.yml \
            .github/workflows/bibata-cursor-tdd.yml \
            .github/scripts/apply-bibata-migration.py

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate cursor theme to Bibata'
          git push origin HEAD:feature/bibata-cursor-migration
