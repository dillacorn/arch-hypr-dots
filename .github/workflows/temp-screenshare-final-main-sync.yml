name: TEMP Sync Screen Share Guard with final main

on:
  push:
    branches: [feature/screenshare-guard-controls]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Stage final Screen Share Guard main sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/screenshare-guard-controls
          fetch-depth: 0

      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          bar='config/quickshell/awtarchy/Bar.qml'

          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if (( merge_rc != 0 )); then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ "$conflicts" != "$history" ]]; then
                  printf 'Unexpected merge conflicts:\n%s\n' "$conflicts" >&2
                  git merge --abort
                  exit 1
              fi
              git checkout --ours -- "$history"
              git add "$history"
          fi

          [[ -z "$(git diff --name-only --diff-filter=U)" ]]

          digest="$(sha256sum "$bar" | awk '{print $1}')"
          entry="$digest"$'\t''.config/quickshell/awtarchy/Bar.qml'
          if ! grep -Fqx -- "$entry" "$history"; then
              printf '\n# 2026-09-08 integrated lockscreen/workspace Bar stock hash.\n%s\n' "$entry" >> "$history"
          fi

          rm -f .github/workflows/temp-screenshare-final-main-sync.yml
          git add -A
          git diff --cached --check
          grep -Fqx -- "$entry" "$history"
          bash tests/test-screenshare-guard-controls.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-workspace-focus-highlight.sh
          bash tests/test-bar-wheel-input.sh

          git commit -m 'Sync Screen Share Guard with final main'
          git push origin HEAD:feature/screenshare-guard-controls
