name: Temp Register Lockscreen Managed Hashes

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/temp-register-lockscreen-managed-hashes.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Append exact managed hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          entries=$(cat <<'EOF'
          203f2629465a500792eb4e08fd90f099f76a9e29479dc655de74f4f4b181384c	.config/hypr/scripts/quickshell_application_state.sh
          21450622da6176aeef7b3a48eddd7ae860144eb1434bb09deaa27bc3f40fe81e	.config/hypr/scripts/quickshell_lockscreen_weather.sh
          79708716f5062887b09ff397624b2fbdfa0c0f04423167c99cbee38e31a61bbe	.config/quickshell/awtarchy/shell.qml
          56028519b984a2699cb26d4f6b4baadce387ffcc4d1560723a13539f8a2a67e4	.config/quickshell/awtarchy/BarState.qml
          8c1f7d511c68f7594377fa253d9011f025271897d13d0f49e707c0a7203b2662	.config/quickshell/awtarchy/QuickSettings.qml
          76bcf1c3fa744a38c3f10b294102745209dc016a645a81a438d68ca419d66520	.config/quickshell/awtarchy/LockscreenEditor.qml
          0d674e5354433e8cfab99649c4bac0f1ee634e5ae28e483e051d6f520c90782f	.config/quickshell/awtarchy/LockscreenWeather.qml
          55c2b96bdda14ebb474ad9e944b349477e5c1eca1660da3b3a74ab93297c628e	.config/quickshell/awtarchy-lock/shell.qml
          2e0d33c418f3960953ea0b130ed2880fe2a4f02697591ae2c7cfc8e6e25a04e4	.config/quickshell/awtarchy-lock/LockSurface.qml
          b99b64ccb3e1cc12dc717b9815a3646f5d11117a6f56ed19830b8242553ad396	.config/quickshell/awtarchy-lock/LockScene.qml
          49e8b2b2e3a7d72649d95fb15f51b8ce2d0cbbd9364c624411fa58bf4444cda6	.config/quickshell/awtarchy-lock/LockWeatherCache.qml
          66f102b1596617316ac016cb5a204643f46ce874157a88b0769529e232022ab6	.config/quickshell/awtarchy-lock/LockWallpaperState.qml
          EOF
          )
          if ! grep -Fqx -- '203f2629465a500792eb4e08fd90f099f76a9e29479dc655de74f4f4b181384c	.config/hypr/scripts/quickshell_application_state.sh' "$history"; then
            printf '\n# 2026-09-09 lockscreen customization/editor final stock hashes.\n' >> "$history"
          fi
          while IFS= read -r entry; do
            grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >> "$history"
          done <<< "$entries"
          git diff --check
          if git diff --quiet -- "$history"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history"
          git commit -m 'Register final lockscreen managed hashes'
          git push origin HEAD:feature/lockscreen-interactive-effects
