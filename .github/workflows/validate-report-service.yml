name: Validate Awtarchy Report Service

on:
  push:
    branches: [main, anonymous-crash-reporting-testing]
    paths:
      - services/report-service/**
      - .github/workflows/validate-report-service.yml
  pull_request:
    paths:
      - services/report-service/**
      - .github/workflows/validate-report-service.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Report service tests
        working-directory: services/report-service
        run: npm test
