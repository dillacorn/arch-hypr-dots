name: Validate Awtarchy Report Service

on:
  push:
    branches: [main, anonymous-crash-reporting-testing]
    paths:
      - services/report-service/**
      - .github/workflows/validate-report-service.yml
  pull_request:
    paths:
      - services/report-service/**
      - .github/workflows/validate-report-service.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install report service dependencies
        working-directory: services/report-service
        run: npm install --no-audit --no-fund
      - name: Report service tests
        working-directory: services/report-service
        run: npm test
      - name: Wrangler config dry run
        if: matrix.node-version == '22'
        working-directory: services/report-service
        run: npx --yes wrangler@latest deploy --dry-run --outdir /tmp/awtarchy-report-worker
