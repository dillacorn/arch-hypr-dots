name: Cleanup v3.4.5 Release Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 103 && github.head_ref == 'release/v3.4.5-publish'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v3.4.5
      RELEASE_TARGET: 6f9da234d11d8668e72fcc4683597ce23dd47e64
    steps:
      - name: Verify published release before cleanup
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.target_commitish')"
          tag_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"

          [[ "$main_sha" == "$RELEASE_TARGET" ]]
          [[ "$release_target" == "$RELEASE_TARGET" ]]
          [[ "$tag_target" == "$RELEASE_TARGET" ]]

      - name: Delete one-use release helper branch
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/v3.4.5-publish"
