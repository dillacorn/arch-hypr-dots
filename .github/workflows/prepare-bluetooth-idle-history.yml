name: Clean Bluetooth and idle managed history

on:
  push:
    branches: [fix/bluetooth-idle-ui-polish]

permissions:
  contents: write

jobs:
  clean-history:
    if: github.ref_name == 'fix/bluetooth-idle-ui-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/bluetooth-idle-ui-polish
          fetch-depth: 0

      - name: Remove only malformed temporary entries
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          before="$(sha256sum "$history" | awk '{print $1}')"

          sed -i \
            -e '/^[0-9a-f]\{64\}\t\.quickshell\/awtarchy\/BarTooltip\.qml$/d' \
            -e '/^[0-9a-f]\{64\}\t\.quickshell\/awtarchy\/BluetoothMenu\.qml$/d' \
            -e '/^[0-9a-f]\{64\}\t\.quickshell\/awtarchy\/QuickSettings\.qml$/d' \
            "$history"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('local/share/awtarchy/quickshell-managed-history.sha256')
          text = p.read_text()
          marker = '# 2026-09-05 Bluetooth startup state and idle-eye UI polish.\n\n# 2026-09-05 Bluetooth startup state and idle-eye UI polish.\n'
          text = text.replace(marker, '# 2026-09-05 Bluetooth startup state and idle-eye UI polish.\n', 1)
          p.write_text(text)
          PY

          after="$(sha256sum "$history" | awk '{print $1}')"
          if [[ "$before" == "$after" ]]; then
            echo 'Managed history already clean.'
            exit 0
          fi

          grep -Fxq '4e32df116b0bedb3146e49300eb9a01cb144ff25fdc524d5c1ac2de45304e18f	.config/quickshell/awtarchy/BarTooltip.qml' "$history"
          grep -Fxq '14bcb1ac56d7e2a0c9875efc93f5f293ed7417037e4d6d9313b77c3689a06320	.config/quickshell/awtarchy/BluetoothMenu.qml' "$history"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history"
          git commit -m 'Clean temporary managed history entries'
          git push origin HEAD:fix/bluetooth-idle-ui-polish
