name: Prepare Bluetooth and idle managed history

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare-history:
    if: github.event.pull_request.number == 141 && github.event.pull_request.head.ref == 'fix/bluetooth-idle-ui-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/bluetooth-idle-ui-polish
          fetch-depth: 0

      - name: Record current managed hashes
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          changed=0

          for path in \
            config/quickshell/awtarchy/BarTooltip.qml \
            config/quickshell/awtarchy/BluetoothMenu.qml \
            config/quickshell/awtarchy/QuickSettings.qml
          do
            hash="$(sha256sum "$path" | awk '{print $1}')"
            entry="${hash}"$'\t'".${path}"
            if ! grep -Fxq -- "$entry" "$history"; then
              if (( changed == 0 )); then
                printf '\n# 2026-09-05 Bluetooth startup state and idle-eye UI polish.\n' >>"$history"
              fi
              printf '%s\n' "$entry" >>"$history"
              changed=1
            fi
          done

          if (( changed == 0 )); then
            echo 'Managed history already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history"
          git commit -m 'Record Bluetooth and idle UI managed hashes'
          git push origin HEAD:fix/bluetooth-idle-ui-polish
