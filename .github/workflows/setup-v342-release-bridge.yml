name: Setup v3.4.2 release bridge

on:
  push:
    branches:
      - ops/v3.4.2-post-release-notes

permissions:
  contents: write

jobs:
  setup:
    if: github.ref == 'refs/heads/ops/v3.4.2-post-release-notes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ops/v3.4.2-post-release-notes
          fetch-depth: 0

      - name: Add guarded one-use release job
        run: |
          python3 <<'SETUPPY'
          import base64
          from pathlib import Path

          workflow = Path('.github/workflows/validate-awtarchy.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '  edit_v342_post_release_notes:\n'
          if marker in text:
              raise SystemExit('release bridge job already exists')

          encoded = ''
          job = base64.b64decode(encoded).decode('utf-8')
          token_expr = '${' + '{ github.token }}'
          job = job.replace('__GITHUB_TOKEN__', token_expr)
          workflow.write_text(text.rstrip() + '\n' + job, encoding='utf-8')
          SETUPPY

          rm -f -- .github/workflows/setup-v342-release-bridge.yml

      - name: Commit one-use bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/validate-awtarchy.yml .github/workflows/setup-v342-release-bridge.yml
          git diff --cached --check
          git commit -m 'Add one-use v3.4.2 release bridge'
          git push origin HEAD:ops/v3.4.2-post-release-notes
