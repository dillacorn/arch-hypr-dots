name: Apply PR78 Clear Snapshot

on:
  push:
    branches:
      - feature/notification-hide-history
    paths:
      - .github/workflows/pr78-clear-snapshot-write.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/notification-hide-history
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Apply and validate Clear snapshot isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/pr78-clear-snapshot.py
          bash -n tests/test-notification-hide-history.sh
          shellcheck tests/test-notification-hide-history.sh
          bash tests/test-notification-hide-history.sh
          bash tests/test-flyout-edge-layout.sh
          git diff --check

      - name: Commit production change and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/pr78-clear-snapshot.py
          git rm .github/workflows/pr78-clear-snapshot-write.yml
          git add \
            config/quickshell/awtarchy/Notifications.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Freeze notification Clear animation snapshot'
          git push origin HEAD:feature/notification-hide-history
