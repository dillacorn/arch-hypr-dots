name: One-use battery rollback all packs

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
          fetch-depth: 0
      - name: Restore every battery during rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/libexec/awtarchy/power-profile-helper')
          text = path.read_text()
          old = '''  else
            /usr/bin/rm -f -- "$MANAGED_CONFIG"
            "$TLP" fullcharge >/dev/null 2>&1 || true
          fi
          }
          '''
          new = '''  else
            /usr/bin/rm -f -- "$MANAGED_CONFIG"
            battery_fullcharge_all >/dev/null 2>&1 || true
          fi
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('rollback fullcharge block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

          bash -n local/libexec/awtarchy/power-profile-helper
          shellcheck local/libexec/awtarchy/power-profile-helper
          bash tests/test-battery-care-multibattery.sh
          bash tests/test-battery-care-control.sh
          bash tests/test-battery-care-compatibility.sh
          bash tests/test-battery-care-vendor-semantics.sh
          git diff --check

          rm -- .github/workflows/one-use-battery-rollback-all-packs.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add local/libexec/awtarchy/power-profile-helper \
                  .github/workflows/one-use-battery-rollback-all-packs.yml
          git commit -m 'Restore all batteries during rollback'
          git push origin HEAD:hardening/tlp-battery-compatibility
