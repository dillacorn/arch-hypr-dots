name: Apply trusted aur-scan boundary

on:
  push:
    branches:
      - feature/aur-scan-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/aur-scan-integration

      - name: Apply trusted scanner boundary
        run: python3 .github/temp-trusted-aur-scan-apply.py

      - name: Validate focused AurGuard changes
        shell: bash
        run: |
          set -euo pipefail
          bash -n bashrc
          bash -n tests/test-security-boundaries.sh
          bash -n tests/test-aur-scan-self-heal.sh
          bash -n tests/test-aur-scan-review-policy.sh
          shellcheck bashrc tests/test-security-boundaries.sh tests/test-aur-scan-self-heal.sh tests/test-aur-scan-review-policy.sh
          bash tests/test-security-boundaries.sh
          bash tests/test-aur-scan-self-heal.sh
          bash tests/test-aur-scan-checkout-delegation.sh
          bash tests/test-aur-scan-review-policy.sh
          bash tests/test-aur-signed-metadata-chain.sh
          bash tests/test-aurguard-runtime-refresh.sh
          git diff --check

      - name: Commit trusted scanner boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bashrc tests/test-security-boundaries.sh tests/test-aur-scan-review-policy.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Trust only package-owned aur-scan binary'
          git push origin HEAD:feature/aur-scan-integration
