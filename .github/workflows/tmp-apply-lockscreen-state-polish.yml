name: TEMP Apply lockscreen appearance state

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-apply-lockscreen-state-polish.yml
      - .github/scripts/tmp-lockscreen-state-polish.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply state patch
        run: python .github/scripts/tmp-lockscreen-state-polish.py
      - name: Validate state helper
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          mkdir -p "$tmp/cache/awtarchy" "$tmp/config" "$tmp/home"
          printf '%s\n' '{"enabled":true,"monitors":{},"launcher_sizes":{},"update_notifications_enabled":true}' >"$tmp/cache/awtarchy/quickshell-state.json"
          state() {
            XDG_CACHE_HOME="$tmp/cache" XDG_CONFIG_HOME="$tmp/config" HOME="$tmp/home" \
              bash config/hypr/scripts/quickshell_application_state.sh "$@"
          }
          state set-lockscreen-background color
          state set-lockscreen-background-color '#336699'
          wall="$tmp/home/lock screen.png"
          printf x >"$wall"
          state set-lockscreen-wallpaper "$wall"
          jq -e --arg wall "$wall" '.lockscreen_background == "wallpaper" and .lockscreen_wallpaper_path == $wall and .lockscreen_background_color == "#336699"' "$tmp/cache/awtarchy/quickshell-state.json"
          if state set-lockscreen-background-color red >/dev/null 2>&1; then exit 1; fi
          if state set-lockscreen-wallpaper relative.png >/dev/null 2>&1; then exit 1; fi
          git diff --check
      - name: Commit production state patch
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/scripts/quickshell_application_state.sh
          git commit -m 'feat: persist lockscreen background appearance'
          git push origin HEAD:feature/lockscreen-interactive-effects

# Trigger after workflow registration.
