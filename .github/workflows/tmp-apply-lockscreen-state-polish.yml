name: TEMP Apply lockscreen appearance green

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-apply-lockscreen-state-polish.yml
      - .github/scripts/tmp-lockscreen-state-polish.py

permissions:
  contents: write

concurrency:
  group: temp-lockscreen-appearance-green
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Apply appearance wiring patch
        run: python .github/scripts/tmp-lockscreen-state-polish.py
      - name: Align superseded fallback assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test-quickshell-lockscreen-editor.sh')
          text = path.read_text()
          old = '''require_text "$LOCK_SCENE" 'color: "#000000"' \\
              'LockScene does not keep a black fallback under wallpaper rendering' '''.rstrip()
          new = '''require_text "$LOCK_SCENE" 'root.backgroundMode === "color" ? root.backgroundColor : "#000000"' \\
              'LockScene does not keep a black fallback under wallpaper rendering' '''.rstrip()
          if text.count(old) != 1:
              raise SystemExit(f'legacy fallback assertion: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate appearance wiring
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_contrast.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_contrast.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_wallpaper_picker.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-editor.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          git diff --check
      - name: Commit production appearance wiring
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/LockscreenEditor.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            tests/test-quickshell-lockscreen-editor.sh
          git commit -m 'feat: finish lockscreen appearance editor wiring'
          git push origin HEAD:feature/lockscreen-interactive-effects
