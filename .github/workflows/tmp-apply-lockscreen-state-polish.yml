name: TEMP Apply cohesive lockscreen logo

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/tmp-apply-lockscreen-state-polish.yml
      - .github/scripts/tmp-lockscreen-state-polish.py

permissions:
  contents: write

concurrency:
  group: temp-lockscreen-logo-green
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Prepare cohesive scene transform
        run: |
          python - <<'PY'
          from pathlib import Path

          scene = Path('config/quickshell/awtarchy-lock/LockScene.qml')
          text = scene.read_text()
          needle = "            logoBridgeCanvas.requestPaint();\n"
          if text.count(needle) != 3:
              raise SystemExit(f'legacy bridge repaint hooks: expected 3 matches, found {text.count(needle)}')
          scene.write_text(text.replace(needle, ""))

          patch = Path('.github/scripts/tmp-lockscreen-state-polish.py')
          patch_text = patch.read_text()
          marker = '# Align older interaction contracts with the new group-field implementation.'
          if patch_text.count(marker) != 1:
              raise SystemExit('could not isolate legacy test-edit section in temporary patch')
          patch.write_text(patch_text[:patch_text.index(marker)])
          PY
      - name: Apply cohesive logo scene patch
        run: python .github/scripts/tmp-lockscreen-state-polish.py
      - name: Align superseded interaction assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test-quickshell-lockscreen-interactive-effects.sh')
          text = path.read_text()
          replacements = [
              ('property real pointerOffsetX: 0', 'property real pointerOffsetX:'),
              ('property real pointerOffsetY: 0', 'property real pointerOffsetY:'),
              ('function applyClickImpulse(x, y)', 'function applyClickField(x, y)'),
              ('NumberAnimation on pointerOffsetX', 'Behavior on pointerOffsetX {'),
              ('NumberAnimation on pointerOffsetY', 'Behavior on pointerOffsetY {'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'legacy assertion token {old!r}: expected 1 match, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate cohesive logo model
        run: |
          bash -n tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash -n tests/test-quickshell-lockscreen-interactive-effects.sh
          bash -n tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          shellcheck tests/test-quickshell-lockscreen-logo-cohesion.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-effects.sh
          shellcheck tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-logo-cohesion.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-runtime-polish.sh
          bash tests/test-quickshell-lockscreen-editor-config-boundary.sh
          cmp -s config/quickshell/awtarchy-lock/LockScene.qml config/quickshell/awtarchy/LockPreviewScene.qml
          ! grep -Fq 'logoBridgeCanvas' config/quickshell/awtarchy-lock/LockScene.qml
          ! grep -Fq 'Easing.OutBack' config/quickshell/awtarchy-lock/LockScene.qml
          git diff --check
      - name: Commit production cohesive logo
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add \
            config/quickshell/awtarchy-lock/LockScene.qml \
            config/quickshell/awtarchy/LockPreviewScene.qml \
            tests/test-quickshell-lockscreen-interactive-effects.sh
          git commit -m 'fix: make lockscreen logo move as cohesive glyphs'
          git push origin HEAD:feature/lockscreen-interactive-effects
