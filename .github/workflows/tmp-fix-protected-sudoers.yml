name: One-use protected sudoers fix

on:
  push:
    branches:
      - refactor/tlp-battery-care-thin-client

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Install focused test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Apply and verify protected sudoers fix
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_parent='fffc72c043842772400cbfd0d016862a63092f3d'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            printf 'No-op: expected parent %s, found %s\n' "$expected_parent" "$actual_parent"
            exit 0
          fi

          reconciler='local/share/awtarchy/awtarchy-power-profile.sh'

          python3 - "$reconciler" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')

          old_verify = (
              '  [[ -f $policy_file && ! -L $policy_file ]] || return 1\n'
              '  owner="$(/usr/bin/stat -c %u -- "$policy_file" 2>/dev/null)" || return 1\n'
              '  mode="$(/usr/bin/stat -c %a -- "$policy_file" 2>/dev/null)" || return 1\n'
          )
          new_verify = (
              '  run_root /usr/bin/test -f "$policy_file" || return 1\n'
              '  if run_root /usr/bin/test -L "$policy_file"; then\n'
              '    return 1\n'
              '  fi\n'
              '  owner="$(run_root /usr/bin/stat -c %u -- "$policy_file")" || return 1\n'
              '  mode="$(run_root /usr/bin/stat -c %a -- "$policy_file")" || return 1\n'
          )

          old_existing = (
              '  if [[ -e $policy_file || -L $policy_file ]]; then\n'
              '    [[ -f $policy_file && ! -L $policy_file ]] \\\n'
              '      || die "Refusing unsafe Battery Care sudoers policy: $policy_file"\n'
              '    content="$(battery_status_policy_content "$policy_file" 2>/dev/null)" \\\n'
              '      || die "Cannot read existing Battery Care sudoers policy: $policy_file"\n'
              '    [[ ${content%%$\'\\n\'*} == "$BATTERY_STATUS_POLICY_MARKER" ]] \\\n'
              '      || die "Refusing to replace non-Awtarchy sudoers policy: $policy_file"\n'
              '  fi\n'
          )
          new_existing = (
              '  if run_root /usr/bin/test -e "$policy_file" || run_root /usr/bin/test -L "$policy_file"; then\n'
              '    run_root /usr/bin/test -f "$policy_file" \\\n'
              '      || die "Refusing unsafe Battery Care sudoers policy: $policy_file"\n'
              '    if run_root /usr/bin/test -L "$policy_file"; then\n'
              '      die "Refusing unsafe Battery Care sudoers policy: $policy_file"\n'
              '    fi\n'
              '    content="$(battery_status_policy_content "$policy_file")" \\\n'
              '      || die "Cannot read existing Battery Care sudoers policy: $policy_file"\n'
              '    [[ ${content%%$\'\\n\'*} == "$BATTERY_STATUS_POLICY_MARKER" ]] \\\n'
              '      || die "Refusing to replace non-Awtarchy sudoers policy: $policy_file"\n'
              '  fi\n'
          )

          if text.count(old_verify) != 1:
              raise SystemExit(f'expected one unprivileged verifier block, found {text.count(old_verify)}')
          if text.count(old_existing) != 1:
              raise SystemExit(f'expected one unprivileged existing-policy block, found {text.count(old_existing)}')

          text = text.replace(old_verify, new_verify, 1)
          text = text.replace(old_existing, new_existing, 1)
          path.write_text(text, encoding='utf-8')
          PY

          bash -n "$reconciler"
          shellcheck "$reconciler" tests/test-battery-status-helper.sh
          bash tests/test-battery-status-helper.sh
          bash tests/test-power-profile-helper-update.sh
          git diff --check

          changed="$(git diff --name-only)"
          [[ "$changed" == "$reconciler" ]] || {
            printf 'Unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          }

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- "$reconciler"
          git commit -m 'fix: inspect Battery Care sudoers policy as root'
          git push origin HEAD:refactor/tlp-battery-care-thin-client
