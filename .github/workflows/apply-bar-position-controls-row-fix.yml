name: Apply Bar Position Controls Row Fix

on:
  push:
    branches:
      - fix/bar-position-controls-row
    paths:
      - '.github/workflows/apply-bar-position-controls-row-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Apply non-wrapping bar position row
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          qml_path = Path('config/quickshell/awtarchy/QuickSettings.qml')
          history_path = Path('local/share/awtarchy/quickshell-managed-history.sha256')
          text = qml_path.read_text()
          history = history_path.read_text()

          old_hash = sha256(text.encode()).hexdigest()
          rel = '.config/quickshell/awtarchy/QuickSettings.qml'
          if f'{old_hash}\t{rel}' not in history.splitlines():
              raise SystemExit(f'current QuickSettings stock hash is missing from managed history: {old_hash}')

          old = (
              '                                    Flow {\n'
              '                                        spacing: 5\n'
              '                                        Repeater {\n'
              '                                            model: ["top", "bottom", "left", "right"]\n'
          )
          new = (
              '                                    RowLayout {\n'
              '                                        spacing: 5\n'
              '                                        Repeater {\n'
              '                                            model: ["top", "bottom", "left", "right"]\n'
          )

          if text.count(old) != 1:
              raise SystemExit(f'expected one bar position Flow block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          qml_path.write_text(text)

          new_hash = sha256(text.encode()).hexdigest()
          entry = f'{new_hash}\t{rel}'
          if entry not in history.splitlines():
              if not history.endswith('\n'):
                  history += '\n'
              history += '# v3.4.6 bar position controls stay horizontal.\n'
              history += entry + '\n'
              history_path.write_text(history)
          PY

          bash -n tests/test-bar-position-controls-row.sh
          shellcheck tests/test-bar-position-controls-row.sh
          bash tests/test-bar-position-controls-row.sh
          git diff --check

          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/QuickSettings.qml \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Keep bar position controls horizontal'
          git push origin HEAD:fix/bar-position-controls-row
