name: Patch Screen Share Guard preserved Hyprland migration

on:
  push:
    branches: [fix/screenshare-guard-runtime-apply]
    paths:
      - '.github/workflows/patch-screenshare-guard-preserved-hyprland.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/screenshare-guard-runtime-apply
          fetch-depth: 0
      - name: Patch updater runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')

          function_marker = 'migrate_retired_hyprlock_stage() {\n'
          if text.count(function_marker) != 1:
              raise SystemExit('expected exactly one migrate_retired_hyprlock_stage marker')
          if 'migrate_screenshare_guard_hyprland_stage() {' in text:
              raise SystemExit('Screen Share Guard migration stage already exists')

          function = r'''migrate_screenshare_guard_hyprland_stage() {
            local repo_dir="$1" target_home="$2"
            local helper="${repo_dir}/local/share/awtarchy/migrate-screenshare-guard-hyprland.sh"
            local live="${HOME_DIR}/.config/hypr/hyprland.lua"
            local managed="${target_home}/.config/hypr/hyprland.lua"
            local stamp backup suffix=0

            [[ -f "$live" && ! -L "$live" ]] || return 0
            if grep -Fq -- 'function awtarchy_screenshare_guard_set_group_v1' "$live" \
              && grep -Fq -- 'function awtarchy_screenshare_guard_status_v1' "$live"; then
              return 0
            fi

            [[ -f "$helper" && ! -L "$helper" ]] \
              || die "Screen Share Guard Hyprland migration helper is unavailable or unsafe: ${helper}"
            [[ -f "$managed" && ! -L "$managed" ]] \
              || die "Managed hyprland.lua is unavailable for Screen Share Guard migration: ${managed}"

            stamp="$(date '+%Y%m%d-%H%M%S')"
            backup="${live}.backup.${stamp}"
            while [[ -e "$backup" || -L "$backup" ]]; do
              ((suffix += 1))
              backup="${live}.backup.${stamp}.${suffix}"
            done

            retry_command run_as_target bash "$helper" "$live" "$managed" "$backup" \
              || die "Could not migrate Screen Share Guard controls into personalized hyprland.lua."
          }

          '''
          text = text.replace(function_marker, function + function_marker, 1)

          call_marker = '''  persist_quickshell_hyprland_user_patch
            remove_quickshell_update_legacy_packages
            migrate_retired_hyprlock_stage "$repo_dir"

            if (( polkit_remove_legacy_ready == 1 )); then
          '''
          if text.count(call_marker) != 1:
              raise SystemExit('expected exactly one update migration call marker')
          replacement = '''  persist_quickshell_hyprland_user_patch
            remove_quickshell_update_legacy_packages
            migrate_retired_hyprlock_stage "$repo_dir"
            migrate_screenshare_guard_hyprland_stage "$repo_dir" "$target_home"

            if (( polkit_remove_legacy_ready == 1 )); then
          '''
          text = text.replace(call_marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          git diff --check
      - name: Commit patch and remove one-use workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'fix: migrate preserved Screen Share Guard config during update'
          git rm .github/workflows/patch-screenshare-guard-preserved-hyprland.yml
          git commit -m 'chore: remove one-use Screen Share Guard patch workflow'
          git push origin HEAD:fix/screenshare-guard-runtime-apply
