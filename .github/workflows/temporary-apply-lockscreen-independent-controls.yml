name: Temporary Apply Lockscreen Independent Controls

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/temporary-apply-lockscreen-independent-controls.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Apply exact independent-control patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          app = 'config/hypr/scripts/quickshell_application_state.sh'
          replace_once(
              app,
              '        lockscreen_audio_reactive|lockscreen_show_time|lockscreen_show_date|lockscreen_show_username) ;;',
              '        lockscreen_audio_reactive|lockscreen_mouse_interactive|lockscreen_show_time|lockscreen_show_date|lockscreen_show_username|lockscreen_show_weather) ;;'
          )
          replace_once(
              app,
              '''    set-lockscreen-audio-reactive)\n        [[ -n ${2:-} ]] || exit 2\n        set_lockscreen_option lockscreen_audio_reactive "$2" 'lockscreen audio reactive'\n        ;;\n    set-lockscreen-show-time)''',
              '''    set-lockscreen-audio-reactive)\n        [[ -n ${2:-} ]] || exit 2\n        set_lockscreen_option lockscreen_audio_reactive "$2" 'lockscreen audio reactive'\n        ;;\n    set-lockscreen-mouse-interactive)\n        [[ -n ${2:-} ]] || exit 2\n        set_lockscreen_option lockscreen_mouse_interactive "$2" 'lockscreen mouse interactive'\n        ;;\n    set-lockscreen-show-time)'''
          )
          replace_once(
              app,
              '''    set-lockscreen-show-username)\n        [[ -n ${2:-} ]] || exit 2\n        set_lockscreen_option lockscreen_show_username "$2" 'lockscreen show username'\n        ;;\n    set-workspace-numbers)''',
              '''    set-lockscreen-show-username)\n        [[ -n ${2:-} ]] || exit 2\n        set_lockscreen_option lockscreen_show_username "$2" 'lockscreen show username'\n        ;;\n    set-lockscreen-show-weather)\n        [[ -n ${2:-} ]] || exit 2\n        set_lockscreen_option lockscreen_show_weather "$2" 'lockscreen show weather'\n        ;;\n    set-workspace-numbers)'''
          )
          replace_once(
              app,
              '|set-lockscreen-audio-reactive <true|false>|set-lockscreen-show-time <true|false>|set-lockscreen-show-date <true|false>|set-lockscreen-show-username <true|false>|',
              '|set-lockscreen-audio-reactive <true|false>|set-lockscreen-mouse-interactive <true|false>|set-lockscreen-show-time <true|false>|set-lockscreen-show-date <true|false>|set-lockscreen-show-username <true|false>|set-lockscreen-show-weather <true|false>|'
          )

          bar = 'config/quickshell/awtarchy/BarState.qml'
          replace_once(
              bar,
              '''            lockscreen_audio_reactive: true,\n            lockscreen_show_time: false,\n            lockscreen_show_date: false,\n            lockscreen_show_username: false,''',
              '''            lockscreen_audio_reactive: true,\n            lockscreen_mouse_interactive: true,\n            lockscreen_show_time: false,\n            lockscreen_show_date: false,\n            lockscreen_show_username: false,\n            lockscreen_show_weather: false,'''
          )
          replace_once(
              bar,
              '''    function lockscreenAudioReactiveEnabled() {\n        return lockscreenBooleanPreference("lockscreen_audio_reactive", true);\n    }\n\n    function lockscreenShowTime()''',
              '''    function lockscreenAudioReactiveEnabled() {\n        return lockscreenBooleanPreference("lockscreen_audio_reactive", true);\n    }\n\n    function lockscreenMouseInteractiveEnabled() {\n        return lockscreenBooleanPreference("lockscreen_mouse_interactive", true);\n    }\n\n    function lockscreenShowTime()'''
          )
          replace_once(
              bar,
              '''    function lockscreenShowUsername() {\n        return lockscreenBooleanPreference("lockscreen_show_username", false);\n    }\n\n    function updateNotificationsEnabled()''',
              '''    function lockscreenShowUsername() {\n        return lockscreenBooleanPreference("lockscreen_show_username", false);\n    }\n\n    function lockscreenShowWeather() {\n        return lockscreenBooleanPreference("lockscreen_show_weather", false);\n    }\n\n    function updateNotificationsEnabled()'''
          )

          quick = Path('config/quickshell/awtarchy/QuickSettings.qml')
          text = quick.read_text()
          start_marker = '''                                Text {\n                                    Layout.fillWidth: true\n                                    text: "Lockscreen Options"'''
          end_marker = '''                            }\n                        }\n\n                        Rectangle {\n                            Layout.row: root.quickSettingsSectionRow("smtty")'''
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('QuickSettings lockscreen option markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          def option_row(label, accessor, command):
              return f'''                                    Text {{\n                                        Layout.fillWidth: true\n                                        text: "{label}"\n                                        color: Theme.foreground\n                                        font.family: Theme.fontFamily\n                                        font.pixelSize: root.scaledText(9)\n                                    }}\n                                    SettingsButton {{\n                                        label: BarState.{accessor}() ? "On" : "Off"\n                                        active: BarState.{accessor}()\n                                        textSize: root.scaledText(9)\n                                        onClicked: root.queueStateCommand([\n                                            "{command}",\n                                            BarState.{accessor}() ? "false" : "true"\n                                        ])\n                                    }}\n\n'''

          effects = [
              ('Audio Reactive', 'lockscreenAudioReactiveEnabled', 'set-lockscreen-audio-reactive'),
              ('Mouse Interaction', 'lockscreenMouseInteractiveEnabled', 'set-lockscreen-mouse-interactive'),
          ]
          details = [
              ('Time', 'lockscreenShowTime', 'set-lockscreen-show-time'),
              ('Date', 'lockscreenShowDate', 'set-lockscreen-show-date'),
              ('Username', 'lockscreenShowUsername', 'set-lockscreen-show-username'),
              ('Weather', 'lockscreenShowWeather', 'set-lockscreen-show-weather'),
          ]
          replacement = '''                                Text {\n                                    Layout.fillWidth: true\n                                    text: "Lockscreen Effects"\n                                    color: Theme.foreground\n                                    font.family: Theme.fontFamily\n                                    font.pixelSize: root.scaledText(9)\n                                    font.bold: true\n                                }\n\n                                GridLayout {\n                                    Layout.fillWidth: true\n                                    columns: 2\n                                    columnSpacing: 8\n                                    rowSpacing: 4\n\n'''
          replacement += ''.join(option_row(*row) for row in effects)
          replacement += '''                                }\n\n                                Text {\n                                    Layout.fillWidth: true\n                                    text: "Lockscreen Details"\n                                    color: Theme.foreground\n                                    font.family: Theme.fontFamily\n                                    font.pixelSize: root.scaledText(9)\n                                    font.bold: true\n                                }\n\n                                GridLayout {\n                                    Layout.fillWidth: true\n                                    columns: 2\n                                    columnSpacing: 8\n                                    rowSpacing: 4\n\n'''
          replacement += ''.join(option_row(*row) for row in details)
          replacement += '''                                }\n'''
          quick.write_text(text[:start] + replacement + text[end:])

          shell = 'config/quickshell/awtarchy-lock/shell.qml'
          replace_once(
              shell,
              '''    property bool lockAudioReactive: true\n    property bool lockShowTime: false\n    property bool lockShowDate: false\n    property bool lockShowUsername: false''',
              '''    property bool lockAudioReactive: true\n    property bool lockMouseInteractive: true\n    property bool lockShowTime: false\n    property bool lockShowDate: false\n    property bool lockShowUsername: false\n    property bool lockShowWeather: false'''
          )
          replace_once(
              shell,
              '''        lockAudioReactive = true;\n        lockShowTime = false;\n        lockShowDate = false;\n        lockShowUsername = false;''',
              '''        lockAudioReactive = true;\n        lockMouseInteractive = true;\n        lockShowTime = false;\n        lockShowDate = false;\n        lockShowUsername = false;\n        lockShowWeather = false;'''
          )
          replace_once(
              shell,
              '''            lockAudioReactive = normalizedBoolean(parsed.lockscreen_audio_reactive, true);\n            lockShowTime = normalizedBoolean(parsed.lockscreen_show_time, false);\n            lockShowDate = normalizedBoolean(parsed.lockscreen_show_date, false);\n            lockShowUsername = normalizedBoolean(parsed.lockscreen_show_username, false);''',
              '''            lockAudioReactive = normalizedBoolean(parsed.lockscreen_audio_reactive, true);\n            lockMouseInteractive = normalizedBoolean(parsed.lockscreen_mouse_interactive, true);\n            lockShowTime = normalizedBoolean(parsed.lockscreen_show_time, false);\n            lockShowDate = normalizedBoolean(parsed.lockscreen_show_date, false);\n            lockShowUsername = normalizedBoolean(parsed.lockscreen_show_username, false);\n            lockShowWeather = normalizedBoolean(parsed.lockscreen_show_weather, false);'''
          )
          replace_once(
              shell,
              '''    LockAudioAnalyzer {\n        id: lockAudioAnalyzer\n        enabled: root.lockAudioReactive && root.lockAnimationPreference !== "off"\n    }\n\n    WlSessionLock {''',
              '''    LockAudioAnalyzer {\n        id: lockAudioAnalyzer\n        enabled: root.lockAudioReactive\n    }\n\n    LockWeatherCache {\n        id: lockWeatherCache\n        enabled: root.lockShowWeather\n    }\n\n    WlSessionLock {'''
          )
          replace_once(
              shell,
              '''                audioLow: lockAudioAnalyzer.low\n                audioMid: lockAudioAnalyzer.mid\n                audioHigh: lockAudioAnalyzer.high\n                audioOverall: lockAudioAnalyzer.overall\n                showTime: root.lockShowTime\n                showDate: root.lockShowDate\n                showUsername: root.lockShowUsername''',
              '''                audioReactive: root.lockAudioReactive\n                audioLow: lockAudioAnalyzer.low\n                audioMid: lockAudioAnalyzer.mid\n                audioHigh: lockAudioAnalyzer.high\n                audioOverall: lockAudioAnalyzer.overall\n                mouseInteractive: root.lockMouseInteractive\n                showTime: root.lockShowTime\n                showDate: root.lockShowDate\n                showUsername: root.lockShowUsername\n                showWeather: root.lockShowWeather\n                weatherText: lockWeatherCache.summary'''
          )

          surface = 'config/quickshell/awtarchy-lock/LockSurface.qml'
          replace_once(
              surface,
              '''    required property int randomFormationMode\n    required property real audioLow\n    required property real audioMid\n    required property real audioHigh\n    required property real audioOverall\n    required property bool showTime\n    required property bool showDate\n    required property bool showUsername''',
              '''    required property int randomFormationMode\n    required property bool audioReactive\n    required property real audioLow\n    required property real audioMid\n    required property real audioHigh\n    required property real audioOverall\n    required property bool mouseInteractive\n    required property bool showTime\n    required property bool showDate\n    required property bool showUsername\n    required property bool showWeather\n    required property string weatherText'''
          )
          replace_once(
              surface,
              '''    readonly property bool interactiveEffectsEnabled: root.animationPreference !== "off"\n    readonly property int ghostTrailLength: 6''',
              '''    readonly property real audioLevel: root.audioOverall\n    readonly property real audioSilenceThreshold: 0.01\n    readonly property bool pointerEffectsEnabled: root.mouseInteractive && root.pointerActive\n    readonly property bool audioEffectsEnabled: root.audioReactive && root.audioLevel > root.audioSilenceThreshold\n    readonly property int ghostTrailLength: 6'''
          )
          replace_once(
              surface,
              '''    readonly property bool metadataVisible: root.showTime || root.showDate || root.showUsername\n    readonly property string usernameText: root.showUsername ? Quickshell.env("USER") : ""\n\n    property bool entered: false''',
              '''    readonly property bool metadataVisible: root.showTime || root.showDate || root.showUsername\n        || (root.showWeather && root.weatherText.length > 0)\n    readonly property string usernameText: root.showUsername ? Quickshell.env("USER") : ""\n\n    property bool entered: false\n    property bool pointerActive: false'''
          )
          replace_once(surface, '''        if (!interactiveEffectsEnabled)\n            return;\n\n        const local = wordmarkItem.mapFromItem(pointerArea, x, y);''', '''        if (!pointerEffectsEnabled)\n            return;\n\n        const local = wordmarkItem.mapFromItem(pointerArea, x, y);''')
          replace_once(surface, '''    function handlePointerMotion(x, y) {\n        if (!interactiveEffectsEnabled)\n            return;\n\n        const now = Date.now();''', '''    function handlePointerMotion(x, y) {\n        if (!root.mouseInteractive)\n            return;\n\n        root.pointerActive = true;\n        const now = Date.now();''')
          replace_once(surface, '''                                readonly property real audioEnvelope: root.interactiveEffectsEnabled\n                                    ? Math.max(0, Math.min(1, audioEnergy)) * Math.pow(edgeWeight, 1.35) : 0''', '''                                readonly property real audioEnvelope: root.audioEffectsEnabled\n                                    ? Math.max(0, Math.min(1, audioEnergy)) * Math.pow(edgeWeight, 1.35) : 0''')
          replace_once(surface, '''                                            || !root.interactiveEffectsEnabled)''', '''                                            || !root.pointerEffectsEnabled)''')
          replace_once(
              surface,
              '''                Text {\n                    Layout.alignment: Qt.AlignHCenter\n                    visible: root.showUsername\n                    text: root.usernameText\n                    color: root.theme.lockAccent\n                    opacity: 0.58\n                    font.family: root.theme.fontFamily\n                    font.pixelSize: Math.round(10 * root.uiScale)\n                }\n            }''',
              '''                Text {\n                    Layout.alignment: Qt.AlignHCenter\n                    visible: root.showUsername\n                    text: root.usernameText\n                    color: root.theme.lockAccent\n                    opacity: 0.58\n                    font.family: root.theme.fontFamily\n                    font.pixelSize: Math.round(10 * root.uiScale)\n                }\n\n                Text {\n                    Layout.alignment: Qt.AlignHCenter\n                    visible: root.showWeather && root.weatherText.length > 0\n                    text: root.weatherText\n                    color: root.theme.lockAccent\n                    opacity: 0.68\n                    font.family: root.theme.fontFamily\n                    font.pixelSize: Math.round(10 * root.uiScale)\n                }\n            }'''
          )
          replace_once(surface, '''            visible: root.interactiveEffectsEnabled && root.ghostOpacity > 0''', '''            visible: root.pointerEffectsEnabled && root.ghostOpacity > 0''')
          replace_once(
              surface,
              '''        duration: root.cursorFadeDurationMs\n        easing.type: Easing.OutCubic\n    }\n\n    Timer {\n        interval: 33\n        repeat: true\n        running: root.interactiveEffectsEnabled && root.audioOverall > 0.01''',
              '''        duration: root.cursorFadeDurationMs\n        easing.type: Easing.OutCubic\n        onFinished: root.pointerActive = false\n    }\n\n    Timer {\n        interval: 33\n        repeat: true\n        running: root.audioEffectsEnabled'''
          )

          weather = Path('config/quickshell/awtarchy-lock/LockWeatherCache.qml')
          weather.write_text('''import QtQuick\nimport Quickshell\nimport Quickshell.Io\n\nItem {\n    id: root\n\n    visible: false\n    width: 0\n    height: 0\n\n    required property bool enabled\n    property string summary: ""\n\n    readonly property string cacheHome: Quickshell.env("XDG_CACHE_HOME")\n        || (Quickshell.env("HOME") + "/.cache")\n    readonly property string cachePath: root.cacheHome\n        + "/awtarchy/lockscreen-weather.json"\n\n    function refreshCache() {\n        if (!root.enabled) {\n            root.summary = "";\n            return;\n        }\n\n        const text = cacheFile.text();\n        if (!text || text.length === 0) {\n            root.summary = "";\n            return;\n        }\n\n        try {\n            const parsed = JSON.parse(text);\n            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {\n                root.summary = "";\n                return;\n            }\n            const value = typeof parsed.summary === "string"\n                ? parsed.summary.trim() : "";\n            root.summary = value.length <= 96 ? value : value.slice(0, 96);\n        } catch (error) {\n            root.summary = "";\n        }\n    }\n\n    onEnabledChanged: {\n        if (root.enabled)\n            cacheFile.reload();\n        else\n            root.summary = "";\n    }\n\n    FileView {\n        id: cacheFile\n        path: root.cachePath\n        watchChanges: true\n        blockLoading: false\n        printErrors: false\n        onLoaded: root.refreshCache()\n        onFileChanged: root.refreshCache()\n    }\n}\n''')

          physics = 'tests/test-quickshell-lockscreen-interactive-physics-regressions.sh'
          replace_once(
              physics,
              '''# Audio smoothing must stop once it reaches the current target, including the\n# zero target after CAVA exits or is unavailable.''',
              '''# Formation Off is not a hidden effects master switch. Mouse and audio have\n# independent gates so users can evaluate or disable either effect separately.\nrequire_text "$SURFACE_QML" 'readonly property bool pointerEffectsEnabled: root.mouseInteractive && root.pointerActive' \\\n    'pointer physics is not independently gated'\nrequire_text "$SURFACE_QML" 'readonly property bool audioEffectsEnabled: root.audioReactive && root.audioLevel > root.audioSilenceThreshold' \\\n    'audio physics is not independently gated'\nif grep -Fq -- 'interactiveEffectsEnabled: root.animationPreference !== "off"' "$SURFACE_QML"; then\n    fail 'formation Off still acts as an effects master switch'\nfi\n\n# Audio smoothing must stop once it reaches the current target, including the\n# zero target after CAVA exits or is unavailable.'''
          )

          managed_test = 'tests/test-quickshell-lockscreen-interactive-managed-history.sh'
          replace_once(
              managed_test,
              '''    'config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml:.config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml'\n    'config/quickshell/awtarchy-lock/cava.conf:.config/quickshell/awtarchy-lock/cava.conf' ''',
              '''    'config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml:.config/quickshell/awtarchy-lock/LockAudioAnalyzer.qml'\n    'config/quickshell/awtarchy-lock/LockWeatherCache.qml:.config/quickshell/awtarchy-lock/LockWeatherCache.qml'\n    'config/quickshell/awtarchy-lock/cava.conf:.config/quickshell/awtarchy-lock/cava.conf' '''
          )

          history = Path('local/share/awtarchy/quickshell-managed-history.sha256')
          history_text = history.read_text()
          managed = [
              ('config/hypr/scripts/quickshell_application_state.sh', '.config/hypr/scripts/quickshell_application_state.sh'),
              ('config/quickshell/awtarchy/BarState.qml', '.config/quickshell/awtarchy/BarState.qml'),
              ('config/quickshell/awtarchy/QuickSettings.qml', '.config/quickshell/awtarchy/QuickSettings.qml'),
              ('config/quickshell/awtarchy-lock/shell.qml', '.config/quickshell/awtarchy-lock/shell.qml'),
              ('config/quickshell/awtarchy-lock/LockSurface.qml', '.config/quickshell/awtarchy-lock/LockSurface.qml'),
              ('config/quickshell/awtarchy-lock/LockWeatherCache.qml', '.config/quickshell/awtarchy-lock/LockWeatherCache.qml'),
          ]
          for source, installed in managed:
              digest = hashlib.sha256(Path(source).read_bytes()).hexdigest()
              entry = f'{digest}\t{installed}'
              if entry not in history_text.splitlines():
                  if history_text and not history_text.endswith('\n'):
                      history_text += '\n'
                  history_text += entry + '\n'
          history.write_text(history_text)
          PY

      - name: Validate exact patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_audio.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_audio.sh
          bash -n tests/test-quickshell-lockscreen-interactive-effects.sh
          bash -n tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-interactive-effects.sh
          bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockWeatherCache.qml \
            tests/test-quickshell-lockscreen-interactive-physics-regressions.sh \
            tests/test-quickshell-lockscreen-interactive-managed-history.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Add independent lockscreen effect controls'
          git push origin HEAD:feature/lockscreen-interactive-effects
