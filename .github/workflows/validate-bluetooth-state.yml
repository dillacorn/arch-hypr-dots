name: Validate Bluetooth State

on:
  push:
    branches:
      - main
    paths:
      - config/hypr/scripts/quickshell_bluetooth_state.sh
      - config/hypr/scripts/quickshell_bluetooth_resume_diagnostic.sh
      - config/quickshell/awtarchy/BluetoothMenu.qml
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-bluetooth-state-persistence.sh
      - tests/test-bluetooth-resume-diagnostic.sh
      - .github/workflows/validate-bluetooth-state.yml
  pull_request:
    paths:
      - config/hypr/scripts/quickshell_bluetooth_state.sh
      - config/hypr/scripts/quickshell_bluetooth_resume_diagnostic.sh
      - config/quickshell/awtarchy/BluetoothMenu.qml
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-bluetooth-state-persistence.sh
      - tests/test-bluetooth-resume-diagnostic.sh
      - .github/workflows/validate-bluetooth-state.yml

permissions:
  contents: read

jobs:
  bluetooth-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n config/hypr/scripts/quickshell_bluetooth_state.sh
          bash -n config/hypr/scripts/quickshell_bluetooth_resume_diagnostic.sh
          bash -n tests/test-bluetooth-state-persistence.sh
          bash -n tests/test-bluetooth-resume-diagnostic.sh
      - name: ShellCheck
        run: |
          shellcheck \
            config/hypr/scripts/quickshell_bluetooth_state.sh \
            tests/test-bluetooth-state-persistence.sh \
            tests/test-bluetooth-resume-diagnostic.sh
          # The diagnostic intentionally appends many report fragments and treats
          # optional command failures as non-fatal evidence gaps. Errors and
          # warnings remain fatal; ShellCheck info/style findings are not.
          shellcheck -S warning config/hypr/scripts/quickshell_bluetooth_resume_diagnostic.sh
      - name: Bluetooth persistence and state sync
        run: bash tests/test-bluetooth-state-persistence.sh
      - name: Bluetooth suspend/resume diagnostic
        run: bash tests/test-bluetooth-resume-diagnostic.sh
      - name: Managed history
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          missing=0
          for entry in \
            'config/hypr/scripts/quickshell_bluetooth_state.sh|.config/hypr/scripts/quickshell_bluetooth_state.sh' \
            'config/quickshell/awtarchy/BluetoothMenu.qml|.config/quickshell/awtarchy/BluetoothMenu.qml'; do
            source_path="${entry%%|*}"
            managed_path="${entry#*|}"
            hash="$(sha256sum "$source_path" | awk '{print $1}')"
            if ! grep -Fq "${hash}"$'\t'"${managed_path}" "$history"; then
              printf 'Missing managed history entry: %s\t%s\n' "$hash" "$managed_path" >&2
              missing=1
            fi
          done
          (( missing == 0 ))

  cleanup-v3-5-6-bridge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 157 &&
      github.event.pull_request.head.ref == 'release/v3.5.6-bridge' &&
      github.event.pull_request.title == 'Release bridge: publish v3.5.6'
    needs: bluetooth-state
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release bridge
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: release/v3.5.6-bridge
          fetch-depth: 0

      - name: Verify published release and delete helper branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 1295e13b9323463b735f1793e5251ca4a2529eef
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$EXPECTED_SHA"

          release_name="$(gh release view v3.5.6 --repo "$GITHUB_REPOSITORY" --json name --jq '.name')"
          release_tag="$(gh release view v3.5.6 --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          release_draft="$(gh release view v3.5.6 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          release_prerelease="$(gh release view v3.5.6 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          release_target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.5.6" --jq '.target_commitish')"
          expected_body="$(cat .github/release-v3.5.6.md)"
          published_body="$(gh release view v3.5.6 --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"

          test "$release_name" = 'Awtarchy v3.5.6 Quickshell'
          test "$release_tag" = 'v3.5.6'
          test "$release_draft" = 'false'
          test "$release_prerelease" = 'false'
          test "$release_target" = "$EXPECTED_SHA"
          test "$published_body" = "$expected_body"

          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.5.6" --jq '.object.type')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.5.6" --jq '.object.sha')"
          if [[ "$tag_type" == 'tag' ]]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          test "$tag_sha" = "$EXPECTED_SHA"

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/v3.5.6-bridge"
