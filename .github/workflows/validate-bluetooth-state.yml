name: Validate Bluetooth State

on:
  push:
    branches:
      - main
    paths:
      - config/hypr/scripts/quickshell_bluetooth_state.sh
      - config/quickshell/awtarchy/BluetoothMenu.qml
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-bluetooth-state-persistence.sh
      - .github/workflows/validate-bluetooth-state.yml
  pull_request:
    paths:
      - config/hypr/scripts/quickshell_bluetooth_state.sh
      - config/quickshell/awtarchy/BluetoothMenu.qml
      - local/share/awtarchy/quickshell-managed-history.sha256
      - tests/test-bluetooth-state-persistence.sh
      - .github/workflows/validate-bluetooth-state.yml

permissions:
  contents: read

jobs:
  bluetooth-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Bash syntax
        run: |
          bash -n config/hypr/scripts/quickshell_bluetooth_state.sh
          bash -n tests/test-bluetooth-state-persistence.sh
      - name: ShellCheck
        run: shellcheck config/hypr/scripts/quickshell_bluetooth_state.sh tests/test-bluetooth-state-persistence.sh
      - name: Bluetooth persistence and state sync
        run: bash tests/test-bluetooth-state-persistence.sh
      - name: Managed history
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          missing=0
          for entry in \
            'config/hypr/scripts/quickshell_bluetooth_state.sh|.config/hypr/scripts/quickshell_bluetooth_state.sh' \
            'config/quickshell/awtarchy/BluetoothMenu.qml|.config/quickshell/awtarchy/BluetoothMenu.qml'; do
            source_path="${entry%%|*}"
            managed_path="${entry#*|}"
            hash="$(sha256sum "$source_path" | awk '{print $1}')"
            if ! grep -Fq "${hash}"$'\t'"${managed_path}" "$history"; then
              printf 'Missing managed history entry: %s\t%s\n' "$hash" "$managed_path" >&2
              missing=1
            fi
          done
          (( missing == 0 ))

  publish-v3-5-4:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 142 && github.event.pull_request.head.ref == 'release/v3.5.4-bridge' && github.event.pull_request.title == 'Release bridge: publish v3.5.4'
    needs: bluetooth-state
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release bridge
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: release/v3.5.4-bridge
          fetch-depth: 0

      - name: Verify target and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 4a7cb022c7001650cfe77467ba94d548e6d0e34a
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$EXPECTED_SHA" || {
            printf 'Refusing release: main moved from %s to %s\n' "$EXPECTED_SHA" "$current_main" >&2
            false
          }

          if gh release view v3.5.4 >/dev/null 2>&1; then
            printf '%s\n' 'Refusing release: v3.5.4 release already exists.' >&2
            false
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.5.4" >/dev/null 2>&1; then
            printf '%s\n' 'Refusing release: v3.5.4 tag already exists.' >&2
            false
          fi

          gh release create v3.5.4 \
            --target "$EXPECTED_SHA" \
            --title 'Awtarchy v3.5.4 Quickshell' \
            --notes-file .github/release-v3.5.4.md

          release_name="$(gh release view v3.5.4 --json name --jq '.name')"
          release_tag="$(gh release view v3.5.4 --json tagName --jq '.tagName')"
          release_draft="$(gh release view v3.5.4 --json isDraft --jq '.isDraft')"
          release_prerelease="$(gh release view v3.5.4 --json isPrerelease --jq '.isPrerelease')"

          test "$release_name" = 'Awtarchy v3.5.4 Quickshell'
          test "$release_tag" = 'v3.5.4'
          test "$release_draft" = 'false'
          test "$release_prerelease" = 'false'

          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.5.4" --jq '.object.type')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.5.4" --jq '.object.sha')"
          if [[ "$tag_type" == 'tag' ]]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          test "$tag_sha" = "$EXPECTED_SHA" || {
            printf 'Release tag points to %s, expected %s\n' "$tag_sha" "$EXPECTED_SHA" >&2
            false
          }

          gh release view v3.5.4 --json name,tagName,isDraft,isPrerelease,url
          printf 'Verified v3.5.4 tag target: %s\n' "$tag_sha"
