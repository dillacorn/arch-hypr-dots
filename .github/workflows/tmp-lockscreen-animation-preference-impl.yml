name: Temporary lockscreen animation preference implementation

on:
  push:
    branches:
      - feature/quickshell-lockscreen

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Run lockscreen animation preference helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quickshell-lockscreen
          fetch-depth: 0

      - name: Apply approved production changes
        run: python3 .github/tmp-lockscreen-animation-preference-impl.py

      - name: Focused validation
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-animation-preference.sh
          bash tests/test-quickshell-lockscreen-runtime-regressions.sh
          git diff --check

      - name: Commit production change and remove helpers
        run: |
          rm -f \
            .github/workflows/tmp-lockscreen-animation-preference-impl.yml \
            .github/tmp-lockscreen-animation-preference-impl.py
          git add -A
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/tmp-lockscreen-animation-preference-impl.py',
              '.github/workflows/tmp-lockscreen-animation-preference-impl.yml',
              'config/hypr/scripts/quickshell_application_state.sh',
              'config/quickshell/awtarchy/BarState.qml',
              'config/quickshell/awtarchy/QuickSettings.qml',
              'config/quickshell/awtarchy-lock/shell.qml',
              'config/quickshell/awtarchy-lock/LockSurface.qml',
              'local/share/awtarchy/quickshell-managed-history.sha256',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(
                  'unexpected staged paths:\n'
                  + '\n'.join(sorted(actual ^ expected))
              )
          PY
          git diff --cached --check
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git commit -m "Add lockscreen animation preferences"
          git push origin HEAD:feature/quickshell-lockscreen
