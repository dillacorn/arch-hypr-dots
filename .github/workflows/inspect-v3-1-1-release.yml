name: Inspect v3.1.1 Release

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect-release:
    runs-on: ubuntu-latest
    steps:
      - name: Print v3.1.1 release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '---BEGIN-V3.1.1-BODY---'
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.1.1" --jq '.body'
          echo '---END-V3.1.1-BODY---'
