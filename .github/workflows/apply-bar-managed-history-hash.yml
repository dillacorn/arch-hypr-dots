name: Apply Bar Managed History Hash

on:
  push:
    branches: [fix/brightness-wheel-response]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy' && github.event.head_commit.message == 'Stage bar managed history hash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/brightness-wheel-response
          fetch-depth: 0
      - name: Register exact Bar stock hash
        run: |
          path='.config/quickshell/awtarchy/Bar.qml'
          hash="$(sha256sum config/quickshell/awtarchy/Bar.qml | awk '{print $1}')"
          line="${hash}	${path}"
          grep -Fqx -- "$line" local/share/awtarchy/quickshell-managed-history.sha256 \
            || printf '%s\n' "$line" >> local/share/awtarchy/quickshell-managed-history.sha256
          bash tests/test-bar-wheel-input.sh
          bash tests/test-bar-icon-display-options.sh
      - name: Commit hash and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-bar-managed-history-hash.yml
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git diff --cached --check
          git commit -m 'Register brightness Bar managed hash'
          git push origin HEAD:fix/brightness-wheel-response
