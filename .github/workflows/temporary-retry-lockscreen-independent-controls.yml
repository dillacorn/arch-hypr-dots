name: Temporary Retry Lockscreen Independent Controls

on:
  push:
    branches:
      - feature/lockscreen-interactive-effects
    paths:
      - .github/workflows/temporary-retry-lockscreen-independent-controls.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/lockscreen-interactive-effects
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Reuse exact patch with matcher normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/temporary-apply-lockscreen-independent-controls.yml').read_text()
          match = re.search(r"python3 <<'PY'\n(?P<body>.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('could not extract original patch script')

          managed = Path('tests/test-quickshell-lockscreen-interactive-managed-history.sh')
          text = managed.read_text()
          needle = "    'config/quickshell/awtarchy-lock/cava.conf:.config/quickshell/awtarchy-lock/cava.conf'\n"
          if text.count(needle) != 1:
              raise SystemExit('managed-history cava line is not unique')
          managed.write_text(text.replace(needle, needle[:-1] + ' \n', 1))

          patch_script = textwrap.dedent(match.group('body'))
          namespace = {'__name__': '__main__'}
          exec(compile(patch_script, '<lockscreen-independent-controls-patch>', 'exec'), namespace)

          lines = managed.read_text().splitlines()
          managed.write_text('\n'.join(line.rstrip() for line in lines) + '\n')
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell_application_state.sh
          bash -n config/hypr/scripts/quickshell_lockscreen_audio.sh
          bash -n tests/test-quickshell-lockscreen-interactive-effects.sh
          bash -n tests/test-quickshell-lockscreen-interactive-physics-regressions.sh

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_lockscreen_audio.sh

      - name: Interactive effects contracts
        run: bash tests/test-quickshell-lockscreen-interactive-effects.sh

      - name: Interactive physics regressions
        run: bash tests/test-quickshell-lockscreen-interactive-physics-regressions.sh

      - name: Lockscreen runtime regressions
        run: bash tests/test-quickshell-lockscreen-runtime-regressions.sh

      - name: Animation preference regression
        run: bash tests/test-quickshell-lockscreen-animation-preference.sh

      - name: Managed history regression
        run: bash tests/test-quickshell-lockscreen-interactive-managed-history.sh

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/BarState.qml \
            config/quickshell/awtarchy/QuickSettings.qml \
            config/quickshell/awtarchy-lock/shell.qml \
            config/quickshell/awtarchy-lock/LockSurface.qml \
            config/quickshell/awtarchy-lock/LockWeatherCache.qml \
            tests/test-quickshell-lockscreen-interactive-physics-regressions.sh \
            tests/test-quickshell-lockscreen-interactive-managed-history.sh \
            local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Add independent lockscreen effect controls'
          git push origin HEAD:feature/lockscreen-interactive-effects
