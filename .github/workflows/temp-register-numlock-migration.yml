name: Temporary Num Lock Migration Registration

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 2
      - name: Verify regression and register managed hash
        env:
          EXPECTED_PARENT: b9796d8f399f73bda87b02677e9989c0216471fb
          EXPECTED_DIGEST: 2a6d1a4302bf15b2448f6a0fdb1bb115266beaf66b35260f37573968b58cd910
          MANAGED_PATH: .config/quickshell/awtarchy/NumlockSessionTweak.qml
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          bash tests/test-quickshell-capture-privacy.sh
          actual_digest="$(sha256sum config/quickshell/awtarchy/NumlockSessionTweak.qml | awk '{print $1}')"
          [[ "$actual_digest" == "$EXPECTED_DIGEST" ]]
          history=local/share/awtarchy/quickshell-managed-history.sha256
          line="${actual_digest}"$'\t'"${MANAGED_PATH}"
          grep -Fqx -- "$line" "$history" || printf '%s\n' "$line" >> "$history"
          git rm -- .github/workflows/temp-quickshell-qmllint.yml .github/workflows/temp-register-numlock-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$history"
          git diff --cached --check
          git commit -m 'Register Num Lock migration hash and remove diagnostics'
          git push origin HEAD:feature/lockscreen-interactive-effects
