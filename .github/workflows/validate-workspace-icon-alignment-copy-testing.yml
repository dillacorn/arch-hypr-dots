name: Validate Workspace Icon Alignment Copy Testing

on:
  push:
    branches:
      - feature/theme-picker-workspace-toggle-fixes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Workspace icon alignment and copy regression
        run: |
          bash -n tests/test-workspace-icon-packs.sh
          shellcheck tests/test-workspace-icon-packs.sh
          bash tests/test-workspace-icon-packs.sh
