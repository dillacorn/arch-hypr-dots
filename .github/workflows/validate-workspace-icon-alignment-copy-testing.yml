name: Validate Workspace Icon Alignment Copy Testing

on:
  push:
    branches:
      - feature/theme-picker-workspace-toggle-fixes

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Apply approved workspace icon refinement
        run: python3 tests/.tmp-workspace-icon-refinement.py
      - name: Validate approved refinement
        run: |
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck config/hypr/scripts/quickshell_application_state.sh
          bash -n tests/test-workspace-icon-packs.sh
          shellcheck tests/test-workspace-icon-packs.sh
          bash -n tests/test-bar-icon-customization.sh
          shellcheck tests/test-bar-icon-customization.sh
          bash tests/test-workspace-icon-packs.sh
          bash tests/test-theme-picker-workspace-composition.sh
          bash tests/test-quickshell-theme-picker.sh
          bash tests/test-bar-icon-customization.sh
          bash tests/test-bar-control-actions.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-task-icons.sh
          bash tests/test-quickshell-updater-migration.sh
          git diff --check
      - name: Commit validated refinement
        run: |
          if git diff --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_application_state.sh \
            config/quickshell/awtarchy/Bar.qml \
            config/quickshell/awtarchy/BarButton.qml \
            config/quickshell/awtarchy/BarIconSettings.qml \
            config/quickshell/awtarchy/BarState.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-bar-icon-customization.sh \
            tests/test-theme-picker-workspace-composition.sh
          git commit -m 'Refine workspace icon presets and copying'
          git push origin HEAD:feature/theme-picker-workspace-toggle-fixes
