name: Verify Quickshell WireGuard Regression

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install migration test tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Refresh hardened WireGuard managed hash
        id: history
        run: |
          manifest='local/share/awtarchy/quickshell-managed-history.sha256'
          entry='78f7ab202058f21be1015a0bcbd49c8cfc6bea1ef33a3cbcb5b1ad5919310107	.config/hypr/scripts/quickshell_wireguard.sh'
          if grep -Fqx "$entry" "$manifest"; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            printf '%b\n' "$entry" >>"$manifest"
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi
          git diff --check
      - name: WireGuard production readiness regression
        run: bash tests/test-quickshell-production-readiness.sh
      - name: Production updater migration regression
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Commit managed history
        if: steps.history.outputs.changed == 'true'
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Record hardened WireGuard managed hash'
          git push origin HEAD:quickshell-conversion-testing
