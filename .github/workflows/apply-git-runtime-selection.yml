name: Apply Git Runtime Selection Patch

on:
  push:
    branches:
      - fix/quickshell-interrupt-recovery
    paths:
      - .github/workflows/apply-git-runtime-selection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/quickshell-interrupt-recovery
          fetch-depth: 0
      - name: Apply exact Git runtime dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/bin/awtarchy')
          text = path.read_text(encoding='utf-8')

          anchor = '''run_runtime() {
            require_runtime
            bash "$RUNTIME" "$@"
          }

          exec_runtime() {
          '''
          helper = '''run_runtime() {
            require_runtime
            bash "$RUNTIME" "$@"
          }

          run_git_revision_runtime() {
            local branch="$1" revision="$2"
            shift 2
            local tmp="" archive="" top="" repo_dir="" testing_runtime="" rc=0

            have curl || die "curl is required for Git-testing runtime selection."
            have tar || die "tar is required for Git-testing runtime selection."
            have python3 || die "python3 is required for Git-testing runtime selection."
            [[ $revision =~ ^[0-9a-fA-F]{40}$ ]] \
              || die "Git-testing runtime requires an exact 40-character commit SHA."
            revision="${revision,,}"

            tmp="$(mktemp -d)"
            archive="${tmp}/awtarchy.tar.gz"
            curl_args download
            log "Loading Awtarchy runtime from Git testing ${branch}@${revision}..."
            if ! curl "${CURL_ARGS[@]}" -o "$archive" \
              "https://github.com/${REPO_OWNER}/${REPO_NAME}/archive/${revision}.tar.gz";
            then
              rm -rf -- "$tmp"
              die "Failed to download Git-testing runtime revision ${revision}."
            fi

            if ! top="$(archive_topdir "$archive")"; then
              rm -rf -- "$tmp"
              die "Git-testing runtime archive validation failed."
            fi
            if ! [[ $top == "${REPO_NAME}-${revision}" ]]; then
              rm -rf -- "$tmp"
              die "Git-testing runtime archive does not match revision ${revision}."
            fi
            if ! tar -xzf "$archive" -C "$tmp"; then
              rm -rf -- "$tmp"
              die "Failed to extract Git-testing runtime revision ${revision}."
            fi

            repo_dir="${tmp}/${top}"
            testing_runtime="${repo_dir}/local/share/awtarchy/awtarchy-runtime.sh"
            if ! [[ -f $testing_runtime && ! -L $testing_runtime ]]; then
              rm -rf -- "$tmp"
              die "Git-testing revision ${revision} does not contain a safe Awtarchy runtime."
            fi
            if ! bash -n "$testing_runtime"; then
              rm -rf -- "$tmp"
              die "Git-testing runtime failed Bash syntax validation."
            fi

            bash "$testing_runtime" "$@" || rc=$?
            rm -rf -- "$tmp"
            return "$rc"
          }

          exec_runtime() {
          '''
          if anchor not in text:
              raise SystemExit('run_runtime insertion anchor not found')
          text = text.replace(anchor, helper, 1)

          old = '  run_runtime "${runtime_args[@]}"\n'
          new = '  run_git_revision_runtime "$branch" "$revision" "${runtime_args[@]}"\n'
          start = text.find('run_git_operation() {')
          end = text.find('\n}\n\ngit_cli() {', start)
          if start < 0 or end < 0:
              raise SystemExit('run_git_operation boundaries not found')
          body = text[start:end]
          if old not in body:
              raise SystemExit('installed runtime dispatch not found in run_git_operation')
          body = body.replace(old, new, 1)
          text = text[:start] + body + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate production patch
        run: |
          bash -n local/bin/awtarchy
          bash tests/test-git-runtime-selection.sh
          bash tests/test-quickshell-update-interrupt-recovery.sh
          bash tests/test-quickshell-updater-bootstrap.sh
          git diff --check
      - name: Commit production patch
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add local/bin/awtarchy
          git commit -m 'Run exact runtime during Git testing'
          git push origin HEAD:fix/quickshell-interrupt-recovery
