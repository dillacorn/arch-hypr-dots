name: Apply Git Runtime Selection Patch

on:
  push:
    branches:
      - fix/quickshell-interrupt-recovery
    paths:
      - .github/workflows/apply-git-runtime-selection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/quickshell-interrupt-recovery
          fetch-depth: 0
      - name: Update Git mode archive fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-awtarchy-git-mode.sh')
          text = path.read_text(encoding='utf-8')

          old_parser = '''url=""
          data_ref=""
          while (( $# )); do
            case "$1" in
              -H|--connect-timeout|--max-time|--retry|--retry-delay|--speed-limit|--speed-time|-o|--output)
                shift 2
                ;;
          '''
          new_parser = '''url=""
          data_ref=""
          output=""
          while (( $# )); do
            case "$1" in
              -H|--connect-timeout|--max-time|--retry|--retry-delay|--speed-limit|--speed-time)
                shift 2
                ;;
              -o|--output)
                output="$2"
                shift 2
                ;;
          '''
          if old_parser not in text:
              raise SystemExit('fake curl parser anchor not found')
          text = text.replace(old_parser, new_parser, 1)

          archive_case = '''  https://github.com/dillacorn/awtarchy/archive/*.tar.gz)
            [[ -n $output ]] || exit 22
            revision="${url%.tar.gz}"
            revision="${revision##*/}"
            [[ $revision =~ ^[0-9a-f]{40}$ ]] || exit 22
            work="$(mktemp -d)"
            top="awtarchy-${revision}"
            mkdir -p -- "$work/$top/local/share/awtarchy"
            cat >"$work/$top/local/share/awtarchy/awtarchy-runtime.sh" <<'EOF_ARCHIVE_RUNTIME'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          printf '%s\\n' "$@" >"${AWTARCHY_TEST_RUNTIME_LOG:?}"
          EOF_ARCHIVE_RUNTIME
            tar -czf "$output" -C "$work" "$top"
            rm -rf -- "$work"
            ;;
          '''
          marker = "  'https://api.github.com/repos/dillacorn/awtarchy/contents/local/share/awtarchy/quickshell-managed-history.sha256')\n"
          if marker not in text:
              raise SystemExit('fake curl archive insertion anchor not found')
          text = text.replace(marker, archive_case + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate updated fixture
        run: |
          bash -n tests/test-awtarchy-git-mode.sh
          bash tests/test-awtarchy-git-mode.sh
          bash tests/test-git-runtime-selection.sh
          bash tests/test-quickshell-update-interrupt-recovery.sh
          bash tests/test-quickshell-updater-bootstrap.sh
          git diff --check
      - name: Commit fixture update
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add tests/test-awtarchy-git-mode.sh
          git commit -m 'Test Git runtime archive loading'
          git push origin HEAD:fix/quickshell-interrupt-recovery
