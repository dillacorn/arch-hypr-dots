name: One-use Lenovo mixed battery fix

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
          fetch-depth: 0
      - name: Patch mixed Lenovo detection
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          detector = Path('config/hypr/scripts/quickshell_battery_care.sh')
          text = detector.read_text()
          pattern = r'(?ms)^        lenovo\)\n.*?^            ;;\n(?=        lenovo-legacy\))'
          new = '''        lenovo)
              lenovo_long_life=false
              lenovo_standard=false
              if grep -Eq 'charge_types[^=]*=.*\\[Long_Life\\]' <<<"$tlp_output"; then
                  lenovo_long_life=true
              fi
              if grep -Eq 'charge_types[^=]*=.*\\[Standard\\]' <<<"$tlp_output"; then
                  lenovo_standard=true
              fi

              if [[ "$lenovo_long_life" == true && "$lenovo_standard" == true ]]; then
                  mixed_stop_thresholds=true
              elif [[ "$lenovo_long_life" == true ]]; then
                  enabled=true
              elif [[ "$lenovo_standard" == true ]]; then
                  enabled=false
                  observed_target=100
              fi
              ;;
'''
          text, count = re.subn(pattern, lambda _: new, text, count=1)
          if count != 1:
              raise SystemExit('expected Lenovo detector block not found exactly once')
          detector.write_text(text)

          profiles = Path('tests/test-battery-care-detector-profiles.sh')
          ptext = profiles.read_text()
          old_fixture = '''json="$(run_profile lenovo 'charge type' '' '0(Standard)..1(Long_Life) -- charge_types' '/sys/class/power_supply/BAT0/charge_types = Standard [Long_Life]')"'''
          new_fixture = '''json="$(run_profile lenovo 'charge threshold' '' '0(Standard)..1(Long_Life) -- charge_types' '/sys/class/power_supply/BAT0/charge_types = Standard [Long_Life]')"'''
          if ptext.count(old_fixture) != 1:
              raise SystemExit('expected Lenovo profile fixture not found exactly once')
          profiles.write_text(ptext.replace(old_fixture, new_fixture, 1))
          PY

          hash="$(sha256sum config/hypr/scripts/quickshell_battery_care.sh | awk '{print $1}')"
          entry="${hash}"$'\t''.config/hypr/scripts/quickshell_battery_care.sh'
          grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256 \
            || printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256

          bash -n config/hypr/scripts/quickshell_battery_care.sh
          bash -n tests/test-battery-care-multibattery.sh
          bash -n tests/test-battery-care-detector-profiles.sh
          shellcheck config/hypr/scripts/quickshell_battery_care.sh tests/test-battery-care-multibattery.sh tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-care-multibattery.sh
          bash tests/test-battery-care-detector-profiles.sh
          git diff --check

          rm -- .github/workflows/one-use-lenovo-mixed-battery.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add config/hypr/scripts/quickshell_battery_care.sh \
                  tests/test-battery-care-detector-profiles.sh \
                  local/share/awtarchy/quickshell-managed-history.sha256 \
                  .github/workflows/one-use-lenovo-mixed-battery.yml
          git commit -m 'Handle mixed Lenovo battery care states'
          git push origin HEAD:hardening/tlp-battery-compatibility
