name: One-use Lenovo mixed battery fix

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
          fetch-depth: 0
      - name: Patch mixed Lenovo detection
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/awtarchy-lenovo-patch.py
          python3 /tmp/awtarchy-lenovo-patch.py

          hash="$(sha256sum config/hypr/scripts/quickshell_battery_care.sh | awk '{print $1}')"
          entry="${hash}"$'\t''.config/hypr/scripts/quickshell_battery_care.sh'
          grep -Fqx -- "$entry" local/share/awtarchy/quickshell-managed-history.sha256 \
            || printf '%s\n' "$entry" >> local/share/awtarchy/quickshell-managed-history.sha256

          bash -n config/hypr/scripts/quickshell_battery_care.sh
          bash -n tests/test-battery-care-multibattery.sh
          bash -n tests/test-battery-care-detector-profiles.sh
          shellcheck config/hypr/scripts/quickshell_battery_care.sh tests/test-battery-care-multibattery.sh tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-care-multibattery.sh
          bash tests/test-battery-care-detector-profiles.sh
          git diff --check

          rm -- .github/workflows/one-use-lenovo-mixed-battery.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add config/hypr/scripts/quickshell_battery_care.sh \
                  tests/test-battery-care-detector-profiles.sh \
                  local/share/awtarchy/quickshell-managed-history.sha256 \
                  .github/workflows/one-use-lenovo-mixed-battery.yml
          git commit -m 'Handle mixed Lenovo battery care states'
          git push origin HEAD:hardening/tlp-battery-compatibility
