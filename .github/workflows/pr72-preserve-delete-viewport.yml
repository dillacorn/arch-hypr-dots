name: Apply PR72 Clipboard Delete Viewport Fix

on:
  push:
    branches:
      - feature/progressive-clipboard-loading
    paths:
      - .github/pr72-preserve-delete-viewport.py
      - .github/workflows/pr72-preserve-delete-viewport.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: feature/progressive-clipboard-loading
          fetch-depth: 0

      - name: Install focused validation tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Apply and validate viewport-preserving deletion
        run: |
          set -euo pipefail
          python3 .github/pr72-preserve-delete-viewport.py

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          marker='# 2026-08-27 preserve Clipboard viewport after per-entry deletion.'
          if grep -Fqx -- "$marker" "$history"; then
            echo 'managed-history marker already exists' >&2
            exit 1
          fi

          js_hash="$(sha256sum config/quickshell/awtarchy/ClipboardLoadState.js | awk '{print $1}')"
          qml_hash="$(sha256sum config/quickshell/awtarchy/ClipboardMenu.qml | awk '{print $1}')"
          {
            printf '\n%s\n' "$marker"
            printf '%s\t%s\n' "$js_hash" '.config/quickshell/awtarchy/ClipboardLoadState.js'
            printf '%s\t%s\n' "$qml_hash" '.config/quickshell/awtarchy/ClipboardMenu.qml'
          } >> "$history"

          bash tests/test-quickshell-clipboard-load-state.sh
          bash tests/test-quickshell-clipboard-progressive.sh
          bash tests/test-quickshell-clipboard-thumbnails.sh
          bash tests/test-flyout-edge-layout.sh
          git diff --check

      - name: Commit production change and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f .github/pr72-preserve-delete-viewport.py
          rm -f .github/workflows/pr72-preserve-delete-viewport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve clipboard position after delete'
          git push origin HEAD:feature/progressive-clipboard-loading
