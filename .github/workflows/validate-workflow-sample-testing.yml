name: Validate Workflow Sample Testing

on:
  push:
    branches:
      - feature/theme-picker-workspace-toggle-fixes

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Apply Workflow preview consistency fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          state = Path("config/quickshell/awtarchy/BarState.qml")
          text = state.read_text(encoding="utf-8")
          old = '{ key: "workflow", label: "Workflow", sample: "" }'
          new = '{ key: "workflow", label: "Workflow", sample: "" }'
          if old not in text:
              raise SystemExit("old Workflow preview sample not found")
          state.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test-workspace-icon-packs.sh")
          text = test.read_text(encoding="utf-8")
          anchor = "contains \"$BAR_STATE\" 'function workspaceIconPackFor(style)' \\\n    'BarState has no pack lookup helper'\n"
          assertion = "contains \"$BAR_STATE\" '{ key: \"workflow\", label: \"Workflow\", sample: \"\" }' \\\n    'Workflow preview does not match the approved pack'\n"
          if assertion not in text:
              if anchor not in text:
                  raise SystemExit("workspace pack test insertion point not found")
              text = text.replace(anchor, assertion + anchor, 1)
              test.write_text(text, encoding="utf-8")

          digest = hashlib.sha256(state.read_bytes()).hexdigest()
          history = Path("local/share/awtarchy/quickshell-managed-history.sha256")
          history_text = history.read_text(encoding="utf-8")
          line = f"{digest}\t.config/quickshell/awtarchy/BarState.qml"
          if line not in history_text:
              if not history_text.endswith("\n"):
                  history_text += "\n"
              history_text += line + "\n"
              history.write_text(history_text, encoding="utf-8")
          PY
      - name: Validate Workflow preview consistency
        run: |
          bash -n tests/test-workspace-icon-packs.sh
          shellcheck tests/test-workspace-icon-packs.sh
          bash tests/test-workspace-icon-packs.sh
          bash tests/test-theme-picker-workspace-composition.sh
          bash tests/test-bar-icon-customization.sh
          bash tests/test-quickshell-updater-migration.sh
          git diff --check
      - name: Commit Workflow preview consistency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            config/quickshell/awtarchy/BarState.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            tests/test-workspace-icon-packs.sh
          git commit -m 'Align Workflow preview with preset'
          git push origin HEAD:feature/theme-picker-workspace-toggle-fixes
