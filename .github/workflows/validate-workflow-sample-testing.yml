name: Validate Workflow Sample Testing

on:
  push:
    branches:
      - feature/theme-picker-workspace-toggle-fixes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Workflow preview consistency regression
        run: |
          grep -Fq '{ key: "workflow", label: "Workflow", sample: "" }' \
            config/quickshell/awtarchy/BarState.qml
