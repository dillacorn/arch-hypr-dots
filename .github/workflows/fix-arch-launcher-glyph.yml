name: Fix Arch Launcher Glyph

on:
  push:
    branches:
      - feature/bar-icon-customization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-arch-glyph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq lua5.4

      - name: Prove old Arch glyph fails corrected regression
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's///g' tests/test-bar-icon-customization.sh
          set +e
          output="$(bash tests/test-bar-icon-customization.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status == 0 )); then
              printf '%s\n' 'Corrected Arch glyph regression unexpectedly passed before production change.' >&2
              exit 1
          fi
          grep -Fq 'launcher presets are missing the Arch glyph' <<<"$output"

      - name: Replace Arch preset with Nerd Font logo
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's///g' config/quickshell/awtarchy/BarState.qml
          sed -i 's///g' docs/superpowers/specs/2026-08-28-bar-icon-customization-design.md
          sed -i 's///g' docs/superpowers/plans/2026-08-28-bar-icon-customization.md

          history='local/share/awtarchy/quickshell-managed-history.sha256'
          hash="$(sha256sum config/quickshell/awtarchy/BarState.qml | awk '{print $1}')"
          if ! grep -Fq "$hash" "$history"; then
              printf '\n# 2026-08-28 Arch launcher Nerd Font glyph correction.\n%s\t.config/quickshell/awtarchy/BarState.qml\n' "$hash" >>"$history"
          fi

      - name: Verify corrected glyph
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tests/test-bar-icon-customization.sh
          bash -n config/hypr/scripts/quickshell_application_state.sh
          shellcheck tests/test-bar-icon-customization.sh config/hypr/scripts/quickshell_application_state.sh
          bash tests/test-bar-icon-customization.sh
          grep -Fq '{ label: "Arch", value: "" }' config/quickshell/awtarchy/BarState.qml
          if grep -RFn --exclude='fix-arch-launcher-glyph.yml' '' \
              config/quickshell/awtarchy/BarState.qml \
              tests/test-bar-icon-customization.sh \
              docs/superpowers/specs/2026-08-28-bar-icon-customization-design.md \
              docs/superpowers/plans/2026-08-28-bar-icon-customization.md; then
              printf '%s\n' 'Old Arch glyph remains in bar-icon feature files.' >&2
              exit 1
          fi

      - name: Preserve production and updater regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-bluetooth-state-persistence.sh
          bash tests/test-night-light-schedule.sh
          bash tests/test-quickshell-production-readiness.sh
          bash tests/test-quickshell-updater-migration.sh
          git diff --check origin/main...HEAD
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
              config/quickshell/awtarchy/BarState.qml \
              tests/test-bar-icon-customization.sh \
              docs/superpowers/specs/2026-08-28-bar-icon-customization-design.md \
              docs/superpowers/plans/2026-08-28-bar-icon-customization.md \
              local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Fix Arch launcher glyph'
          git push origin HEAD:feature/bar-icon-customization
