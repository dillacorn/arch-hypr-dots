name: Temporary NVIDIA detection fix

on:
  push:
    branches:
      - nvidia-detection-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nvidia-detection-fix
          fetch-depth: 0

      - name: Apply minimal runtime fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("local/share/awtarchy/awtarchy-runtime.sh")
          old = "  pacman -Qq 2>/dev/null | grep -Eq '^(nvidia|nvidia-open|nvidia-[0-9]{3}xx|linux-cachyos.*-nvidia)(-|$)|^nvidia-utils$'"
          new = "  pacman -Qq 2>/dev/null | grep -E '^(nvidia|nvidia-open|nvidia-[0-9]{3}xx|linux-cachyos.*-nvidia)(-|$)|^nvidia-utils$' >/dev/null"
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count == 0:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("expected NVIDIA detection line was not found")
          if count != 1:
              raise SystemExit(f"expected exactly one NVIDIA detection line, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate targeted fix
        shell: bash
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash tests/test-hardware-reconcile-sudo.sh
          git diff --check

      - name: Commit runtime fix
        shell: bash
        run: |
          if git diff --quiet -- local/share/awtarchy/awtarchy-runtime.sh; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m "fix: avoid NVIDIA stack pipefail false positive"
          git push origin HEAD:nvidia-detection-fix
