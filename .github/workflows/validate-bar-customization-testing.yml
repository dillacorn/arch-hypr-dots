name: Validate Bar Customization Testing

on:
  push:
    branches: [feature/filter-quickshell-task-icons]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Record managed stock hashes
        env:
          HISTORY: local/share/awtarchy/quickshell-managed-history.sha256
        run: |
          append_hash() {
            local digest="$1" path="$2"
            grep -Fq -- "$digest"$'\t'"$path" "$HISTORY" || printf '%s\t%s\n' "$digest" "$path" >>"$HISTORY"
          }
          append_hash af57ebb1ac2ff70eaebb8d4985921a3b09e70726ac395c52fd9e34cee510a07f .config/hypr/scripts/quickshell.sh
          append_hash 99cc1c0ccb97efb119c985782827d2bd631ca14c81ec18b7f3bf7fb2b2b2b1d8 .config/quickshell/awtarchy/Bar.qml
          append_hash 291ad97f54a1567f989da20cfa20df211f999d217ac3c6d4787dc4f6afbb8d04 .config/quickshell/awtarchy/BarSettingsSection.qml
          if git diff --quiet -- "$HISTORY"; then
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -- "$HISTORY"
          git commit -m 'Record bar customization managed hashes'
          git push origin HEAD:feature/filter-quickshell-task-icons
      - name: Syntax and lint
        run: |
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bar-task-icons.sh
          bash -n tests/test-bar-module-visibility.sh
          bash -n tests/test-display-scale-quicksettings.sh
          shellcheck tests/test-bar-task-icons.sh tests/test-bar-module-visibility.sh
          git diff --check origin/main...HEAD
      - name: Focused bar tests
        run: |
          bash tests/test-bar-task-icons.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-customization.sh
      - name: Updater regressions
        run: |
          bash tests/test-display-scale-quicksettings.sh
          bash tests/test-quickshell-updater-migration.sh
