name: Validate Bar Customization Testing

on:
  push:
    branches: [feature/filter-quickshell-task-icons]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck lua5.4
      - name: Apply launcher task-filter fix
        env:
          BAR: config/quickshell/awtarchy/Bar.qml
          HISTORY: local/share/awtarchy/quickshell-managed-history.sha256
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("config/quickshell/awtarchy/Bar.qml")
          lines = path.read_text().splitlines(keepends=True)
          desired = '"Awtarchy Application Search",'

          if not any(desired in line for line in lines):
              list_index = next((i for i, line in enumerate(lines)
                                 if "const flyoutTitles = [" in line), None)
              if list_index is None:
                  raise SystemExit("flyout title list not found")

              insert_index = next((i for i in range(list_index + 1, len(lines))
                                   if '"Awtarchy Clipboard History",' in lines[i]), None)
              if insert_index is None:
                  raise SystemExit("clipboard flyout title not found")

              indent = lines[insert_index][:len(lines[insert_index]) - len(lines[insert_index].lstrip())]
              lines.insert(insert_index, f'{indent}"Awtarchy Application Search",\n')
              path.write_text("".join(lines))
          PY

          append_file_hash() {
            local source="$1" target="$2" digest
            digest="$(sha256sum "$source" | awk '{print $1}')"
            grep -Fq -- "$digest"$'\t'"$target" "$HISTORY" \
              || printf '%s\t%s\n' "$digest" "$target" >>"$HISTORY"
          }

          append_file_hash config/hypr/scripts/quickshell.sh .config/hypr/scripts/quickshell.sh
          append_file_hash "$BAR" .config/quickshell/awtarchy/Bar.qml
          append_file_hash config/quickshell/awtarchy/BarSettingsSection.qml .config/quickshell/awtarchy/BarSettingsSection.qml

          if ! git diff --quiet -- "$BAR" "$HISTORY"; then
            git config user.name dillacorn
            git config user.email 28743863+dillacorn@users.noreply.github.com
            git add -- "$BAR" "$HISTORY"
            git commit -m 'Exclude application launcher from task strip'
            git push origin HEAD:feature/filter-quickshell-task-icons
          fi
      - name: Syntax and lint
        run: |
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bar-task-icons.sh
          bash -n tests/test-bar-module-visibility.sh
          bash -n tests/test-display-scale-quicksettings.sh
          shellcheck tests/test-bar-task-icons.sh tests/test-bar-module-visibility.sh
          git diff --check origin/main...HEAD
      - name: Focused bar tests
        run: |
          bash tests/test-bar-task-icons.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-customization.sh
      - name: Updater regressions
        run: |
          bash tests/test-display-scale-quicksettings.sh
          bash tests/test-quickshell-updater-migration.sh
