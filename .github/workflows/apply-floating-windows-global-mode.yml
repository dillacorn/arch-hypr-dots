name: Apply Floating Windows Global Mode

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/apply-floating-windows-global-mode.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: python3 .github/scripts/apply_floating_windows_global_mode.py
      - run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell_floating_windows.sh
          bash -n tests/test-floating-windows-global-mode.sh
          shellcheck config/hypr/scripts/quickshell_floating_windows.sh tests/test-floating-windows-global-mode.sh
          bash tests/test-floating-windows-global-mode.sh
          bash tests/test-floating-windows-quicksettings.sh
          bash tests/test-quick-settings-bar-customize-flow.sh
          bash tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-ux-flow.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-display-options.sh
          bash tests/test-bar-icon-customization.sh
      - run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add \
            config/hypr/scripts/quickshell_floating_windows.sh \
            config/hypr/hyprland.lua \
            config/quickshell/awtarchy/Bar.qml \
            config/quickshell/awtarchy/FloatingWindowsCard.qml \
            config/quickshell/awtarchy/FloatingWindowsState.qml \
            local/share/awtarchy/quickshell-managed-history.sha256 \
            docs/superpowers/plans/2026-08-30-floating-spawn-mode-design.md \
            docs/superpowers/plans/2026-08-30-floating-spawn-mode.md
          git commit -m 'Add global floating spawn mode controls'
          git push origin HEAD:feature/bar-transparency
