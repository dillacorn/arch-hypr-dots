name: Validate Awtarchy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-stage2b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: keyring-pam-cleanup
          fetch-depth: 0

      - name: Correct Stage 2B production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("local/share/awtarchy/awtarchy-runtime.sh")
          text = path.read_text(encoding="utf-8")

          old_enable = '''enable_keyring_pam_stage() {
            if (( INSTALL_LY == 1 )); then
              cleanup_legacy_keyring_pam_stage "$REPO_DIR"
              log "Ly provides GNOME Keyring PAM integration; skipping duplicate /etc/pam.d/login hooks."
              return 0
            fi
            (( ENABLE_KEYRING_PAM == 1 )) || { warn "Skipping GNOME Keyring PAM change."; return 0; }
          '''
          old_enable = "\n".join(line[10:] if line.startswith("          ") else line for line in old_enable.splitlines()) + "\n"
          new_enable = '''enable_keyring_pam_stage() {
            if (( INSTALL_LY == 1 )); then
              log "Ly provides GNOME Keyring PAM integration; skipping duplicate /etc/pam.d/login hooks."
              return 0
            fi
            (( ENABLE_KEYRING_PAM == 1 )) || { warn "Skipping GNOME Keyring PAM change."; return 0; }
          '''
          new_enable = "\n".join(line[10:] if line.startswith("          ") else line for line in new_enable.splitlines()) + "\n"
          if old_enable in text:
              text = text.replace(old_enable, new_enable, 1)
          elif new_enable not in text:
              raise SystemExit("could not normalize Ly keyring install branch")

          old_sequence = '''  install_micro_themes_stage
            enable_keyring_pam_stage
            install_ly_stage
            copy_awtarchy_configs_stage
          '''
          old_sequence = "\n".join(line[10:] if line.startswith("          ") else line for line in old_sequence.splitlines()) + "\n"
          new_sequence = '''  install_micro_themes_stage
            enable_keyring_pam_stage
            install_ly_stage
            if (( INSTALL_LY == 1 )); then
              cleanup_legacy_keyring_pam_stage "$REPO_DIR"
            fi
            copy_awtarchy_configs_stage
          '''
          new_sequence = "\n".join(line[10:] if line.startswith("          ") else line for line in new_sequence.splitlines()) + "\n"
          if old_sequence in text:
              text = text.replace(old_sequence, new_sequence, 1)
          elif new_sequence not in text:
              raise SystemExit("could not locate fresh-install stage sequence")

          malformed = '''  if (( REVIEW_ONLY == 0 )); then
            cleanup_legacy_keyring_pam_stage "$repo_dir"
          fi
          '''
          malformed = "\n".join(line[10:] if line.startswith("          ") else line for line in malformed.splitlines()) + "\n"
          correct = '  if (( REVIEW_ONLY == 0 )); then\n    cleanup_legacy_keyring_pam_stage "$repo_dir"\n  fi\n'
          # The first branch patch lost indentation on the body/end lines.
          bad = '  if (( REVIEW_ONLY == 0 )); then\n  cleanup_legacy_keyring_pam_stage "$repo_dir"\nfi\n'
          if bad in text:
              text = text.replace(bad, correct, 1)
          elif correct not in text:
              raise SystemExit("could not normalize update cleanup indentation")

          path.write_text(text, encoding="utf-8")
          PY

          bash -n local/share/awtarchy/awtarchy-runtime.sh
          python3 tests/test-keyring-pam-cleanup.py
          git diff --check

      - name: Commit corrected production patch
        run: |
          if git diff --quiet; then
            echo 'Stage 2B production patch ordering is already correct.'
            exit 0
          fi
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'fix: clean keyring PAM after Ly install'
          git push origin HEAD:keyring-pam-cleanup
