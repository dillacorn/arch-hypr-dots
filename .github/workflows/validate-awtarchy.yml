name: One-use TLPUI runtime cleanup

on:
  pull_request:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.number == 156 && github.head_ref == 'refactor/tlp-battery-care-thin-client'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove obsolete TLPUI AUR block
        shell: bash
        run: |
          set -Eeuo pipefail

          runtime='local/share/awtarchy/awtarchy-runtime.sh'
          expected_blob='0db7e6b55f5e9468f429166d15c1e5c90bd137eb'
          actual_blob="$(git hash-object "$runtime")"
          [[ "$actual_blob" == "$expected_blob" ]] || {
            printf 'Refusing runtime edit: expected blob %s, found %s\n' "$expected_blob" "$actual_blob" >&2
            exit 1
          }

          python3 - "$runtime" <<'PY'
          from pathlib import Path
          import re
          import sys

          runtime = Path(sys.argv[1])
          text = runtime.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n  if \[\[ "\$IS_LAPTOP" == true && "\$IS_VM" == false \]\]; then\n'
              r'    if pacman -Q tlpui >/dev/null 2>&1; then\n'
              r'.*?'
              r'\n  fi\n\n(?=  if pacman -Q moonlight-qt-bin >/dev/null 2>&1; then)',
              re.DOTALL,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one structurally anchored legacy tlpui AUR block, found {len(matches)}')
          runtime.write_text(pattern.sub('\n', text, count=1), encoding='utf-8')
          PY

          bash -n "$runtime"
          bash tests/test-installer-aur-scanner-delegation.sh
          bash tests/test-quickshell-backend-readiness.sh
          git diff --check

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -- "$runtime"
          git diff --cached --check
          git commit -m 'refactor: retire tlpui AUR install path'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
