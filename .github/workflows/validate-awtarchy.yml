name: Validate Awtarchy

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish-v3-2-0:
    if: github.event.pull_request.title == 'Trigger v3.2.0 release' && github.event.pull_request.head.ref == 'v3-2-0-release-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          ref: main

      - name: Run reviewed v3.2.0 publisher from main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 9a96b5352461fc88e31c8fe690eb4487a3e16de4
          TARGET_TREE: 192934acba334e350abd6e2e76de27a664880bc2
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/antispam-pr-labeler.yml')
          text = path.read_text()
          step = "      - name: Publish Awtarchy v3.2.0\n"
          run_marker = "        run: |\n"
          step_pos = text.index(step)
          start = text.index(run_marker, step_pos) + len(run_marker)
          raw = text[start:]
          lines = raw.splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected publisher indentation: {line!r}')
          script = '\n'.join(script_lines).rstrip() + '\n'
          if not script.startswith('set -euo pipefail\n'):
              raise SystemExit('publisher extraction did not start at expected shell body')
          if 'gh release create v3.2.0' not in script:
              raise SystemExit('publisher extraction is missing v3.2.0 release creation')
          Path('/tmp/publish-v3-2-0.sh').write_text(script)
          PY

          bash /tmp/publish-v3-2-0.sh
