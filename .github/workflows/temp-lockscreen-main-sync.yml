name: TEMP Sync Quickshell Lockscreen with main

on:
  push:
    branches: [feature/quickshell-lockscreen]

permissions:
  contents: write

jobs:
  sync:
    if: startsWith(github.event.head_commit.message, 'Stage lockscreen main sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quickshell-lockscreen
          fetch-depth: 0

      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          bar='config/quickshell/awtarchy/Bar.qml'
          hypr='config/hypr/hyprland.lua'
          bar_test='tests/test-bar-wheel-input.sh'
          lua_test='tests/test-lua-validation.sh'

          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if (( merge_rc != 0 )); then
              unexpected=''
              while IFS= read -r path; do
                  case "$path" in
                      "$history")
                          git checkout --ours -- "$history"
                          while IFS= read -r line; do
                              [[ -z "$line" ]] && continue
                              if ! grep -Fqx -- "$line" "$history"; then
                                  printf '%s\n' "$line" >> "$history"
                              fi
                          done < <(git show "origin/main:$history")
                          git add "$history"
                          ;;
                      "$bar")
                          git checkout --ours -- "$bar"
                          sed -i '/^[[:space:]]*wheelActivationDelay: 400[[:space:]]*$/d' "$bar"
                          git add "$bar"
                          ;;
                      "$hypr")
                          git checkout --ours -- "$hypr"
                          git add "$hypr"
                          ;;
                      "$bar_test"|"$lua_test")
                          git checkout --theirs -- "$path"
                          git add "$path"
                          ;;
                      *)
                          unexpected+="$path"$'\n'
                          ;;
                  esac
              done < <(git diff --name-only --diff-filter=U)

              if [[ -n "$unexpected" ]]; then
                  printf 'Unexpected merge conflicts:\n%s' "$unexpected" >&2
                  git merge --abort
                  exit 1
              fi
          fi

          [[ -z "$(git diff --name-only --diff-filter=U)" ]]

          rm -f .github/workflows/temp-lockscreen-main-sync.yml
          git add -A
          git diff --cached --check

          bash tests/test-bar-wheel-input.sh
          bash tests/test-lua-validation.sh
          bash tests/test-quickshell-lockscreen-foundation.sh
          bash tests/test-quickshell-lockscreen-migration.sh

          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git commit -m 'Sync lockscreen with current main'
          git push origin HEAD:feature/quickshell-lockscreen
