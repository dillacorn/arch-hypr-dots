name: Hardware Reconcile Regression

on:
  push:
    branches: [hardware-reconcile-sudo-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Apply production patch
        run: python3 .github/hardware-reconcile-patch.py
      - name: Verify focused regression
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-hardware-reconcile-sudo.sh
          bash tests/test-hardware-reconcile-sudo.sh
          git diff --check
      - name: Commit production patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local/share/awtarchy/awtarchy-runtime.sh .github/workflows/validate-awtarchy.yml
          git commit -m 'fix: reconcile hardware with narrow sudo elevation'
          git push origin HEAD:hardware-reconcile-sudo-fix
