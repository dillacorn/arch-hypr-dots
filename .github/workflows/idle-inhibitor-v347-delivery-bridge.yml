name: One-use v3.4.7 idle inhibitor delivery bridge

on:
  push:
    branches: [fix/idle-inhibitor-instant-feedback]

permissions:
  contents: write

jobs:
  add-stable-delivery:
    if: github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: fix/idle-inhibitor-instant-feedback
          fetch-depth: 0

      - name: Add focused failing delivery regression
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/test-bar-control-actions.sh')
          text = path.read_text(encoding='utf-8')

          old = 'SYSTEM_STATE="${ROOT}/config/quickshell/awtarchy/SystemState.qml"\n'
          new = old + 'RUNTIME="${ROOT}/local/share/awtarchy/awtarchy-runtime.sh"\n'
          if text.count(old) != 1:
              raise SystemExit('test runtime-variable anchor mismatch')
          text = text.replace(old, new, 1)

          anchor = '''! grep -Fq 'interval: 350' "$SYSTEM_STATE" \\
            || fail "idle inhibitor still contains the 350 ms visual delay"\n'''
          addition = r'''

          grep -Fq 'repair_v347_idle_inhibitor_feedback_target()' "$RUNTIME" \
            || fail "runtime is missing the v3.4.7 idle-inhibitor post-release repair"
          grep -Fq '[[ "$tag" == "v3.4.7" ]] || return 0' "$RUNTIME" \
            || fail "v3.4.7 idle-inhibitor repair is not scoped to the published release"
          grep -Fq 'repair_v347_idle_inhibitor_feedback_target "$target_home" "$tag"' "$RUNTIME" \
            || fail "runtime does not apply the v3.4.7 idle-inhibitor repair to the generated target"

          prepare_line="$(grep -nF 'prepare_quickshell_update_target "$target_home"' "$RUNTIME" | head -n1 | cut -d: -f1)"
          repair_line="$(grep -nF 'repair_v347_idle_inhibitor_feedback_target "$target_home" "$tag"' "$RUNTIME" | head -n1 | cut -d: -f1)"
          baseline_line="$(grep -nF 'bootstrap_previous_baseline "$active_theme"' "$RUNTIME" | head -n1 | cut -d: -f1)"
          [[ "$prepare_line" =~ ^[0-9]+$ && "$repair_line" =~ ^[0-9]+$ && "$baseline_line" =~ ^[0-9]+$ ]] \
            || fail "could not locate v3.4.7 idle-inhibitor target-repair ordering"
          (( prepare_line < repair_line && repair_line < baseline_line )) \
            || fail "v3.4.7 idle-inhibitor target repair must run before baseline comparison"

          v347_target_home="${TMP}/v347-target"
          v346_target_home="${TMP}/v346-control-target"
          v347_rel='.config/quickshell/awtarchy/SystemState.qml'
          v347_original="${TMP}/v347-original-SystemState.qml"
          mkdir -p "${v347_target_home}/$(dirname "$v347_rel")" "${v346_target_home}/$(dirname "$v347_rel")"
          git -C "$ROOT" show v3.4.7:config/quickshell/awtarchy/SystemState.qml >"$v347_original" \
            || fail "v3.4.7 SystemState fixture is unavailable"
          cp -- "$v347_original" "${v347_target_home}/${v347_rel}"
          cp -- "$v347_original" "${v346_target_home}/${v347_rel}"

          repair_definition="$(
            sed -n '/^repair_v347_idle_inhibitor_feedback_target() {/,/^prepare_quickshell_update_target() {/p' "$RUNTIME" |
              sed '$d'
          )"
          [[ -n "$repair_definition" ]] || fail "could not extract v3.4.7 idle-inhibitor repair function"
          log() { :; }
          die() { fail "$*"; }
          eval "$repair_definition"

          repair_v347_idle_inhibitor_feedback_target "$v347_target_home" v3.4.7
          cmp -s "${v347_target_home}/${v347_rel}" "$SYSTEM_STATE" \
            || fail "v3.4.7 post-release repair does not produce the current fixed SystemState.qml"

          repair_v347_idle_inhibitor_feedback_target "$v346_target_home" v3.4.6
          cmp -s "${v346_target_home}/${v347_rel}" "$v347_original" \
            || fail "v3.4.7 post-release repair changed another release target"
          '''
          if text.count(anchor) != 1:
              raise SystemExit('test delivery-regression anchor mismatch')
          text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

          set +e
          bash tests/test-bar-control-actions.sh >red.log 2>&1
          rc=$?
          set -e
          cat red.log
          test "$rc" -ne 0
          grep -Fq 'runtime is missing the v3.4.7 idle-inhibitor post-release repair' red.log

      - name: Add v3.4.7 generated-target repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text(encoding='utf-8')

          function_anchor = '\nprepare_quickshell_update_target() {\n'
          repair = r'''
          repair_v347_idle_inhibitor_feedback_target() {
            local target_home="$1" tag="$2"
            local state_file="${target_home}/.config/quickshell/awtarchy/SystemState.qml"

            [[ "$tag" == "v3.4.7" ]] || return 0
            [[ -f "$state_file" && ! -L "$state_file" ]] \
              || die "v3.4.7 post-release SystemState target is unavailable."

            python3 - "$state_file" <<'PY_V347_IDLE_INHIBITOR'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    property bool idleInhibited: false
              property bool idleBroken: false
              property var coreUsage: ({})
          ''',
                  '''    property bool idleInhibited: false
              property bool idleBroken: false
              property bool idleReconcilePending: false
              property var coreUsage: ({})
          ''',
              ),
              (
                  '''    Process {
              id: idleStatusProcess
              command: ["sh", "-c", "if [ -x '" + root.idleScript + "' ]; then '" + root.idleScript + "'; fi"]
              stdout: StdioCollector {
                  onStreamFinished: {
                      try {
                          const status = JSON.parse(text.trim());
                          const classes = status.class || [];
                          root.idleInhibited = classes.indexOf("activated") >= 0;
                          root.idleBroken = classes.indexOf("error") >= 0;
                      } catch (error) {
                          root.idleInhibited = false;
                          root.idleBroken = false;
                      }
                  }
              }
          }
          ''',
                  '''    Process {
              id: idleStatusProcess
              command: ["sh", "-c", "if [ -x '" + root.idleScript + "' ]; then '" + root.idleScript + "'; fi"]
              stdout: StdioCollector {
                  onStreamFinished: {
                      if (idleReconcilePending)
                          return;
                      try {
                          const status = JSON.parse(text.trim());
                          const classes = status.class || [];
                          root.idleInhibited = classes.indexOf("activated") >= 0;
                          root.idleBroken = classes.indexOf("error") >= 0;
                      } catch (error) {
                          root.idleInhibited = false;
                          root.idleBroken = false;
                      }
                  }
              }
              onExited: {
                  if (root.idleReconcilePending && !idleToggleProcess.running)
                      root.refreshIdleAfterToggle();
              }
          }

          Process {
              id: idleToggleProcess
              onExited: root.refreshIdleAfterToggle()
          }
          ''',
              ),
              (
                  '''            if (!metricsProcess.running)
                  metricsProcess.running = true;
              if (!idleStatusProcess.running)
                  idleStatusProcess.running = true;
          ''',
                  '''            if (!metricsProcess.running)
                  metricsProcess.running = true;
              if (!idleStatusProcess.running && !idleToggleProcess.running && !root.idleReconcilePending)
                  idleStatusProcess.running = true;
          ''',
              ),
              (
                  '''    function toggleIdle() {
              Quickshell.execDetached([idleScript, "toggle"]);
              refreshIdleTimer.restart();
          }

          Timer {
              id: refreshIdleTimer
              interval: 350
              repeat: false
              onTriggered: {
                  if (!idleStatusProcess.running)
                      idleStatusProcess.running = true;
              }
          }
          ''',
                  '''    function refreshIdleAfterToggle() {
              if (!root.idleReconcilePending || idleToggleProcess.running || idleStatusProcess.running)
                  return;
              root.idleReconcilePending = false;
              idleStatusProcess.running = true;
          }

          function toggleIdle() {
              if (idleToggleProcess.running)
                  return;
              root.idleInhibited = !root.idleInhibited;
              root.idleReconcilePending = true;
              idleToggleProcess.exec([idleScript, "toggle"]);
          }
          ''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("v3.4.7 idle inhibitor target repair anchor mismatch")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY_V347_IDLE_INHIBITOR
            log "Applied v3.4.7 idle-inhibitor post-release repair to generated target."
          }
          '''
          if 'repair_v347_idle_inhibitor_feedback_target()' in text:
              raise SystemExit('v3.4.7 idle-inhibitor repair already exists')
          if text.count(function_anchor) != 1:
              raise SystemExit('runtime function insertion anchor mismatch')
          text = text.replace(function_anchor, '\n' + repair + function_anchor, 1)

          call_anchor = '''  repair_v343_transient_task_icons_target "$target_home" "$tag"

            bootstrap_previous_baseline "$active_theme"
          '''
          call_replacement = '''  repair_v343_transient_task_icons_target "$target_home" "$tag"
            repair_v347_idle_inhibitor_feedback_target "$target_home" "$tag"

            bootstrap_previous_baseline "$active_theme"
          '''
          if text.count(call_anchor) != 1:
              raise SystemExit('runtime repair-call insertion anchor mismatch')
          text = text.replace(call_anchor, call_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify green and commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n tests/test-bar-control-actions.sh
          bash tests/test-bar-control-actions.sh
          git diff --check

          git rm -- .github/workflows/idle-inhibitor-v347-delivery-bridge.yml
          git add -- local/share/awtarchy/awtarchy-runtime.sh tests/test-bar-control-actions.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deliver idle inhibitor fix to v3.4.7'
          git push origin HEAD:fix/idle-inhibitor-instant-feedback
