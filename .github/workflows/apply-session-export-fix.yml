name: Apply session export fix

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Export recovered session variables
        run: |
          file=local/share/awtarchy/awtarchy-runtime.sh
          sed -i 's/|| WAYLAND_DISPLAY="$value"/|| export WAYLAND_DISPLAY="$value"/' "$file"
          sed -i 's/|| HYPRLAND_INSTANCE_SIGNATURE="$value"/|| export HYPRLAND_INSTANCE_SIGNATURE="$value"/' "$file"
          sed -i 's/|| XDG_SESSION_ID="$value"/|| export XDG_SESSION_ID="$value"/' "$file"
          sed -i 's/|| XDG_CURRENT_DESKTOP="$value"/|| export XDG_CURRENT_DESKTOP="$value"/' "$file"
          sed -i 's/|| XDG_SESSION_DESKTOP="$value"/|| export XDG_SESSION_DESKTOP="$value"/' "$file"
          sed -i 's/|| XDG_SESSION_TYPE="$value"/|| export XDG_SESSION_TYPE="$value"/' "$file"
          rm -f .github/workflows/apply-session-export-fix.yml

      - name: Validate
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n config/hypr/scripts/hypridle_restart.sh
          bash tests/test-polkit-agent-session-binding.sh
          bash tests/test-hypridle-restart.sh
          git diff --check

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Export recovered updater session environment'
          git push
