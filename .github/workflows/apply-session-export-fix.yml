name: Apply session export fix

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Export recovered session variables
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('local/share/awtarchy/awtarchy-runtime.sh')
          text = path.read_text()
          keys = (
              'WAYLAND_DISPLAY',
              'HYPRLAND_INSTANCE_SIGNATURE',
              'XDG_SESSION_ID',
              'XDG_CURRENT_DESKTOP',
              'XDG_SESSION_DESKTOP',
              'XDG_SESSION_TYPE',
          )
          for key in keys:
              old = f'[[ -n "${{{key}:-}}" ]] || {key}="$value"'
              new = f'[[ -n "${{{key}:-}}" ]] || export {key}="$value"'
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected recovery assignment count for {key}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/apply-session-export-fix.yml

      - name: Validate
        run: |
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          bash -n config/hypr/scripts/hypridle_restart.sh
          bash tests/test-polkit-agent-session-binding.sh
          bash tests/test-hypridle-restart.sh
          git diff --check

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Export recovered updater session environment'
          git push
