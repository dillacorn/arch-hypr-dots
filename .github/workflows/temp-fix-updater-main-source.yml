name: Temporary updater main-source patch

on:
  push:
    branches:
      - fix-updater-main-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-updater-main-source

      - name: Patch updater source and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"{label} did not match expected text")

          awtarchy = Path("awtarchy.sh")
          text = awtarchy.read_text(encoding="utf-8")

          lookup_start = "fetch_latest_release_tag() {\n"
          lookup_end = "urlencode_path_segment() {\n"
          if lookup_start in text:
              start = text.index(lookup_start)
              end = text.index(lookup_end, start)
              text = text[:start] + text[end:]
          elif lookup_end not in text:
              raise SystemExit("release lookup markers were not found")

          old_download_start = "download_release_tarball() {\n"
          new_download_start = "download_repo_tarball() {\n"
          tar_marker = "tar_topdir() {\n"
          new_download = "\n".join([
              "download_repo_tarball() {",
              "  local ref_kind=\"$1\"",
              "  local ref=\"$2\"",
              "  local out=\"$3\"",
              "  local ref_enc",
              "  ref_enc=\"$(urlencode_path_segment \"$ref\")\"",
              "",
              "  local url=\"https://github.com/${REPO_OWNER}/${REPO_NAME}/archive/refs/${ref_kind}/${ref_enc}.tar.gz\"",
              "  curl \"${CURL_ARGS[@]}\" -L -o \"$out\" \"$url\" || die \"Failed to download repository tarball: $url\"",
              "}",
              "",
          ])
          if old_download_start in text:
              start = text.index(old_download_start)
              end = text.index(tar_marker, start)
              text = text[:start] + new_download + text[end:]
          elif new_download_start not in text:
              raise SystemExit("tarball downloader markers were not found")

          old_source = "\n".join([
              "  local tag=\"\"",
              "  if [[ \"${1:-}\" == \"--tag\" ]]; then",
              "    tag=\"${2:-}\"",
              "    [[ -n \"$tag\" ]] || die \"Usage: $0 [--tag <tag>]\"",
              "  else",
              "    tag=\"$(fetch_latest_release_tag)\" || die \"No GitHub release found for ${REPO_OWNER}/${REPO_NAME}\"",
              "  fi",
              "",
              "  log \"Target user: ${TARGET_USER}\"",
              "  log \"Release tag: ${tag}\"",
              "",
          ])
          new_source = "\n".join([
              "  local ref_kind=\"heads\"",
              "  local source_ref=\"main\"",
              "  if [[ \"${1:-}\" == \"--tag\" ]]; then",
              "    ref_kind=\"tags\"",
              "    source_ref=\"${2:-}\"",
              "    [[ -n \"$source_ref\" ]] || die \"Usage: $0 [--tag <tag>]\"",
              "  elif [[ $# -gt 0 ]]; then",
              "    die \"Usage: $0 [--tag <tag>]\"",
              "  fi",
              "",
              "  log \"Target user: ${TARGET_USER}\"",
              "  if [[ \"$ref_kind\" == \"tags\" ]]; then",
              "    log \"Release tag: ${source_ref}\"",
              "  else",
              "    log \"Branch: ${source_ref}\"",
              "  fi",
              "",
          ])
          text = replace_once(text, old_source, new_source, "updater source selection")
          text = replace_once(text, '  download_release_tarball "$tag" "$tgz"\n', '  download_repo_tarball "$ref_kind" "$source_ref" "$tgz"\n', "tarball call")
          text = replace_once(text, '  log "Deploying (latest Release tag; backups on change; refuses empty overwrites)."\n', '  log "Deploying from ${ref_kind}/${source_ref} (backups on change; refuses empty overwrites)."\n', "deployment log")
          text = replace_once(text, '  write_version_stamp "$tag"\n', '  write_version_stamp "$source_ref"\n', "version stamp")
          text = text.replace('Update/reset Awtarchy configs from latest release', 'Update/reset Awtarchy configs from current main')
          awtarchy.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          doc = readme.read_text(encoding="utf-8")
          doc = doc.replace('update/reset managed configs from the latest release', 'update/reset managed configs from the current main branch')
          doc = doc.replace('Update/reset Awtarchy configs from latest release', 'Update/reset Awtarchy configs from current main')
          doc = doc.replace('Update/reset managed configs from the latest release:', 'Update/reset managed configs from the current main branch:')
          readme.write_text(doc, encoding="utf-8")
          PY

          bash -n awtarchy.sh
          grep -Fq 'local ref_kind="heads"' awtarchy.sh
          grep -Fq 'local source_ref="main"' awtarchy.sh
          grep -Fq 'download_repo_tarball "$ref_kind" "$source_ref" "$tgz"' awtarchy.sh
          ! grep -Fq 'fetch_latest_release_tag()' awtarchy.sh

      - name: Commit patch
        run: |
          if git diff --quiet -- awtarchy.sh README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awtarchy.sh README.md
          git commit -m "Update configs from main by default"
          git push origin HEAD:fix-updater-main-source
