name: Retry shutdown integration test with Lua

on:
  push:
    paths:
      - ".github/workflows/tmp-update-shutdown-test-retry.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: tmp-quickshell-direct-term-20260815
          fetch-depth: 0

      - name: Install migration test dependency
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Update stale shutdown fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test-quickshell-updater-migration.sh")
          text = path.read_text()

          old = '''  "AWTARCHY_TEST_QS_STALL_QUIT=1"\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected stalled-quit fixture count")
          text = text.replace(old, "", 1)

          old = '''grep -Eq '^kill --pid [0-9]+$' "${TMP}/qs-kill.log" \\\n  || fail "Quickshell manager did not request shutdown for the exact running PID"\n'''
          new = '''[[ ! -s ${TMP}/qs-kill.log ]] \\\n  || fail "Quickshell manager unexpectedly used the crash-prone qs kill teardown"\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected qs-kill assertion count")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify integration suite
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/test-quickshell-updater-migration.sh
          shellcheck --severity=error tests/test-quickshell-updater-migration.sh
          bash tests/test-quickshell-production-readiness.sh
          bash tests/test-bluetooth-state-persistence.sh
          bash tests/test-quickshell-updater-migration.sh
          git diff --check

      - name: Commit tested fixture update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add tests/test-quickshell-updater-migration.sh
          git commit -m "Update Quickshell shutdown integration test"
          git push origin HEAD:tmp-quickshell-direct-term-20260815