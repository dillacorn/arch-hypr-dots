name: Verify Quickshell Production Readiness

on:
  push:
    branches: [quickshell-conversion-testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quickshell production readiness
        run: bash tests/test-quickshell-production-readiness.sh
