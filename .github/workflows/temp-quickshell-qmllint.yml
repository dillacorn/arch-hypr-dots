name: Temporary Quickshell QML Lint

on:
  push:
    branches: [feature/lockscreen-interactive-effects]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Install Quickshell and Qt QML tooling
        run: pacman -Syu --noconfirm quickshell qt6-declarative
      - name: Lint desktop shell and lockscreen QML
        run: |
          set -euxo pipefail
          qmllint config/quickshell/awtarchy/shell.qml
          qmllint config/quickshell/awtarchy/LockscreenEditor.qml
          qmllint config/quickshell/awtarchy/LockscreenWeather.qml
          qmllint config/quickshell/awtarchy-lock/shell.qml
          qmllint config/quickshell/awtarchy-lock/LockScene.qml
          qmllint config/quickshell/awtarchy-lock/LockSurface.qml
          qmllint config/quickshell/awtarchy-lock/LockWallpaperState.qml
          qmllint config/quickshell/awtarchy-lock/LockWeatherCache.qml
