name: Apply Managed History Hash Refresh

on:
  push:
    branches: [feature/quickshell-lockscreen]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dillacorn/awtarchy' && github.event.head_commit.message == 'Stage managed history hash refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/quickshell-lockscreen
          fetch-depth: 0
      - name: Refresh exact managed hash
        run: |
          path='.config/hypr/scripts/quickshell_ready_sound.sh'
          hash="$(sha256sum config/hypr/scripts/quickshell_ready_sound.sh | awk '{print $1}')"
          line="${hash}	${path}"
          grep -Fqx -- "$line" local/share/awtarchy/quickshell-managed-history.sha256 \
            || printf '%s\n' "$line" >> local/share/awtarchy/quickshell-managed-history.sha256
      - name: Verify updater migration contract
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Commit refresh
        run: |
          git config user.name dillacorn
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git rm .github/workflows/apply-managed-history-hash.yml
          git add local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m 'Refresh submap startup managed hash'
          git push origin HEAD:feature/quickshell-lockscreen
