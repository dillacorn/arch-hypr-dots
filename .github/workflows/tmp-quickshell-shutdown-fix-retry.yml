name: Retry Quickshell shutdown recovery

on:
  push:
    paths:
      - ".github/workflows/tmp-quickshell-shutdown-fix-retry.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: tmp-quickshell-shutdown-fix-20260815
          fetch-depth: 0

      - name: Patch stalled shutdown fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("config/hypr/scripts/quickshell.sh")
          s = p.read_text()
          old_local = 'stop_shell() {\n    local pid local_quickshell_alive\n'
          new_local = 'stop_shell() {\n    local pid\n'
          if s.count(old_local) != 1:
              raise SystemExit("unexpected stop_shell declaration")
          s = s.replace(old_local, new_local, 1)

          old = '''    wait_for_pids_stop "${pids[@]}" && return 0\n\n    # Quickshell 0.3.x can crash or hang while tearing down Qt shortcuts after\n    # accepting the IPC shutdown request. Do not leave the updater wedged on\n    # that old process. Only force-kill PIDs that still resolve to quickshell.\n    printf 'quickshell.sh: graceful shutdown stalled for PID(s): %s; forcing old Quickshell process to stop.\\n' "${pids[*]}" >&2\n    for pid in "${pids[@]}"; do\n        [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n        kill -KILL -- "$pid" 2>/dev/null || true\n    done\n\n    for _ in {1..40}; do\n        local_quickshell_alive=0\n        for pid in "${pids[@]}"; do\n            [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n            local_quickshell_alive=1\n            break\n        done\n        (( local_quickshell_alive == 0 )) && return 0\n        sleep 0.05\n    done\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n'''
          new = '''    wait_for_pids_stop "${pids[@]}" && return 0\n\n    # Quickshell's IPC shutdown can occasionally stall during Qt teardown.\n    # Use SIGTERM as recovery because Quickshell does not register SIGTERM\n    # with its crash reporter. Avoid SIGKILL, which presents a crash dialog.\n    printf 'quickshell.sh: graceful shutdown stalled for PID(s): %s; using SIGTERM fallback.\\n' "${pids[*]}" >&2\n    for pid in "${pids[@]}"; do\n        [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n        kill -TERM -- "$pid" 2>/dev/null || true\n    done\n\n    wait_for_pids_stop "${pids[@]}" && return 0\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish after SIGTERM for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n'''
          if s.count(old) != 1:
              raise SystemExit("unexpected shutdown fallback block")
          p.write_text(s.replace(old, new, 1))

          p = Path("tests/test-quickshell-production-readiness.sh")
          s = p.read_text()
          old = '''assert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs kill --pid "$pid"'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs -c "$CONFIG_NAME" list --json'\n'''
          new = '''assert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs kill --pid "$pid"'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'kill -TERM -- "$pid"'\nassert_not_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'kill -KILL -- "$pid"'\nassert_contains "${REPO_ROOT}/config/hypr/scripts/quickshell.sh" 'qs -c "$CONFIG_NAME" list --json'\n'''
          if s.count(old) != 1:
              raise SystemExit("unexpected readiness assertions")
          p.write_text(s.replace(old, new, 1))

          p = Path("tests/test-bluetooth-state-persistence.sh")
          s = p.read_text()
          old = '''grep -Fq 'kill -KILL -- "$pid"' "$MANAGER"\n'''
          new = '''grep -Fq 'kill -TERM -- "$pid"' "$MANAGER"\nif grep -Fq 'kill -KILL -- "$pid"' "$MANAGER"; then\n    printf '%s\\n' 'Quickshell updater still contains SIGKILL fallback.' >&2\n    exit 1\nfi\n'''
          if s.count(old) != 1:
              raise SystemExit("unexpected Bluetooth assertion")
          p.write_text(s.replace(old, new, 1))
          PY

          manifest="local/share/awtarchy/quickshell-managed-history.sha256"
          hash="$(sha256sum config/hypr/scripts/quickshell.sh | awk '{print $1}')"
          managed='.config/hypr/scripts/quickshell.sh'
          if ! grep -Fqx "${hash}"$'\t'"${managed}" "$manifest"; then
              printf '\n# Quickshell stalled-shutdown SIGTERM recovery.\n%s\t%s\n' "$hash" "$managed" >>"$manifest"
          fi

      - name: Verify focused change
        shell: bash
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-quickshell-production-readiness.sh
          bash -n tests/test-bluetooth-state-persistence.sh
          shellcheck --severity=error config/hypr/scripts/quickshell.sh tests/test-quickshell-production-readiness.sh tests/test-bluetooth-state-persistence.sh
          bash tests/test-quickshell-production-readiness.sh
          bash tests/test-bluetooth-state-persistence.sh
          git diff --check

      - name: Commit tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add config/hypr/scripts/quickshell.sh \
                  tests/test-quickshell-production-readiness.sh \
                  tests/test-bluetooth-state-persistence.sh \
                  local/share/awtarchy/quickshell-managed-history.sha256
          git commit -m "Avoid Quickshell crash dialog during updates"
          git push origin HEAD:tmp-quickshell-shutdown-fix-20260815