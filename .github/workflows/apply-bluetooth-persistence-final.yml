name: Finalize Bluetooth persistence patch

on:
  push:
    paths:
      - ".github/workflows/apply-bluetooth-persistence-final.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          menu_path = Path("config/quickshell/awtarchy/BluetoothMenu.qml")
          menu = menu_path.read_text()

          old = '''    readonly property string prepareScript: configHome + "/hypr/scripts/quickshell_flyout_prepare.sh"\n'''
          new = old + '''    readonly property string bluetoothStateScript: configHome + "/hypr/scripts/quickshell_bluetooth_state.sh"\n'''
          if old not in menu:
              raise SystemExit("BluetoothMenu property anchor missing")
          menu = menu.replace(old, new, 1)

          old = '''    function toggleAdapter() {\n        const current = adapter;\n        if (!current) {\n            actionMessage = "Bluetooth adapter unavailable";\n            return;\n        }\n\n        if (!current.enabled && current.state === BluetoothAdapterState.Blocked) {\n            actionMessage = "Unblocking Bluetooth…";\n            rfkillUnblock.exec(["rfkill", "unblock", "bluetooth"]);\n            return;\n        }\n\n        const nextEnabled = !current.enabled;\n        if (!nextEnabled && current.discovering)\n            current.discovering = false;\n        current.enabled = nextEnabled;\n        actionMessage = nextEnabled ? "Bluetooth enabled" : "Bluetooth disabled";\n    }\n'''
          new = '''    function toggleAdapter() {\n        const current = adapter;\n        if (!current) {\n            actionMessage = "Bluetooth adapter unavailable";\n            return;\n        }\n\n        const enableRequested = !current.enabled\n            || current.state === BluetoothAdapterState.Blocked;\n        if (enableRequested) {\n            actionMessage = "Enabling Bluetooth…";\n            bluetoothEnable.exec([bluetoothStateScript, "set", "enabled"]);\n            return;\n        }\n\n        if (current.discovering)\n            current.discovering = false;\n        actionMessage = "Disabling Bluetooth…";\n        bluetoothDisable.exec([bluetoothStateScript, "set", "disabled"]);\n    }\n'''
          if old not in menu:
              raise SystemExit("BluetoothMenu toggleAdapter anchor missing")
          menu = menu.replace(old, new, 1)

          old = '''    Process {\n        id: rfkillUnblock\n        onExited: rfkillRetry.restart()\n    }\n'''
          new = '''    Process {\n        id: bluetoothEnable\n        onExited: (exitCode, exitStatus) => {\n            if (exitCode !== 0) {\n                root.actionMessage = "Failed to enable Bluetooth";\n                return;\n            }\n            rfkillRetry.restart();\n        }\n    }\n\n    Process {\n        id: bluetoothDisable\n        onExited: (exitCode, exitStatus) => {\n            root.actionMessage = exitCode === 0\n                ? "Bluetooth disabled" : "Failed to disable Bluetooth";\n        }\n    }\n\n    Process {\n        id: bluetoothRestore\n    }\n'''
          if old not in menu:
              raise SystemExit("BluetoothMenu rfkill process anchor missing")
          menu = menu.replace(old, new, 1)

          old = '''    Connections {\n        target: FlyoutManager\n'''
          new = '''    Component.onCompleted: bluetoothRestore.exec([bluetoothStateScript, "restore"])\n\n''' + old
          if old not in menu:
              raise SystemExit("BluetoothMenu startup anchor missing")
          menu = menu.replace(old, new, 1)
          menu_path.write_text(menu)

          manager_path = Path("config/hypr/scripts/quickshell.sh")
          manager = manager_path.read_text()
          old = '''stop_shell() {\n    local pid\n'''
          new = '''stop_shell() {\n    local pid local_quickshell_alive\n'''
          if old not in manager:
              raise SystemExit("quickshell.sh local declaration anchor missing")
          manager = manager.replace(old, new, 1)

          old = '''    wait_for_pids_stop "${pids[@]}" && return 0\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n'''
          new = '''    wait_for_pids_stop "${pids[@]}" && return 0\n\n    # Quickshell 0.3.x can crash or hang while tearing down Qt shortcuts after\n    # accepting the IPC shutdown request. Do not leave the updater wedged on\n    # that old process. Only force-kill PIDs that still resolve to quickshell.\n    printf 'quickshell.sh: graceful shutdown stalled for PID(s): %s; forcing old Quickshell process to stop.\\n' "${pids[*]}" >&2\n    for pid in "${pids[@]}"; do\n        [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n        kill -KILL -- "$pid" 2>/dev/null || true\n    done\n\n    for _ in {1..40}; do\n        local_quickshell_alive=0\n        for pid in "${pids[@]}"; do\n            [[ "$(basename "$(readlink -f "/proc/${pid}/exe" 2>/dev/null || true)")" == "quickshell" ]] || continue\n            local_quickshell_alive=1\n            break\n        done\n        (( local_quickshell_alive == 0 )) && return 0\n        sleep 0.05\n    done\n\n    printf 'quickshell.sh: Quickshell shutdown did not finish for PID(s): %s\\n' "${pids[*]}" >&2\n    return 1\n'''
          if old not in manager:
              raise SystemExit("quickshell.sh stop fallback anchor missing")
          manager = manager.replace(old, new, 1)
          manager_path.write_text(manager)

          workflow_path = Path(".github/workflows/validate-awtarchy.yml")
          workflow = workflow_path.read_text()
          replacements = [
              (
                  "          bash -n config/hypr/scripts/quickshell_application_state.sh\n",
                  "          bash -n config/hypr/scripts/quickshell_application_state.sh\n          bash -n config/hypr/scripts/quickshell_bluetooth_state.sh\n",
              ),
              (
                  "          bash -n tests/test-bar-wheel-input.sh\n",
                  "          bash -n tests/test-bar-wheel-input.sh\n          bash -n tests/test-bluetooth-state-persistence.sh\n",
              ),
              (
                  "            config/hypr/scripts/quickshell_bar_restore.sh \\\n",
                  "            config/hypr/scripts/quickshell_bar_restore.sh \\\n            config/hypr/scripts/quickshell_bluetooth_state.sh \\\n",
              ),
              (
                  "            tests/test-bar-wheel-input.sh \\\n",
                  "            tests/test-bar-wheel-input.sh \\\n            tests/test-bluetooth-state-persistence.sh \\\n",
              ),
              (
                  "          bash tests/test-bar-wheel-input.sh\n",
                  "          bash tests/test-bar-wheel-input.sh\n          bash tests/test-bluetooth-state-persistence.sh\n",
              ),
          ]
          for old, new in replacements:
              if old not in workflow:
                  raise SystemExit(f"validation workflow anchor missing: {old!r}")
              workflow = workflow.replace(old, new, 1)
          workflow_path.write_text(workflow)
          PY

          cat > config/hypr/scripts/quickshell_bluetooth_state.sh <<'SH'
          #!/usr/bin/env bash
          # Persist only Bluetooth choices made through Awtarchy's Bluetooth UI.

          set -euo pipefail

          STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
          STATE_DIR="${STATE_HOME}/awtarchy"
          STATE_FILE="${STATE_DIR}/bluetooth-state"

          usage() {
              printf 'usage: quickshell_bluetooth_state.sh set <enabled|disabled> | restore | status\n' >&2
              exit 2
          }

          need_rfkill() {
              command -v rfkill >/dev/null 2>&1 || {
                  printf 'quickshell_bluetooth_state.sh: rfkill is required\n' >&2
                  return 127
              }
          }

          apply_state() {
              case "$1" in
                  enabled) rfkill unblock bluetooth ;;
                  disabled) rfkill block bluetooth ;;
                  *) return 2 ;;
              esac
          }

          save_state() {
              local state="$1" tmp
              mkdir -p -- "$STATE_DIR"
              chmod 0700 -- "$STATE_DIR" 2>/dev/null || true
              tmp="${STATE_FILE}.tmp.$$"
              printf '%s\n' "$state" >"$tmp"
              chmod 0600 -- "$tmp" 2>/dev/null || true
              mv -f -- "$tmp" "$STATE_FILE"
          }

          command_name="${1:-}"
          case "$command_name" in
              set)
                  state="${2:-}"
                  [[ "$state" == "enabled" || "$state" == "disabled" ]] || usage
                  [[ $# -eq 2 ]] || usage
                  need_rfkill
                  save_state "$state"
                  apply_state "$state"
                  ;;
              restore)
                  [[ $# -eq 1 ]] || usage
                  [[ -r "$STATE_FILE" ]] || exit 0
                  IFS= read -r state <"$STATE_FILE" || state=""
                  case "$state" in
                      enabled|disabled) ;;
                      *)
                          printf 'quickshell_bluetooth_state.sh: ignoring invalid saved state\n' >&2
                          exit 0
                          ;;
                  esac
                  need_rfkill || exit 0
                  apply_state "$state" || true
                  ;;
              status)
                  [[ $# -eq 1 ]] || usage
                  if [[ -r "$STATE_FILE" ]]; then
                      cat -- "$STATE_FILE"
                  else
                      printf 'unset\n'
                  fi
                  ;;
              *) usage ;;
          esac
          SH
          chmod 0755 config/hypr/scripts/quickshell_bluetooth_state.sh

          cat > tests/test-bluetooth-state-persistence.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          HELPER="${ROOT}/config/hypr/scripts/quickshell_bluetooth_state.sh"
          MENU="${ROOT}/config/quickshell/awtarchy/BluetoothMenu.qml"
          MANAGER="${ROOT}/config/hypr/scripts/quickshell.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT

          mkdir -p "$tmp/bin" "$tmp/home"
          cat >"$tmp/bin/rfkill" <<'FAKE'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >>"${RFKILL_LOG:?}"
          FAKE
          chmod 0755 "$tmp/bin/rfkill"

          export HOME="$tmp/home"
          export XDG_STATE_HOME="$tmp/state"
          export RFKILL_LOG="$tmp/rfkill.log"
          export PATH="$tmp/bin:$PATH"
          state_file="$XDG_STATE_HOME/awtarchy/bluetooth-state"

          "$HELPER" restore
          [[ ! -e "$state_file" ]]
          [[ ! -e "$RFKILL_LOG" ]]

          "$HELPER" set disabled
          grep -Fxq 'disabled' "$state_file"
          grep -Fxq 'block bluetooth' "$RFKILL_LOG"

          : >"$RFKILL_LOG"
          "$HELPER" restore
          grep -Fxq 'block bluetooth' "$RFKILL_LOG"

          : >"$RFKILL_LOG"
          "$HELPER" set enabled
          grep -Fxq 'enabled' "$state_file"
          grep -Fxq 'unblock bluetooth' "$RFKILL_LOG"

          printf 'invalid\n' >"$state_file"
          : >"$RFKILL_LOG"
          "$HELPER" restore
          [[ ! -s "$RFKILL_LOG" ]]

          grep -Fq 'bluetoothStateScript' "$MENU"
          grep -Fq 'bluetoothEnable.exec([bluetoothStateScript, "set", "enabled"]);' "$MENU"
          grep -Fq 'bluetoothDisable.exec([bluetoothStateScript, "set", "disabled"]);' "$MENU"
          grep -Fq 'Component.onCompleted: bluetoothRestore.exec([bluetoothStateScript, "restore"])' "$MENU"
          if grep -Fq 'current.enabled = nextEnabled;' "$MENU"; then
              printf '%s\n' 'Legacy non-persistent Bluetooth toggle is still present.' >&2
              exit 1
          fi
          # shellcheck disable=SC2016
          grep -Fq 'kill -KILL -- "$pid"' "$MANAGER"

          printf '%s\n' 'Bluetooth persistence regression test: PASS'
          SH
          chmod 0755 tests/test-bluetooth-state-persistence.sh

          manifest="local/share/awtarchy/quickshell-managed-history.sha256"
          printf '\n# Per-user Bluetooth preference persistence and resilient Quickshell updater shutdown.\n' >>"$manifest"
          while IFS='|' read -r source managed; do
              hash="$(sha256sum "$source" | awk '{print $1}')"
              if ! grep -Fq "${hash}"$'\t'"${managed}" "$manifest"; then
                  printf '%s\t%s\n' "$hash" "$managed" >>"$manifest"
              fi
          done <<'HASHES'
          config/hypr/scripts/quickshell_bluetooth_state.sh|.config/hypr/scripts/quickshell_bluetooth_state.sh
          config/hypr/scripts/quickshell.sh|.config/hypr/scripts/quickshell.sh
          config/quickshell/awtarchy/BluetoothMenu.qml|.config/quickshell/awtarchy/BluetoothMenu.qml
          HASHES

      - name: Verify focused changes
        shell: bash
        run: |
          set -euo pipefail
          bash -n config/hypr/scripts/quickshell_bluetooth_state.sh
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bluetooth-state-persistence.sh
          shellcheck config/hypr/scripts/quickshell_bluetooth_state.sh tests/test-bluetooth-state-persistence.sh
          bash tests/test-bluetooth-state-persistence.sh
          bash tests/test-quickshell-production-readiness.sh
          git diff --check

      - name: Commit final patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-bluetooth-persistence.yml
          rm -f .github/workflows/apply-bluetooth-persistence-retry.yml
          rm -f .github/workflows/apply-bluetooth-persistence-final.yml
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add -A
          git commit -m "Persist Bluetooth preference per user"
          git push origin HEAD:main
