name: Clean Converted Quickshell Migration Test

on:
  push:
    branches: [quickshell-conversion-testing]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install migration test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: Detect converted-test lint cleanup
        id: detect
        run: |
          if grep -Fq 'INSTALLER="${ROOT}/awtarchy-install.sh"' tests/test-quickshell-updater-migration.sh; then
            echo 'needed=true' >>"$GITHUB_OUTPUT"
          else
            echo 'needed=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Remove unused beta-installer variable
        if: steps.detect.outputs.needed == 'true'
        run: |
          sed -i '/^INSTALLER="${ROOT}\/awtarchy-install\.sh"$/d' tests/test-quickshell-updater-migration.sh
          bash -n tests/test-quickshell-updater-migration.sh
          shellcheck tests/test-quickshell-updater-migration.sh
          git diff --check
      - name: Re-run production migration test
        if: steps.detect.outputs.needed == 'true'
        run: bash tests/test-quickshell-updater-migration.sh
      - name: Commit lint cleanup
        if: steps.detect.outputs.needed == 'true'
        run: |
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add tests/test-quickshell-updater-migration.sh
          git commit -m 'Clean production migration test harness'
          git push origin HEAD:quickshell-conversion-testing
