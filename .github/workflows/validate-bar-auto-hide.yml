name: Validate Bar Auto Hide

on:
  pull_request:
    paths:
      - '.github/workflows/validate-bar-auto-hide.yml'
      - 'config/hypr/scripts/quickshell.sh'
      - 'config/hypr/scripts/quickshell_bar_toggle.sh'
      - 'config/hypr/hyprland.lua'
      - 'config/quickshell/awtarchy/BarState.qml'
      - 'config/quickshell/awtarchy/Bar.qml'
      - 'config/quickshell/awtarchy/shell.qml'
      - 'config/quickshell/awtarchy/BarSettingsSection.qml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'tests/test-bar-auto-hide.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bar-auto-hide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate bar auto-hide
        run: |
          bash -n config/hypr/scripts/quickshell.sh
          bash -n config/hypr/scripts/quickshell_bar_toggle.sh
          bash -n tests/test-bar-auto-hide.sh
          shellcheck tests/test-bar-auto-hide.sh
          bash tests/test-bar-auto-hide.sh
