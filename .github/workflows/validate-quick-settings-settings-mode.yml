name: Validate Quick Settings Settings Mode

on:
  push:
    branches:
      - feature/bar-transparency
    paths:
      - '.github/workflows/validate-quick-settings-settings-mode.yml'
      - 'config/quickshell/awtarchy/QuickSettings.qml'
      - 'config/quickshell/awtarchy/FlyoutSettings.qml'
      - 'config/quickshell/awtarchy/BarSettingsSection.qml'
      - 'config/hypr/scripts/quickshell.sh'
      - 'tests/test-quick-settings-settings-mode.sh'

permissions:
  contents: read

jobs:
  settings-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate settings mode
        run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-quick-settings-settings-mode.sh
          shellcheck tests/test-quick-settings-settings-mode.sh
          bash tests/test-quick-settings-settings-mode.sh
