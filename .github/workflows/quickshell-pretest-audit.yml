name: Quickshell pretest audit

on:
  push:
    branches: [quickshell-conversion-testing]
    paths:
      - '.github/workflows/quickshell-pretest-audit.yml'
      - 'config/quickshell/**'
      - 'config/hypr/**'
      - 'local/share/applications/**'
      - 'awtarchy-install.sh'
      - 'local/share/awtarchy/awtarchy-runtime.sh'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Arch Linux checks
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo archlinux:latest bash -lc '
            set -euo pipefail
            pacman -Syu --noconfirm --needed \
              bash coreutils findutils grep sed gawk jq python shellcheck \
              quickshell qt6-declarative sway libcap dbus

            # Arch grants sway tty/session file capabilities. The default Docker
            # capability bounding set rejects executing such a binary even for
            # a purely headless backend, so strip them inside this disposable
            # test container. Headless wlroots does not need those privileges.
            getcap "$(command -v sway)" || true
            setcap -r "$(command -v sway)" || true

            echo "=== versions ==="
            pacman -Q quickshell qt6-declarative shellcheck jq sway
            qs --version
            sway --version

            echo "=== bash syntax ==="
            bash -n awtarchy-install.sh
            bash -n local/share/awtarchy/awtarchy-runtime.sh
            while IFS= read -r -d "" script; do bash -n "$script"; done < <(find config/hypr/scripts -maxdepth 1 -type f -name "*.sh" -print0)
            for theme in config/hypr/themes/*; do bash -n "$theme"; done

            echo "=== shellcheck errors ==="
            shellcheck -S error -x -e SC1091 config/hypr/scripts/*.sh

            echo "=== QML lint ==="
            QMLLINT="$(command -v qmllint || true)"
            [[ -n "$QMLLINT" ]] || QMLLINT=/usr/lib/qt6/bin/qmllint
            test -x "$QMLLINT"
            "$QMLLINT" -I /usr/lib/qt6/qml config/quickshell/awtarchy/*.qml

            echo "=== installer runtime transform dry-run ==="
            mkdir -p /root/.local/bin /root/.local/share/awtarchy
            printf "%s\n" "#!/usr/bin/env bash" "exit 0" > /root/.local/bin/awtarchy
            chmod +x /root/.local/bin/awtarchy
            cp local/share/awtarchy/awtarchy-runtime.sh /root/.local/share/awtarchy/awtarchy-runtime.sh
            ./awtarchy-install.sh --dry-run >/tmp/installer-dry-run.log 2>&1
            cat /tmp/installer-dry-run.log

            echo "=== removed legacy shell files ==="
            for path in config/waybar config/fuzzel config/mako config/wlogout; do test ! -e "$path"; done
            for path in \
              config/hypr/scripts/waybar.sh \
              config/hypr/scripts/waybar_flip.sh \
              config/hypr/scripts/waybar_rotate.sh \
              config/hypr/scripts/waybar_toggle.sh \
              config/hypr/scripts/fuzzel_toggle.sh \
              config/hypr/scripts/mako_dismiss.sh \
              config/hypr/scripts/wlogout_toggle.sh; do
              test ! -e "$path"
            done

            echo "=== desktop controls and binds ==="
            for action in flip rotate toggle; do
              file="local/share/applications/quickshell_bar_${action}.desktop"
              test -f "$file"
              grep -q "quickshell_bar_${action}.sh" "$file"
            done
            for target in \
              quickshell_launcher.sh \
              quickshell_power_menu.sh \
              quickshell_notification_dismiss.sh \
              quickshell_clipboard_toggle.sh \
              quickshell_bar_rotate.sh \
              quickshell_bar_toggle.sh \
              quickshell_bar_flip.sh; do
              grep -q "$target" config/hypr/hyprland.lua
            done

            echo "=== migration cleanup hooks ==="
            grep -q "remove_legacy_shell_files_stage" awtarchy-install.sh
            grep -q "CACHE_HOME}/waybar" config/hypr/scripts/quickshell.sh

            echo "=== manager mocked monitor state ==="
            TMP="$(mktemp -d)"
            mkdir -p "$TMP/bin" "$TMP/home/.config/hypr/scripts"
            cp config/hypr/scripts/quickshell.sh "$TMP/home/.config/hypr/scripts/quickshell.sh"
            printf "%s\n" \
              "#!/usr/bin/env bash" \
              "case \"\$*\" in" \
              "  \"monitors -j\") printf \"%s\\n\" \"[{\\\"name\\\":\\\"DP-3\\\",\\\"focused\\\":true},{\\\"name\\\":\\\"DP-1\\\",\\\"focused\\\":false}]\" ;;" \
              "  \"activeworkspace -j\") printf \"%s\\n\" \"{\\\"monitor\\\":\\\"DP-3\\\"}\" ;;" \
              "  *) exit 0 ;;" \
              "esac" > "$TMP/bin/hyprctl"
            printf "%s\n" "#!/usr/bin/env bash" "exit 1" > "$TMP/bin/qs"
            chmod +x "$TMP/bin/hyprctl" "$TMP/bin/qs"
            export HOME="$TMP/home" XDG_CACHE_HOME="$TMP/home/.cache" PATH="$TMP/bin:$PATH"
            "$HOME/.config/hypr/scripts/quickshell.sh" dump-state > "$TMP/state.json"
            jq -e ".enabled == true and .monitors[\"DP-3\"].position == \"top\" and .monitors[\"DP-1\"].position == \"top\"" "$TMP/state.json"
            "$HOME/.config/hypr/scripts/quickshell.sh" rotate-focused
            "$HOME/.config/hypr/scripts/quickshell.sh" getpos-focused | grep -qx right
            "$HOME/.config/hypr/scripts/quickshell.sh" flip-focused
            "$HOME/.config/hypr/scripts/quickshell.sh" getpos-focused | grep -qx left
            "$HOME/.config/hypr/scripts/quickshell.sh" rotate-focused
            "$HOME/.config/hypr/scripts/quickshell.sh" getpos-focused | grep -qx top
            "$HOME/.config/hypr/scripts/quickshell.sh" toggle-focused
            "$HOME/.config/hypr/scripts/quickshell.sh" getenabled-focused | grep -qx false

            echo "=== headless Sway + Quickshell startup and IPC ==="
            unset HOME XDG_CACHE_HOME
            export HOME=/root
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"

            mapfile -t DBUS_INFO < <(dbus-daemon --session --fork --print-address=1 --print-pid=1)
            export DBUS_SESSION_BUS_ADDRESS="${DBUS_INFO[0]}"
            DBUS_PID="${DBUS_INFO[1]}"

            printf "%s\n" "output * mode 1920x1080" "seat * hide_cursor 1000" > /tmp/sway.conf
            WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 \
              sway -c /tmp/sway.conf -d >/tmp/sway.log 2>&1 &
            SWAY_PID=$!
            trap "kill $SWAY_PID $DBUS_PID 2>/dev/null || true; rm -rf \"$XDG_RUNTIME_DIR\" \"$TMP\"" EXIT

            for i in $(seq 1 80); do
              WAYLAND_SOCKET="$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name "wayland-*" | head -n1 || true)"
              [[ -n "$WAYLAND_SOCKET" ]] && break
              sleep 0.1
            done
            if [[ -z "${WAYLAND_SOCKET:-}" ]]; then
              cat /tmp/sway.log
              exit 1
            fi
            export WAYLAND_DISPLAY="$(basename "$WAYLAND_SOCKET")"
            export QT_QPA_PLATFORM=wayland
            echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

            CONFIG="$(pwd)/config/quickshell/awtarchy/shell.qml"
            echo "starting Quickshell entrypoint: $CONFIG"
            qs -p "$CONFIG" >/tmp/qs.log 2>&1 &
            QS_PID=$!

            PING=""
            for i in $(seq 1 100); do
              if ! kill -0 "$QS_PID" 2>/dev/null; then
                break
              fi
              PING="$(qs -p "$CONFIG" ipc call control ping 2>/dev/null || true)"
              [[ "$PING" == "ok" ]] && break
              sleep 0.05
            done

            echo "Quickshell IPC ping: ${PING:-<none>}"
            cat /tmp/qs.log || true
            find "$XDG_RUNTIME_DIR/quickshell" -type f -maxdepth 4 -print -exec sh -c "echo --- {}; tail -n 200 \"{}\" 2>/dev/null || true" \; 2>/dev/null || true

            if [[ "$PING" != "ok" ]]; then
              echo "Quickshell did not expose the control IPC endpoint" >&2
              wait "$QS_PID" || true
              exit 1
            fi

            qs -p "$CONFIG" ipc call control quit >/dev/null 2>&1 || kill "$QS_PID" 2>/dev/null || true
            wait "$QS_PID" || true

            git diff --check
          '
