name: Record Screen Share Guard new-window hash

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.head.ref == 'fix/screenshare-guard-runtime-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: fix/screenshare-guard-runtime-apply
      - name: Record current managed hash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          entry=$'e5e81c4aeb3a3d9ea1f243780b68308debfa5494fa1663e5a14d76024dbac4cd\t.config/hypr/screenshare_guard.lua'
          grep -Fqx -- "$entry" "$history" || printf '%s\n' "$entry" >>"$history"
          rm -f -- .github/workflows/record-screenshare-new-window-hash.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$history" .github/workflows/record-screenshare-new-window-hash.yml
          git commit -m 'Record Screen Share Guard new-window hash'
          git push origin HEAD:fix/screenshare-guard-runtime-apply
