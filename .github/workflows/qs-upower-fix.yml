name: QS UPower source fix
on:
  push:
    branches: [quickshell-conversion-testing]
    paths: [.github/workflows/qs-upower-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quickshell-conversion-testing
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('local/share/awtarchy/awtarchy-runtime.sh')
          s = runtime.read_text()
          m = re.search(r'("Utilities": ")([^"]+)(")', s)
          if not m:
              raise SystemExit('Utilities group missing')
          pkgs = m.group(2).split()
          if 'upower' not in pkgs:
              i = pkgs.index('qt6ct') + 1 if 'qt6ct' in pkgs else 0
              pkgs.insert(i, 'upower')
              s = s[:m.start()] + m.group(1) + ' '.join(pkgs) + m.group(3) + s[m.end():]
          runtime.write_text(s)

          installer = Path('awtarchy-install.sh')
          s = installer.read_text()
          marker = '# Quickshell battery integration requires the UPower daemon.'
          if marker not in s:
              anchor = '# AUR defaults: Waybar-git and wlogout are no longer part of Awtarchy.'
              pos = s.index(anchor)
              block = '''# Quickshell battery integration requires the UPower daemon.
utility_match = re.search(r'("Utilities": ")([^"]+)(")', text)
if not utility_match:
    raise SystemExit("ERROR: could not locate Utilities package group")
utility_packages = utility_match.group(2).split()
if "upower" not in utility_packages:
    insert_at = utility_packages.index("qt6ct") + 1 if "qt6ct" in utility_packages else 0
    utility_packages.insert(insert_at, "upower")
text = text[:utility_match.start()] + utility_match.group(1) + " ".join(utility_packages) + utility_match.group(3) + text[utility_match.end():]

'''
              s = s[:pos] + block + s[pos:]
          installer.write_text(s)
          PY
          bash -n awtarchy-install.sh
          bash -n local/share/awtarchy/awtarchy-runtime.sh
          git diff --check
          git config user.name dillacorn
          git config user.email 28743863+dillacorn@users.noreply.github.com
          git add awtarchy-install.sh local/share/awtarchy/awtarchy-runtime.sh
          git commit -m 'Add UPower dependency for Quickshell battery support'
          git push origin HEAD:quickshell-conversion-testing
