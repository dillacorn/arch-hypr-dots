name: Apply PR138 Cleanup Structurally

on:
  push:
    branches: [fix/update-terminal-sudo-disk-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply PR138 cleanup structurally'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Apply bounded sudo cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('local/share/awtarchy/awtarchy-package-reconcile.sh')
          text = path.read_text(encoding='utf-8')

          text, n = re.subn(r'^PACKAGE_SUDO_KEEPALIVE_PID=""\n', '', text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit(f'expected keepalive global once, found {n}')

          for name in (
              'require_sudo',
              'stop_package_privilege_keepalive',
              'start_package_privilege_keepalive',
              'resume_package_privilege_keepalive',
          ):
              pattern = rf'(?ms)^{re.escape(name)}\(\) \{{\n.*?^\}}\n\n'
              text, n = re.subn(pattern, '', text, count=1)
              if n != 1:
                  raise SystemExit(f'expected function {name} once, found {n}')

          old = '''    if (( EUID == 0 )); then\n      "$paccache_bin" -rk2\n    elif ! sudo -n "$paccache_bin" -rk2; then\n      die "Automatic pacman cache pruning failed after sudo authorization."\n    fi\n'''
          new = '''    if ! as_root "$paccache_bin" -rk2; then\n      die "Automatic pacman cache pruning failed."\n    fi\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected package paccache auth block once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          text, n = re.subn(
              r"(?m)^confirm_yes_no 'Apply this package plan\?' 0 \|\| \{ log 'Package reconciliation canceled\.'; exit 0; \}\n"
              r"require_sudo\nstart_package_privilege_keepalive\ntrap stop_package_privilege_keepalive EXIT HUP INT TERM\n"
              r"recover_package_disk_headroom\n",
              "confirm_yes_no 'Apply this package plan?' 0 || { log 'Package reconciliation canceled.'; exit 0; }\nrecover_package_disk_headroom\n",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'expected approval/preauth sequence once, found {n}')

          outer = '''if (( ${#selected_aur[@]} )); then\n  stop_package_privilege_keepalive\n  trap - EXIT HUP INT TERM\n  if (( EUID != 0 )); then\n    sudo -k\n  fi\n  log 'AUR build privilege isolation enabled; makepkg may request sudo independently.'\n'''
          replacement = '''if (( ${#selected_aur[@]} )); then\n  log 'AUR build privilege isolation enabled; makepkg may request sudo independently.'\n'''
          if text.count(outer) != 1:
              raise SystemExit(f'expected outer AUR privilege block once, found {text.count(outer)}')
          text = text.replace(outer, replacement, 1)

          text, n = re.subn(r'(?m)^  resume_package_privilege_keepalive\n', '', text, count=1)
          if n != 1:
              raise SystemExit(f'expected AUR keepalive resume once, found {n}')

          text, n = re.subn(r'\nstop_package_privilege_keepalive\ntrap - EXIT HUP INT TERM\n\Z', '\n', text, count=1)
          if n != 1:
              raise SystemExit(f'expected final keepalive cleanup once, found {n}')

          text, n = re.subn(r'(?m)^  require_sudo\n(?=  log "Replacing retired Cheese camera app with Snapshot\.\.\."$)', '', text, count=1)
          if n != 1:
              raise SystemExit(f'expected Cheese replacement preauth once, found {n}')

          for forbidden in (
              'PACKAGE_SUDO_KEEPALIVE_PID',
              'start_package_privilege_keepalive',
              'stop_package_privilege_keepalive',
              'resume_package_privilege_keepalive',
              'require_sudo',
          ):
              if forbidden in text:
                  raise SystemExit(f'stale sudo preauth symbol remains: {forbidden}')

          install_start = text.index('install_selected_aur_packages() {')
          install_end = text.index('\n}\n\nrecord_managed_packages()', install_start)
          aur_install = text[install_start:install_end]
          if aur_install.find('sudo -k') < 0 or aur_install.find('sudo -k') > aur_install.find('"$AUR_SCAN_BIN" install'):
              raise SystemExit('per-package AUR sudo invalidation was lost')

          text = text.rstrip('\n') + '\n'
          path.write_text(text, encoding='utf-8')

          launcher = Path('local/bin/awtarchy')
          text = launcher.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^      offer_package_reconciliation_before_update "\$@"\n'
              r'^ensure_update_disk_headroom\n'
              r'^if ! config_release_ready_or_noop "\$@"; then\n'
              r'^  return 0\n'
              r'^fi\n'
              r'^run_runtime update-reset-backup --mode preserve "\$@"\n'
              r'^reconcile_quickshell_ui_after_update\n'
              r'^;;$'
          )
          replacement = '''      offer_package_reconciliation_before_update "$@"\n      ensure_update_disk_headroom\n      if ! config_release_ready_or_noop "$@"; then\n        return 0\n      fi\n      run_runtime update-reset-backup --mode preserve "$@"\n      reconcile_quickshell_ui_after_update\n      ;;'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'expected malformed update arm once, found {n}')
          launcher.write_text(text, encoding='utf-8')

          test = Path('tests/test-awtarchy-update-session.sh')
          text = test.read_text(encoding='utf-8')
          old_msg = 'PASS: notification detachment, approval-timed sudo, trusted keepalive cleanup, low-disk recovery, and per-package AUR sudo isolation are enforced.'
          new_msg = 'PASS: notification detachment, AUR-only no-preauth, low-disk recovery, and per-package AUR sudo isolation are enforced.'
          if text.count(old_msg) != 1:
              raise SystemExit(f'expected stale PASS message once, found {text.count(old_msg)}')
          test.write_text(text.replace(old_msg, new_msg, 1), encoding='utf-8')
          PY

          rm -f \
            .github/workflows/apply-pr138-cleanup-v2.yml \
            .github/workflows/apply-pr138-sudo-cleanup.yml \
            .github/workflows/verify-pr138-cleanup-red.yml

          bash -n local/bin/awtarchy
          bash -n local/share/awtarchy/awtarchy-package-reconcile.sh
          bash -n tests/test-awtarchy-update-session.sh
          bash tests/test-awtarchy-update-session.sh
          git diff --check

          git config user.name 'dillacorn'
          git config user.email '28743863+dillacorn@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify package sudo boundaries'
          git push origin HEAD:fix/update-terminal-sudo-disk-recovery
