name: Validate Theme Header Fix

on:
  push:
    branches: [feature/theme-revamp]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Register ThemePicker managed hash
        run: |
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          entry='f80735b803b7c556028dbbf3cfde6c2bc429727fec11afffe03459b03a304ec3'
          entry+=$'\t.config/quickshell/awtarchy/ThemePicker.qml'
          if ! grep -Fxq "$entry" "$history"; then
            printf '%s\n' "$entry" >>"$history"
            git config user.name 'dillacorn'
            git config user.email '28743863+dillacorn@users.noreply.github.com'
            git add "$history"
            git commit -m 'Register theme picker header hash'
            git push origin HEAD:feature/theme-revamp
          fi
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Theme picker header regression
        run: |
          bash -n tests/test-quickshell-theme-picker.sh
          shellcheck tests/test-quickshell-theme-picker.sh
          bash tests/test-quickshell-theme-picker.sh
