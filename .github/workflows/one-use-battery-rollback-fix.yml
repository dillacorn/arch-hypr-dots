name: One-use verified battery rollback

on:
  push:
    branches: [hardening/tlp-battery-compatibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'dillacorn/awtarchy' && github.actor == 'dillacorn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: hardening/tlp-battery-compatibility
          fetch-depth: 0
      - name: Verify rollback hardware state before claiming restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('local/libexec/awtarchy/power-profile-helper')
          text = helper.read_text()

          old_rollback = '''rollback_apply() {
            local previous_state="$1" backup="$2"
            if [[ "$previous_state" == present && -f "$backup" ]]; then
              /usr/bin/cp -a -- "$backup" "$MANAGED_CONFIG"
              "$TLP" start >/dev/null 2>&1 || true
            else
              /usr/bin/rm -f -- "$MANAGED_CONFIG"
              battery_fullcharge_all >/dev/null 2>&1 || true
            fi
          }
          '''
          new_rollback = '''rollback_apply() {
            local previous_state="$1" backup="$2" plugin="$3"
            local target_label target_num

            if [[ "$previous_state" == present && -f "$backup" ]]; then
              /usr/bin/cp -a -- "$backup" "$MANAGED_CONFIG" || return 1
              "$TLP" start >/dev/null 2>&1 || true

              target_label="$(/usr/bin/sed -n -E 's/^# target=([^[:space:]]+)$/\\1/p' "$backup" | /usr/bin/head -n1)"
              if [[ "$target_label" == fixed ]]; then
                case "$plugin" in
                  lenovo|lenovo-legacy) verify_enabled_state "$plugin" 1 ;;
                  *) return 1 ;;
                esac
                return $?
              fi

              [[ "$target_label" =~ ^[0-9]+$ ]] || return 1
              target_num=$((10#$target_label))
              (( target_num >= 1 && target_num < 100 )) || return 1
              verify_enabled_state "$plugin" "$target_num"
            else
              /usr/bin/rm -f -- "$MANAGED_CONFIG" || return 1
              battery_fullcharge_all >/dev/null 2>&1 || true
              verify_disabled_state "$plugin"
            fi
          }

          battery_fail_after_rollback() {
            local previous_state="$1" backup="$2" plugin="$3" reason="$4"

            if rollback_apply "$previous_state" "$backup" "$plugin"; then
              /usr/bin/rm -f -- "$backup"
              fail "${reason}; previous settings were restored"
            fi

            /usr/bin/rm -f -- "$backup"
            fail "${reason}; previous configuration state was restored, but hardware rollback could not be verified"
          }
          '''
          if text.count(old_rollback) != 1:
              raise SystemExit('rollback_apply block not found exactly once')
          text = text.replace(old_rollback, new_rollback, 1)

          replacements = {
              '''    rollback_apply "$previous_state" "$backup"\n    /usr/bin/rm -f -- "$backup"\n    fail 'TLP failed to apply the requested battery charge limit; previous settings were restored'\n''':
              '''    battery_fail_after_rollback "$previous_state" "$backup" "$plugin" 'TLP failed to apply the requested battery charge limit'\n''',
              '''    rollback_apply "$previous_state" "$backup"\n    /usr/bin/rm -f -- "$backup"\n    fail 'TLP failed to enable the hardware conservation mode; previous settings were restored'\n''':
              '''    battery_fail_after_rollback "$previous_state" "$backup" "$plugin" 'TLP failed to enable the hardware conservation mode'\n''',
              '''    rollback_apply "$previous_state" "$backup"\n    /usr/bin/rm -f -- "$backup"\n    fail 'TLP failed to restore full-charge defaults; previous settings were restored'\n''':
              '''    battery_fail_after_rollback "$previous_state" "$backup" "$plugin" 'TLP failed to restore full-charge defaults'\n''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'rollback caller block not found exactly once: {old!r}')
              text = text.replace(old, new, 1)

          readback_variants = [
              (
                  '''    rollback_apply "$previous_state" "$backup"\n    /usr/bin/rm -f -- "$backup"\n    fail 'hardware read-back verification failed; previous settings were restored'\n''',
                  1,
              ),
              (
                  '''    rollback_apply "$previous_state" "$backup"\n    /usr/bin/rm -f -- "$backup"\n    fail 'hardware read-back verification failed; previous battery settings were restored'\n''',
                  2,
              ),
          ]
          new_readback = '''    battery_fail_after_rollback "$previous_state" "$backup" "$plugin" 'hardware read-back verification failed'\n'''
          for old, expected in readback_variants:
              if text.count(old) != expected:
                  raise SystemExit(f'expected {expected} readback rollback blocks, found {text.count(old)}: {old!r}')
              text = text.replace(old, new_readback)
          helper.write_text(text)

          workflow = Path('.github/workflows/validate-awtarchy.yml')
          w = workflow.read_text()
          edits = [
              (
                  '          bash -n tests/test-battery-care-multibattery.sh\n',
                  '          bash -n tests/test-battery-care-multibattery.sh\n          bash -n tests/test-battery-care-rollback-verification.sh\n',
              ),
              (
                  '            tests/test-battery-care-multibattery.sh \\\n',
                  '            tests/test-battery-care-multibattery.sh \\\n            tests/test-battery-care-rollback-verification.sh \\\n',
              ),
              (
                  '          bash tests/test-battery-care-multibattery.sh\n',
                  '          bash tests/test-battery-care-multibattery.sh\n          bash tests/test-battery-care-rollback-verification.sh\n',
              ),
          ]
          for old, new in edits:
              if w.count(old) != 1:
                  raise SystemExit(f'validate-awtarchy insertion anchor not found exactly once: {old!r}')
              w = w.replace(old, new, 1)
          workflow.write_text(w)
          PY

          bash -n local/libexec/awtarchy/power-profile-helper
          bash -n tests/test-battery-care-rollback-verification.sh
          shellcheck local/libexec/awtarchy/power-profile-helper tests/test-battery-care-rollback-verification.sh
          bash tests/test-battery-care-rollback-verification.sh
          bash tests/test-battery-care-multibattery.sh
          sudo bash tests/test-battery-care-control.sh
          bash tests/test-battery-care-compatibility.sh
          bash tests/test-battery-care-detector-profiles.sh
          bash tests/test-battery-care-vendor-semantics.sh
          bash tests/test-battery-care-write-gating.sh
          git diff --check

          rm -- .github/workflows/one-use-battery-rollback-red.yml
          rm -- .github/workflows/one-use-battery-rollback-fix.yml
          git config user.name 'Awtarchy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add local/libexec/awtarchy/power-profile-helper \
                  tests/test-battery-care-rollback-verification.sh \
                  .github/workflows/validate-awtarchy.yml \
                  .github/workflows/one-use-battery-rollback-red.yml \
                  .github/workflows/one-use-battery-rollback-fix.yml
          git commit -m 'Verify battery rollback hardware state'
          git push origin HEAD:hardening/tlp-battery-compatibility
