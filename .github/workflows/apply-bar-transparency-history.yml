name: Apply Bar Transparency Managed History

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-runtime-managed-history:
    if: github.event.pull_request.number == 102 && github.head_ref == 'feature/bar-transparency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: feature/bar-transparency
          fetch-depth: 0
          fetch-tags: true

      - name: Register current runtime rule hash
        shell: bash
        run: |
          set -euo pipefail
          history='local/share/awtarchy/quickshell-managed-history.sha256'
          file='config/hypr/scripts/quickshell_runtime_rules.sh'
          rel='.config/hypr/scripts/quickshell_runtime_rules.sh'
          hash="$(sha256sum "$file" | awk '{print $1}')"
          entry="${hash}"$'\t'"${rel}"
          grep -Fxq -- "$entry" "$history" || printf '%s\n' "$entry" >> "$history"

          # Run the complete updater-migration regression before writing so any
          # other missing current stock hashes are caught in this same gate.
          bash tests/test-quickshell-updater-migration.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$history"
          if ! git diff --cached --quiet; then
            git commit -m 'Register runtime rule managed hash'
            git push origin HEAD:feature/bar-transparency
          fi
