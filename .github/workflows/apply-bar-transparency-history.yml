name: Validate Bar Transparency Regression Suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bar-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Validate bar regression suite
        run: |
          git diff --check
          bash -n config/hypr/scripts/quickshell.sh
          bash -n tests/test-bar-transparency.sh
          shellcheck tests/test-bar-transparency.sh
          bash tests/test-bar-transparency.sh
          bash tests/test-bar-module-visibility.sh
          bash tests/test-bar-icon-customization.sh
          bash tests/test-bar-icon-display-options.sh
          bash tests/test-bar-task-icons.sh
